<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — cifnoba.com</title>
  <link rel="stylesheet" href="/static/portal.css">
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo">cifnoba<span>.com</span></a>
  <div class="nav-links">
    <a href="/registro" class="btn btn-primary btn-chico">Registrarse</a>
  </div>
</nav>

<div class="form-page">
  <div class="form-card" style="max-width:420px">
    <h2>Iniciar sesión</h2>
    <p class="subtitulo">Accede al panel de reclutamiento de tu institución.</p>

    {% if error %}
    <div class="aviso error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required autofocus placeholder="tu@correo.com">
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="Tu contraseña">
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px">Entrar</button>

      <p style="text-align:center;margin-top:20px;font-size:13px;color:#5a6a7c">
        ¿No tienes cuenta? <a href="/registro">Registra tu institución</a>
      </p>
    </form>
  </div>
</div>

</body>
</html>
