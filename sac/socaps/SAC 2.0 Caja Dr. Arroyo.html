  bind(){
    const app=document.getElementById('app');
    app.onclick=e=>{
      const btn=e.target.closest('[data-action]');
      if(!btn)return;
      const tag=btn.tagName;
      if(tag==='SELECT'||tag==='TEXTAREA'||(tag==='INPUT'&&btn.type!=='radio'))return;
      this.handleAction(btn.dataset.action,btn,e);
    };
    app.oninput=e=>{
      const el=e.target.closest('[data-action]');
      if(!el)return;
      const a=el.dataset.action;
      if(a==='updText')this.upd(el.dataset.path,el.value);
      else if(a==='updNum'){
        let v=num(el.value);
        if(el.dataset.path==='datos.tasaPct'||el.dataset.path==='datos.plazo'||el.dataset.path==='datos.monto'){
          const sol=this.actual();
          if(sol&&sol.datos.producto){
            const pr=this.state.config.productos.find(p=>p.nombre===sol.datos.producto);
            if(pr){
              if(el.dataset.path==='datos.tasaPct'&&v>pr.tasaAnual){v=pr.tasaAnual;el.value=v}
              if(el.dataset.path==='datos.plazo'&&v>pr.plazoMax){v=pr.plazoMax;el.value=v}
              if(el.dataset.path==='datos.monto'&&pr.montoMax&&v>pr.montoMax){v=pr.montoMax;el.value=v}
            }
          }
        }
        this.upd(el.dataset.path,v);
      }
      else if(a==='updFlujo'){const s=this.actual();if(!s)return;const arr=(s.flujo[el.dataset.key]||[]).slice();arr[parseInt(el.dataset.mes)]=num(el.value);this.upd('flujo.'+el.dataset.key,arr)}
      else if(a==='updCanvasNota')this.upd('canvas.'+el.dataset.key+'.nota',el.value);
      else if(a==='updActivoFijo'){const sol=this.actual();if(!sol)return;const af=JSON.parse(JSON.stringify(sol.capital.activosFijos||{}));if(!af[el.dataset.key])af[el.dataset.key]={monto:0,comprobante:'ninguno'};if(el.dataset.prop==='monto')af[el.dataset.key].monto=num(el.value);else af[el.dataset.key].comprobante=el.value;this.upd('capital.activosFijos',af)}
      else if(a==='updGarantia'){this.updGarantia(parseInt(el.dataset.idx),el.dataset.prop,el.value);return}
      else if(a==='updMixta'){const sol=this.actual();if(!sol)return;const arr=JSON.parse(JSON.stringify(sol.colateral.mixta||[]));const it=arr.find(x=>x.tipo===el.dataset.clave);if(!it)return;it[el.dataset.prop]=num(el.value);this.upd('colateral.mixta',arr)}
      else if(a==='updReglaPct'){const cfg=JSON.parse(JSON.stringify(this.state.config));cfg.reglas=Object.assign({},REGLAS_DEFAULT,cfg.reglas||{});cfg.reglas[el.dataset.regla]=Math.max(0,Math.min(100,num(el.value)))/100;this.state.config=cfg;this.persist();return}
      else if(a==='updMargenGiro'){const cfg=JSON.parse(JSON.stringify(this.state.config));cfg.margenesGiro=Object.assign({},cfg.margenesGiro||{});cfg.margenesGiro[el.dataset.clave]=num(el.value)/100;this.state.config=cfg;this.persist();return}
      else if(a==='updNivelPlazo'){const cfg=JSON.parse(JSON.stringify(this.state.config));cfg.nivelesOperacion[parseInt(el.dataset.idx)].plazoMax=num(el.value);this.state.config=cfg;this.persist()}
      else if(a==='updParam'){const p=JSON.parse(JSON.stringify(this.state.params));const parts=el.dataset.path.split('.');let ref=p;for(let i=0;i<parts.length-1;i++)ref=ref[parts[i]];ref[parts[parts.length-1]]=num(el.value);this.state.params=p}
      else return;
      this._scheduleRender();
    };
    app.onchange=e=>{
      const el=e.target.closest('[data-action]');
      // El monto mínimo del producto se aplica al salir del campo, no mientras se teclea.
      if(el&&el.tagName==='INPUT'&&el.dataset.path==='datos.monto'){
        const sol=this.actual();
        const pr=sol&&sol.datos.producto?this.state.config.productos.find(p=>p.nombre===sol.datos.producto):null;
        if(pr&&pr.montoMin&&num(el.value)<pr.montoMin){this.upd('datos.monto',pr.montoMin);this.render()}
        return;
      }
      if(el&&el.tagName==='INPUT'&&(el.dataset.action==='updReglaPct'||el.dataset.action==='updMargenGiro')){
        if(el.dataset.action==='updReglaPct')this.log('Regla de análisis modificada','Gasto mínimo esperado: '+pct(this.reglas().gastoMinimoPct));
        else this.log('Margen promedio del giro modificado',el.dataset.clave+': '+pct(margenGiroRef(el.dataset.clave,this.state.config)));
        this.render();return;
      }
      if(el&&el.dataset.action==='toggleMixta'){
        const sol=this.actual();if(!sol)return;
        let arr=JSON.parse(JSON.stringify(sol.colateral.mixta||[]));
        if(el.checked){if(!arr.some(x=>x.tipo===el.dataset.clave))arr.push({tipo:el.dataset.clave,avaluo:0,ingAval:0,ingGarante1:0,ingGarante2:0})}
        else arr=arr.filter(x=>x.tipo!==el.dataset.clave);
        this.upd('colateral.mixta',arr);this.render();return;
      }
      if(el&&el.dataset.action==='updGarantia'){
        let g=el.tagName==='SELECT'?this.updGarantia(parseInt(el.dataset.idx),el.dataset.prop,el.value):this.garantias()[parseInt(el.dataset.idx)];
        if(g&&el.dataset.prop==='nombre'&&!g.nombre.trim())g=this.updGarantia(parseInt(el.dataset.idx),'nombre',g.clave);
        if(g)this.log('Garantía modificada',g.nombre);
        this.render();return;
      }
      if(!el||el.tagName!=='SELECT')return;
      const a=el.dataset.action;
      if(a==='updText'){
        this.upd(el.dataset.path,el.value);
        if(el.dataset.path==='datos.producto'){
          const sol=this.actual();
          if(sol&&el.value){
            const pr=this.state.config.productos.find(p=>p.nombre===el.value);
            if(pr){
              if(num(sol.datos.tasaPct)>pr.tasaAnual)this.upd('datos.tasaPct',pr.tasaAnual);
              if(num(sol.datos.plazo)>pr.plazoMax)this.upd('datos.plazo',pr.plazoMax);
            }
          }
        }
      }
      else if(a==='updNum')this.upd(el.dataset.path,num(el.value));
      else if(a==='updBool')this.upd(el.dataset.path,el.value==='true');
      else if(a==='updTipoActividad'){
        const sol=this.actual();
        if(sol){
          // Si la ocupación no corresponde al nuevo tipo, se limpia (o se elige la única posible).
          const lista=ocupacionesDeTipo(el.value,this.state.config.ocupaciones||OCUPACIONES_DEFAULT);
          if(!lista.some(o=>o[0]===sol.datos.ocupacion))this.upd('datos.ocupacion',lista.length===1?lista[0][0]:'');
          this.upd('datos.tipoActividad',el.value);
        }
      }
      else if(a==='updFlujoProp')this.upd(el.dataset.prop,num(el.value));
      else if(a==='updRegla'){
        const cfg=JSON.parse(JSON.stringify(this.state.config));
        cfg.reglas=Object.assign({},REGLAS_DEFAULT,cfg.reglas||{});cfg.reglas[el.dataset.regla]=el.value==='true';
        this.state.config=cfg;this.persist();
        this.log('Regla de análisis '+(el.value==='true'?'activada':'desactivada'),{ocultarScore:'Ocultar score y causales',tipoIngreso:'Jornaleros e ingresos formales',margenUtilidad:'Margen de utilidad'}[el.dataset.regla]||el.dataset.regla);
      }
      else if(a==='updActivoFijo'){const sol=this.actual();if(sol){const af=JSON.parse(JSON.stringify(sol.capital.activosFijos||{}));if(!af[el.dataset.key])af[el.dataset.key]={monto:0,comprobante:'ninguno'};af[el.dataset.key].comprobante=el.value;this.upd('capital.activosFijos',af)}}
      this.render();
    };
  },

  handleAction(action,el,e){
    const st=this.state;
    switch(action){
      case 'login':{
        const user=document.getElementById('loginUser')?.value?.trim();
        const pass=document.getElementById('loginPass')?.value;
        const f=st.users.find(x=>x.usuario===user&&x.pass===pass);
        if(!f){this.set({loginErr:'Usuario o contraseña incorrectos.'});return}
        this.set({sesion:f,loginErr:'',loginPass:'',vista:'tablero'});
        this.log('Inicio de sesión',f.sucursal);
        break;
      }
      case 'logout':
        this.log('Cierre de sesión','');
        this.set({sesion:null,loginUser:'',loginPass:'',idActual:null,vista:'tablero'});
        break;
      case 'nav':
        this.set({vista:el.dataset.vista,avisoAccion:''});
        break;
      case 'tab':
        if(el.dataset.tab==='flujo'){const id=st.idActual;this.state.solicitudes=st.solicitudes.map(s=>s.id===id?this.sincronizarFlujo(s):s);this.persist()}
        this.set({tab:el.dataset.tab,avisoAccion:''});
        break;
      case 'recargarFlujo':{
        const id=st.idActual;
        this.state.solicitudes=st.solicitudes.map(s=>s.id===id?this.sincronizarFlujo(s,true):s);
        this.persist();this.render();
        break;
      }
      case 'configTab':
        this.set({configTab:el.dataset.tab});
        break;
      case 'nuevaSolicitud':{
        const folio=(st.config.nombreInstitucion.substring(0,3).toUpperCase()||'SAC')+'-'+st.folioSeq;
        const s=nuevaSolicitud(folio,st.sesion);
        const gIni=this.garantias().filter(x=>x.activa!==false);
        if(gIni.length&&!gIni.some(x=>x.clave===s.colateral.tipo))s.colateral.tipo=gIni[0].clave;
        const lista=[s,...st.solicitudes];
        this.state.solicitudes=lista;this.state.folioSeq=st.folioSeq+1;
        this.persist();this.log('Nueva solicitud',folio);
        this.set({idActual:s.id,vista:'solicitud',tab:'datos',comentario:'',firma:'',esc:null});
        break;
      }
      case 'abrirSolicitud':
        this.set({idActual:el.dataset.id,vista:'solicitud',tab:'datos',comentario:'',firma:'',avisoAccion:'',esc:null});
        break;
      case 'updText':this.upd(el.dataset.path,el.value);break;
      case 'updNum':this.upd(el.dataset.path,num(el.value));break;
      case 'updBool':this.upd(el.dataset.path,el.value==='true');break;
      case 'updRadio':this.upd(el.dataset.path,parseInt(el.dataset.val));this.render();break;
      case 'updFlujo':{
        const s=this.actual();if(!s)return;
        const arr=(s.flujo[el.dataset.key]||[]).slice();
        arr[parseInt(el.dataset.mes)]=num(el.value);
        this.upd('flujo.'+el.dataset.key,arr);
        break;
      }
      case 'updFlujoProp':this.upd(el.dataset.prop,num(el.value));break;
      case 'updCanvasP':{
        this.upd('canvas.'+el.dataset.key+'.p',parseInt(el.dataset.val));this.render();break;
      }
      case 'updCanvasNota':this.upd('canvas.'+el.dataset.key+'.nota',el.value);break;
      case 'updParam':{
        const p=JSON.parse(JSON.stringify(st.params));
        const parts=el.dataset.path.split('.');
        let ref=p;for(let i=0;i<parts.length-1;i++)ref=ref[parts[i]];
        ref[parts[parts.length-1]]=num(el.value);
        this.set({params:p});
        break;
      }
      case 'guardar':this.persist();this.log('Avance guardado',this.actual()?.folio);this.render();break;
      case 'irDictamen':this.set({tab:'dictamen'});break;
      case 'guardarParams':this.persist();this.log('Parámetros modificados','');break;
      case 'resetParams':this.state.params=defaultParams();this.persist();this.log('Parámetros restaurados','');this.render();break;
      case 'resolver':{
        const comentario=document.getElementById('comentarioDictamen')?.value||'';
        const firma=document.getElementById('firmaDictamen')?.value||'';
        if(!comentario.trim()||!firma.trim()){this.set({avisoAccion:'El dictamen del analista y la firma electrónica son obligatorios.'});return}
        const s=this.actual();const E=this.evaluar(s);const u=st.sesion;
        const estado=el.dataset.estado;const etiqueta=el.dataset.etiqueta;
        this.state.solicitudes=st.solicitudes.map(x=>{
          if(x.id!==s.id)return x;
          const c=JSON.parse(JSON.stringify(x));
          c.estado=estado;
          c.resolucion={estado,por:u.nombre,rol:ROL_NOMBRE[u.rol],comentario,firma,ts:Date.now(),score:E.global,banda:E.banda};
          c.bitacora=(c.bitacora||[]).concat([{ts:Date.now(),accion:etiqueta+' — score '+E.global.toFixed(1),quien:u.nombre}]);
          return c;
        });
        this.persist();this.log(etiqueta,s.folio+' · '+mx(s.datos.monto));
        this.set({comentario:'',firma:'',avisoAccion:''});
        break;
      }
      case 'imprimir':window.print();break;
      case 'imprimirDictamen':{
        const sol=this.actual();if(!sol)break;
        const ev=this.evaluar(sol);
        let area=document.getElementById('print-area');
        if(!area){area=document.createElement('div');area.id='print-area';document.body.appendChild(area)}
        area.innerHTML=this.renderDictamenImprimible(sol,ev);
        document.body.classList.add('printing');
        this.imprimirComo('SAC',sol);
        break;
      }
      case 'imprimirFlujo':{
        const sol=this.actual();if(!sol)break;
        const ev=this.evaluar(sol);
        let area=document.getElementById('print-area');
        if(!area){area=document.createElement('div');area.id='print-area';document.body.appendChild(area)}
        area.innerHTML=this.renderFlujoImprimible(sol,ev);
        document.body.classList.add('printing');
        this.imprimirComo('Flujo de efectivo',sol);
        break;
      }
      case 'imprimirCanvas':{
        const sol=this.actual();if(!sol)break;
        const ev=this.evaluar(sol);
        let area=document.getElementById('print-area');
        if(!area){area=document.createElement('div');area.id='print-area';document.body.appendChild(area)}
        area.innerHTML=this.renderCanvasImprimible(sol,ev);
        document.body.classList.add('printing');
        this.imprimirComo('CANVAS',sol);
        break;
      }
      case 'autoPopularFlujo':{
        const id=st.idActual;if(!this.actual())break;
        // Se generan los renglones completos: no quedan pagos de un monto, plazo o periodicidad anteriores.
        this.state.solicitudes=st.solicitudes.map(s=>s.id===id?this.sincronizarPrestamo(s,true):s);
        this.persist();this.render();
        break;
      }
      case 'guardarNombreInst':{
        const val=document.getElementById('cfgNombreInst')?.value?.trim();
        if(val){
          const cfg=Object.assign({},st.config,{nombreInstitucion:val});
          this.state.config=cfg;this.persist();this.log('Nombre de institución cambiado',val);this.render();
        }break;
      }
      case 'agregarProducto':{
        const nombre=document.getElementById('nuevoProductoNombre')?.value?.trim();
        const plazo=num(document.getElementById('nuevoProductoPlazo')?.value);
        const tasa=num(document.getElementById('nuevoProductoTasa')?.value);
        const montoMin=num(document.getElementById('nuevoProductoMontoMin')?.value);
        const montoMax=num(document.getElementById('nuevoProductoMontoMax')?.value);
        if(!nombre)return;
        const cfg=JSON.parse(JSON.stringify(st.config));
        const sinIva=document.getElementById('nuevoProductoIva')?.value==='sin';
        cfg.productos.push(Object.assign({nombre,plazoMax:plazo,tasaAnual:tasa,montoMin,montoMax},sinIva?{sinIva:true}:{}));
        this.state.config=cfg;this.persist();this.log('Producto agregado',nombre);
        this.set({nuevoProducto:{nombre:'',plazoMax:24,tasaAnual:18,montoMin:0,montoMax:0}});
        break;
      }
      case 'toggleIvaProducto':{
        const cfg=JSON.parse(JSON.stringify(st.config));
        const pr=cfg.productos[parseInt(el.dataset.idx)];if(!pr)break;
        if(pr.sinIva)delete pr.sinIva;else pr.sinIva=true;
        this.state.config=cfg;this.persist();this.log('Producto '+(pr.sinIva?'sin':'con')+' IVA sobre intereses',pr.nombre);this.render();
        break;
      }
      case 'borrarProducto':{
        const cfg=JSON.parse(JSON.stringify(st.config));
        cfg.productos.splice(parseInt(el.dataset.idx),1);
        this.state.config=cfg;this.persist();this.log('Producto eliminado','');this.render();
        break;
      }
      case 'agregarNivel':{
        const nombre=document.getElementById('nuevoNivelNombre')?.value?.trim();
        const plazo=num(document.getElementById('nuevoNivelPlazo')?.value);
        if(!nombre)return;
        const cfg=JSON.parse(JSON.stringify(st.config));
        cfg.nivelesOperacion.push({nombre,plazoMax:plazo});
        this.state.config=cfg;this.persist();this.log('Nivel de operación agregado',nombre);
        this.set({nuevoNivel:{nombre:'',plazoMax:24}});
        break;
      }
      case 'borrarNivel':{
        const cfg=JSON.parse(JSON.stringify(st.config));
        cfg.nivelesOperacion.splice(parseInt(el.dataset.idx),1);
        this.state.config=cfg;this.persist();this.log('Nivel eliminado','');this.render();
        break;
      }
      case 'updNivelPlazo':{
        const cfg=JSON.parse(JSON.stringify(st.config));
        cfg.nivelesOperacion[parseInt(el.dataset.idx)].plazoMax=num(el.value);
        this.state.config=cfg;this.persist();
        break;
      }
      case 'updActivoFijo':{
        const sol=this.actual();if(!sol)return;
        const af=JSON.parse(JSON.stringify(sol.capital.activosFijos||{}));
        if(!af[el.dataset.key])af[el.dataset.key]={monto:0,comprobante:'ninguno'};
        if(el.dataset.prop==='monto')af[el.dataset.key].monto=num(el.value);
        else af[el.dataset.key].comprobante=el.value;
        this.upd('capital.activosFijos',af);
        this.render();break;
      }
      case 'agregarOcupacion':{
        const clave=document.getElementById('nuevaOcupacionClave')?.value?.trim().replace(/\s+/g,'_');
        const nombre=document.getElementById('nuevaOcupacionNombre')?.value?.trim();
        if(!clave||!nombre)return;
        const cfg=JSON.parse(JSON.stringify(st.config));
        if(!cfg.ocupaciones)cfg.ocupaciones=[...OCUPACIONES_DEFAULT];
        cfg.ocupaciones.push([clave,nombre]);
        this.state.config=cfg;this.persist();this.log('Ocupación agregada',nombre);this.render();
        break;
      }
      case 'toggleCanvasOcupacion':{
        const cfg=JSON.parse(JSON.stringify(st.config));
        if(!cfg.ocupaciones)cfg.ocupaciones=JSON.parse(JSON.stringify(OCUPACIONES_DEFAULT));
        const o=cfg.ocupaciones[parseInt(el.dataset.idx)];if(!o)break;
        o[2]=!usaCanvas(o[0],[o]);
        this.state.config=cfg;this.persist();this.log('CANVAS '+(o[2]?'activado':'desactivado')+' para ocupación',o[1]);this.render();
        break;
      }
      case 'borrarOcupacion':{
        const cfg=JSON.parse(JSON.stringify(st.config));
        if(!cfg.ocupaciones)cfg.ocupaciones=[...OCUPACIONES_DEFAULT];
        cfg.ocupaciones.splice(parseInt(el.dataset.idx),1);
        this.state.config=cfg;this.persist();this.log('Ocupación eliminada','');this.render();
        break;
      }
      case 'toggleGarantia':{
        const cat=JSON.parse(JSON.stringify(this.garantias()));
        const g=cat[parseInt(el.dataset.idx)];if(!g)break;
        if(g.activa!==false&&cat.filter(x=>x.activa!==false).length<=1){this.set({avisoGarantias:'Debe quedar al menos una garantía activa.'});break}
        g.activa=g.activa===false;
        this.state.config=Object.assign({},st.config,{garantias:cat});this.persist();
        this.log('Garantía '+(g.activa?'activada':'desactivada'),g.nombre);this.set({avisoGarantias:''});
        break;
      }
      case 'borrarGarantia':{
        const cat=JSON.parse(JSON.stringify(this.garantias()));
        const i=parseInt(el.dataset.idx),g=cat[i];if(!g)break;
        const n=st.solicitudes.filter(s=>usaGarantia(s,g.clave)).length;
        if(n){this.set({avisoGarantias:'«'+g.nombre+'» se usa en '+n+' solicitud'+(n>1?'es':'')+'; desactívela en lugar de quitarla.'});break}
        if(cat.length<=1||(g.activa!==false&&cat.filter(x=>x.activa!==false).length<=1)){this.set({avisoGarantias:'Debe quedar al menos una garantía activa.'});break}
        cat.splice(i,1);
        this.state.config=Object.assign({},st.config,{garantias:cat});this.persist();
        this.log('Garantía eliminada',g.nombre);this.set({avisoGarantias:''});
        break;
      }
      case 'agregarGarantia':{
        const nombre=document.getElementById('nuevaGarantiaNombre')?.value?.trim();
        const ng={nombre:nombre||'',medida:document.getElementById('nuevaGarantiaMedida')?.value||'monto',
          personas:num(document.getElementById('nuevaGarantiaPersonas')?.value)>=2?2:1,
          cobertura:Math.max(0,num(document.getElementById('nuevaGarantiaCobertura')?.value)),
          parcial:Math.max(0,num(document.getElementById('nuevaGarantiaParcial')?.value)),
          puntajeParcial:Math.min(100,Math.max(0,num(document.getElementById('nuevaGarantiaPuntaje')?.value)))};
        if(!nombre){this.set({nuevaGarantia:ng,avisoGarantias:'Escriba el nombre de la garantía.'});break}
        const cat=JSON.parse(JSON.stringify(this.garantias()));
        const base=nombre.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'garantia';
        let clave=base,k=2;while(cat.some(x=>x.clave===clave))clave=base+'_'+(k++);
        cat.push({clave,nombre,medida:ng.medida,personas:ng.personas,cobertura:ng.cobertura,parcial:ng.parcial,puntajeParcial:ng.puntajeParcial/100,activa:true});
        this.state.config=Object.assign({},st.config,{garantias:cat});this.persist();
        this.log('Garantía agregada',nombre);this.set({nuevaGarantia:null,avisoGarantias:''});
        break;
      }
      case 'resetGarantias':{
        // Se conservan las garantías propias que ya usan solicitudes, para no dejarlas sin catálogo.
        const ini=garantiasIniciales(st.params.u);
        const propias=this.garantias().filter(x=>!ini.some(y=>y.clave===x.clave)&&st.solicitudes.some(s=>usaGarantia(s,x.clave)));
        this.state.config=Object.assign({},st.config,{garantias:ini.concat(propias)});this.persist();
        this.log('Catálogo de garantías restaurado','');this.set({avisoGarantias:''});
        break;
      }
      case 'resetOcupaciones':{
        const cfg=JSON.parse(JSON.stringify(st.config));
        cfg.ocupaciones=[...OCUPACIONES_DEFAULT];
        this.state.config=cfg;this.persist();this.log('Catálogo de ocupaciones restaurado','');this.render();
        break;
      }
      case 'cargarLogotipo':{
        const inp=document.createElement('input');inp.type='file';inp.accept='image/png,image/jpeg,image/svg+xml';
        inp.onchange=()=>{
          const file=inp.files?.[0];if(!file)return;
          if(file.size>512000){alert('El archivo es demasiado grande. Máximo 500 KB.');return}
          const fr=new FileReader();
          fr.onload=()=>{
            const cfg=JSON.parse(JSON.stringify(st.config));
            cfg.logotipo=fr.result;
            this.state.config=cfg;this.persist();this.log('Logotipo cargado',file.name);this.render();
          };
          fr.readAsDataURL(file);
        };
        inp.click();
        break;
      }
      case 'quitarLogotipo':{
        const cfg=JSON.parse(JSON.stringify(st.config));
        cfg.logotipo='';
        this.state.config=cfg;this.persist();this.log('Logotipo eliminado','');this.render();
        break;
      }
      case 'agregarPersonal':{
        const nombre=document.getElementById('nuevoPersonalNombre')?.value?.trim();
        const cargo=document.getElementById('nuevoPersonalCargo')?.value?.trim();
        const tipo=document.getElementById('nuevoPersonalTipo')?.value||'analista';
        if(!nombre||!cargo)return;
        const cfg=JSON.parse(JSON.stringify(st.config));
        if(!cfg.personal)cfg.personal=[];
        cfg.personal.push({nombre,cargo,tipo});
        this.state.config=cfg;this.persist();this.log('Personal agregado',nombre+' — '+cargo);
        this.set({nuevoPersonal:{nombre:'',cargo:'',tipo:'analista'}});
        break;
      }
      case 'borrarPersonal':{
        const cfg=JSON.parse(JSON.stringify(st.config));
        if(!cfg.personal)cfg.personal=[];
        cfg.personal.splice(parseInt(el.dataset.idx),1);
        this.state.config=cfg;this.persist();this.log('Personal eliminado','');this.render();
        break;
      }
      case 'guardarRegulatorio':{
        const cfg=JSON.parse(JSON.stringify(st.config));
        cfg.regulatorio={
          razonSocial:document.getElementById('cfgRazonSocial')?.value?.trim()||'',
          rfc:document.getElementById('cfgRFC')?.value?.trim()||'',
          registroCNBV:document.getElementById('cfgCNBV')?.value?.trim()||'',
          representanteLegal:document.getElementById('cfgRepLegal')?.value?.trim()||'',
          domicilioFiscal:document.getElementById('cfgDomicilio')?.value?.trim()||'',
          telefonoOficina:document.getElementById('cfgTelefono')?.value?.trim()||'',
          correoOficial:document.getElementById('cfgCorreo')?.value?.trim()||'',
          clabe:document.getElementById('cfgCLABE')?.value?.trim()||''
        };
        this.state.config=cfg;this.persist();this.log('Información regulatoria actualizada','');this.render();
        break;
      }
      case 'altaUsuario':{
        const usuario=document.getElementById('nuUsuario')?.value?.trim();
        const nombre=document.getElementById('nuNombre')?.value?.trim();
        const pass=document.getElementById('nuPass')?.value;
        const rol=document.getElementById('nuRol')?.value;
        const sucursal=document.getElementById('nuSucursal')?.value;
        const tope=num(document.getElementById('nuTope')?.value);
        if(!usuario||!nombre||!pass){this.set({avisoUsuarios:'Usuario, nombre y contraseña son obligatorios.'});return}
        if(st.users.some(u=>u.usuario===usuario)){this.set({avisoUsuarios:'Ese nombre de usuario ya existe.'});return}
        const lista=[...st.users,{usuario,nombre,pass,rol,sucursal,tope}];
        this.state.users=lista;this.persist();this.log('Usuario dado de alta',usuario+' — '+ROL_NOMBRE[rol]);
        this.set({avisoUsuarios:''});
        break;
      }
      case 'borrarUsuario':{
        if(el.dataset.user===st.sesion.usuario){this.set({avisoUsuarios:'No puede quitar su propia cuenta.'});return}
        const lista=st.users.filter(u=>u.usuario!==el.dataset.user);
        this.state.users=lista;this.persist();this.log('Usuario dado de baja',el.dataset.user);
        this.set({avisoUsuarios:''});
        break;
      }
      case 'editarUsuario':
        this.set({editUsuario:el.dataset.user,avisoUsuarios:''});
        break;
      case 'cancelarUsuario':
        this.set({editUsuario:null,avisoUsuarios:''});
        break;
      case 'guardarUsuario':{
        const orig=st.users.find(u=>u.usuario===st.editUsuario);
        if(!orig){this.set({editUsuario:null});return}
        const usuario=document.getElementById('euUsuario')?.value?.trim();
        const nombre=document.getElementById('euNombre')?.value?.trim();
        const pass=document.getElementById('euPass')?.value||'';
        const rol=document.getElementById('euRol')?.value||orig.rol;
        const sucursal=document.getElementById('euSucursal')?.value||orig.sucursal;
        const tope=num(document.getElementById('euTope')?.value);
        if(!usuario||!nombre){this.set({avisoUsuarios:'Usuario y nombre son obligatorios.'});return}
        if(usuario!==orig.usuario&&st.users.some(u=>u.usuario===usuario)){this.set({avisoUsuarios:'Ese nombre de usuario ya existe.'});return}
        const propia=orig.usuario===st.sesion.usuario;
        if(propia&&rol!=='superadmin'){this.set({avisoUsuarios:'No puede quitarse a sí mismo el rol de superadministrador.'});return}
        if(orig.rol==='superadmin'&&rol!=='superadmin'&&!st.users.some(u=>u!==orig&&u.rol==='superadmin')){this.set({avisoUsuarios:'Debe existir al menos un superadministrador.'});return}
        const nuevo={...orig,usuario,nombre,rol,sucursal,tope,pass:pass||orig.pass};
        this.state.users=st.users.map(u=>u===orig?nuevo:u);
        if(usuario!==orig.usuario||nombre!==orig.nombre){
          this.state.solicitudes=st.solicitudes.map(s=>s.analistaId===orig.usuario?{...s,analistaId:usuario,analista:nombre}:s);
        }
        if(propia)this.state.sesion=nuevo;
        this.persist();
        this.log('Usuario modificado',orig.usuario+(usuario!==orig.usuario?' → '+usuario:'')+' — '+ROL_NOMBRE[rol]+(pass?' · contraseña cambiada':''));
        this.set({editUsuario:null,avisoUsuarios:''});
        break;
      }
      case 'altaSucursal':{
        const n=document.getElementById('nuevaSucursal')?.value?.trim();
        if(!n)return;
        if(n==='Todas'||st.sucursales.some(s=>s.toLowerCase()===n.toLowerCase())){this.set({avisoSucursales:'Esa sucursal ya existe.'});return}
        const lista=[...st.sucursales,n];
        this.state.sucursales=lista;this.persist();this.log('Sucursal creada',n);this.set({avisoSucursales:''});
        break;
      }
      case 'editarSucursal':
        this.set({editSucursal:Number(el.dataset.idx),avisoSucursales:''});
        break;
      case 'cancelarSucursal':
        this.set({editSucursal:null,avisoSucursales:''});
        break;
      case 'guardarSucursal':{
        const i=Number(el.dataset.idx);const ant=st.sucursales[i];
        const n=document.getElementById('esNombre')?.value?.trim();
        if(ant===undefined){this.set({editSucursal:null});return}
        if(!n){this.set({avisoSucursales:'El nombre de la sucursal es obligatorio.'});return}
        if(n==='Todas'||st.sucursales.some((s,j)=>j!==i&&s.toLowerCase()===n.toLowerCase())){this.set({avisoSucursales:'Esa sucursal ya existe.'});return}
        if(n!==ant){
          this.state.sucursales=st.sucursales.map((s,j)=>j===i?n:s);
          this.state.users=st.users.map(u=>u.sucursal===ant?{...u,sucursal:n}:u);
          this.state.solicitudes=st.solicitudes.map(s=>s.sucursal===ant?{...s,sucursal:n}:s);
          if(st.sesion&&st.sesion.sucursal===ant)this.state.sesion=this.state.users.find(u=>u.usuario===st.sesion.usuario)||st.sesion;
          this.persist();this.log('Sucursal renombrada',ant+' → '+n);
        }
        this.set({editSucursal:null,avisoSucursales:''});
        break;
      }
      case 'borrarSucursal':{
        const i=Number(el.dataset.idx);const s=st.sucursales[i];
        if(s===undefined)return;
        const nu=st.users.filter(u=>u.sucursal===s).length;
        if(nu>0){this.set({avisoSucursales:'No se puede quitar «'+s+'»: tiene '+nu+' usuario(s) asignado(s). Reasígnelos primero.'});return}
        if(st.sucursales.length<=1){this.set({avisoSucursales:'Debe existir al menos una sucursal.'});return}
        this.state.sucursales=st.sucursales.filter((x,j)=>j!==i);
        this.persist();this.log('Sucursal eliminada',s);
        this.set({editSucursal:null,avisoSucursales:''});
        break;
      }
      case 'exportar':{
        const data={app:'SAC '+st.config.nombreInstitucion+' 2.0',exportado:new Date().toISOString(),users:st.users,sucursales:st.sucursales,params:st.params,config:st.config,solicitudes:st.solicitudes,auditoria:st.auditoria,folioSeq:st.folioSeq};
        const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
        const a=document.createElement('a');a.href=URL.createObjectURL(blob);
        a.download='respaldo-sac-'+new Date().toISOString().slice(0,10)+'.json';
        a.click();URL.revokeObjectURL(a.href);
        this.log('Respaldo exportado',st.solicitudes.length+' solicitudes');
        break;
      }
      case 'importar':{
        const inp=document.createElement('input');inp.type='file';inp.accept='.json';
        inp.onchange=()=>{
          const file=inp.files?.[0];if(!file)return;
          const fr=new FileReader();
          fr.onload=()=>{
            try{
              const d=JSON.parse(fr.result);
              const merged=(d.solicitudes||[]).concat(st.solicitudes.filter(x=>!(d.solicitudes||[]).some(y=>y.id===x.id)));
              Object.assign(this.state,{
                users:d.users||st.users,sucursales:d.sucursales||st.sucursales,
                params:Object.assign(defaultParams(),d.params||{}),config:migrarConfig(Object.assign(defaultConfig(),d.config||{}),(d.params||{}).u),
                solicitudes:merged,auditoria:(d.auditoria||[]).concat(st.auditoria).slice(0,400),
                folioSeq:Math.max(d.folioSeq||1001,st.folioSeq)
              });
              this.persist();this.log('Respaldo importado',file.name);this.render();
            }catch(err){this.log('Error al importar',file.name)}
          };
          fr.readAsText(file);
        };
        inp.click();
        break;
      }
    }
  }
};

document.addEventListener('DOMContentLoaded',()=>APP.init());
</script>
</body>
</html>
