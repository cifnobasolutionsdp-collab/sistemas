<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAC 2.0 · Caja Dr. Arroyo</title>
<style>
:root {
  --bg: #f3f2f2; --surface: #eae9e9; --text: #201e1d;
  --accent: #0088b0; --accent2: #d6006c;
  --div: rgba(32,30,29,.16);
  --n100:#f8f4f4;--n200:#eae7e7;--n300:#d7d3d3;--n400:#bab6b6;--n500:#9b9797;
  --n600:#7d7979;--n700:#605d5d;--n800:#444141;--n900:#2d2b2b;
  --a100:#e9f8ff;--a200:#cbeeff;--a700:#006786;--a800:#004961;--a900:#0a303e;
  --a2100:#fff1f4;--a2700:#aa0b56;--a2800:#790e3d;--a2900:#4b1528;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --fonth: Georgia, 'Times New Roman', serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:400 15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--fonth);font-weight:600;line-height:1.12;letter-spacing:-.015em;margin:0 0 8px}
h1{font-size:40px}h2{font-size:22px}h3{font-size:18px}
a{color:var(--accent);text-underline-offset:3px}
::selection{background:rgba(0,136,176,.25)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;font:600 14px/1.2 var(--font);color:var(--text);background:transparent;border:1px solid transparent;padding:8px 16px;border-radius:3px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-p{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-p:hover{background:#0078a0}
.btn-s{border-color:var(--div)}.btn-s:hover{background:rgba(32,30,29,.06)}
.btn-g{color:var(--accent);padding:6px 8px}.btn-g:hover{background:rgba(0,136,176,.08)}
.btn-d{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.btn-block{width:100%;margin-top:8px}
.input{width:100%;min-height:36px;padding:6px 10px;font:400 14px/1.4 var(--font);color:var(--text);background:var(--surface);border:1px solid var(--div);border-radius:3px;caret-color:var(--accent)}
.input:focus{border-color:var(--accent);outline:none}
textarea.input{min-height:80px;resize:vertical}
select.input{appearance:auto}
.tag{display:inline-flex;font-size:11px;padding:3px 10px;border-radius:3px;letter-spacing:.02em}
.tag-o{border:1px solid var(--accent);color:var(--accent)}
.tag-g{background:#e0f5e0;color:#1a6b1a}
.tag-r{background:var(--a2100);color:var(--a2800)}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(32,30,29,.55);padding:8px;border-bottom:1px solid var(--div)}
.table td{padding:8px;border-bottom:1px solid rgba(32,30,29,.06)}
.table tbody tr:hover{background:rgba(32,30,29,.03)}
.grid{border-collapse:collapse;font-variant-numeric:tabular-nums}
.grid th,.grid td{border:1px solid var(--div);padding:0}
.grid input{border:0;background:transparent;width:80px;padding:5px 6px;font:400 12.5px var(--font);text-align:right}
.grid input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--a100)}
.field>label{display:block;font-size:12px;margin-bottom:5px;color:rgba(32,30,29,.65)}
.canvas-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;grid-template-rows:auto auto auto;gap:0;border:2px solid var(--n800);font-size:13px}
.canvas-cell{border:1px solid var(--n400);padding:8px;min-height:120px;display:flex;flex-direction:column}
.canvas-cell h4{font:600 11px/1.3 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--n800);margin:0 0 6px;display:flex;align-items:center;gap:6px}
.canvas-cell textarea{flex:1;border:0;background:transparent;font:400 12.5px/1.4 var(--font);resize:none;padding:4px 0;color:var(--text)}
.canvas-cell textarea:focus{outline:none;background:var(--a100)}
.canvas-header{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr;gap:0;border-bottom:2px solid var(--n800)}
.canvas-header>div{padding:6px 8px;border-right:1px solid var(--n400);font:400 12px/1.3 var(--font)}
.canvas-header>div:last-child{border-right:0}
.canvas-header label{font-size:10px;color:var(--n600);display:block}
.canvas-header input{border:0;background:transparent;font:400 12px/1.3 var(--font);width:100%;padding:2px 0}
.canvas-header input:focus{outline:none;background:var(--a100)}
.canvas-bottom{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:2px solid var(--n800)}
.canvas-bottom>.canvas-cell{min-height:100px}
.config-card{background:var(--surface);border-radius:4px;padding:20px;margin-bottom:16px}
#print-area{display:none}
.aviso-limite{font:400 12px/1.4 var(--font);color:var(--a2700);margin-top:4px;padding:4px 8px;background:var(--a2100);border-radius:3px}
@media print{.no-print{display:none!important}body{background:#fff;margin:0;padding:0}body.printing #app{display:none!important}body.printing #print-area{display:block!important;position:static}@page{margin:8mm}}
</style>
</head>

function fechaPago(iso,periodicidad,k){
  const [y,m,d]=iso.split('-').map(Number);
  const dias={quincenal:15,semanal:7}[periodicidad];
  if(dias)return new Date(Date.UTC(y,m-1,d+dias*k));
  const meses=({mensual:1,bimestral:2,semestral:6,anual:12}[periodicidad]||1)*k;
  const ult=new Date(Date.UTC(y,m-1+meses+1,0)).getUTCDate();
  return new Date(Date.UTC(y,m-1+meses,Math.min(d,ult)));
}

function migrarConfig(c,u){
  if(!Array.isArray(c.garantias)||!c.garantias.length)c.garantias=garantiasIniciales(u);
  else if(c.garantiasVer!==GARANTIAS_VER&&!c.garantias.some(g=>g.medida==='mixta'))c.garantias=c.garantias.concat([JSON.parse(JSON.stringify(GARANTIAS_DEFAULT.find(g=>g.clave==='mixta')))]);
  c.garantiasVer=GARANTIAS_VER;
  c.reglas=Object.assign({},REGLAS_DEFAULT,c.reglas||{});
  if(!c.margenesGiro||typeof c.margenesGiro!=='object')c.margenesGiro={};
  if(c.ocupacionesVer!==OCUPACIONES_VER&&Array.isArray(c.ocupaciones)){

}

// Solicitudes capturadas antes del tipo de actividad: se deduce de la ocupación.
function tipoActividad(d,catalogo){
  if(d.tipoActividad)return d.tipoActividad;
  const o=d.ocupacion||'';
  if(usaCanvas(o,catalogo))return 'negocio';
  if(o==='ama_casa')return 'ama_casa';
  if(OCUPACIONES_DEPENDIENTE.includes(o))return 'dependiente';
  return 'empleado';
}
// Ocupaciones del catálogo que se ofrecen para cada tipo de actividad.
function ocupacionesDeTipo(tipo,catalogo){
  const cat=catalogo||OCUPACIONES_DEFAULT;
  if(tipo==='negocio')return cat.filter(o=>usaCanvas(o[0],cat));
  if(tipo==='ama_casa')return cat.filter(o=>o[0]==='ama_casa');
  if(tipo==='dependiente')return cat.filter(o=>OCUPACIONES_DEPENDIENTE.includes(o[0]));
  return cat.filter(o=>!usaCanvas(o[0],cat)&&o[0]!=='ama_casa'&&!OCUPACIONES_DEPENDIENTE.includes(o[0]));
}
// El flujo de efectivo aplica con negocio, ingresos variables o un gasto importante en el año.
function flujoActivo(d,catalogo){return tipoActividad(d,catalogo)==='negocio'||!!d.ingresosVariables||!!d.gastoImportante}
function usaCanvas(clave,catalogo){
  const o=(catalogo||[]).find(x=>x[0]===clave);
  if(o&&typeof o[2]==='boolean')return o[2];
  return !!clave&&!clave.startsWith('empleado')&&!OCUPACIONES_SIN_CANVAS.includes(clave);
}

const FILAS_ING_NEGOCIO=['agricolas','ganaderos','ventas'];
// Margen de utilidad del negocio en el periodo del flujo: (ingresos del negocio − gastos del negocio) ÷ ingresos del negocio.
function margenNegocio(s,meses){
  const n=meses||Math.max(...FILAS_ING_NEGOCIO.concat(['gastosNegocio']).map(k=>((s.flujo||{})[k]||[]).length),0);
  let ing=0,gas=0;
  for(let m=0;m<n;m++){
    FILAS_ING_NEGOCIO.forEach(k=>{ing+=num(((s.flujo||{})[k]||[])[m])});
    gas+=num(((s.flujo||{}).gastosNegocio||[])[m]);
  }
  return {ing,gas,margen:ing>0?(ing-gas)/ing:null};
}

      return /^(capacidad\.|datos\.|flujoAnios$|flujoMesPago$)/.test(path)?this.sincronizarFlujo(c):c;

  // Carga en el flujo los ingresos y gastos mensuales capturados en Capacidad. Un renglón que el
  // analista modificó a mano deja de actualizarse; «Recargar desde Capacidad» (forzar) lo reemplaza.
  sincronizarFlujo(sol,forzar){
    const cat=this.state.config.ocupaciones||OCUPACIONES_DEFAULT;
    if(!flujoActivo(sol.datos,cat))return sol;
    sol=this.sincronizarPrestamo(sol);
    // Solicitudes guardadas antes de la carga automática: solo se cargan si su flujo está vacío.
    if(!forzar&&!sol.flujoAuto&&Object.values(sol.flujo||{}).some(arr=>(arr||[]).some(v=>num(v)!==0)))return sol;
    const k=sol.capacidad,neg=tipoActividad(sol.datos,cat)==='negocio';
    const suma=campos=>campos.reduce((a,x)=>a+num(k[x]),0);
    // Con negocio los ingresos se capturan directamente en el flujo; solo se cargan gastos familiares y deudas.
    const objetivo=neg?{}:{
      sueldos:num(k.ingTrabajo),
      remesas:suma(['ingArrendamiento','ingIntereses','ingTransferencias','ingOtros'])
    };
    Object.assign(objetivo,{
      egresosFam:suma(['gAlimentos','gTransporte','gEducacion','gVivienda','gPersonal','gLimpieza','gVestido','gSalud','gOtrosGastos']),
      pagoOtras:suma(['dCajas','dBancos','dArrendamiento','dPrestamistas'])
    });
    const auto=sol.flujoAuto||{},flujo={...sol.flujo},nuevoAuto={...auto};
    let cambio=false;
    Object.keys(objetivo).forEach(r=>{
      const arr=flujo[r]||[],previo=num(auto[r]);
      let intacto=forzar;
      if(!intacto){intacto=true;for(let m=0;m<96;m++)if(num(arr[m])!==previo){intacto=false;break}}
      if(intacto&&(forzar||previo!==objetivo[r]||auto[r]===undefined)){
        flujo[r]=new Array(96).fill(objetivo[r]);nuevoAuto[r]=objetivo[r];cambio=true;
      }
    });
    return cambio?{...sol,flujo,flujoAuto:nuevoAuto}:sol;
  },

  // Al pasar a negocio, los ingresos que se habían cargado desde Capacidad (que con negocio ya no se ven)
  // se quitan del flujo, salvo que el analista haya modificado el renglón a mano.
  quitarIngresosCapacidad(sol){
    const auto=sol.flujoAuto;if(!auto)return sol;
    const flujo={...sol.flujo},nuevoAuto={...auto};let cambio=false;
    ['sueldos','remesas'].forEach(r=>{
      if(auto[r]===undefined||!num(auto[r]))return;
      const arr=flujo[r]||[],previo=num(auto[r]);
      for(let m=0;m<96;m++)if(num(arr[m])!==previo)return;
      flujo[r]=new Array(96).fill(0);nuevoAuto[r]=0;cambio=true;
    });
    return cambio?{...sol,flujo,flujoAuto:nuevoAuto}:sol;
  },

  // Renglones del préstamo de la Institución según monto, plazo, tasa y periodicidad de la solicitud.
  prestamoFlujo(sol){
    const d=sol.datos,mesesFlujo=this.aniosFlujo(sol)*12;
    const prestamoInst=new Array(96).fill(0),pagoInst=new Array(96).fill(0);
    prestamoInst[0]=num(d.monto);
    // Cada pago de la tabla de amortización en el mes en que se cubre; la suma es capital, interés e IVA.
    this.tablaPagos(d,Math.min(mesesFlujo-1,Math.max(0,num(sol.flujoMesPago)))).forEach(f=>{if(f.mes>=0&&f.mes<96)pagoInst[f.mes]+=f.pago});
    for(let m=0;m<96;m++)pagoInst[m]=Math.round(pagoInst[m]);
    return {prestamoInst,pagoInst};
  },

  // Después de «Autopoblar préstamo», los renglones del préstamo siguen al monto, plazo y periodicidad
  // mientras el analista no los modifique a mano; el botón (forzar) los vuelve a generar completos.
  sincronizarPrestamo(sol,forzar){
    const auto=sol.flujoAutoPrestamo;
    if(!auto&&!forzar)return sol;
    const calc=this.prestamoFlujo(sol),flujo={...sol.flujo},nuevoAuto={...(auto||{})};
    let cambio=false;
    ['prestamoInst','pagoInst'].forEach(r=>{
      const arr=flujo[r]||[],prev=auto&&auto[r];
      let intacto=!!forzar;
      if(!intacto&&Array.isArray(prev)){intacto=true;for(let m=0;m<96;m++)if(num(arr[m])!==num(prev[m])){intacto=false;break}}
      if(!intacto)return;
      let distinto=!!forzar;
      for(let m=0;m<96&&!distinto;m++)if(num(arr[m])!==calc[r][m])distinto=true;
      if(distinto){flujo[r]=calc[r];nuevoAuto[r]=calc[r].slice();cambio=true}
    });
    return cambio?{...sol,flujo,flujoAutoPrestamo:nuevoAuto}:sol;
  },

  ivaDe(datos){const pr=datos.producto?this.state.config.productos.find(p=>p.nombre===datos.producto):null;return pr&&pr.sinIva?0:num(this.state.params.u.ivaInteres)},

  plan(datos,montoOv,plazoOv,aprox){
    const P=this.state.params,IVA=this.ivaDe(datos);
    const monto=montoOv!=null?montoOv:num(datos.monto);

    const per=PERIODICIDADES.find(p=>p[0]===datos.periodicidad)||PERIODICIDADES[2];
    const porAnio=per[2];

    if(datos.periodicidad==='pago_unico'){
      const intTotal=monto*tasaAnual*(meses/12);
      const cuotaUnica=monto+intTotal;
      const cuotaMensual=cuotaUnica/Math.max(1,meses);
      const cuotaIva=cuotaUnica+intTotal*IVA;

    }

      const iPeriodo=tasaAnual/12;

      const totalInt=intMensual*meses;
      const cuotaInt=intMensual;
      const cuotaMensual=intMensual+intMensual*IVA+monto/Math.max(1,meses);
      return {monto,meses,n:meses,porAnio:12,cuota:cuotaInt,cuotaIva:cuotaInt+cuotaInt*IVA,ultimoPago:monto+cuotaInt+cuotaInt*IVA,cuotaMensual,totalInt,iva:totalInt*IVA,total:monto+totalInt+totalInt*IVA,mesesPlan:meses,ivaPct:IVA};
    }

    // Pagos periódicos: la tasa del periodo es la anual entre los pagos por año y el IVA se cobra sobre el interés de cada pago.
    const n=Math.max(1,Math.round(meses/12*porAnio));
    const i=tasaAnual/porAnio,iIva=i*(1+IVA);
    let primerPago,ultimoPago,totalInt;
    if(datos.plan==='insolutos'&&!aprox&&fechaValida(datos.fechaDisposicion)){
      // Saldos insolutos con días transcurridos entre pagos: interés = saldo × tasa ÷ base × días.
      const base=num(P.u.baseDias)||360,cap=monto/n;
      let saldo=monto,ant=fechaPago(datos.fechaDisposicion,datos.periodicidad,0),maxPago=0;totalInt=0;
      for(let k=1;k<=n;k++){
        const f=fechaPago(datos.fechaDisposicion,datos.periodicidad,k),dias=Math.round((f-ant)/864e5);
        const interes=saldo*tasaAnual/base*dias,pago=cap+interes*(1+IVA);
        if(k===1)primerPago=pago;
        if(pago>maxPago)maxPago=pago;
        totalInt+=interes;saldo-=cap;ant=f;ultimoPago=pago;
      }
      const iva=totalInt*IVA;
      return {monto,meses,n,porAnio,cuota:primerPago,cuotaIva:primerPago,ultimoPago,pagoMaximo:maxPago,cuotaMensual:maxPago*porAnio/12,totalInt,iva,total:monto+totalInt+iva,mesesPlan:n*12/porAnio,ivaPct:IVA,porDias:true};
    }
    if(datos.plan==='insolutos'){
      // Capital igual en cada pago e interés con IVA sobre el saldo: el primer pago es el más alto.
      const cap=monto/n;
      primerPago=cap+monto*iIva;ultimoPago=cap+cap*iIva;
      totalInt=monto*i*(n+1)/2;
    }else{
      // Pago fijo con IVA incluido: cada pago cubre el interés y su IVA, y el resto abona a capital.
      primerPago=ultimoPago=iIva>0?monto*iIva/(1-Math.pow(1+iIva,-n)):monto/n;
      totalInt=(primerPago*n-monto)/(1+IVA);
    }
    const iva=totalInt*IVA;
    return {monto,meses,n,porAnio,cuota:primerPago-monto*i*IVA,cuotaIva:primerPago,ultimoPago,pagoMaximo:primerPago,cuotaMensual:primerPago*porAnio/12,totalInt,iva,total:monto+totalInt+iva,mesesPlan:n*12/porAnio,ivaPct:IVA};
  },

  // Tabla de amortización. «mes» es el mes del flujo (0 = primer mes) en que cae cada pago; con pagos
  // anuales el primero cae en mesAnual (el mes del pago analizado) y los siguientes cada doce meses.
  tablaPagos(datos,mesAnual){
    const pl=this.plan(datos),IVA=pl.ivaPct,tasa=num(datos.tasaPct)/100,base=num(this.state.params.u.baseDias)||360;
    const conFecha=fechaValida(datos.fechaDisposicion)&&!/^pago_unico/.test(datos.periodicidad);
    const filas=[];let saldo=pl.monto;
    const fila=(mes,capital,interes,fecha,dias)=>{const iva=interes*IVA;filas.push({k:filas.length+1,mes,fecha,dias,saldoIni:saldo,capital,interes,iva,pago:capital+interes+iva,saldoFin:saldo-capital});saldo-=capital};
    if(datos.periodicidad==='pago_unico')fila(pl.meses-1,pl.monto,pl.totalInt);
    else if(datos.periodicidad==='pago_unico_periodico'){const im=pl.monto*tasa/12;for(let m=0;m<pl.meses;m++)fila(m,m===pl.meses-1?pl.monto:0,im)}
    else{
      const i=tasa/pl.porAnio;
      for(let k=1;k<=pl.n;k++){
        const f=conFecha?fechaPago(datos.fechaDisposicion,datos.periodicidad,k):null;
        const dias=f?Math.round((f-fechaPago(datos.fechaDisposicion,datos.periodicidad,k-1))/864e5):null;
        const interes=pl.porDias?saldo*tasa/base*dias:saldo*i;
        const capital=k===pl.n?saldo:datos.plan==='insolutos'?pl.monto/pl.n:pl.cuotaIva-interes*(1+IVA);
        const mes=datos.periodicidad==='anual'&&mesAnual!=null?mesAnual%12+12*(k-1):Math.ceil(k*12/pl.porAnio)-1;
        fila(mes,capital,interes,f,dias);
      }
    }
    return filas;
  },

  // Años del flujo: como mínimo los que abarca el plazo solicitado, hasta 8.
  aniosPlazo(s){return Math.min(8,Math.max(1,Math.ceil(num(s.datos.plazo)/12)))},
  aniosFlujo(s){return Math.min(8,Math.max(this.aniosPlazo(s),num(s.flujoAnios)||1))},

  calcArraigo(anios,meses2){
    const totalMeses=num(anios)*12+num(meses2);
    if(totalMeses>=18)return 10;
    if(totalMeses>=12)return 7;
    if(totalMeses>=6)return 3;
    return 0;
  },

  evaluar(s,montoOv,plazoOv){
    const P=this.state.params;const vetos=[];
    const pl=this.plan(s.datos,montoOv,plazoOv);
    const simplificada=pl.monto>0&&pl.monto<num(P.montoEvalSimplificada);
    const c=s.caracter;
    const catOcup=this.state.config.ocupaciones||OCUPACIONES_DEFAULT;
    const tieneNegocio=tipoActividad(s.datos,catOcup)==='negocio';
    const flujoAplica=flujoActivo(s.datos,catOcup);

    // BONUS POINTS
    let bonusDiscapacidad=s.datos.tieneDiscapacidad?7:0;
    let bonusGenero=0;
    if(s.datos.genero==='mujer'){
      bonusGenero=3;
      if(s.datos.esUnicoSosten)bonusGenero=10;
    }else if(s.datos.genero==='hombre'&&s.datos.esUnicoSosten){
      bonusGenero=5;
    }

    // CARÁCTER
    const pVi=OPC.vivienda[c.vivienda]?OPC.vivienda[c.vivienda][1]:OPC.vivienda[0][1];
    const totalResMeses=num(c.resAnios)*12+num(c.resMeses);
    let pRe;
    if(totalResMeses>=6){
      pRe=this.calcArraigo(c.resAnios,c.resMeses);
    }else{
      pRe=this.calcArraigo(c.resPrevAnios,c.resPrevMeses);
    }
    const dom=clamp10(pVi*P.arraigoDom.vivienda+pRe*P.arraigoDom.residencia);

    const esPrimerEmpleo=!!s.datos.esPrimerEmpleo;
    const pAc=ACTIVIDADES_TODAS[c.actividad]?ACTIVIDADES_TODAS[c.actividad][1]:OPC.actividad[0][1];
    let pAn;
    if(esPrimerEmpleo){
      pAn=10;
    }else{
      const totalLabMeses=num(c.labAnios)*12+num(c.labMeses);
      if(totalLabMeses>=6){
        pAn=this.calcArraigo(c.labAnios,c.labMeses);
      }else{
        pAn=this.calcArraigo(c.labPrevAnios,c.labPrevMeses);
      }
    }
    const lab=clamp10(pAc*P.arraigoLab.actividad+pAn*P.arraigoLab.antiguedad);

    const sinHist=c.historial!==0;
    const pHi=OPC.historial[c.historial]?OPC.historial[c.historial][1]:OPC.historial[0][1];
    let pAt=10;
    if(!sinHist){
      const mop=mopClave(c.mopMaximo),regla=MOP_REGLA[mop];
      if(regla.veto){pAt=0;vetos.push('Experiencia crediticia: MOP '+mop+', '+regla.veto+'.')}
      else if(regla.comprobante){
        if(c.comprobantePagoMOP)pAt=regla.p;
        else{pAt=0;vetos.push('Experiencia crediticia: MOP '+mop+' sin comprobante de pago presentado.')}
      }else pAt=regla.p;
    }
    const pCo=sinHist?10:(OPC.comportamiento[c.comportamiento]?OPC.comportamiento[c.comportamiento][1]:10);
    const pRf=OPC.referencias[c.referencias]?OPC.referencias[c.referencias][1]:OPC.referencias[0][1];
    const exp=clamp10(pHi*P.expCred.historial+pAt*P.expCred.atrasos+pCo*P.expCred.comportamiento+pRf*P.expCred.referencias);
    const com=clamp10((OPC.antigSocio[c.antigSocio]?OPC.antigSocio[c.antigSocio][1]:10)*P.compromiso.antigSocio+(OPC.ahorro[c.ahorro]?OPC.ahorro[c.ahorro][1]:10)*P.compromiso.ahorro);
    const caracterBase=(dom*P.caracter.arraigoDom+lab*P.caracter.arraigoLab+exp*P.caracter.expCred+com*P.caracter.compromiso)/10;
    const caracter=Math.min(1,caracterBase+(bonusDiscapacidad+bonusGenero)/100);

    // CAPACIDAD
    const k=s.capacidad;
    // Con negocio los ingresos salen del flujo: promedio mensual de los ingresos sin préstamos menos los gastos del negocio.
    let ingresos;
    if(tieneNegocio){
      const mf=this.aniosFlujo(s)*12;let t=0;
      FILAS_ING.filter(f=>f[0]!=='prestamoInst'&&f[0]!=='prestamoOtra').forEach(f=>{for(let m=0;m<mf;m++)t+=num((s.flujo[f[0]]||[])[m])});
      for(let m=0;m<mf;m++)t-=num((s.flujo.gastosNegocio||[])[m]);
      ingresos=Math.max(0,t/mf);
    }else ingresos=num(k.ingTrabajo)+num(k.ingArrendamiento)+num(k.ingIntereses)+num(k.ingTransferencias)+num(k.ingOtros);
    const fam=num(k.gAlimentos)+num(k.gTransporte)+num(k.gEducacion)+num(k.gVivienda)+num(k.gPersonal)+num(k.gLimpieza)+num(k.gVestido)+num(k.gSalud)+num(k.gOtrosGastos);
    const deudas=num(k.dCajas)+num(k.dBancos)+num(k.dArrendamiento)+num(k.dPrestamistas);
    const egresosTot=fam*(1+P.u.margenGastos)+deudas;
    const disponible=ingresos-egresosTot;
    const cobCuota=pl.cuotaMensual>0?disponible/pl.cuotaMensual:0;
    let r1=0;
    if(cobCuota>=P.u.cobCuotaBuena)r1=10;else if(cobCuota>=P.u.cobCuotaMin)r1=5;
    else if(!tieneNegocio)vetos.push('Capacidad de pago: la cobertura de la cuota es '+(isFinite(cobCuota)?cobCuota.toFixed(2):'0.00')+', menor al mínimo de '+P.u.cobCuotaMin.toFixed(2)+'.');
    const ratioGI=ingresos>0?egresosTot/ingresos:1;
    const r2=ratioGI<P.u.gastosIngBueno?10:ratioGI<P.u.gastosIngMedio?3:0;
    const ratioGCI=ingresos>0?(egresosTot+pl.cuotaMensual)/ingresos:1;
    const r3=ratioGCI<P.u.gastosCuotaBueno?10:ratioGCI<P.u.gastosCuotaMedio?3:0;
    const capacidad=(r1*P.capacidad.coberturaCuota+r2*P.capacidad.gastosIngresos+r3*P.capacidad.gastosCuotaIng)/10;
    const gastoRef=num(s.datos.dependientes)*P.u.gastoBasicoPersona;
    const alertaGastos=fam>0&&fam<gastoRef;
    // Alertas informativas: no restan puntos ni son causal de rechazo.
    const alertas=[];
    if(alertaGastos)alertas.push('Capacidad: los gastos familiares declarados ('+mx(fam)+') son menores a la referencia de '+mx(gastoRef)+' por '+num(s.datos.dependientes)+' dependientes.');
    const gastoMinPct=num(this.reglas().gastoMinimoPct);
    const ratioGastoFam=ingresos>0?fam/ingresos:0;
    const alertaGastoMin=gastoMinPct>0&&ingresos>0&&ratioGastoFam<gastoMinPct;
    if(alertaGastoMin)alertas.push('Capacidad: los gastos familiares declarados son '+pct(ratioGastoFam)+' de los ingresos, menos del mínimo esperado de '+pct(gastoMinPct)+'. Verifique que no se hayan subdeclarado.');
    const LIM_CAP=0.30;
    const capMaxPago=ingresos*LIM_CAP;
    const capDisponible=capMaxPago-deudas;
    const pctCuotaIng=ingresos>0?pl.cuotaMensual/ingresos:1;
    const ratioCompromisos=ingresos>0?(deudas+pl.cuotaMensual)/ingresos:1;
    let plazoIdeal=null;
    if(capDisponible>0&&pl.monto>0){for(let m=1;m<=360;m++){if(this.plan(s.datos,pl.monto,m,true).cuotaMensual<=capDisponible){plazoIdeal=m;break}}}

    // CAPITAL
    const cp=s.capital;
    const af=cp.activosFijos||{};
    let activoFijoComprobado=0,activoFijoTotal=0;
    ACTIVOS_FIJOS.forEach(a=>{const it=af[a[0]];if(it){activoFijoTotal+=num(it.monto);if(it.comprobante&&it.comprobante!=='ninguno')activoFijoComprobado+=num(it.monto)}});
    const activos=num(cp.activoCirculante)+activoFijoTotal;
    const pasivos=num(cp.pasivoCorto)+num(cp.pasivoLargo);
    const capitalContable=activos-pasivos;
    const endAct=pasivos<=0?0:activos>0?pasivos/activos:Infinity;
    let q1=0;
    if(endAct>P.u.endActVeto){q1=0;if(!simplificada)vetos.push('Capital: el endeudamiento actual es '+pct(endAct)+', arriba del límite de '+pct(P.u.endActVeto)+'.')}
    else if(endAct>P.u.endActMedio)q1=5;else if(endAct>P.u.endActBueno)q1=7;else q1=10;
    const endProy=(activos+pl.monto)>0?(pasivos+pl.monto)/(activos+pl.monto):1;
    let q2=0;
    if(endProy>P.u.endProyVeto){q2=0;if(!simplificada)vetos.push('Capital: con el crédito solicitado el endeudamiento llega a '+pct(endProy)+', arriba del límite de '+pct(P.u.endProyVeto)+'.')}
    else if(endProy>P.u.endProyMedio)q2=5;else if(endProy>P.u.endProyBueno)q2=7;else q2=10;
    const capital=(q1*P.capital.endeudActual+q2*P.capital.endeudProyectado)/10;

    // CONDICIONES
    const cd=s.condiciones;
    const pFu=OPC.fuente[cd.fuente]?OPC.fuente[cd.fuente][1]:10;
    const tieneOVaEmprender=tieneNegocio||(c.actividad===0||c.actividad===4);
    let condiciones;
    if(tieneOVaEmprender){
      const pSe=OPC.sector[cd.sector]?OPC.sector[cd.sector][1]:10;
      const pEn=OPC.entorno[cd.entorno]?OPC.entorno[cd.entorno][1]:10;
      const pAN=OPC.antigNegocio[cd.antigNegocio]?OPC.antigNegocio[cd.antigNegocio][1]:10;
      const neg2=pSe*P.negocio.sector+pEn*P.negocio.entorno+pAN*P.negocio.antiguedad;
      condiciones=(pFu*P.condiciones.fuente+neg2*P.condiciones.negocio)/10;
    }else{
      condiciones=pFu/10;
    }

    // COLATERAL
    const g=s.colateral;let colateral=0;let colTxt='';
    const catGar=this.garantias(),gar=garantiaDe(g.tipo,catGar);
    const califica=x=>x>=num(gar.cobertura)?1:(num(gar.parcial)>0&&x>=num(gar.parcial)?Math.min(1,Math.max(0,num(gar.puntajeParcial))):0);
    const resultado=()=>colateral>=1?' — aceptable':colateral>0?' — cobertura parcial ('+pct(colateral)+')':' — insuficiente';
    // Cobertura de una garantía con sus propios datos: con dos garantes cuenta el que cubre menos.
    const coberturaDe=(gx,v)=>gx.medida==='cuota'
      ?Math.min(...(num(gx.personas)>=2?[num(v.ingGarante1),num(v.ingGarante2)]:[num(v.ingAval)]).map(x=>pl.cuotaMensual>0?x/pl.cuotaMensual:0))
      :pl.monto>0?num(v.avaluo)/pl.monto:0;
    if(!gar){
      colTxt='Garantía no configurada en el catálogo';
    }else if(gar.medida==='mixta'){
      const partes=(Array.isArray(g.mixta)?g.mixta:[]).map(v=>({v,gx:garantiaDe(v.tipo,catGar)})).filter(x=>x.gx&&(x.gx.medida==='cuota'||x.gx.medida==='monto'));
      let suma=0;
      const txt=partes.map(({v,gx})=>{
        const cov=coberturaDe(gx,v),req=num(gx.cobertura);
        const aporte=req>0?Math.min(1,cov/req):(cov>0?1:0);
        suma+=aporte;
        return gx.nombre+' '+cov.toFixed(2)+' de '+req.toFixed(2)+' ('+pct(aporte)+')';
      });
      colateral=califica(suma);
      colTxt=partes.length?gar.nombre+': '+txt.join(' + ')+' = '+pct(suma)+' de la cobertura requerida; se requiere '+pct(num(gar.cobertura))+resultado():gar.nombre+': seleccione las garantías que la integran — insuficiente';
    }else if(gar.medida==='cuota'){
      const ingG=num(gar.personas)>=2?[num(g.ingGarante1),num(g.ingGarante2)]:[num(g.ingAval)];
      const cobs=ingG.map(x=>pl.cuotaMensual>0?x/pl.cuotaMensual:0);
      colateral=Math.min(...cobs.map(califica));
      colTxt=gar.nombre+': cobertura de cuota '+cobs.map(x=>x.toFixed(2)).join(' y ')+'; se requiere '+num(gar.cobertura).toFixed(2)+(cobs.length>1?' cada uno':'')+resultado();
    }else if(gar.medida==='monto'){
      const cov=pl.monto>0?num(g.avaluo)/pl.monto:0;
      colateral=califica(cov);
      colTxt=gar.nombre+': cobertura '+cov.toFixed(2)+' veces el crédito; se requiere '+num(gar.cobertura).toFixed(2)+resultado();
    }else{
      colTxt=gar.nombre;
    }

    const B=P.bloques;
    const pesosC=simplificada
      ?(t=>({caracter:B.caracter/t,capacidad:B.capacidad/t,capital:0,condiciones:0,colateral:B.colateral/t}))(B.caracter+B.capacidad+B.colateral)
      :{caracter:B.caracter,capacidad:B.capacidad,capital:B.capital,condiciones:B.condiciones,colateral:B.colateral};
    const score5c=caracter*pesosC.caracter+capacidad*pesosC.capacidad+capital*pesosC.capital+condiciones*pesosC.condiciones+colateral*pesosC.colateral;

    // FLUJO DE EFECTIVO
    const mesesFlujo=this.aniosFlujo(s)*12;
    let ing=[],egr=[],res=[],acum=[],run=0;
    for(let m=0;m<mesesFlujo;m++){
      let a=0,b=0;
      FILAS_ING.forEach(f=>{a+=num((s.flujo[f[0]]||[])[m])});
      FILAS_EGR.forEach(f=>{b+=num((s.flujo[f[0]]||[])[m])});
      ing.push(a);egr.push(b);res.push(a-b);run+=a-b;acum.push(run);
    }
    const totIng=ing.reduce((x,y)=>x+y,0);
    const totEgr=egr.reduce((x,y)=>x+y,0);
    const ratioFlujo=totIng>0?totEgr/totIng:1;
    const mp=Math.min(mesesFlujo-1,Math.max(0,num(s.flujoMesPago)));
    const ingMesPago=ing[mp]||0;
    const compromisoMes=egr[mp]||0;
    const acumPrevio=mp>0?acum[mp-1]:0;
    const ingDisponibleMes=ingMesPago+Math.min(0,acumPrevio);
    const cobFlujo=compromisoMes>0?Math.max(0,ingDisponibleMes)/compromisoMes:0;
    const mesesNeg=acum.filter(x=>x<0).length;
    let f1=0;
    if(totIng<=0){f1=0}
    else if(ratioFlujo<=0.70)f1=10;else if(ratioFlujo<=0.80)f1=7;else if(ratioFlujo<=P.u.flujoGastosMax)f1=4;
    else{f1=0;if(flujoAplica)vetos.push('Flujo de efectivo: los egresos son '+pct(ratioFlujo)+' de los ingresos, arriba del máximo de '+pct(P.u.flujoGastosMax)+'.')}
    let f2=0;
    if(compromisoMes<=0){f2=0}
    else if(cobFlujo>=1.5)f2=10;else if(cobFlujo>=1.2)f2=8;else if(cobFlujo>P.u.flujoCoberturaMin)f2=5;
    else{f2=0;if(flujoAplica)vetos.push('Flujo de efectivo: la cobertura del mes de pago es '+pct(cobFlujo)+', igual o menor al 100% exigido.')}
    const f3=mesesNeg===0?10:mesesNeg<=2?6:2;
    const capturado=totIng>0||totEgr>0;
    const margenNeg=margenNegocio(s,mesesFlujo);
    const scoreFlujo=capturado?(f1*P.flujoPeso.ratioGastos+f2*P.flujoPeso.cobertura+f3*P.flujoPeso.acumulado)/10:0;
    if(!capturado&&flujoAplica)vetos.push('Flujo de efectivo: no se ha capturado el flujo mensual.');

    // CANVAS (solo aplica a actividades productivas)
    let cs=0;
    CANVAS_BLOQUES.forEach(b=>{cs+=num((s.canvas[b[0]]||{}).p)});
    const scoreCanvas=tieneNegocio?cs/(CANVAS_BLOQUES.length*5):0;

    let wC=P.mezcla.cincoC,wF=P.mezcla.flujo,wV=P.mezcla.canvas;
    if(!tieneNegocio){wV=0;const tot=P.mezcla.cincoC+P.mezcla.flujo;wC=P.mezcla.cincoC/tot;wF=P.mezcla.flujo/tot}
    if(!flujoAplica){wC=1;wF=0;wV=0}
    const global=100*(score5c*wC+scoreFlujo*wF+scoreCanvas*wV);
    let banda='NO AUTORIZABLE';
    for(let i=0;i<P.bandas.length;i++){if(score5c>=P.bandas[i][0]){banda=P.bandas[i][1];break}}
    let dict='RECHAZADO';
    if(vetos.length===0)dict=global>=P.dictamen.aprobado?'APROBADO':global>=P.dictamen.condicionado?'CONDICIONADO':'RECHAZADO';

    const flujoRequerido=flujoAplica;
    return {
      pl,vetos,banda,dictamen:dict,global,
      score5c,scoreFlujo,scoreCanvas,
      caracter,caracterBase,capacidad,capital,condiciones,colateral,colTxt,
      sub:{dom,lab,exp,com,pVi,pRe,pAc,pAn,pHi,pAt,pCo,pRf,r1,r2,r3,q1,q2},

      <div><div style="font:400 11.5px/1.4 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--n600);margin-bottom:7px">Rechazadas</div><div style="font:600 33px/1 var(--fonth)">${evs.filter(x=>x.s.estado==='RECHAZADA').length}</div></div>

      <tbody>${evs.map(x=>`<tr>
        <td style="font-variant-numeric:tabular-nums">${esc(x.s.folio)}</td>
        <td>${esc(x.s.datos.nombre||'(sin nombre)')}</td>
        <td style="color:var(--n700)">${esc(x.s.sucursal)}</td>
        <td style="text-align:right;font-variant-numeric:tabular-nums">${mx(x.s.datos.monto)}</td>
        ${ver?`<td style="text-align:right;font-variant-numeric:tabular-nums;font-weight:600">${x.e.global.toFixed(1)}</td>

    ${evs.length===0?'<p style="font:400 15px/1.5 var(--font);color:var(--n700);margin:26px 0 0">No hay solicitudes en su alcance. Cree la primera con «Nueva solicitud».</p>':''}`;
  },

    let tabContent='';
    if(activeTab==='datos')tabContent=this.renderTabDatos(s,E);

    else if(activeTab==='capital')tabContent=this.renderTabCapital(s,E);
    else if(activeTab==='condiciones')tabContent=this.renderTabCondiciones(s,E);
    else if(activeTab==='colateral')tabContent=this.renderTabColateral(s,E);
    else if(activeTab==='flujo')tabContent=this.renderTabFlujo(s,E);
    else if(activeTab==='canvas')tabContent=this.renderTabCanvas(s,E);

          {l:'Subtotal 5C',p:pct(E.pesos.cincoC),v:pct(E.score5c)},
          {l:'Flujo de efectivo',p:E.flujoAplica?pct(E.pesos.flujo):'—',v:E.flujoAplica?pct(E.scoreFlujo):'No aplica'}
        ].concat(E.tieneNegocio?[{l:'Modelo CANVAS',p:pct(E.pesos.canvas),v:pct(E.scoreCanvas)}]:[]).map(b=>`<div style="display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid var(--div)">

          <span style="font:400 12px/1.3 var(--font);color:var(--n600)">${b.p}</span>
          <span style="font:600 14px/1.3 var(--fonth);font-variant-numeric:tabular-nums;min-width:52px;text-align:right">${b.v}</span>
        </div>`).join('')}

          <span style="font:600 15px/1.3 var(--fonth)">Score global</span><span style="flex:1"></span>

        </div>
        ${E.bonusDiscapacidad||E.bonusGenero?`<div style="margin-top:8px;font:400 12px/1.4 var(--font);color:var(--a700)">Bonificaciones: ${E.bonusDiscapacidad?'Discapacidad +7':''}${E.bonusDiscapacidad&&E.bonusGenero?' · ':''}${E.bonusGenero?'Género/sostén +'+E.bonusGenero:''}</div>`:''}

        ${E.vetos.map(v=>`<div style="font:400 13px/1.45 var(--font);padding:5px 0;border-bottom:1px solid var(--div)">${esc(v)}</div>`).join('')}

        <div style="font:600 46px/1 var(--fonth)">${E.global.toFixed(1)}</div>
        <div style="font:400 13px/1.3 var(--font);color:var(--n700)">${E.vetos.length?'No autorizable':E.dictamen==='APROBADO'?'Viable':E.dictamen==='CONDICIONADO'?'Viable con condiciones':'Debajo del mínimo'}</div>
      </div>`:''}

    <div class="no-print" style="display:flex;flex-wrap:wrap;gap:3px;border-bottom:1px solid var(--text);margin:24px 0 26px">

  renderTabDatos(s,E){
    const d=s.datos,cfg=this.state.config;
    const cat=cfg.ocupaciones||OCUPACIONES_DEFAULT,tipoAct=tipoActividad(d,cat),ocups=ocupacionesDeTipo(tipoAct,cat);
    const siNo=path=>`<select class="input" data-action="updBool" data-path="${path}">
        <option value="false" ${!path.split('.').reduce((o,p)=>o[p],s)?'selected':''}>No</option>
        <option value="true" ${path.split('.').reduce((o,p)=>o[p],s)?'selected':''}>Sí</option>
      </select>`;
    const prodSel=d.producto?cfg.productos.find(p=>p.nombre===d.producto):null;
    const ver=this.verScore();
    const productoOpts=cfg.productos.map(p=>`<option value="${esc(p.nombre)}" ${d.producto===p.nombre?'selected':''}>${esc(p.nombre)} (${p.tasaAnual}%${p.sinIva?' sin IVA':''}, ${p.plazoMax}m, ${mx(p.montoMin||0)}–${mx(p.montoMax||0)})</option>`).join('');

        E.ingresos>0?`<strong>${pct(E.ratioGastoFam)}</strong> · ${E.alertaGastoMin?'<strong style="color:var(--a2700)">Revisar: posible subdeclaración de gastos</strong>':'Sin observación'}`:'<strong>Capture los ingresos para calcularla</strong>'):'')
    )+

      this.renderField('Pagos a bancos y tarjetas de crédito','',`<input class="input" type="text" inputmode="decimal" value="${fnum(k.dBancos)}" data-action="updNum" data-path="capacidad.dBancos" min="0">`)+
      this.renderField('Arrendamientos y factorajes','',`<input class="input" type="text" inputmode="decimal" value="${fnum(k.dArrendamiento)}" data-action="updNum" data-path="capacidad.dArrendamiento" min="0">`)+

      this.renderField('Disponible mensual','Ingresos menos egresos con margen',`<strong>${mx(E.disponible)}</strong>`)+

      this.renderField('Gastos sobre ingresos',ver?'Debajo de '+pct(P.u.gastosIngBueno)+' es óptimo':'Egresos con margen ÷ ingresos',`<strong>${pct(E.ratioGI)}</strong>`,E.sub.r2.toFixed(0))+
      this.renderField('Gastos más cuota sobre ingresos',ver?'Debajo de '+pct(P.u.gastosCuotaBueno)+' es óptimo':'(Egresos con margen + cuota) ÷ ingresos',`<strong>${pct(E.ratioGCI)}</strong>`,E.sub.r3.toFixed(0))+
      this.renderField('Capacidad máxima de pago','Hasta el 30% de los ingresos mensuales ('+mx(E.ingresos)+')',`<strong>${mx(E.capMaxPago)}</strong>`)+
      this.renderField('Cuota solicitada sobre ingresos','La mensualidad no debe superar el 30% de los ingresos',`<strong>${pct(E.pctCuotaIng)}</strong> · ${dentro(E.pctCuotaIng)}`)+
      this.renderField('Nivel de compromisos financieros','Deudas actuales ('+mx(E.deudas)+') más la cuota solicitada ('+mx(E.pl.cuotaMensual)+'); máximo 30% de los ingresos',`<strong>${pct(E.ratioCompromisos)}</strong> · ${dentro(E.ratioCompromisos)}`)+
      this.renderField('Plazo ideal','Plazo mínimo en que la cuota cabe en el 30% de los ingresos, descontando las deudas actuales ('+mx(Math.max(0,E.capDisponible))+' disponibles)',`<strong>${plazoTxt}</strong>`)
    );
  },

  textoCuotaMensual(d,pl){
    const per=((PERIODICIDADES.find(p=>p[0]===d.periodicidad)||[])[1]||'').toLowerCase();
    if(d.periodicidad==='pago_unico')return 'Total a pagar ('+mx(pl.total)+') entre los '+pl.meses+' meses del plazo';
    if(d.periodicidad==='pago_unico_periodico')return 'Interés mensual con IVA ('+mx(pl.cuotaIva)+') más el capital entre los '+pl.meses+' meses ('+mx(pl.monto/pl.meses)+')';
    if(pl.porAnio===12)return d.plan==='insolutos'?'Pago más alto del plan':'Pago mensual fijo';
    return (d.plan==='insolutos'?'Pago '+per+' más alto ':'Pago '+per+' fijo ')+'('+mx(pl.pagoMaximo)+') × '+pl.porAnio+' pagos al año ÷ 12 meses';
  },

  renderPlanPagos(s,E){
    const filas=this.tablaPagos(s.datos,Math.min(E.flujo.mesesFlujo-1,Math.max(0,num(s.flujoMesPago))));
    const sum=k=>filas.reduce((a,f)=>a+f[k],0);
    const td='padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap';
    const mesTxt=m=>MESES[((m%12)+12)%12].slice(0,3)+' A'+(Math.floor(m/12)+1);
    const conFecha=filas.some(f=>f.fecha),conDias=!!E.pl.porDias;
    return this.renderSection('Plan de pagos',filas.length+' pago'+(filas.length>1?'s':'')+' · total '+mx(E.pl.total),
      `<p style="font:400 12.5px/1.5 var(--font);color:var(--n700);margin:8px 0 10px">${conDias?'Saldos insolutos: el capital se paga en partes iguales y el interés de cada pago es saldo × '+num(s.datos.tasaPct)+'% ÷ '+(num(this.state.params.u.baseDias)||360)+' × días transcurridos desde el pago anterior.':s.datos.plan==='insolutos'&&!/^pago_unico/.test(s.datos.periodicidad)?'Saldos insolutos: el capital se paga en partes iguales y el interés se calcula sobre el saldo, por eso los pagos bajan. Capture la fecha de disposición para calcularlo por días transcurridos.':/^pago_unico/.test(s.datos.periodicidad)?'':'Pagos fijos: el pago incluye el IVA del interés; al bajar el saldo, una parte mayor abona a capital.'} ${conDias?'':'Tasa del periodo: '+(num(s.datos.tasaPct)/(E.pl.porAnio||1)).toFixed(4)+'%'+(E.pl.porAnio&&!/^pago_unico/.test(s.datos.periodicidad)?' ('+num(s.datos.tasaPct)+'% anual ÷ '+E.pl.porAnio+' pagos)':'')+' · '}${E.pl.ivaPct>0?'IVA '+pct(E.pl.ivaPct)+' sobre el interés.':'Producto sin IVA.'} Estos pagos son los que «Autopoblar préstamo» coloca en el flujo de efectivo.</p>
      <div style="overflow:auto;max-height:420px;border:1px solid var(--div)">
      <table class="table" style="min-width:720px;margin:0">
        <thead><tr><th style="text-align:right">Pago</th>${conFecha?'<th>Fecha</th>':''}${conDias?'<th style="text-align:right">Días</th>':''}<th>Mes del flujo</th><th style="text-align:right">Saldo inicial</th><th style="text-align:right">Capital</th><th style="text-align:right">Interés</th><th style="text-align:right">IVA</th><th style="text-align:right">Pago total</th><th style="text-align:right">Saldo final</th></tr></thead>
        <tbody>${filas.map(f=>`<tr><td style="${td}">${f.k}</td>${conFecha?`<td style="white-space:nowrap">${f.fecha?fechaTxt(f.fecha):''}</td>`:''}${conDias?`<td style="${td}">${f.dias}</td>`:''}<td style="white-space:nowrap">${mesTxt(f.mes)}</td><td style="${td}">${mx(f.saldoIni)}</td><td style="${td}">${mx(f.capital)}</td><td style="${td}">${mx(f.interes)}</td><td style="${td}">${mx(f.iva)}</td><td style="${td};font-weight:600">${mx(f.pago)}</td><td style="${td}">${mx(Math.max(0,f.saldoFin))}</td></tr>`).join('')}
          <tr style="background:var(--n200);font-weight:600"><td colspan="${3+(conFecha?1:0)+(conDias?1:0)}">Totales</td><td style="${td}">${mx(sum('capital'))}</td><td style="${td}">${mx(sum('interes'))}</td><td style="${td}">${mx(sum('iva'))}</td><td style="${td}">${mx(sum('pago'))}</td><td></td></tr>
        </tbody>
      </table></div>`);
  },

  renderTabCapital(s,E){
    const cp=s.capital,P=this.state.params,ver=this.verScore();
    const af=cp.activosFijos||{};
    let activoFijoFields='';
    ACTIVOS_FIJOS.forEach(a=>{
      const it=af[a[0]]||{monto:0,comprobante:'ninguno'};
      activoFijoFields+=this.renderField(a[1],'',`<div style="display:flex;gap:10px;align-items:flex-end">
        <div class="field" style="flex:1"><label>Monto declarado</label><input class="input" type="text" inputmode="decimal" value="${fnum(it.monto)}" data-action="updActivoFijo" data-key="${a[0]}" data-prop="monto" min="0"></div>
        <div class="field" style="flex:1.5"><label>Comprobante</label><select class="input" data-action="updActivoFijo" data-key="${a[0]}" data-prop="comprobante">
          ${COMPROBANTES_ACTIVO.map(c2=>`<option value="${c2[0]}" ${it.comprobante===c2[0]?'selected':''}>${c2[1]}</option>`).join('')}
        </select></div>
      </div>`);
    });
    return this.renderSection('Activos totales — lo que tiene','Total de activos: '+mx(E.activos),
      this.renderField('Activo circulante','Efectivo, inventarios, cuentas por cobrar',`<input class="input" type="text" inputmode="decimal" value="${fnum(cp.activoCirculante)}" data-action="updNum" data-path="capital.activoCirculante" min="0">`)
    )+
    this.renderSection('Activo fijo desglosado','Total '+mx(E.activoFijoTotal)+' · con escritura o factura: '+mx(E.activoFijoComprobado),activoFijoFields)+
    this.renderSection('Pasivos totales — lo que debe',mx(num(cp.pasivoCorto)+num(cp.pasivoLargo)),
      this.renderField('Pasivo de corto plazo','Vencimientos dentro de doce meses',`<input class="input" type="text" inputmode="decimal" value="${fnum(cp.pasivoCorto)}" data-action="updNum" data-path="capital.pasivoCorto" min="0">`)+
      this.renderField('Pasivo de largo plazo','Vencimientos a más de doce meses',`<input class="input" type="text" inputmode="decimal" value="${fnum(cp.pasivoLargo)}" data-action="updNum" data-path="capital.pasivoLargo" min="0">`)
    )+
    this.renderSection('Indicadores de capital',ver?pct(P.bloques.capital)+' del score 5C · '+pct(E.capital):'',
      this.renderField('Activos totales','Activo circulante más activo fijo',`<strong>${mx(E.activos)}</strong>`)+
      this.renderField('Pasivos totales','Corto más largo plazo',`<strong>${mx(E.pasivos)}</strong>`)+
      this.renderField('Capital contable','Activos totales menos pasivos totales',`<strong style="color:${E.capitalContable<0?'var(--a2700)':'inherit'}">${mx(E.capitalContable)}</strong>`)+
      this.renderField('Endeudamiento actual','Pasivos ÷ activos'+(ver?' · hasta '+pct(P.u.endActBueno)+' óptimo · arriba de '+pct(P.u.endActVeto)+' es rechazo':''),`<strong>${isFinite(E.endAct)?pct(E.endAct):'Sin activos'}</strong>`,E.sub.q1.toFixed(0))+
      this.renderField('Endeudamiento con el crédito','(Pasivos + crédito) ÷ (activos + crédito)'+(ver?' · arriba de '+pct(P.u.endProyVeto)+' es rechazo':''),`<strong>${pct(E.endProy)}</strong>`,E.sub.q2.toFixed(0))
    );
  },

  renderTabCondiciones(s,E){
    const cd=s.condiciones,P=this.state.params,ver=this.verScore();
    let html=this.renderSection('Fuente principal de ingresos',ver?pct(P.condiciones.fuente)+' de las condiciones':'',
      this.renderField('Estabilidad de la fuente','Cómo se comporta el ingreso a lo largo del año',this.renderRadio('fuente',OPC.fuente,cd.fuente,'condiciones.fuente'))
    );
    if(E.tieneOVaEmprender){
      html+=this.renderSection('Del negocio',ver?pct(P.condiciones.negocio)+' de las condiciones':'',
        this.renderField('Sector y mercado','Demanda del producto o servicio',this.renderRadio('sector',OPC.sector,cd.sector,'condiciones.sector'))+
        this.renderField('Ubicación y entorno','Riesgo climático, social y de acceso',this.renderRadio('entorno',OPC.entorno,cd.entorno,'condiciones.entorno'))+
        this.renderField('Antigüedad del negocio','',this.renderRadio('antigNegocio',OPC.antigNegocio,cd.antigNegocio,'condiciones.antigNegocio'))
      );
    }else{
      html+=`<div style="background:var(--n200);border:1px solid var(--div);padding:14px 18px;margin-bottom:20px;border-radius:3px;font:400 13.5px/1.5 var(--font);color:var(--n700)">El apartado "Del negocio" no aplica porque el solicitante no tiene un negocio ni va a emprender uno (según la ocupación y actividad seleccionadas). Se evalúa únicamente la fuente de ingresos.</div>`;
    }

  },

  renderTabColateral(s,E){
    const g=s.colateral,cat=this.garantias(),gar=garantiaDe(g.tipo,cat);
    const opciones=cat.filter(x=>x.activa!==false||x.clave===g.tipo);
    let campos=this.renderField('Tipo de garantía requerida','Define cómo se mide la cobertura · el catálogo se configura en Configuración › Garantías',`<select class="input" data-action="updText" data-path="colateral.tipo">
      ${gar?'':`<option value="${esc(g.tipo||'')}" selected>${esc(g.tipo||'Seleccione...')} — no configurada</option>`}
      ${opciones.map(x=>`<option value="${esc(x.clave)}" ${g.tipo===x.clave?'selected':''}>${esc(x.nombre)}${x.activa===false?' (inactiva)':''}</option>`).join('')}
    </select>`);
    const veces=v=>num(v).toLocaleString('es-MX',{maximumFractionDigits:2});
    const parcialTxt=gar&&num(gar.parcial)>0?' · desde '+veces(gar.parcial)+' veces califica con '+pct(num(gar.puntajeParcial)):'';
    if(gar&&gar.medida==='cuota'&&num(gar.personas)>=2){
      const ayuda='Cada garante debe cubrir al menos '+veces(gar.cobertura)+' veces la cuota mensual'+parcialTxt;
      campos+=this.renderField('Ingresos mensuales del primer garante',ayuda,`<input class="input" type="text" inputmode="decimal" value="${fnum(g.ingGarante1)}" data-action="updNum" data-path="colateral.ingGarante1" min="0">`);
      campos+=this.renderField('Ingresos mensuales del segundo garante',ayuda,`<input class="input" type="text" inputmode="decimal" value="${fnum(g.ingGarante2)}" data-action="updNum" data-path="colateral.ingGarante2" min="0">`);
    }else if(gar&&gar.medida==='cuota'){
      campos+=this.renderField('Ingresos mensuales del aval, codeudor o garante','Debe cubrir al menos '+veces(gar.cobertura)+' veces la cuota mensual'+parcialTxt,`<input class="input" type="text" inputmode="decimal" value="${fnum(g.ingAval)}" data-action="updNum" data-path="colateral.ingAval" min="0">`);
    }else if(gar&&gar.medida==='monto'){
      campos+=this.renderField('Valor de la garantía','Avalúo, depósito o valor del colateral · cobertura exigida: '+veces(gar.cobertura)+' veces el monto del crédito'+parcialTxt,`<input class="input" type="text" inputmode="decimal" value="${fnum(g.avaluo)}" data-action="updNum" data-path="colateral.avaluo" min="0">`);
    }else if(gar&&gar.medida==='mixta'){
      const mixta=Array.isArray(g.mixta)?g.mixta:[];
      const elegibles=cat.filter(x=>(x.medida==='cuota'||x.medida==='monto')&&(x.activa!==false||mixta.some(v=>v.tipo===x.clave)));
      const inp=(clave,prop,v)=>`<input class="input" type="text" inputmode="decimal" value="${fnum(num(v))}" data-action="updMixta" data-clave="${esc(clave)}" data-prop="${prop}" min="0">`;
      campos+=this.renderField('Garantías que la integran','Marque las que presenta el solicitante. Cada una aporta la parte de su cobertura requerida que cubre, hasta 100%; la suma debe llegar a '+pct(num(gar.cobertura))+' de lo requerido'+(num(gar.parcial)>0?' · desde '+pct(num(gar.parcial))+' califica con '+pct(num(gar.puntajeParcial)):''),
        `<div style="display:flex;flex-direction:column;gap:10px">${elegibles.map(x=>{
          const v=mixta.find(m=>m.tipo===x.clave);
          let det='';
          if(v){
            if(x.medida==='monto')det=`<div class="field"><label>Valor de la garantía · se requieren ${veces(x.cobertura)} veces el monto</label>${inp(x.clave,'avaluo',v.avaluo)}</div>`;
            else if(num(x.personas)>=2)det=`<div style="display:flex;gap:10px"><div class="field" style="flex:1"><label>Ingresos del primer garante</label>${inp(x.clave,'ingGarante1',v.ingGarante1)}</div><div class="field" style="flex:1"><label>Ingresos del segundo garante</label>${inp(x.clave,'ingGarante2',v.ingGarante2)}</div></div><div style="font:400 12px/1.4 var(--font);color:var(--n700)">Cada garante debe cubrir ${veces(x.cobertura)} veces la cuota mensual</div>`;
            else det=`<div class="field"><label>Ingresos mensuales · se requieren ${veces(x.cobertura)} veces la cuota mensual</label>${inp(x.clave,'ingAval',v.ingAval)}</div>`;
          }
          return `<div style="border:1px solid var(--div);padding:8px 10px;border-radius:3px"><label style="display:flex;gap:8px;align-items:center;font:400 13.5px/1.4 var(--font);cursor:pointer"><input type="checkbox" data-action="toggleMixta" data-clave="${esc(x.clave)}" ${v?'checked':''} style="accent-color:var(--accent)"><span>${esc(x.nombre)}${x.activa===false?' (inactiva)':''}</span></label>${det?'<div style="margin-top:8px">'+det+'</div>':''}</div>`;
        }).join('')}</div>`);
    }
    campos+=this.renderField('Calificación de la garantía',E.colTxt,`<strong>${E.colateral>=0.7?'Aceptable':'No aceptable'}</strong>`,pct(E.colateral));
    return this.renderSection('Colateral',this.verScore()?pct(E.pesosC.colateral)+' del score 5C':'',campos);
  },

  renderTabFlujo(s,E){
    const meses=E.flujo.mesesFlujo,ver=this.verScore();
    const colLabel=m=>MESES[m%12].slice(0,3)+' A'+(Math.floor(m/12)+1);
    const mkRow=(key,label)=>{
      const arr=s.flujo[key]||[];
      let cells='';
      for(let m=0;m<meses;m++)cells+=`<td><input type="text" inputmode="decimal" value="${fnum(arr[m]||0)}" data-action="updFlujo" data-key="${key}" data-mes="${m}" step="any"></td>`;
      return `<tr><td style="position:sticky;left:0;background:var(--bg);padding:5px 10px;font:400 12.5px/1.3 var(--font);white-space:nowrap;z-index:1">${label}</td>${cells}</tr>`;
    };
    const totRow=(label,arr)=>`<tr><td style="position:sticky;left:0;background:var(--n200);padding:6px 10px;font:600 12.5px/1.3 var(--font);white-space:nowrap;z-index:1">${label}</td>${arr.slice(0,meses).map(x=>`<td style="background:var(--n200);padding:6px;font:600 12px/1.2 var(--font);text-align:right;white-space:nowrap">${mx(x)}</td>`).join('')}</tr>`;
    const headerRow=(label)=>`<tr><td colspan="${meses+1}" style="background:var(--a100);padding:6px 10px;font:600 11.5px/1.2 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--a800)">${label}</td></tr>`;

    let cols='';
    for(let m=0;m<meses;m++)cols+=`<th style="background:var(--n200);padding:7px 6px;font:600 11px/1.2 var(--font);white-space:nowrap">${colLabel(m)}</th>`;
    let mesesOpts='';
    for(let m=0;m<meses;m++)mesesOpts+=`<option value="${m}" ${num(s.flujoMesPago)===m?'selected':''}>${MESES[m%12]} — año ${Math.floor(m/12)+1}</option>`;

    return `
    <div style="background:var(--a2100);border:1px solid var(--accent2);padding:10px 14px;margin-bottom:12px;border-radius:3px;font:400 13px/1.5 var(--font);color:var(--a2800)"><strong>Flujo de efectivo requerido:</strong> ${E.tieneNegocio?'el solicitante tiene un negocio o empresa':'el solicitante tiene ingresos variables o un gasto importante programado en el año'}. Complete el flujo mensual para una evaluación precisa.</div>
    <div style="font:400 12.5px/1.5 var(--font);color:var(--n700);margin-bottom:14px">${E.tieneNegocio?'Capture aquí los ingresos del negocio. De Capacidad se cargan solos':'Los datos de Capacidad se cargan solos: ingresos por trabajo en <strong>Sueldos</strong>, rentas, intereses y transferencias en <strong>Otros ingresos</strong>,'} gastos familiares en <strong>Egresos familiares</strong> y deudas en <strong>Pago a otras Entidades Financieras</strong>. Si modifica un mes de esos renglones, el renglón deja de actualizarse.</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">
      <button class="btn btn-s" data-action="recargarFlujo">Recargar desde Capacidad</button>
      <button class="btn btn-p" data-action="autoPopularFlujo">Autopoblar préstamo de la Institución</button>
      <span style="font:400 12px/1.4 var(--font);color:var(--n700);align-self:center">Coloca el monto del préstamo como ingreso del primer mes y los pagos como egreso según el plan. Después se actualiza solo si cambian monto, plazo, tasa o periodicidad, mientras no modifique esos renglones a mano.</span>
    </div>
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:24px;margin-bottom:22px">
      <div><label style="display:block;font:400 13px/1.4 var(--font);margin-bottom:5px">Años analizados</label>
        <select class="input" data-action="updFlujoProp" data-prop="flujoAnios" style="width:130px">
          ${[1,2,3,4,5,6,7,8].filter(n=>n>=this.aniosPlazo(s)).map(n=>`<option value="${n}" ${meses/12===n?'selected':''}>${n} año${n>1?'s':''}</option>`).join('')}
        </select>
        <div style="font:400 12px/1.4 var(--font);color:var(--n700);margin-top:4px">Mínimo ${this.aniosPlazo(s)} según el plazo de ${num(s.datos.plazo)} meses · máximo 8</div>
      </div>
      <div><label style="display:block;font:400 13px/1.4 var(--font);margin-bottom:5px">Mes del pago analizado</label>
        <select class="input" data-action="updFlujoProp" data-prop="flujoMesPago" style="width:180px">${mesesOpts}</select>

  // Margen de utilidad del negocio frente al promedio de referencia del giro y al de las solicitudes del mismo giro.
  renderMargenUtilidad(s,E){
    const M=E.margenNeg,cfg=this.state.config,clave=s.datos.ocupacion||'';
    const ocu=(cfg.ocupaciones||OCUPACIONES_DEFAULT).find(o=>o[0]===clave);
    const ref=margenGiroRef(clave,cfg);
    const otros=this.state.solicitudes.filter(x=>x.id!==s.id&&(x.datos||{}).ocupacion===clave&&clave).map(x=>margenNegocio(x).margen).filter(x=>x!=null);
    const promInst=otros.length?otros.reduce((a,b)=>a+b,0)/otros.length:null;
    const dif=M.margen!=null?(M.margen-ref)*100:null;
    return `<div>
        <div style="font:400 11.5px/1.4 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--n600);margin-bottom:6px">Margen de utilidad del negocio</div>
        <div style="font:600 28px/1 var(--fonth)">${M.margen!=null?pct(M.margen):'—'}</div>
        <div style="font:400 12.5px/1.45 var(--font);color:var(--n700);margin-top:5px">${M.margen!=null?'(Ingresos del negocio '+mx(M.ing)+' − gastos del negocio '+mx(M.gas)+') ÷ ingresos del negocio. Ingresos del negocio: agrícolas, ganaderos y ventas.':'Capture ingresos agrícolas, ganaderos o de ventas y los gastos del negocio.'}</div>
        <div style="font:400 12.5px/1.45 var(--font);margin-top:6px">Promedio de referencia del giro${ocu?' «'+esc(ocu[1])+'»':''}: <strong>${pct(ref)}</strong>${dif!=null?' · '+(Math.abs(dif)<0.05?'igual al promedio':Math.abs(dif).toFixed(1)+' puntos '+(dif>0?'arriba':'abajo')+' del promedio'):''}</div>
        <div style="font:400 12.5px/1.45 var(--font);color:var(--n700);margin-top:3px">${promInst!=null?'Promedio de '+otros.length+' solicitud'+(otros.length>1?'es':'')+' del mismo giro en la institución: '+pct(promInst):'Aún no hay otras solicitudes del mismo giro con flujo capturado.'}</div>
      </div>`;
  },

          <table style="width:100%;border-collapse:collapse;font-size:8.5px"><tr><td style="padding:1px 4px">Activos totales</td><td style="padding:1px 4px;text-align:right">${mx(activos)}</td></tr><tr><td style="padding:1px 4px">Pasivos totales</td><td style="padding:1px 4px;text-align:right">${mx(pasivos)}</td></tr><tr><td style="padding:1px 4px">Capital contable</td><td style="padding:1px 4px;text-align:right;font-weight:700">${mx(activos-pasivos)}</td></tr><tr><td style="padding:1px 4px">Endeudamiento actual</td><td style="padding:1px 4px;text-align:right">${ver?E.sub.q1.toFixed(0)+'/10':(isFinite(E.endAct)?pct(E.endAct):'Sin activos')}</td></tr><tr><td style="padding:1px 4px">Endeudamiento proyectado</td><td style="padding:1px 4px;text-align:right">${ver?E.sub.q2.toFixed(0)+'/10':pct(E.endProy)}</td></tr></table>
        </div>
        <div style="border:1px solid #999"><div style="background:#d0d0d0;padding:2px 4px;font:700 9px/1.2 Arial,sans-serif">C3 CAPACIDAD DE PAGO${sc(' — '+(E.capacidad*100).toFixed(1)+'%')}</div>
          <table style="width:100%;border-collapse:collapse;font-size:8.5px"><tr><td style="padding:1px 4px">Ingresos mensuales</td><td style="padding:1px 4px;text-align:right">${mx(E.ingresos)}</td></tr><tr><td style="padding:1px 4px">Egresos mensuales</td><td style="padding:1px 4px;text-align:right">${mx(E.egresosTot)}</td></tr><tr><td style="padding:1px 4px">Disponible mensual</td><td style="padding:1px 4px;text-align:right;font-weight:700">${mx(E.disponible)}</td></tr><tr><td style="padding:1px 4px">Cobertura de cuota</td><td style="padding:1px 4px;text-align:right">${E.cobCuota.toFixed(2)}${sc(' · '+E.sub.r1.toFixed(0)+'/10')}</td></tr><tr><td style="padding:1px 4px">Gastos/Ingresos</td><td style="padding:1px 4px;text-align:right">${pct(E.ratioGI)}${sc(' · '+E.sub.r2.toFixed(0)+'/10')}</td></tr></table>
        </div>
        <div style="border:1px solid #999"><div style="background:#d0d0d0;padding:2px 4px;font:700 9px/1.2 Arial,sans-serif">C4 CONDICIONES${E.simplificada?' — NO APLICA':sc(' — '+(E.condiciones*100).toFixed(1)+'%')}</div>
          <table style="width:100%;border-collapse:collapse;font-size:8.5px"><tr><td style="padding:1px 4px">Fuente de ingresos</td><td style="padding:1px 4px;text-align:right">${OPC.fuente[cd.fuente]?esc(OPC.fuente[cd.fuente][0]):'—'}</td></tr><tr><td style="padding:1px 4px">Sector y mercado</td><td style="padding:1px 4px;text-align:right">${OPC.sector[cd.sector]?esc(OPC.sector[cd.sector][0].substring(0,25)):'—'}</td></tr><tr><td style="padding:1px 4px">Entorno</td><td style="padding:1px 4px;text-align:right">${OPC.entorno[cd.entorno]?esc(OPC.entorno[cd.entorno][0].substring(0,25)):'—'}</td></tr><tr><td style="padding:1px 4px">Antigüedad negocio</td><td style="padding:1px 4px;text-align:right">${OPC.antigNegocio[cd.antigNegocio]?esc(OPC.antigNegocio[cd.antigNegocio][0].substring(0,25)):'—'}</td></tr></table>
        </div>
      </div>
      <div style="border:1px solid #999;margin-bottom:4px"><div style="background:#d0d0d0;padding:2px 4px;font:700 9px/1.2 Arial,sans-serif">C5 COLATERAL${sc(' — '+pct(E.colateral))}</div><div style="padding:2px 4px;font-size:8.5px">Tipo: ${garantia?esc(garantia.nombre):'—'} · ${esc(E.colTxt)}</div></div>
      ${ver?`<div style="border:2px solid #000;padding:4px 8px;margin-bottom:4px;display:flex;align-items:center;gap:12px">
        <div style="flex:1;font:700 9.5px/1.3 Arial,sans-serif"><div>CALIFICACIÓN CREDITICIA</div><div style="font-weight:400;margin-top:1px">5C${E.simplificada?' simplificada (C1, C3, C5)':''}: ${pct(E.score5c)} (${pct(E.pesos.cincoC)}) · Flujo: ${E.flujoAplica?pct(E.scoreFlujo)+' ('+pct(E.pesos.flujo)+')':'No aplica'}${E.tieneNegocio?' · CANVAS: '+pct(E.scoreCanvas)+' ('+pct(E.pesos.canvas)+')':''}</div></div>
        <div style="font:700 22px/1 Arial,sans-serif">${E.global.toFixed(1)}</div>
        <div style="font:700 10px/1.2 Arial,sans-serif;padding:3px 8px;border:1px solid #000">${E.dictamen}</div>
      </div>
      ${E.vetos.length?'<div style="font:400 8.5px/1.3 Arial,sans-serif;margin-bottom:3px"><strong>Causales de rechazo:</strong> '+E.vetos.map(v=>esc(v)).join(' · ')+'</div>':''}`:''}
      ${E.alertas.length?'<div style="font:400 8.5px/1.3 Arial,sans-serif;margin-bottom:3px"><strong>Alertas informativas:</strong> '+E.alertas.map(v=>esc(v)).join(' · ')+'</div>':''}
      <div style="border:1px solid #999;padding:3px 6px;margin-bottom:4px">
        <div style="font:700 9px/1.2 Arial,sans-serif;margin-bottom:2px">DICTAMEN DEL ANALISTA</div>
        <div style="font:400 8.5px/1.4 Arial,sans-serif">${s.resolucion?esc(s.resolucion.comentario):'(Pendiente de resolución)'}</div>

      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:50px;margin:34px 30px 8px">
        <div style="text-align:center;border-top:1px solid #000;padding-top:3px;font:400 8.5px/1.3 Arial,sans-serif">${esc(s.analista)}<br>Nombre y firma del analista</div>
        <div style="text-align:center;border-top:1px solid #000;padding-top:3px;font:400 8.5px/1.3 Arial,sans-serif">${s.resolucion?esc(s.resolucion.por):'&nbsp;'}<br>Nombre y firma de quien autoriza</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:6px;padding-top:4px;border-top:1px solid #999">
        <div style="font:400 8px/1.3 Arial,sans-serif;color:#666">Analista: ${esc(s.analista)}${sc('<br>Banda de riesgo 5C: '+E.banda)}</div>
        <div style="font:400 8px/1.3 Arial,sans-serif;color:#666;text-align:right">SAC 2.0 · ${esc(cfg.nombreInstitucion)}<br>${new Date().toLocaleString('es-MX')}</div>

  renderFlujoImprimible(s,E){
    const meses=E.flujo.mesesFlujo,anios=Math.ceil(meses/12),ver=this.verScore();
    const margenTxt=this.reglas().margenUtilidad&&E.margenNeg.margen!=null?' · Margen de utilidad del negocio: '+pct(E.margenNeg.margen)+' (promedio del giro '+pct(margenGiroRef(s.datos.ocupacion,this.state.config))+')':'';
    const cfg=this.state.config;
    const th='border:1px solid #999;padding:2px 3px;font:700 7px/1.1 Arial,sans-serif;white-space:nowrap;background:#eee';
    const tot='border:1px solid #999;padding:1px 3px;text-align:right;font:700 7.5px/1.1 Arial,sans-serif;background:#e0e0e0';
    // Una tabla de 12 meses por año, con columna de total anual.
    const tablaAnio=y=>{
      const ms=[];for(let m=y*12;m<Math.min(meses,y*12+12);m++)ms.push(m);
      const suma=arr=>ms.reduce((a,m)=>a+num(arr[m]),0);
      const mkRow=(key,label)=>{const arr=s.flujo[key]||[];return '<tr><td style="border:1px solid #999;padding:2px 4px;font-size:8px;white-space:nowrap;background:#f8f8f8">'+label+'</td>'+ms.map(m=>'<td style="border:1px solid #ddd;padding:1px 3px;text-align:right;font-size:7.5px">'+(num(arr[m])?mx(arr[m]):'—')+'</td>').join('')+'<td style="'+tot+'">'+mx(suma(arr))+'</td></tr>'};
      const totRow=(label,arr,acum)=>'<tr><td style="border:1px solid #999;padding:2px 4px;font:700 8px/1.1 Arial,sans-serif;white-space:nowrap;background:#e0e0e0">'+label+'</td>'+ms.map(m=>'<td style="'+tot+'">'+mx(arr[m])+'</td>').join('')+'<td style="'+tot+'">'+mx(acum?arr[ms[ms.length-1]]:suma(arr))+'</td></tr>';
      return `<div style="margin-top:${y?10:0}px;break-inside:avoid;page-break-inside:avoid">
        ${anios>1?`<div style="font:700 8.5px/1.2 Arial,sans-serif;margin-bottom:2px">AÑO ${y+1}</div>`:''}
        <table style="width:100%;border-collapse:collapse"><thead><tr><th style="${th};text-align:left;min-width:120px">Concepto</th>${ms.map(m=>`<th style="${th}">${MESES[m%12].slice(0,3)}</th>`).join('')}<th style="${th}">Total</th></tr></thead><tbody>
          ${FILAS_ING.map(f=>mkRow(f[0],f[1])).join('')}
          ${totRow('Total ingresos',E.flujo.ing)}
          ${FILAS_EGR.map(f=>mkRow(f[0],f[1])).join('')}
          ${totRow('Total egresos',E.flujo.egr)}
          ${totRow('Resultado',E.flujo.res)}
          ${totRow('Acumulado',E.flujo.acum,true)}
        </tbody></table>
      </div>`;
    };
    return `<div style="font:400 9px/1.2 Arial,sans-serif;color:#000;padding:8px 10px">
      <div style="text-align:center;margin-bottom:6px">${cfg.logotipo?`<img src="${cfg.logotipo}" alt="" style="max-height:35px;max-width:160px;object-fit:contain;margin-bottom:2px">`:''}<div style="font:700 12px/1.2 Arial,sans-serif">${esc(cfg.nombreInstitucion)}</div><div style="font:700 10px/1.2 Arial,sans-serif">FLUJO DE EFECTIVO — ${esc(s.datos.nombre||'—')} · Folio ${esc(s.folio)} · ${anios} año${anios>1?'s':''}</div></div>
      ${Array.from({length:anios},(_,y)=>tablaAnio(y)).join('')}
      <div style="margin-top:6px;font:400 8px/1.3 Arial,sans-serif;color:#666">Egresos/Ingresos: ${pct(E.flujo.ratio)} · Cobertura mes pago: ${pct(E.flujo.cobertura)} · Meses negativos: ${E.flujo.mesesNeg}${margenTxt}${ver?' · Score flujo: '+pct(E.scoreFlujo):''} · ${new Date().toLocaleString('es-MX')}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:50px;margin:34px 30px 8px;break-inside:avoid;page-break-inside:avoid">
        <div style="text-align:center;border-top:1px solid #000;padding-top:3px;font:400 8.5px/1.3 Arial,sans-serif">${esc(s.datos.nombre||'&nbsp;')}<br>Nombre y firma del solicitante</div>
        <div style="text-align:center;border-top:1px solid #000;padding-top:3px;font:400 8.5px/1.3 Arial,sans-serif">${esc(s.analista)}<br>Nombre y firma del analista</div>
      </div>
    </div>`;
  },

  renderCanvasImprimible(s,E){
    const cv=s.canvas,cfg=this.state.config;
    return `<div style="font:400 9px/1.2 Arial,sans-serif;color:#000;padding:8px 15px;max-width:800px;margin:0 auto">
      <div style="text-align:center;margin-bottom:6px">${cfg.logotipo?`<img src="${cfg.logotipo}" alt="" style="max-height:35px;max-width:160px;object-fit:contain;margin-bottom:2px">`:''}<div style="font:700 12px/1.2 Arial,sans-serif">${esc(cfg.nombreInstitucion)}</div><div style="font:700 10px/1.2 Arial,sans-serif">MODELO CANVAS — ${esc(s.datos.nombre||'—')} · Folio ${esc(s.folio)}</div></div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px">
        ${CANVAS_BLOQUES.map(b=>{const val=cv[b[0]]||{p:3,nota:''};return '<div style="border:1px solid #999;padding:4px 6px"><div style="font:700 8.5px/1.2 Arial,sans-serif;margin-bottom:2px">'+esc(b[1])+' — '+val.p+'/5</div><div style="font:400 8px/1.35 Arial,sans-serif;color:#333">'+esc(val.nota||'Sin observaciones')+'</div></div>'}).join('')}
      </div>
      ${this.verScore()?`<div style="font:700 10px/1.2 Arial,sans-serif;text-align:center;padding:4px;border:1px solid #000">Score CANVAS: ${pct(E.scoreCanvas)}</div>`:''}
      <div style="margin-top:6px;font:400 8px/1.3 Arial,sans-serif;color:#666;text-align:center">SAC 2.0 · ${esc(cfg.nombreInstitucion)} · ${new Date().toLocaleString('es-MX')}</div>
    </div>`;
  },

  renderConfigReglas(){
    const R=this.reglas();
    const siNo=(k,v)=>`<select class="input" data-action="updRegla" data-regla="${k}" style="max-width:120px">
        <option value="false" ${!v?'selected':''}>No</option><option value="true" ${v?'selected':''}>Sí</option>
      </select>`;
    const fila=(titulo,texto,control)=>`<div style="display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--div)">
        <div style="flex:1 1 320px;min-width:0"><div style="font:400 15px/1.35 var(--font)">${titulo}</div><div style="font:400 12.5px/1.45 var(--font);color:var(--n700);margin-top:3px">${texto}</div></div>
        <div style="flex:0 0 140px">${control}</div>
      </div>`;
    return `
    <div class="config-card">
      <h3>Reglas de análisis</h3>
      <p style="font:400 13px/1.5 var(--font);color:var(--n700);margin:0 0 12px">Reglas que la institución decide aplicar. Los cambios se aplican de inmediato a todas las solicitudes.</p>
      ${fila('Ocultar el score y las causales de rechazo','Analistas y gerentes de sucursal no ven el score global, el desglose por C, los puntajes de cada respuesta, el resultado del modelo ni las causales de rechazo, en pantalla ni en los impresos. El superadministrador ve todo.',siNo('ocultarScore',R.ocultarScore))}
      ${fila('Calificar jornaleros e ingresos formales','Agrega dos opciones en Carácter › Actividad o fuente de ingresos: jornalero (5 puntos) e ingresos formales comprobables (10 puntos).',siNo('tipoIngreso',R.tipoIngreso))}
      ${fila('Margen de utilidad en el flujo de efectivo','Muestra el margen de utilidad del negocio y lo compara con el promedio de referencia del giro (editable en Catálogo de ocupaciones) y con el promedio de las solicitudes del mismo giro. Es informativo.',siNo('margenUtilidad',R.margenUtilidad))}
      ${fila('Gasto mínimo esperado (% del ingreso)','Si los gastos familiares declarados en Capacidad son menores a este porcentaje de los ingresos, se muestra una alerta. Solo informativa: no resta puntos ni es causal de rechazo. Use 0 para desactivarla.',`<input class="input" type="text" inputmode="decimal" value="${+(num(R.gastoMinimoPct)*100).toFixed(1)}" data-action="updReglaPct" data-regla="gastoMinimoPct" style="width:100px;text-align:right">`)}
    </div>`;
  },

  renderConfigGarantias(){
    const st=this.state,cat=this.garantias();
    const enUso=clave=>st.solicitudes.filter(s=>usaGarantia(s,clave)).length;
    const inp=(i,prop,v,w)=>`<input class="input" type="text" inputmode="decimal" value="${esc(String(v))}" data-action="updGarantia" data-idx="${i}" data-prop="${prop}" style="width:${w}px;text-align:right">`;
    const selMedida=(attrs,v,w)=>`<select class="input" ${attrs} style="width:${w||'100%'}">${MEDIDAS_GARANTIA.map(m=>`<option value="${m[0]}" ${v===m[0]?'selected':''}>${m[1]}</option>`).join('')}</select>`;
    const selPersonas=(attrs,v,w)=>`<select class="input" ${attrs} style="width:${w||'100%'}"><option value="1" ${num(v)<2?'selected':''}>1</option><option value="2" ${num(v)>=2?'selected':''}>2</option></select>`;
    const ng=st.nuevaGarantia||{nombre:'',medida:'monto',personas:1,cobertura:1,parcial:0,puntajeParcial:70};
    return `
    <div class="config-card">
      <h3>Garantías y coberturas</h3>
      <p style="font:400 13px/1.5 var(--font);color:var(--n700);margin:0 0 8px">Defina los tipos de garantía que se ofrecen en la pestaña Colateral y la cobertura que exige cada uno.</p>
      <ul style="font:400 13px/1.55 var(--font);color:var(--n700);margin:0 0 14px;padding-left:18px">
        <li><strong>Ingresos contra la cuota:</strong> los ingresos mensuales de cada garante, aval o codeudor se dividen entre la cuota mensual del crédito. Con dos garantes, ambos deben cumplir.</li>
        <li><strong>Valor contra el monto:</strong> el avalúo, depósito o valor del bien se divide entre el monto solicitado.</li>
        <li><strong>Combinación de garantías (mixta):</strong> en la solicitud se marcan varias garantías del catálogo con sus datos. Cada una aporta la parte que cubre de su propia cobertura requerida, hasta 100%, y la suma se compara con la cobertura de la mixta: 1 = 100% de lo requerido (por ejemplo, una prenda que cubre la mitad de lo exigido más un aval que cubre la otra mitad).</li>
        <li>Con la <strong>cobertura requerida</strong> la garantía califica al 100%. Con la <strong>cobertura parcial</strong> (0 = no aplica) califica con el porcentaje indicado; debajo, con 0%.</li>
      </ul>
      <p style="font:400 13px/1.5 var(--font);color:var(--n700);margin:0 0 12px">Los cambios se aplican de inmediato al score de las solicitudes. Una garantía que ya usa alguna solicitud no se puede quitar: desactívela para que no se ofrezca en solicitudes nuevas.</p>
      ${st.avisoGarantias?`<div style="font:400 13px/1.4 var(--font);color:var(--a2700);margin-bottom:12px">${esc(st.avisoGarantias)}</div>`:''}
      <div style="overflow-x:auto">
      <table class="table" style="margin-bottom:20px;min-width:1040px">
        <thead><tr><th>Garantía</th><th>Cómo se mide</th><th style="text-align:right">Garantes</th><th style="text-align:right">Cobertura requerida (veces)</th><th style="text-align:right">Cobertura parcial (veces)</th><th style="text-align:right">Calificación parcial (%)</th><th>Activa</th><th style="text-align:right">En uso</th><th></th></tr></thead>
        <tbody>
          ${cat.map((g,i)=>{const n=enUso(g.clave),cub=g.medida!=='ninguna';return `<tr>
            <td><input class="input" type="text" value="${esc(g.nombre)}" data-action="updGarantia" data-idx="${i}" data-prop="nombre" style="min-width:300px"></td>
            <td>${selMedida(`data-action="updGarantia" data-idx="${i}" data-prop="medida"`,g.medida,'205px')}</td>
            <td style="text-align:right">${g.medida==='cuota'?selPersonas(`data-action="updGarantia" data-idx="${i}" data-prop="personas"`,g.personas,'70px'):'—'}</td>
            <td style="text-align:right">${cub?inp(i,'cobertura',g.cobertura,80):'—'}</td>
            <td style="text-align:right">${cub?inp(i,'parcial',g.parcial,80):'—'}</td>
            <td style="text-align:right">${cub?inp(i,'puntajeParcial',Math.round(num(g.puntajeParcial)*1000)/10,70):'—'}</td>
            <td><button class="btn btn-g" data-action="toggleGarantia" data-idx="${i}" style="padding:4px 9px;font-size:12px">${g.activa===false?'No':'Sí'}</button></td>
            <td style="text-align:right">${n}</td>
            <td style="text-align:right"><button class="btn btn-g" data-action="borrarGarantia" data-idx="${i}" style="padding:4px 9px;font-size:12px">Quitar</button></td>
          </tr>`}).join('')}
        </tbody>
      </table></div>
      <h4 style="font:600 15px/1.3 var(--font);margin:0 0 10px">Agregar garantía</h4>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end;max-width:1000px">
        <div class="field" style="grid-column:span 2"><label>Nombre de la garantía</label><input class="input" type="text" id="nuevaGarantiaNombre" value="${esc(ng.nombre)}"></div>
        <div class="field"><label>Cómo se mide</label>${selMedida('id="nuevaGarantiaMedida"',ng.medida)}</div>
        <div class="field"><label>Garantes (contra la cuota)</label>${selPersonas('id="nuevaGarantiaPersonas"',ng.personas)}</div>
        <div class="field"><label>Cobertura requerida (veces)</label><input class="input" type="text" inputmode="decimal" id="nuevaGarantiaCobertura" value="${ng.cobertura}"></div>
        <div class="field"><label>Cobertura parcial (veces)</label><input class="input" type="text" inputmode="decimal" id="nuevaGarantiaParcial" value="${ng.parcial}"></div>
        <div class="field"><label>Calificación parcial (%)</label><input class="input" type="text" inputmode="decimal" id="nuevaGarantiaPuntaje" value="${ng.puntajeParcial}"></div>
        <button class="btn btn-p" data-action="agregarGarantia">Agregar</button>

  renderParams(){
    const st=this.state,P=st.params,esSuper=st.sesion.rol==='superadmin';
    const dis=esSuper?'':'disabled';
    const mkRow=(label,hint,value,path)=>`<div style="display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--div)">
      <div><div style="font:400 14px/1.35 var(--font)">${label}</div>${hint?`<div style="font:400 12px/1.4 var(--font);color:var(--n600)">${hint}</div>`:''}</div>
      <input class="input" type="text" inputmode="decimal" value="${value}" data-action="updParam" data-path="${path}" step="any" ${dis} style="text-align:right">
    </div>`;

    return `
    <h1 style="margin:0 0 4px">Parámetros del modelo</h1>
    <p style="font:400 15px/1.5 var(--font);color:var(--n700);margin:0 0 34px">Ponderaciones y umbrales del modelo de scoring. Solo el superadministrador puede modificarlos.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:40px">
      <section>
        <div style="border-bottom:2px solid var(--text);padding-bottom:6px"><h2 style="margin:0">Mezcla del score global</h2></div>
        ${mkRow('Cinco C del crédito','',''+P.mezcla.cincoC,'mezcla.cincoC')}
        ${mkRow('Análisis de flujo de efectivo','',''+P.mezcla.flujo,'mezcla.flujo')}
        ${mkRow('Modelo CANVAS del negocio','',''+P.mezcla.canvas,'mezcla.canvas')}
      </section>
      <section>
        <div style="border-bottom:2px solid var(--text);padding-bottom:6px"><h2 style="margin:0">Las cinco C</h2></div>
        ${mkRow('Carácter','',''+P.bloques.caracter,'bloques.caracter')}
        ${mkRow('Capacidad de pago','',''+P.bloques.capacidad,'bloques.capacidad')}
        ${mkRow('Capital','',''+P.bloques.capital,'bloques.capital')}
        ${mkRow('Condiciones','',''+P.bloques.condiciones,'bloques.condiciones')}
        ${mkRow('Colateral','',''+P.bloques.colateral,'bloques.colateral')}
        ${mkRow('Monto para evaluación simplificada','Debajo de este monto solo se evalúan Carácter, Capacidad y Colateral',''+P.montoEvalSimplificada,'montoEvalSimplificada')}
      </section>
      <section>
        <div style="border-bottom:2px solid var(--text);padding-bottom:6px"><h2 style="margin:0">Semáforo del dictamen</h2></div>
        ${mkRow('Score mínimo para aprobar','',''+P.dictamen.aprobado,'dictamen.aprobado')}
        ${mkRow('Score mínimo para condicionar','',''+P.dictamen.condicionado,'dictamen.condicionado')}
      </section>
      <section>
        <div style="border-bottom:2px solid var(--text);padding-bottom:6px"><h2 style="margin:0">Umbrales de veto</h2></div>
        ${mkRow('Cobertura mínima de la cuota','Debajo: rechazo',''+P.u.cobCuotaMin,'u.cobCuotaMin')}
        ${mkRow('Egresos máximos sobre ingresos','Arriba de 0.90 se niega',''+P.u.flujoGastosMax,'u.flujoGastosMax')}
        ${mkRow('Endeudamiento actual máximo','',''+P.u.endActVeto,'u.endActVeto')}
        ${mkRow('Endeudamiento máximo con el crédito','',''+P.u.endProyVeto,'u.endProyVeto')}
        ${mkRow('Créditos con atraso tolerados','',''+P.u.atrasosVeto,'u.atrasosVeto')}
        ${mkRow('IVA sobre intereses','Se aplica a los productos marcados con IVA',''+P.u.ivaInteres,'u.ivaInteres')}
        ${mkRow('Base de días del año','Saldos insolutos: interés = saldo × tasa anual ÷ base × días transcurridos',''+(num(P.u.baseDias)||360),'u.baseDias')}
      </section>
    </div>
    ${esSuper?`<div style="display:flex;gap:8px;margin-top:34px">
      <button class="btn btn-p" data-action="guardarParams">Guardar parámetros</button>
      <button class="btn btn-s" data-action="resetParams">Restaurar valores originales</button>
    </div>`:''}`;
