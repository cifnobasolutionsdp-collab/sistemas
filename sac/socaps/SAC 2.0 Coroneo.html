<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAC 2.0 · Caja Solidaria Coroneo</title>
<style>
:root {
  --bg: #f3f2f2; --surface: #eae9e9; --text: #201e1d;
  --accent: #0088b0; --accent2: #d6006c;
  --div: rgba(32,30,29,.16);
  --n100:#f8f4f4;--n200:#eae7e7;--n300:#d7d3d3;--n400:#bab6b6;--n500:#9b9797;
  --n600:#7d7979;--n700:#605d5d;--n800:#444141;--n900:#2d2b2b;
  --a100:#e9f8ff;--a200:#cbeeff;--a700:#006786;--a800:#004961;--a900:#0a303e;
  --a2100:#fff1f4;--a2700:#aa0b56;--a2800:#790e3d;--a2900:#4b1528;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --fonth: Georgia, 'Times New Roman', serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:400 15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--fonth);font-weight:600;line-height:1.12;letter-spacing:-.015em;margin:0 0 8px}
h1{font-size:40px}h2{font-size:22px}h3{font-size:18px}
a{color:var(--accent);text-underline-offset:3px}
::selection{background:rgba(0,136,176,.25)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;font:600 14px/1.2 var(--font);color:var(--text);background:transparent;border:1px solid transparent;padding:8px 16px;border-radius:3px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-p{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-p:hover{background:#0078a0}
.btn-s{border-color:var(--div)}.btn-s:hover{background:rgba(32,30,29,.06)}
.btn-g{color:var(--accent);padding:6px 8px}.btn-g:hover{background:rgba(0,136,176,.08)}
.btn-d{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.btn-block{width:100%;margin-top:8px}
.input{width:100%;min-height:36px;padding:6px 10px;font:400 14px/1.4 var(--font);color:var(--text);background:var(--surface);border:1px solid var(--div);border-radius:3px;caret-color:var(--accent)}
.input:focus{border-color:var(--accent);outline:none}
textarea.input{min-height:80px;resize:vertical}
select.input{appearance:auto}
.tag{display:inline-flex;font-size:11px;padding:3px 10px;border-radius:3px;letter-spacing:.02em}
.tag-o{border:1px solid var(--accent);color:var(--accent)}
.tag-g{background:#e0f5e0;color:#1a6b1a}
.tag-r{background:var(--a2100);color:var(--a2800)}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(32,30,29,.55);padding:8px;border-bottom:1px solid var(--div)}
.table td{padding:8px;border-bottom:1px solid rgba(32,30,29,.06)}
.table tbody tr:hover{background:rgba(32,30,29,.03)}
.grid{border-collapse:collapse;font-variant-numeric:tabular-nums}
.grid th,.grid td{border:1px solid var(--div);padding:0}
.grid input{border:0;background:transparent;width:80px;padding:5px 6px;font:400 12.5px var(--font);text-align:right}
.grid input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--a100)}
.field>label{display:block;font-size:12px;margin-bottom:5px;color:rgba(32,30,29,.65)}
.canvas-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;grid-template-rows:auto auto auto;gap:0;border:2px solid var(--n800);font-size:13px}
.canvas-cell{border:1px solid var(--n400);padding:8px;min-height:120px;display:flex;flex-direction:column}
.canvas-cell h4{font:600 11px/1.3 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--n800);margin:0 0 6px;display:flex;align-items:center;gap:6px}
.canvas-cell textarea{flex:1;border:0;background:transparent;font:400 12.5px/1.4 var(--font);resize:none;padding:4px 0;color:var(--text)}
.canvas-cell textarea:focus{outline:none;background:var(--a100)}
.canvas-header{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr;gap:0;border-bottom:2px solid var(--n800)}
.canvas-header>div{padding:6px 8px;border-right:1px solid var(--n400);font:400 12px/1.3 var(--font)}
.canvas-header>div:last-child{border-right:0}
.canvas-header label{font-size:10px;color:var(--n600);display:block}
.canvas-header input{border:0;background:transparent;font:400 12px/1.3 var(--font);width:100%;padding:2px 0}
.canvas-header input:focus{outline:none;background:var(--a100)}
.canvas-bottom{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:2px solid var(--n800)}
.canvas-bottom>.canvas-cell{min-height:100px}
.config-card{background:var(--surface);border-radius:4px;padding:20px;margin-bottom:16px}
#print-area{display:none}
.aviso-limite{font:400 12px/1.4 var(--font);color:var(--a2700);margin-top:4px;padding:4px 8px;background:var(--a2100);border-radius:3px}
@media print{.no-print{display:none!important}body{background:#fff;margin:0;padding:0}body.printing #app{display:none!important}body.printing #print-area{display:block!important;position:static}@page{margin:8mm}}
</style>
</head>

const OCUPACIONES_VER=2;
function migrarConfig(c){
  if(c.ocupacionesVer!==OCUPACIONES_VER&&Array.isArray(c.ocupaciones)){
    const claves=new Set(c.ocupaciones.map(o=>o[0]));
    c.ocupaciones=c.ocupaciones.concat(OCUPACIONES_DEFAULT.filter(o=>!claves.has(o[0]))).sort((a,b)=>a[1].localeCompare(b[1],'es'));
  }
  c.ocupacionesVer=OCUPACIONES_VER;
  return c;
}

}

      if(s.id!==id)return s;
      const c=JSON.parse(JSON.stringify(s));
      let ref=c;const parts=path.split('.');
      for(let i=0;i<parts.length-1;i++)ref=ref[parts[i]];
      ref[parts[parts.length-1]]=value;
      return c;
    });
    this.persist();

  _scheduleRender(){clearTimeout(this._rt);this._rt=setTimeout(()=>this._renderSafe(),600)},
  _renderSafe(){
    const ae=document.activeElement;
    const path=ae?.getAttribute('data-path');
    const key=ae?.getAttribute('data-key');
    const mes=ae?.getAttribute('data-mes');
    const action=ae?.getAttribute('data-action');
    const pos=ae?.selectionStart;
    const tag=ae?.tagName;
    this.render();
    let el=null;
    if(path&&action)el=document.querySelector('[data-path="'+path+'"][data-action="'+action+'"]');
    else if(key&&mes)el=document.querySelector('[data-key="'+key+'"][data-mes="'+mes+'"]');
    else if(key&&action)el=document.querySelector('[data-key="'+key+'"][data-action="'+action+'"]');
    if(el){el.focus();if(pos!=null&&el.setSelectionRange&&(tag==='INPUT'||tag==='TEXTAREA')){try{el.setSelectionRange(pos,pos)}catch(e){}}}
  },

  _clampProductLimits(){
    const s=this.actual();if(!s||!s.datos.producto)return;
    const prod=this.state.config.productos.find(p=>p.nombre===s.datos.producto);
    if(!prod)return;
    if(num(s.datos.tasaPct)>prod.tasaAnual)this.upd('datos.tasaPct',prod.tasaAnual);
    if(num(s.datos.plazo)>prod.plazoMax)this.upd('datos.plazo',prod.plazoMax);
    if(prod.montoMin&&num(s.datos.monto)<prod.montoMin)this.upd('datos.monto',prod.montoMin);
    if(prod.montoMax&&num(s.datos.monto)>prod.montoMax)this.upd('datos.monto',prod.montoMax);
  },

  plan(datos,montoOv,plazoOv){
    const P=this.state.params;
    const monto=montoOv!=null?montoOv:num(datos.monto);
    const meses=Math.max(1,plazoOv!=null?plazoOv:num(datos.plazo));
    const tasaAnual=num(datos.tasaPct)/100;
    const per=PERIODICIDADES.find(p=>p[0]===datos.periodicidad)||PERIODICIDADES[2];
    const porAnio=per[2];

    if(datos.periodicidad==='pago_unico'){
      const intTotal=monto*tasaAnual*(meses/12);
      const cuotaUnica=monto+intTotal;
      const cuotaMensual=cuotaUnica/Math.max(1,meses);
      return {monto,meses,n:1,porAnio:0,cuota:cuotaUnica,cuotaIva:cuotaUnica+intTotal*P.u.ivaInteres,cuotaMensual:cuotaMensual+intTotal*P.u.ivaInteres/Math.max(1,meses),totalInt:intTotal,iva:intTotal*P.u.ivaInteres,total:cuotaUnica+intTotal*P.u.ivaInteres};
    }
    if(datos.periodicidad==='pago_unico_periodico'){
      const iPeriodo=tasaAnual/12;
      const intMensual=monto*iPeriodo;
      const totalInt=intMensual*meses;
      const cuotaInt=intMensual;
      const cuotaMensual=intMensual+intMensual*P.u.ivaInteres+monto/Math.max(1,meses);
      return {monto,meses,n:meses,porAnio:12,cuota:cuotaInt,cuotaIva:cuotaInt+cuotaInt*P.u.ivaInteres,cuotaMensual,totalInt,iva:totalInt*P.u.ivaInteres,total:monto+totalInt+totalInt*P.u.ivaInteres};
    }

    const n=Math.max(1,Math.round(meses/12*porAnio));
    const i=tasaAnual/porAnio;
    let cuota,totalInt;
    if(datos.plan==='insolutos'){
      const cap=monto/n;const prim=cap+monto*i;
      cuota=prim;totalInt=monto*i*(n+1)/2;
    }else{
      cuota=i>0?monto*i/(1-Math.pow(1+i,-n)):monto/n;
      totalInt=cuota*n-monto;
    }
    const intPeriodo=totalInt/n;
    const cuotaIva=cuota+intPeriodo*P.u.ivaInteres;
    const cuotaMensual=cuotaIva*porAnio/12;
    return {monto,meses,n,porAnio,cuota,cuotaIva,cuotaMensual,totalInt,iva:totalInt*P.u.ivaInteres,total:cuotaIva*n};
  },

  calcArraigo(anios,meses2){
    const totalMeses=num(anios)*12+num(meses2);
    if(totalMeses>=18)return 10;
    if(totalMeses>=12)return 7;
    if(totalMeses>=6)return 3;
    return 0;
  },

  evaluar(s,montoOv,plazoOv){
    const P=this.state.params;const vetos=[];
    const pl=this.plan(s.datos,montoOv,plazoOv);
    const simplificada=pl.monto>0&&pl.monto<num(P.montoEvalSimplificada);
    const c=s.caracter;
    const tieneNegocio=usaCanvas(s.datos.ocupacion,this.state.config.ocupaciones||OCUPACIONES_DEFAULT);

    // BONUS POINTS
    let bonusDiscapacidad=s.datos.tieneDiscapacidad?7:0;
    let bonusGenero=0;
    if(s.datos.genero==='mujer'){
      bonusGenero=3;
      if(s.datos.esUnicoSosten)bonusGenero=10;
    }else if(s.datos.genero==='hombre'&&s.datos.esUnicoSosten){
      bonusGenero=5;
    }

    // CARÁCTER
    const pVi=OPC.vivienda[c.vivienda]?OPC.vivienda[c.vivienda][1]:OPC.vivienda[0][1];
    const totalResMeses=num(c.resAnios)*12+num(c.resMeses);
    let pRe;
    if(totalResMeses>=6){
      pRe=this.calcArraigo(c.resAnios,c.resMeses);
    }else{
      pRe=this.calcArraigo(c.resPrevAnios,c.resPrevMeses);
    }
    const dom=clamp10(pVi*P.arraigoDom.vivienda+pRe*P.arraigoDom.residencia);

    const esPrimerEmpleo=!!s.datos.esPrimerEmpleo;
    const pAc=OPC.actividad[c.actividad]?OPC.actividad[c.actividad][1]:OPC.actividad[0][1];
    let pAn;
    if(esPrimerEmpleo){
      pAn=10;
    }else{
      const totalLabMeses=num(c.labAnios)*12+num(c.labMeses);
      if(totalLabMeses>=6){
        pAn=this.calcArraigo(c.labAnios,c.labMeses);
      }else{
        pAn=this.calcArraigo(c.labPrevAnios,c.labPrevMeses);
      }
    }
    const lab=clamp10(pAc*P.arraigoLab.actividad+pAn*P.arraigoLab.antiguedad);

    const sinHist=c.historial!==0;
    const pHi=OPC.historial[c.historial]?OPC.historial[c.historial][1]:OPC.historial[0][1];
    let pAt=10;
    if(!sinHist){
      const mop=num(c.mopMaximo);
      if(mop>=5){pAt=0;vetos.push('Experiencia crediticia: MOP '+mop+', la deuda se considera irrecuperable.')}
      else if(mop>=3){
        if(c.comprobantePagoMOP)pAt=3;
        else{pAt=0;vetos.push('Experiencia crediticia: MOP '+mop+' sin comprobante de pago presentado.')}
      }else if(mop===2)pAt=5;
      else pAt=10;
    }
    const pCo=sinHist?10:(OPC.comportamiento[c.comportamiento]?OPC.comportamiento[c.comportamiento][1]:10);
    const pRf=OPC.referencias[c.referencias]?OPC.referencias[c.referencias][1]:OPC.referencias[0][1];
    const exp=clamp10(pHi*P.expCred.historial+pAt*P.expCred.atrasos+pCo*P.expCred.comportamiento+pRf*P.expCred.referencias);
    const com=clamp10((OPC.antigSocio[c.antigSocio]?OPC.antigSocio[c.antigSocio][1]:10)*P.compromiso.antigSocio+(OPC.ahorro[c.ahorro]?OPC.ahorro[c.ahorro][1]:10)*P.compromiso.ahorro);
    const caracterBase=(dom*P.caracter.arraigoDom+lab*P.caracter.arraigoLab+exp*P.caracter.expCred+com*P.caracter.compromiso)/10;
    const caracter=Math.min(1,caracterBase+(bonusDiscapacidad+bonusGenero)/100);

    // CAPACIDAD
    const k=s.capacidad;
    const ingresos=num(k.ingTrabajo)+num(k.ingArrendamiento)+num(k.ingIntereses)+num(k.ingTransferencias)+num(k.ingOtros);
    const fam=num(k.gAlimentos)+num(k.gTransporte)+num(k.gEducacion)+num(k.gVivienda)+num(k.gPersonal)+num(k.gLimpieza)+num(k.gVestido)+num(k.gSalud)+num(k.gOtrosGastos);
    const deudas=num(k.dCajas)+num(k.dBancos)+num(k.dArrendamiento)+num(k.dPrestamistas);
    const egresosTot=fam*(1+P.u.margenGastos)+deudas;
    const disponible=ingresos-egresosTot;
    const cobCuota=pl.cuotaMensual>0?disponible/pl.cuotaMensual:0;
    let r1=0;
    if(cobCuota>=P.u.cobCuotaBuena)r1=10;else if(cobCuota>=P.u.cobCuotaMin)r1=5;
    else vetos.push('Capacidad de pago: la cobertura de la cuota es '+(isFinite(cobCuota)?cobCuota.toFixed(2):'0.00')+', menor al mínimo de '+P.u.cobCuotaMin.toFixed(2)+'.');
    const ratioGI=ingresos>0?egresosTot/ingresos:1;
    const r2=ratioGI<P.u.gastosIngBueno?10:ratioGI<P.u.gastosIngMedio?3:0;
    const ratioGCI=ingresos>0?(egresosTot+pl.cuotaMensual)/ingresos:1;
    const r3=ratioGCI<P.u.gastosCuotaBueno?10:ratioGCI<P.u.gastosCuotaMedio?3:0;
    const capacidad=(r1*P.capacidad.coberturaCuota+r2*P.capacidad.gastosIngresos+r3*P.capacidad.gastosCuotaIng)/10;
    const gastoRef=num(s.datos.dependientes)*P.u.gastoBasicoPersona;
    const alertaGastos=fam>0&&fam<gastoRef;
    const LIM_CAP=0.30;
    const capMaxPago=ingresos*LIM_CAP;
    const capDisponible=capMaxPago-deudas;
    const pctCuotaIng=ingresos>0?pl.cuotaMensual/ingresos:1;
    const ratioCompromisos=ingresos>0?(deudas+pl.cuotaMensual)/ingresos:1;
    let plazoIdeal=null;
    if(capDisponible>0&&pl.monto>0){for(let m=1;m<=360;m++){if(this.plan(s.datos,pl.monto,m).cuotaMensual<=capDisponible){plazoIdeal=m;break}}}

    // CAPITAL
    const cp=s.capital;
    const af=cp.activosFijos||{};
    let activoFijoComprobado=0,activoFijoTotal=0;
    ACTIVOS_FIJOS.forEach(a=>{const it=af[a[0]];if(it){activoFijoTotal+=num(it.monto);if(it.comprobante&&it.comprobante!=='ninguno')activoFijoComprobado+=num(it.monto)}});
    const activos=num(cp.activoCirculante)+activoFijoComprobado;
    const pasivos=num(cp.pasivoCorto)+num(cp.pasivoLargo);
    const endAct=activos>0?pasivos/activos:1;
    let q1=0;
    if(endAct>1)q1=0;
    else if(endAct>P.u.endActVeto){q1=0;if(!simplificada)vetos.push('Capital: el endeudamiento actual es '+pct(endAct)+', arriba del límite de '+pct(P.u.endActVeto)+'.')}
    else if(endAct>P.u.endActMedio)q1=5;else if(endAct>P.u.endActBueno)q1=7;else q1=10;
    const endProy=(activos+pl.monto)>0?(pasivos+pl.monto)/(activos+pl.monto):1;
    let q2=0;
    if(endProy>1)q2=0;
    else if(endProy>P.u.endProyVeto){q2=0;if(!simplificada)vetos.push('Capital: con el crédito solicitado el endeudamiento llega a '+pct(endProy)+', arriba del límite de '+pct(P.u.endProyVeto)+'.')}
    else if(endProy>P.u.endProyMedio)q2=5;else if(endProy>P.u.endProyBueno)q2=7;else q2=10;
    const capital=(q1*P.capital.endeudActual+q2*P.capital.endeudProyectado)/10;

    // CONDICIONES
    const cd=s.condiciones;
    const pFu=OPC.fuente[cd.fuente]?OPC.fuente[cd.fuente][1]:10;
    const tieneOVaEmprender=tieneNegocio||(c.actividad===0||c.actividad===4);
    let condiciones;
    if(tieneOVaEmprender){
      const pSe=OPC.sector[cd.sector]?OPC.sector[cd.sector][1]:10;
      const pEn=OPC.entorno[cd.entorno]?OPC.entorno[cd.entorno][1]:10;
      const pAN=OPC.antigNegocio[cd.antigNegocio]?OPC.antigNegocio[cd.antigNegocio][1]:10;
      const neg2=pSe*P.negocio.sector+pEn*P.negocio.entorno+pAN*P.negocio.antiguedad;
      condiciones=(pFu*P.condiciones.fuente+neg2*P.condiciones.negocio)/10;
    }else{
      condiciones=pFu/10;
    }

    // COLATERAL
    const g=s.colateral;let colateral=0;let colTxt='';
    const grado=x=>x<0.5?1:x<1?2:x<2?3:4;
    if(g.tipo==='garantes'){
      const c1=pl.cuotaMensual>0?num(g.ingGarante1)/pl.cuotaMensual:0;
      const c2=pl.cuotaMensual>0?num(g.ingGarante2)/pl.cuotaMensual:0;
      const g1=grado(c1),g2=grado(c2);
      colateral=(g1===1||g2===1)?0:(g1+g2>=4?1:0);
      colTxt='Garantes: cobertura de cuota '+c1.toFixed(2)+' y '+c2.toFixed(2)+(colateral?' — aceptable':' — no aceptable');
    }else if(g.tipo==='aval'){
      const cAval=pl.cuotaMensual>0?num(g.ingAval)/pl.cuotaMensual:0;
      colateral=cAval>=2?1:cAval>=1?0.7:0;
      colTxt='Aval/codeudor: cobertura de cuota '+cAval.toFixed(2)+(colateral>=0.7?' — aceptable':' — insuficiente');
    }else if(g.tipo==='sin_aval_garantia_liquida'){
      const cov=pl.monto>0?num(g.avaluo)/pl.monto:0;
      colateral=cov>=P.u.covAhorro?1:0;
      colTxt='Garantía líquida sin aval: cobertura '+cov.toFixed(2)+' veces el crédito; se requiere '+P.u.covAhorro.toFixed(2)+(colateral?' — adecuada':' — insuficiente');
    }else if(g.tipo==='ninguna'){
      colateral=0;colTxt='Sin garantía';
    }else{
      const req=g.tipo==='prenda'?P.u.covPrenda:g.tipo==='hipoteca'?P.u.covHipoteca:P.u.covAhorro;
      const cov=pl.monto>0?num(g.avaluo)/pl.monto:0;
      colateral=cov>=req?1:0;
      colTxt='Cobertura del avalúo '+cov.toFixed(2)+' veces el crédito; se requiere '+req.toFixed(2)+(colateral?' — adecuada':' — insuficiente');
    }

    const B=P.bloques;
    const pesosC=simplificada
      ?(t=>({caracter:B.caracter/t,capacidad:B.capacidad/t,capital:0,condiciones:0,colateral:B.colateral/t}))(B.caracter+B.capacidad+B.colateral)
      :{caracter:B.caracter,capacidad:B.capacidad,capital:B.capital,condiciones:B.condiciones,colateral:B.colateral};
    const score5c=caracter*pesosC.caracter+capacidad*pesosC.capacidad+capital*pesosC.capital+condiciones*pesosC.condiciones+colateral*pesosC.colateral;

    // FLUJO DE EFECTIVO
    const mesesFlujo=Math.max(1,num(s.flujoAnios))*12;
    let ing=[],egr=[],res=[],acum=[],run=0;
    for(let m=0;m<mesesFlujo;m++){
      let a=0,b=0;
      FILAS_ING.forEach(f=>{a+=num((s.flujo[f[0]]||[])[m])});
      FILAS_EGR.forEach(f=>{b+=num((s.flujo[f[0]]||[])[m])});
      ing.push(a);egr.push(b);res.push(a-b);run+=a-b;acum.push(run);
    }
    const totIng=ing.reduce((x,y)=>x+y,0);
    const totEgr=egr.reduce((x,y)=>x+y,0);
    const ratioFlujo=totIng>0?totEgr/totIng:1;
    const mp=Math.min(mesesFlujo-1,Math.max(0,num(s.flujoMesPago)));
    const ingMesPago=ing[mp]||0;
    const compromisoMes=egr[mp]||0;
    const acumPrevio=mp>0?acum[mp-1]:0;
    const ingDisponibleMes=ingMesPago+Math.min(0,acumPrevio);
    const cobFlujo=compromisoMes>0?Math.max(0,ingDisponibleMes)/compromisoMes:0;
    const mesesNeg=acum.filter(x=>x<0).length;
    let f1=0;
    if(totIng<=0){f1=0}
    else if(ratioFlujo<=0.70)f1=10;else if(ratioFlujo<=0.80)f1=7;else if(ratioFlujo<=P.u.flujoGastosMax)f1=4;
    else{f1=0;vetos.push('Flujo de efectivo: los egresos son '+pct(ratioFlujo)+' de los ingresos, arriba del máximo de '+pct(P.u.flujoGastosMax)+'.')}
    let f2=0;
    if(compromisoMes<=0){f2=0}
    else if(cobFlujo>=1.5)f2=10;else if(cobFlujo>=1.2)f2=8;else if(cobFlujo>P.u.flujoCoberturaMin)f2=5;
    else{f2=0;vetos.push('Flujo de efectivo: la cobertura del mes de pago es '+pct(cobFlujo)+', igual o menor al 100% exigido.')}
    const f3=mesesNeg===0?10:mesesNeg<=2?6:2;
    const capturado=totIng>0||totEgr>0;
    const scoreFlujo=capturado?(f1*P.flujoPeso.ratioGastos+f2*P.flujoPeso.cobertura+f3*P.flujoPeso.acumulado)/10:0;
    if(!capturado)vetos.push('Flujo de efectivo: no se ha capturado el flujo mensual.');

    // CANVAS (solo aplica a actividades productivas)
    let cs=0;
    CANVAS_BLOQUES.forEach(b=>{cs+=num((s.canvas[b[0]]||{}).p)});
    const scoreCanvas=tieneNegocio?cs/(CANVAS_BLOQUES.length*5):0;

    let wC=P.mezcla.cincoC,wF=P.mezcla.flujo,wV=P.mezcla.canvas;
    if(!tieneNegocio){wV=0;const tot=P.mezcla.cincoC+P.mezcla.flujo;wC=P.mezcla.cincoC/tot;wF=P.mezcla.flujo/tot}
    const global=100*(score5c*wC+scoreFlujo*wF+scoreCanvas*wV);
    let banda='NO AUTORIZABLE';
    for(let i=0;i<P.bandas.length;i++){if(score5c>=P.bandas[i][0]){banda=P.bandas[i][1];break}}
    let dict='RECHAZADO';
    if(vetos.length===0)dict=global>=P.dictamen.aprobado?'APROBADO':global>=P.dictamen.condicionado?'CONDICIONADO':'RECHAZADO';

    const flujoRequerido=s.condiciones.fuente>0||['anual','pago_unico','pago_unico_periodico'].includes(s.datos.periodicidad)||s.datos.ocupacion==='negocio_rural';
    return {
      pl,vetos,banda,dictamen:dict,global,
      score5c,scoreFlujo,scoreCanvas,
      caracter,caracterBase,capacidad,capital,condiciones,colateral,colTxt,
      sub:{dom,lab,exp,com,pVi,pRe,pAc,pAn,pHi,pAt,pCo,pRf,r1,r2,r3,q1,q2},
      ingresos,egresosTot,disponible,cobCuota,ratioGI,ratioGCI,alertaGastos,gastoRef,
      deudas,LIM_CAP,capMaxPago,capDisponible,pctCuotaIng,ratioCompromisos,plazoIdeal,
      bonusDiscapacidad,bonusGenero,
      flujo:{ing,egr,res,acum,ratio:ratioFlujo,cobertura:cobFlujo,mesesNeg,mesesFlujo,ingMesPago,compromisoMes,acumPrevio,ingDisponibleMes,f1,f2,f3},
      sinHist,tieneNegocio,tieneOVaEmprender,flujoRequerido,simplificada,pesosC,pesos:{cincoC:wC,flujo:wF,canvas:wV},
      activoFijoTotal,activoFijoComprobado
    };
  },

          {l:'Condiciones',p:E.simplificada?'—':pct(E.pesosC.condiciones),v:E.simplificada?'No aplica':pct(E.condiciones)},
          {l:'Colateral',p:pct(E.pesosC.colateral),v:pct(E.colateral)},

        ].concat(E.tieneNegocio?[{l:'Modelo CANVAS',p:pct(E.pesos.canvas),v:pct(E.scoreCanvas)}]:[]).map(b=>`<div style="display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid var(--div)">

        <div style="display:flex;align-items:baseline;gap:10px;padding:10px 0 0">
          <span style="font:600 15px/1.3 var(--fonth)">Score global</span><span style="flex:1"></span>
          <span style="font:600 22px/1 var(--fonth);font-variant-numeric:tabular-nums">${E.global.toFixed(1)}</span>
        </div>
        ${E.bonusDiscapacidad||E.bonusGenero?`<div style="margin-top:8px;font:400 12px/1.4 var(--font);color:var(--a700)">Bonificaciones: ${E.bonusDiscapacidad?'Discapacidad +7':''}${E.bonusDiscapacidad&&E.bonusGenero?' · ':''}${E.bonusGenero?'Género/sostén +'+E.bonusGenero:''}</div>`:''}
      </div>
      ${E.vetos.length?`<div style="margin-top:22px;border-top:3px solid var(--accent2);padding-top:12px">
        <div style="font:400 11.5px/1.4 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--a2700);margin-bottom:8px">Causales de rechazo</div>
        ${E.vetos.map(v=>`<div style="font:400 13px/1.45 var(--font);padding:5px 0;border-bottom:1px solid var(--div)">${esc(v)}</div>`).join('')}
      </div>`:''}
      <div style="margin-top:22px;display:flex;flex-direction:column;gap:7px">
        <button class="btn btn-s" data-action="guardar">Guardar avance</button>
        <button class="btn btn-g" data-action="irDictamen">Ir al dictamen</button>
      </div>
    </aside>`;

    return `
    <div style="display:flex;align-items:flex-start;gap:20px;margin-bottom:6px">
      <div>
        <div style="font:400 11.5px/1.4 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--n600)">Folio ${esc(s.folio)} · ${esc(s.estado)}</div>
        <h1 style="margin:4px 0 0">${esc(s.datos.nombre||'Solicitante sin nombre')}</h1>
      </div>
      <span style="flex:1"></span>
      <div style="text-align:right">
        <div style="font:400 11.5px/1.4 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--n600)">Score global</div>
        <div style="font:600 46px/1 var(--fonth)">${E.global.toFixed(1)}</div>
        <div style="font:400 13px/1.3 var(--font);color:var(--n700)">${E.vetos.length?'No autorizable':E.dictamen==='APROBADO'?'Viable':E.dictamen==='CONDICIONADO'?'Viable con condiciones':'Debajo del mínimo'}</div>
      </div>
    </div>
    <div class="no-print" style="display:flex;flex-wrap:wrap;gap:3px;border-bottom:1px solid var(--text);margin:24px 0 26px">
      ${tabs.map(t=>`<button data-action="tab" data-tab="${t[0]}" style="border:0;${activeTab===t[0]?'background:var(--text);color:var(--bg);font:600 13.5px/1 var(--font)':'background:transparent;color:var(--n800);font:400 13.5px/1 var(--font)'};padding:10px 13px;cursor:pointer">${t[1]}${t[0]==='flujo'&&E.flujoRequerido?'<span style="color:var(--accent2);margin-left:3px" title="Flujo requerido">●</span>':''}</button>`).join('')}
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start">
      <div style="flex:1 1 440px;min-width:0">${tabContent}</div>
      ${activeTab!=='flujo'&&activeTab!=='canvas'?sidebar:''}
    </div>`;
  },

  renderField(label,hint,inputHtml,puntaje){
    return `<div style="display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--div)">
      <div style="flex:1 1 200px;min-width:0">
        <div style="font:400 15px/1.35 var(--font)">${label}</div>
        ${hint?`<div style="font:400 12.5px/1.45 var(--font);color:var(--n700);margin-top:3px">${hint}</div>`:''}
      </div>
      <div style="flex:2 1 240px;min-width:0">${inputHtml}</div>
      <div style="flex:0 0 46px;text-align:right;font:400 14px/1.5 var(--font);color:var(--n700)">${puntaje!=null?puntaje:''}</div>
    </div>`;
  },

  renderSection(titulo,meta,fields){
    return `<section style="margin-bottom:36px">
      <div style="display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--text);padding-bottom:6px;margin-bottom:4px">
        <h2 style="font:600 19px/1.2 var(--fonth);margin:0">${titulo}</h2><span style="flex:1"></span>
        <span style="font:400 12.5px/1 var(--font);color:var(--n700)">${meta}</span>
      </div>
      ${fields}
    </section>`;
  },

  renderRadio(name,options,selected,path){
    return `<div style="display:flex;flex-direction:column;gap:4px">
      ${options.map((o,i)=>`<label style="display:flex;gap:8px;align-items:flex-start;font:400 13.5px/1.4 var(--font);cursor:pointer">
        <input type="radio" name="${name}" ${selected===i?'checked':''} data-action="updRadio" data-path="${path}" data-val="${i}" style="margin:3px 0 0;accent-color:var(--accent)">
        <span>${esc(o[0])} · ${o[1]}</span>
      </label>`).join('')}
    </div>`;
  },

    const prodSel=d.producto?cfg.productos.find(p=>p.nombre===d.producto):null;
    const productoOpts=cfg.productos.map(p=>`<option value="${esc(p.nombre)}" ${d.producto===p.nombre?'selected':''}>${esc(p.nombre)} (${p.tasaAnual}%, ${p.plazoMax}m, ${mx(p.montoMin||0)}–${mx(p.montoMax||0)})</option>`).join('');

    return this.renderSection('Solicitante',s.sucursal+' · '+s.analista,
      this.renderField('Nombre del solicitante','Como aparece en su identificación',`<input class="input" type="text" value="${esc(d.nombre)}" data-action="updText" data-path="datos.nombre">`)+
      this.renderField('Número de socio','Formato 001-000000',`<input class="input" type="text" value="${esc(d.socio)}" data-action="updText" data-path="datos.socio">`)+
      this.renderField('Género','',`<select class="input" data-action="updText" data-path="datos.genero">
        <option value="" ${!d.genero?'selected':''}>Seleccione...</option>
        <option value="mujer" ${d.genero==='mujer'?'selected':''}>Mujer</option>
        <option value="hombre" ${d.genero==='hombre'?'selected':''}>Hombre</option>
      </select>`)+
      this.renderField('¿Es el(la) único(a) que sostiene a su familia?','Suma al score de Carácter. Mujer: +3 pts · Mujer única sostén: +10 pts · Hombre único sostén: +5 pts',`<select class="input" data-action="updBool" data-path="datos.esUnicoSosten">
        <option value="false" ${!d.esUnicoSosten?'selected':''}>No</option>
        <option value="true" ${d.esUnicoSosten?'selected':''}>Sí</option>
      </select>`,E.bonusGenero)+
      this.renderField('¿Tiene alguna discapacidad?','Bonificación de +7 puntos al score de carácter',`<select class="input" data-action="updBool" data-path="datos.tieneDiscapacidad">
        <option value="false" ${!d.tieneDiscapacidad?'selected':''}>No</option>
        <option value="true" ${d.tieneDiscapacidad?'selected':''}>Sí</option>
      </select>`,E.bonusDiscapacidad)+
      this.renderField('Ocupación','Actividad principal del solicitante · '+(E.tieneNegocio?'Activa el modelo CANVAS':'No activa el modelo CANVAS'),`<select class="input" data-action="updText" data-path="datos.ocupacion">
        ${(cfg.ocupaciones||OCUPACIONES_DEFAULT).map(o=>`<option value="${o[0]}" ${d.ocupacion===o[0]?'selected':''}>${o[1]}</option>`).join('')}
      </select>`)+
      this.renderField('Clasificación IFRS9','Tipo de crédito según las Normas Internacionales de Información Financiera',`<select class="input" data-action="updText" data-path="datos.clasificacionIFRS9">
        <option value="" ${!d.clasificacionIFRS9?'selected':''}>Seleccione...</option>
        ${CLASIFICACION_IFRS9.map(c2=>`<option value="${c2[0]}" ${d.clasificacionIFRS9===c2[0]?'selected':''}>${c2[1]}</option>`).join('')}
      </select>`)+
      this.renderField('¿Es su primer empleo?','Si es su primer empleo se desactivará el arraigo laboral',`<select class="input" data-action="updBool" data-path="datos.esPrimerEmpleo">
        <option value="false" ${!d.esPrimerEmpleo?'selected':''}>No</option>
        <option value="true" ${d.esPrimerEmpleo?'selected':''}>Sí</option>
      </select>`)+
      this.renderField('Destino del crédito','Capital de trabajo, activo fijo, ciclo agrícola...',`<input class="input" type="text" value="${esc(d.destino)}" data-action="updText" data-path="datos.destino">`)+
      this.renderField('Dependientes económicos','Se usa para el gasto familiar de referencia',`<input class="input" type="text" inputmode="decimal" value="${d.dependientes}" data-action="updNum" data-path="datos.dependientes" min="0">`)
    )+
    this.renderSection('Producto y condiciones del crédito','Cuota mensual equivalente '+mx(E.pl.cuotaMensual),
      this.renderField('Producto de crédito','Seleccione del catálogo de productos configurado',`<select class="input" data-action="updText" data-path="datos.producto">
        <option value="">Seleccione un producto...</option>${productoOpts}
      </select>`)+
      this.renderField('Monto solicitado',prodSel?'Rango del producto: '+mx(prodSel.montoMin||0)+' – '+mx(prodSel.montoMax||0):'En pesos mexicanos',`<input class="input" type="text" inputmode="decimal" value="${d.monto}" data-action="updNum" data-path="datos.monto" min="${prodSel&&prodSel.montoMin?prodSel.montoMin:1000}"${prodSel&&prodSel.montoMax?' max="'+prodSel.montoMax+'"':''}>`)+
      this.renderField('Plazo en meses',prodSel?'Máximo del producto: '+prodSel.plazoMax+' meses':'Seleccione un producto para ver el límite',`<input class="input" type="text" inputmode="decimal" value="${d.plazo}" data-action="updNum" data-path="datos.plazo" min="1"${prodSel?' max="'+prodSel.plazoMax+'"':''}>`)+
      this.renderField('Tasa de interés anual (%)',prodSel?'Máximo del producto: '+prodSel.tasaAnual+'%':'Seleccione un producto para ver el límite',`<input class="input" type="text" inputmode="decimal" value="${d.tasaPct}" data-action="updNum" data-path="datos.tasaPct" min="0" step="0.1"${prodSel?' max="'+prodSel.tasaAnual+'"':''}>`)+
      this.renderField('Periodicidad de pago','Frecuencia de los pagos',`<select class="input" data-action="updText" data-path="datos.periodicidad">
        ${PERIODICIDADES.map(p=>`<option value="${p[0]}" ${d.periodicidad===p[0]?'selected':''}>${p[1]}</option>`).join('')}
      </select>`)+
      this.renderField('Tipo de plan','Método de amortización',`<select class="input" data-action="updText" data-path="datos.plan">
        <option value="fijo" ${d.plan==='fijo'?'selected':''}>Pagos fijos</option>
        <option value="insolutos" ${d.plan==='insolutos'?'selected':''}>Sobre saldos insolutos</option>
      </select>`)+
      this.renderField('Número de pagos','',(d.periodicidad==='pago_unico'?'1':String(E.pl.n)))+
      this.renderField('Pago por periodo con IVA','Capital, interés e IVA',`<strong>${mx(E.pl.cuotaIva)}</strong>`)+
      this.renderField('Interés total del crédito','Más IVA de '+mx(E.pl.iva),`<strong>${mx(E.pl.totalInt)}</strong>`)
    );
  },

  renderTabCaracter(s,E){
    const c=s.caracter,P=this.state.params;
    const totalResMeses=num(c.resAnios)*12+num(c.resMeses);
    const totalLabMeses=num(c.labAnios)*12+num(c.labMeses);
    const d=s.datos;
    const bonus=E.bonusGenero+E.bonusDiscapacidad;
    const txtGenero=(d.genero==='mujer'?'Mujer':d.genero==='hombre'?'Hombre':'Género sin capturar')+(d.esUnicoSosten?' · único(a) sostén de su familia':'');
    const rubros=[['Arraigo domiciliario',P.caracter.arraigoDom,E.sub.dom],['Arraigo laboral o estabilidad económica',P.caracter.arraigoLab,E.sub.lab],['Experiencia crediticia',P.caracter.expCred,E.sub.exp],['Compromiso con la institución',P.caracter.compromiso,E.sub.com]];

    let expFields=this.renderField('Experiencia crediticia','Determina si se evalúa el comportamiento de pago',this.renderRadio('historial',OPC.historial,c.historial,'caracter.historial'),E.sub.pHi);
    if(!E.sinHist){
      expFields+=this.renderField('MOP Máximo','Modo de Pago máximo registrado en Buró de Crédito en los últimos 24 meses',`<select class="input" data-action="updNum" data-path="caracter.mopMaximo">
        ${MOP_VALORES.map(m=>`<option value="${m[0]}" ${num(c.mopMaximo)===m[0]?'selected':''}>${m[1]}</option>`).join('')}
      </select>`,E.sub.pAt.toFixed(0));
      if(num(c.mopMaximo)>=3){
        expFields+=this.renderField('Comprobante de pago de la deuda','MOP 3 o mayor: se requiere que el solicitante presente comprobante de pago',`<select class="input" data-action="updBool" data-path="caracter.comprobantePagoMOP">
          <option value="false" ${!c.comprobantePagoMOP?'selected':''}>No presentado</option>
          <option value="true" ${c.comprobantePagoMOP?'selected':''}>Sí, comprobante presentado</option>
        </select>`);
      }
      expFields+=this.renderField('Comportamiento de pago','Atraso máximo registrado',this.renderRadio('comportamiento',OPC.comportamiento,c.comportamiento,'caracter.comportamiento'),E.sub.pCo);
    }else{
      expFields+=this.renderField('Atrasos y comportamiento','Sin historial: se califica con el puntaje máximo',`<strong>No aplica</strong>`,'10');
    }
    expFields+=this.renderField('Referencias personales y comerciales','Verificadas por el analista',this.renderRadio('referencias',OPC.referencias,c.referencias,'caracter.referencias'),E.sub.pRf);

    let domFields=this.renderField('Tipo de vivienda','Tenencia del domicilio declarado',this.renderRadio('vivienda',OPC.vivienda,c.vivienda,'caracter.vivienda'),E.sub.pVi);
    domFields+=this.renderField('Tiempo en el domicilio actual','Capture en años y meses',`<div style="display:flex;gap:10px">
      <div class="field" style="flex:1"><label>Años</label><input class="input" type="text" inputmode="decimal" value="${c.resAnios}" data-action="updNum" data-path="caracter.resAnios" min="0"></div>
      <div class="field" style="flex:1"><label>Meses</label><input class="input" type="text" inputmode="decimal" value="${c.resMeses}" data-action="updNum" data-path="caracter.resMeses" min="0" max="11"></div>
    </div>`,E.sub.pRe.toFixed(0));
    if(totalResMeses<6){
      domFields+=this.renderField('Tiempo en vivienda anterior','Menos de 6 meses en vivienda actual: se evalúa la anterior. 6+ meses: 3 pts · 12+ meses: 7 pts · 18+ meses: 10 pts',`<div style="display:flex;gap:10px">
        <div class="field" style="flex:1"><label>Años</label><input class="input" type="text" inputmode="decimal" value="${c.resPrevAnios}" data-action="updNum" data-path="caracter.resPrevAnios" min="0"></div>
        <div class="field" style="flex:1"><label>Meses</label><input class="input" type="text" inputmode="decimal" value="${c.resPrevMeses}" data-action="updNum" data-path="caracter.resPrevMeses" min="0" max="11"></div>
      </div>`);
    }

    let labFields=this.renderField('Actividad o fuente de ingresos','Principal fuente de ingresos del solicitante',this.renderRadio('actividad',OPC.actividad,c.actividad,'caracter.actividad'),E.sub.pAc);
    if(d.esPrimerEmpleo){
      labFields+=this.renderField('Tiempo en la actividad actual','<strong>Primer empleo:</strong> no se evalúa antigüedad laboral',`<strong>No aplica (primer empleo)</strong>`,'10');
    }else{
      labFields+=this.renderField('Tiempo en la actividad actual','Capture en años y meses',`<div style="display:flex;gap:10px">
        <div class="field" style="flex:1"><label>Años</label><input class="input" type="text" inputmode="decimal" value="${c.labAnios}" data-action="updNum" data-path="caracter.labAnios" min="0"></div>
        <div class="field" style="flex:1"><label>Meses</label><input class="input" type="text" inputmode="decimal" value="${c.labMeses}" data-action="updNum" data-path="caracter.labMeses" min="0" max="11"></div>
      </div>`,E.sub.pAn.toFixed(0));
      if(totalLabMeses<6){
        labFields+=this.renderField('Tiempo en actividad anterior','Menos de 6 meses: se evalúa la anterior. 6+ meses: 3 pts · 12+ meses: 7 pts · 18+ meses: 10 pts',`<div style="display:flex;gap:10px">
          <div class="field" style="flex:1"><label>Años</label><input class="input" type="text" inputmode="decimal" value="${c.labPrevAnios}" data-action="updNum" data-path="caracter.labPrevAnios" min="0"></div>
          <div class="field" style="flex:1"><label>Meses</label><input class="input" type="text" inputmode="decimal" value="${c.labPrevMeses}" data-action="updNum" data-path="caracter.labPrevMeses" min="0" max="11"></div>
        </div>`);
      }
    }
    if(d.ocupacion==='ama_casa'){
      labFields+=this.renderField('¿De quién recibe sus ingresos?','Persona que aporta al ingreso familiar',`<input class="input" type="text" value="${esc(d.proveedorIngresos||'')}" data-action="updText" data-path="datos.proveedorIngresos">`);
      labFields+=this.renderField('¿Tiene alguna actividad económica?','Ventas por catálogo, micronegocio propio, etc.',`<input class="input" type="text" value="${esc(d.actividadSecundaria||'')}" data-action="updText" data-path="datos.actividadSecundaria">`);
    }

    return this.renderSection('Arraigo domiciliario',pct(P.caracter.arraigoDom)+' del carácter · '+E.sub.dom.toFixed(1)+'/10',domFields)+
      this.renderSection('Arraigo laboral o estabilidad económica',pct(P.caracter.arraigoLab)+' del carácter · '+E.sub.lab.toFixed(1)+'/10',labFields)+
      this.renderSection('Experiencia crediticia',pct(P.caracter.expCred)+' del carácter · '+E.sub.exp.toFixed(1)+'/10',expFields)+
      this.renderSection('Compromiso con la institución',pct(P.caracter.compromiso)+' del carácter · '+E.sub.com.toFixed(1)+'/10',
        this.renderField('Antigüedad como socio','',this.renderRadio('antigSocio',OPC.antigSocio,c.antigSocio,'caracter.antigSocio'),OPC.antigSocio[c.antigSocio]?OPC.antigSocio[c.antigSocio][1]:'')+
        this.renderField('Cultura de ahorro','Aportaciones y compromiso de ahorro al día',this.renderRadio('ahorro',OPC.ahorro,c.ahorro,'caracter.ahorro'),OPC.ahorro[c.ahorro]?OPC.ahorro[c.ahorro][1]:'')
      )+
      this.renderSection('Bonificaciones del solicitante','Se capturan en la pestaña Datos · +'+bonus+' pts',
        this.renderField('Género y sostén económico','Mujer: +3 pts · Mujer única sostén: +10 pts · Hombre único sostén: +5 pts',`<strong>${esc(txtGenero)}</strong>`,'+'+E.bonusGenero)+
        this.renderField('Discapacidad','Bonificación de +7 puntos',`<strong>${d.tieneDiscapacidad?'Sí':'No'}</strong>`,'+'+E.bonusDiscapacidad)
      )+
      this.renderSection('Resumen del carácter',pct(E.pesosC.caracter)+' del score 5C · '+pct(E.caracter),
        rubros.map(x=>this.renderField(x[0],pct(x[1])+' del carácter · '+x[2].toFixed(1)+'/10',`<strong>${(x[1]*x[2]*10).toFixed(1)} pts</strong>`)).join('')+
        this.renderField('Carácter base','Suma ponderada de los cuatro rubros',`<strong>${pct(E.caracterBase)}</strong>`)+
        this.renderField('Bonificaciones','Capturadas en la pestaña Datos',`<strong>+${bonus} pts</strong>`)+
        this.renderField('Score de carácter',E.caracterBase+bonus/100>1?'Carácter base más bonificaciones, con tope de 100%':'Carácter base más bonificaciones',`<strong>${pct(E.caracter)}</strong>`)+
        this.renderField('Aporte al score global','Carácter × '+pct(E.pesosC.caracter)+' del 5C × '+pct(E.pesos.cincoC)+' del score global',`<strong>${(100*E.caracter*E.pesosC.caracter*E.pesos.cincoC).toFixed(1)} pts</strong>`)
      );
  },

  renderTabCapacidad(s,E){
    const k=s.capacidad,P=this.state.params;
    const prodSel=s.datos.producto?this.state.config.productos.find(p=>p.nombre===s.datos.producto):null;
    const dentro=v=>v<=E.LIM_CAP?'Dentro del límite':'Excede el 30%';
    let plazoTxt;
    if(E.ingresos<=0)plazoTxt='Capture los ingresos para calcularlo';
    else if(E.capDisponible<=0)plazoTxt='Sin capacidad: sus deudas actuales ya ocupan el 30% de sus ingresos';
    else if(E.plazoIdeal==null)plazoTxt='Más de 360 meses: considere un monto menor';
    else plazoTxt=E.plazoIdeal+' meses'+(prodSel&&E.plazoIdeal>prodSel.plazoMax?' · excede el máximo del producto ('+prodSel.plazoMax+' meses)':E.plazoIdeal<=num(s.datos.plazo)?' · el plazo solicitado ('+num(s.datos.plazo)+' meses) es suficiente':' · el plazo solicitado ('+num(s.datos.plazo)+' meses) es menor al ideal');
    return this.renderSection('Ingresos mensuales',mx(E.ingresos)+' declarados',
      this.renderField('Ingresos por trabajo','Sueldos, salarios, honorarios',`<input class="input" type="text" inputmode="decimal" value="${k.ingTrabajo}" data-action="updNum" data-path="capacidad.ingTrabajo" min="0">`)+
      this.renderField('Arrendamientos de vivienda o cualquier activo','Rentas que recibe',`<input class="input" type="text" inputmode="decimal" value="${k.ingArrendamiento}" data-action="updNum" data-path="capacidad.ingArrendamiento" min="0">`)+
      this.renderField('Ingresos por intereses','Rendimientos financieros',`<input class="input" type="text" inputmode="decimal" value="${k.ingIntereses}" data-action="updNum" data-path="capacidad.ingIntereses" min="0">`)+
      this.renderField('Transferencias','Remesas, apoyos gubernamentales, pensiones',`<input class="input" type="text" inputmode="decimal" value="${k.ingTransferencias}" data-action="updNum" data-path="capacidad.ingTransferencias" min="0">`)+
      this.renderField('Otros ingresos','Cualquier otro ingreso recurrente',`<input class="input" type="text" inputmode="decimal" value="${k.ingOtros}" data-action="updNum" data-path="capacidad.ingOtros" min="0">`)
    )+
    this.renderSection('Egresos mensuales','Referencia mínima '+mx(E.gastoRef)+' por '+s.datos.dependientes+' dependientes',
      this.renderField('Alimentos, bebidas y tabaco','',`<input class="input" type="text" inputmode="decimal" value="${k.gAlimentos}" data-action="updNum" data-path="capacidad.gAlimentos" min="0">`)+

      this.renderField('Pagos a bancos y tarjetas de crédito','',`<input class="input" type="text" inputmode="decimal" value="${k.dBancos}" data-action="updNum" data-path="capacidad.dBancos" min="0">`)+

      this.renderField('Gastos sobre ingresos','Debajo de '+pct(P.u.gastosIngBueno)+' es óptimo',`<strong>${pct(E.ratioGI)}</strong>`,E.sub.r2.toFixed(0))+
      this.renderField('Gastos más cuota sobre ingresos','Debajo de '+pct(P.u.gastosCuotaBueno)+' es óptimo',`<strong>${pct(E.ratioGCI)}</strong>`,E.sub.r3.toFixed(0))+
      this.renderField('Capacidad máxima de pago','Hasta el 30% de los ingresos mensuales ('+mx(E.ingresos)+')',`<strong>${mx(E.capMaxPago)}</strong>`)+
      this.renderField('Cuota solicitada sobre ingresos','La mensualidad no debe superar el 30% de los ingresos',`<strong>${pct(E.pctCuotaIng)}</strong> · ${dentro(E.pctCuotaIng)}`)+
      this.renderField('Nivel de compromisos financieros','Deudas actuales ('+mx(E.deudas)+') más la cuota solicitada ('+mx(E.pl.cuotaMensual)+'); máximo 30% de los ingresos',`<strong>${pct(E.ratioCompromisos)}</strong> · ${dentro(E.ratioCompromisos)}`)+
      this.renderField('Plazo ideal','Plazo mínimo en que la cuota cabe en el 30% de los ingresos, descontando las deudas actuales ('+mx(Math.max(0,E.capDisponible))+' disponibles)',`<strong>${plazoTxt}</strong>`)

  renderTabCapital(s,E){
    const cp=s.capital,P=this.state.params;
    const af=cp.activosFijos||{};
    let activoFijoFields='';
    ACTIVOS_FIJOS.forEach(a=>{
      const it=af[a[0]]||{monto:0,comprobante:'ninguno'};
      activoFijoFields+=this.renderField(a[1],'',`<div style="display:flex;gap:10px;align-items:flex-end">
        <div class="field" style="flex:1"><label>Monto declarado</label><input class="input" type="text" inputmode="decimal" value="${it.monto}" data-action="updActivoFijo" data-key="${a[0]}" data-prop="monto" min="0"></div>
        <div class="field" style="flex:1.5"><label>Comprobante</label><select class="input" data-action="updActivoFijo" data-key="${a[0]}" data-prop="comprobante">
          ${COMPROBANTES_ACTIVO.map(c2=>`<option value="${c2[0]}" ${it.comprobante===c2[0]?'selected':''}>${c2[1]}</option>`).join('')}
        </select></div>
      </div>`);
    });
    return this.renderSection('Activos totales — lo que tiene','Comprobado: '+mx(E.activoFijoComprobado)+' de '+mx(E.activoFijoTotal)+' declarado',
      this.renderField('Activo circulante','Efectivo, inventarios, cuentas por cobrar',`<input class="input" type="text" inputmode="decimal" value="${cp.activoCirculante}" data-action="updNum" data-path="capital.activoCirculante" min="0">`)
    )+
    this.renderSection('Activo fijo desglosado','Solo se toman en cuenta montos con escritura o factura a nombre del solicitante',activoFijoFields)+
    this.renderSection('Pasivos totales — lo que debe',mx(num(cp.pasivoCorto)+num(cp.pasivoLargo)),
      this.renderField('Pasivo de corto plazo','Vencimientos dentro de doce meses',`<input class="input" type="text" inputmode="decimal" value="${cp.pasivoCorto}" data-action="updNum" data-path="capital.pasivoCorto" min="0">`)+
      this.renderField('Pasivo de largo plazo','Vencimientos a más de doce meses',`<input class="input" type="text" inputmode="decimal" value="${cp.pasivoLargo}" data-action="updNum" data-path="capital.pasivoLargo" min="0">`)
    )+
    this.renderSection('Indicadores de capital',pct(P.bloques.capital)+' del score 5C · '+pct(E.capital),
      this.renderField('Capital contable','Activos comprobados menos pasivos',`<strong>${mx(num(cp.activoCirculante)+E.activoFijoComprobado-num(cp.pasivoCorto)-num(cp.pasivoLargo))}</strong>`)+
      this.renderField('Endeudamiento actual','Arriba de '+pct(P.u.endActVeto)+' es rechazo',`<strong>${pct((num(cp.activoCirculante)+E.activoFijoComprobado)>0?(num(cp.pasivoCorto)+num(cp.pasivoLargo))/(num(cp.activoCirculante)+E.activoFijoComprobado):1)}</strong>`,E.sub.q1.toFixed(0))+
      this.renderField('Endeudamiento con el crédito','Arriba de '+pct(P.u.endProyVeto)+' es rechazo',`<strong>${pct((E.pl.monto+num(cp.activoCirculante)+E.activoFijoComprobado)>0?(num(cp.pasivoCorto)+num(cp.pasivoLargo)+E.pl.monto)/(num(cp.activoCirculante)+E.activoFijoComprobado+E.pl.monto):1)}</strong>`,E.sub.q2.toFixed(0))
    );
  },

  renderTabCondiciones(s,E){
    const cd=s.condiciones,P=this.state.params;
    let html=this.renderSection('Fuente principal de ingresos',pct(P.condiciones.fuente)+' de las condiciones',
      this.renderField('Estabilidad de la fuente','Cómo se comporta el ingreso a lo largo del año',this.renderRadio('fuente',OPC.fuente,cd.fuente,'condiciones.fuente'))
    );
    if(E.tieneOVaEmprender){
      html+=this.renderSection('Del negocio',pct(P.condiciones.negocio)+' de las condiciones',
        this.renderField('Sector y mercado','Demanda del producto o servicio',this.renderRadio('sector',OPC.sector,cd.sector,'condiciones.sector'))+
        this.renderField('Ubicación y entorno','Riesgo climático, social y de acceso',this.renderRadio('entorno',OPC.entorno,cd.entorno,'condiciones.entorno'))+
        this.renderField('Antigüedad del negocio','',this.renderRadio('antigNegocio',OPC.antigNegocio,cd.antigNegocio,'condiciones.antigNegocio'))
      );
    }else{
      html+=`<div style="background:var(--n200);border:1px solid var(--div);padding:14px 18px;margin-bottom:20px;border-radius:3px;font:400 13.5px/1.5 var(--font);color:var(--n700)">El apartado "Del negocio" no aplica porque el solicitante no tiene un negocio ni va a emprender uno (según la ocupación y actividad seleccionadas). Se evalúa únicamente la fuente de ingresos.</div>`;
    }
    return html;

  renderTabColateral(s,E){
    const g=s.colateral,P=this.state.params;
    let campos=this.renderField('Tipo de garantía requerida','Define cómo se mide la cobertura',`<select class="input" data-action="updText" data-path="colateral.tipo">
      ${GARANTIAS.map(x=>`<option value="${x[0]}" ${g.tipo===x[0]?'selected':''}>${x[1]}</option>`).join('')}
    </select>`);
    if(g.tipo==='garantes'){
      campos+=this.renderField('Ingresos mensuales del primer garante','Se compara contra la cuota mensual',`<input class="input" type="text" inputmode="decimal" value="${g.ingGarante1}" data-action="updNum" data-path="colateral.ingGarante1" min="0">`);
      campos+=this.renderField('Ingresos mensuales del segundo garante','Se compara contra la cuota mensual',`<input class="input" type="text" inputmode="decimal" value="${g.ingGarante2}" data-action="updNum" data-path="colateral.ingGarante2" min="0">`);
    }else if(g.tipo==='aval'){
      campos+=this.renderField('Ingresos mensuales del aval/codeudor','Debe cubrir al menos 2 veces la cuota',`<input class="input" type="text" inputmode="decimal" value="${g.ingAval}" data-action="updNum" data-path="colateral.ingAval" min="0">`);
    }else if(g.tipo==='sin_aval_garantia_liquida'){
      campos+=this.renderField('Monto de la garantía líquida','Cobertura exigida: '+P.u.covAhorro+' veces el crédito',`<input class="input" type="text" inputmode="decimal" value="${g.avaluo}" data-action="updNum" data-path="colateral.avaluo" min="0">`);
    }else if(g.tipo!=='ninguna'){
      const req=g.tipo==='prenda'?P.u.covPrenda:g.tipo==='hipoteca'?P.u.covHipoteca:P.u.covAhorro;
      campos+=this.renderField('Valor del avalúo o del colateral','Cobertura exigida: '+req+' veces el crédito',`<input class="input" type="text" inputmode="decimal" value="${g.avaluo}" data-action="updNum" data-path="colateral.avaluo" min="0">`);
    }
    campos+=this.renderField('Calificación de la garantía',E.colTxt,`<strong>${E.colateral>=0.7?'Aceptable':'No aceptable'}</strong>`,pct(E.colateral));
    return this.renderSection('Colateral',pct(E.pesosC.colateral)+' del score 5C',campos);
  },

  renderTabFlujo(s,E){
    const meses=E.flujo.mesesFlujo;
    const colLabel=m=>MESES[m%12].slice(0,3)+' A'+(Math.floor(m/12)+1);
    const mkRow=(key,label)=>{
      const arr=s.flujo[key]||[];
      let cells='';
      for(let m=0;m<meses;m++)cells+=`<td><input type="text" inputmode="decimal" value="${arr[m]||0}" data-action="updFlujo" data-key="${key}" data-mes="${m}" step="any"></td>`;
      return `<tr><td style="position:sticky;left:0;background:var(--bg);padding:5px 10px;font:400 12.5px/1.3 var(--font);white-space:nowrap;z-index:1">${label}</td>${cells}</tr>`;
    };
    const totRow=(label,arr)=>`<tr><td style="position:sticky;left:0;background:var(--n200);padding:6px 10px;font:600 12.5px/1.3 var(--font);white-space:nowrap;z-index:1">${label}</td>${arr.slice(0,meses).map(x=>`<td style="background:var(--n200);padding:6px;font:600 12px/1.2 var(--font);text-align:right;white-space:nowrap">${mx(x)}</td>`).join('')}</tr>`;
    const headerRow=(label)=>`<tr><td colspan="${meses+1}" style="background:var(--a100);padding:6px 10px;font:600 11.5px/1.2 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--a800)">${label}</td></tr>`;

    let cols='';
    for(let m=0;m<meses;m++)cols+=`<th style="background:var(--n200);padding:7px 6px;font:600 11px/1.2 var(--font);white-space:nowrap">${colLabel(m)}</th>`;
    let mesesOpts='';
    for(let m=0;m<meses;m++)mesesOpts+=`<option value="${m}" ${num(s.flujoMesPago)===m?'selected':''}>${MESES[m%12]} — año ${Math.floor(m/12)+1}</option>`;

    const esAnualOUnico=['anual','pago_unico','pago_unico_periodico'].includes(s.datos.periodicidad);
    return `
    ${E.flujoRequerido?'<div style="background:var(--a2100);border:1px solid var(--accent2);padding:10px 14px;margin-bottom:16px;border-radius:3px;font:400 13px/1.5 var(--font);color:var(--a2800)"><strong>Flujo de efectivo requerido:</strong> El solicitante tiene ingresos o gastos variables en el año, o su plan de pagos es anual / pago único. Complete el flujo mensual para una evaluación precisa.</div>':''}
    ${esAnualOUnico?'<div style="margin-bottom:14px"><button class="btn btn-p" data-action="autoPopularFlujo">Autopoblar préstamo de la Institución en el flujo</button><span style="font:400 12px/1.4 var(--font);color:var(--n700);margin-left:10px">Coloca el monto del préstamo como ingreso y los pagos como egreso según el plan.</span></div>':''}
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:24px;margin-bottom:22px">
      <div><label style="display:block;font:400 13px/1.4 var(--font);margin-bottom:5px">Años analizados</label>
        <select class="input" data-action="updFlujoProp" data-prop="flujoAnios" style="width:130px">
          <option value="1" ${num(s.flujoAnios)===1?'selected':''}>1 año</option>
          <option value="2" ${num(s.flujoAnios)===2?'selected':''}>2 años</option>
          <option value="3" ${num(s.flujoAnios)===3?'selected':''}>3 años</option>
        </select>
      </div>
      <div><label style="display:block;font:400 13px/1.4 var(--font);margin-bottom:5px">Mes del pago analizado</label>
        <select class="input" data-action="updFlujoProp" data-prop="flujoMesPago" style="width:180px">${mesesOpts}</select>
      </div>
    </div>
    <div style="overflow-x:auto;border:1px solid var(--div);margin-bottom:26px">
      <table class="grid" style="min-width:100%">
        <thead><tr><th style="position:sticky;left:0;background:var(--n200);text-align:left;padding:7px 10px;font:600 12px/1.2 var(--font);min-width:214px;z-index:2">Concepto / mes</th>${cols}</tr></thead>
        <tbody>
          ${headerRow('Ingresos del negocio o comercio')}
          ${FILAS_ING.map(f=>mkRow(f[0],f[1])).join('')}
          ${totRow('Total de ingresos',E.flujo.ing)}
          ${headerRow('Egresos familiares y del negocio')}
          ${FILAS_EGR.map(f=>mkRow(f[0],f[1])).join('')}
          ${totRow('Total de egresos',E.flujo.egr)}
          ${totRow('Resultado mensual',E.flujo.res)}
          ${totRow('Resultado acumulado',E.flujo.acum)}
        </tbody>
      </table>
    </div>
    <h2 style="font:600 19px/1.2 var(--fonth);margin:0 0 4px;border-bottom:2px solid var(--text);padding-bottom:6px">Indicadores de viabilidad del flujo</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:28px;margin-top:18px">
      <div>
        <div style="font:400 11.5px/1.4 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--n600);margin-bottom:6px">Egresos sobre ingresos</div>
        <div style="font:600 28px/1 var(--fonth)">${pct(E.flujo.ratio)}</div>
        <div style="font:400 12.5px/1.45 var(--font);color:var(--n700);margin-top:5px">Regla: 90% o menos es viable.</div>
        <div style="font:600 13px/1.4 var(--font);margin-top:4px">${E.flujo.ratio<=this.state.params.u.flujoGastosMax?'Viable · '+E.flujo.f1+'/10':'Negado'}</div>
      </div>
      <div>
        <div style="font:400 11.5px/1.4 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--n600);margin-bottom:6px">Cobertura del mes de pago</div>
        <div style="font:600 28px/1 var(--fonth)">${pct(E.flujo.cobertura)}</div>
        <div style="font:400 12.5px/1.45 var(--font);color:var(--n700);margin-top:5px">Ingreso del mes analizado ${mx(E.flujo.ingMesPago)}${E.flujo.acumPrevio<0?' menos el acumulado negativo de meses anteriores ('+mx(-E.flujo.acumPrevio)+')':''} entre compromisos ${mx(E.flujo.compromisoMes)}. Debe superar el 100%.</div>
        <div style="font:600 13px/1.4 var(--font);margin-top:4px">${E.flujo.cobertura>this.state.params.u.flujoCoberturaMin?'Viable · '+E.flujo.f2+'/10':'Negado'}</div>
      </div>
      <div>
        <div style="font:400 11.5px/1.4 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--n600);margin-bottom:6px">Meses con acumulado negativo</div>
        <div style="font:600 28px/1 var(--fonth)">${E.flujo.mesesNeg} de ${meses}</div>
        <div style="font:400 12.5px/1.45 var(--font);color:var(--n700);margin-top:5px">Ninguno: 10 · 1 a 2 meses: 6 · 3 o más: 2.</div>
        <div style="font:600 13px/1.4 var(--font);margin-top:4px">${E.flujo.f3}/10</div>
      </div>
      <div>
        <div style="font:400 11.5px/1.4 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--n600);margin-bottom:6px">Score del flujo</div>
        <div style="font:600 28px/1 var(--fonth)">${pct(E.scoreFlujo)}</div>
        <div style="font:400 12.5px/1.45 var(--font);color:var(--n700);margin-top:5px">Pesa ${pct(E.pesos.flujo)} del score global.</div>
      </div>
    </div>
    <div class="no-print" style="margin-top:24px"><button class="btn btn-s" data-action="imprimirFlujo">Imprimir flujo de efectivo</button></div>`;
  },

  renderTabCanvas(s,E){
    const cv=s.canvas;
    const hdrFields=[
      {l:'Elaborado por',v:s.analista,ro:true},{l:'Socio',v:s.datos.socio||'—',ro:true},
      {l:'Sucursal',v:s.sucursal,ro:true},{l:'Fecha',v:new Date().toLocaleDateString('es-MX'),ro:true},
      {l:'Monto',v:mx(s.datos.monto),ro:true},{l:'Tasa',v:(s.datos.tasaPct||0)+'%',ro:true}
    ];

    return `
    <h2 style="font:600 19px/1.2 var(--fonth);margin:0 0 16px;border-bottom:2px solid var(--text);padding-bottom:6px">Modelo CANVAS del Negocio</h2>
    <p style="font:400 13.5px/1.5 var(--font);color:var(--n700);margin:0 0 16px">El analista de crédito debe llenar cada bloque con las observaciones y evidencias recopiladas durante la visita y la investigación de crédito. Califique cada bloque de 1 a 5.</p>

    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px">
      <div style="flex:1 1 300px"><label style="display:block;font:400 13px/1.4 var(--font);margin-bottom:4px">Nombre del negocio o empresa</label>
        <input class="input" type="text" value="${esc(s.datos.nombreNegocio||'')}" data-action="updText" data-path="datos.nombreNegocio" placeholder="Capture el nombre del negocio" style="font-size:16px;font-weight:600">
      </div>
    </div>
    <div style="margin-bottom:8px;font:600 20px/1.2 var(--fonth);text-transform:uppercase;letter-spacing:.02em">EMPRESA: ${esc(s.datos.nombreNegocio||s.datos.nombre||'(sin nombre)')}</div>

    <div class="canvas-header">
      ${hdrFields.map(f=>`<div><label>${f.l}:</label><input type="text" value="${esc(f.v)}" readonly></div>`).join('')}
    </div>

    <div class="canvas-grid">
      ${this.renderCanvasBlock('aliados',cv,1,2,1,1)}
      ${this.renderCanvasBlock('actividades',cv,1,1,2,2)}
      ${this.renderCanvasBlock('propuesta',cv,1,2,3,3)}
      ${this.renderCanvasBlock('comunicacion',cv,1,1,4,4)}
      ${this.renderCanvasBlock('segmentos',cv,1,2,5,5)}
      ${this.renderCanvasBlock('recursos',cv,2,2,2,2)}
      ${this.renderCanvasBlock('canales',cv,2,2,4,4)}
    </div>
    <div class="canvas-bottom">
      ${this.renderCanvasBlock('flujoCanvas',cv,0,0,0,0,true)}
      ${this.renderCanvasBlock('dictamenCanvas',cv,0,0,0,0,true)}
    </div>

    <div style="margin-top:20px;font:600 16px/1.3 var(--fonth)">Score CANVAS: ${pct(E.scoreCanvas)} · Pesa ${pct(E.pesos.canvas)} del score global</div>
    <div class="no-print" style="margin-top:16px"><button class="btn btn-s" data-action="imprimirCanvas">Imprimir CANVAS</button></div>`;
  },

  renderCanvasBlock(key,cv,rStart,rEnd,cStart,cEnd,isBottom){
    const bloque=CANVAS_BLOQUES.find(b=>b[0]===key);
    if(!bloque)return '';
    const val=cv[key]||{p:3,nota:''};
    const style=isBottom?'':`grid-row:${rStart}/${rEnd+1};grid-column:${cStart}/${cEnd+1}`;
    return `<div class="canvas-cell" style="${style}">
      <h4>${bloque[1]}</h4>
      <textarea data-action="updCanvasNota" data-key="${key}" placeholder="${bloque[2]}">${esc(val.nota)}</textarea>

          <table style="width:100%;border-collapse:collapse;font-size:8.5px"><tr><td style="padding:1px 4px">Arraigo domiciliario</td><td style="padding:1px 4px;text-align:right;font-weight:700">${E.sub.dom.toFixed(1)}/10</td></tr><tr><td style="padding:1px 4px">Arraigo laboral</td><td style="padding:1px 4px;text-align:right;font-weight:700">${E.sub.lab.toFixed(1)}/10</td></tr><tr><td style="padding:1px 4px">Experiencia crediticia</td><td style="padding:1px 4px;text-align:right;font-weight:700">${E.sub.exp.toFixed(1)}/10</td></tr><tr><td style="padding:1px 4px">Compromiso institucional</td><td style="padding:1px 4px;text-align:right;font-weight:700">${E.sub.com.toFixed(1)}/10</td></tr></table>
        </div>
        <div style="border:1px solid #999"><div style="background:#d0d0d0;padding:2px 4px;font:700 9px/1.2 Arial,sans-serif">C2 CAPITAL — ${E.simplificada?'NO APLICA':(E.capital*100).toFixed(1)+'%'}</div>
          <table style="width:100%;border-collapse:collapse;font-size:8.5px"><tr><td style="padding:1px 4px">Activos totales</td><td style="padding:1px 4px;text-align:right">${mx(activos)}</td></tr><tr><td style="padding:1px 4px">Pasivos totales</td><td style="padding:1px 4px;text-align:right">${mx(pasivos)}</td></tr><tr><td style="padding:1px 4px">Capital contable</td><td style="padding:1px 4px;text-align:right;font-weight:700">${mx(activos-pasivos)}</td></tr><tr><td style="padding:1px 4px">Endeudamiento actual</td><td style="padding:1px 4px;text-align:right">${E.sub.q1.toFixed(0)}/10</td></tr><tr><td style="padding:1px 4px">Endeudamiento proyectado</td><td style="padding:1px 4px;text-align:right">${E.sub.q2.toFixed(0)}/10</td></tr></table>
        </div>
        <div style="border:1px solid #999"><div style="background:#d0d0d0;padding:2px 4px;font:700 9px/1.2 Arial,sans-serif">C3 CAPACIDAD DE PAGO — ${(E.capacidad*100).toFixed(1)}%</div>
          <table style="width:100%;border-collapse:collapse;font-size:8.5px"><tr><td style="padding:1px 4px">Ingresos mensuales</td><td style="padding:1px 4px;text-align:right">${mx(E.ingresos)}</td></tr><tr><td style="padding:1px 4px">Egresos mensuales</td><td style="padding:1px 4px;text-align:right">${mx(E.egresosTot)}</td></tr><tr><td style="padding:1px 4px">Disponible mensual</td><td style="padding:1px 4px;text-align:right;font-weight:700">${mx(E.disponible)}</td></tr><tr><td style="padding:1px 4px">Cobertura de cuota</td><td style="padding:1px 4px;text-align:right">${E.cobCuota.toFixed(2)} · ${E.sub.r1.toFixed(0)}/10</td></tr><tr><td style="padding:1px 4px">Gastos/Ingresos</td><td style="padding:1px 4px;text-align:right">${pct(E.ratioGI)} · ${E.sub.r2.toFixed(0)}/10</td></tr></table>
        </div>
        <div style="border:1px solid #999"><div style="background:#d0d0d0;padding:2px 4px;font:700 9px/1.2 Arial,sans-serif">C4 CONDICIONES — ${E.simplificada?'NO APLICA':(E.condiciones*100).toFixed(1)+'%'}</div>

      <div style="border:1px solid #999;margin-bottom:4px"><div style="background:#d0d0d0;padding:2px 4px;font:700 9px/1.2 Arial,sans-serif">C5 COLATERAL — ${pct(E.colateral)}</div><div style="padding:2px 4px;font-size:8.5px">Tipo: ${garantia?esc(garantia[1]):'—'} · ${esc(E.colTxt)}</div></div>
      <div style="border:2px solid #000;padding:4px 8px;margin-bottom:4px;display:flex;align-items:center;gap:12px">
        <div style="flex:1;font:700 9.5px/1.3 Arial,sans-serif"><div>CALIFICACIÓN CREDITICIA</div><div style="font-weight:400;margin-top:1px">5C${E.simplificada?' simplificada (C1, C3, C5)':''}: ${pct(E.score5c)} (${pct(E.pesos.cincoC)}) · Flujo: ${pct(E.scoreFlujo)} (${pct(E.pesos.flujo)})${E.tieneNegocio?' · CANVAS: '+pct(E.scoreCanvas)+' ('+pct(E.pesos.canvas)+')':''}</div></div>
        <div style="font:700 22px/1 Arial,sans-serif">${E.global.toFixed(1)}</div>
        <div style="font:700 10px/1.2 Arial,sans-serif;padding:3px 8px;border:1px solid #000">${E.dictamen}</div>
      </div>
      ${E.vetos.length?'<div style="font:400 8.5px/1.3 Arial,sans-serif;margin-bottom:3px"><strong>Causales de rechazo:</strong> '+E.vetos.map(v=>esc(v)).join(' · ')+'</div>':''}

  renderFlujoImprimible(s,E){
    const meses=E.flujo.mesesFlujo;
    const colLabel=m=>MESES[m%12].slice(0,3)+(meses>12?' A'+(Math.floor(m/12)+1):'');
    const cfg=this.state.config;
    let cols='';for(let m=0;m<meses;m++)cols+='<th style="border:1px solid #999;padding:2px 3px;font:700 7px/1.1 Arial,sans-serif;white-space:nowrap;background:#eee">'+colLabel(m)+'</th>';
    const mkRow=(key,label)=>{const arr=s.flujo[key]||[];let cells='';for(let m=0;m<meses;m++)cells+='<td style="border:1px solid #ddd;padding:1px 3px;text-align:right;font-size:7.5px">'+(arr[m]?mx(arr[m]):'—')+'</td>';return '<tr><td style="border:1px solid #999;padding:2px 4px;font-size:8px;white-space:nowrap;background:#f8f8f8">'+label+'</td>'+cells+'</tr>'};
    const totRow=(label,arr)=>'<tr><td style="border:1px solid #999;padding:2px 4px;font:700 8px/1.1 Arial,sans-serif;white-space:nowrap;background:#e0e0e0">'+label+'</td>'+arr.slice(0,meses).map(x=>'<td style="border:1px solid #999;padding:1px 3px;text-align:right;font:700 7.5px/1.1 Arial,sans-serif;background:#e0e0e0">'+mx(x)+'</td>').join('')+'</tr>';
    return `<div style="font:400 9px/1.2 Arial,sans-serif;color:#000;padding:8px 10px">
      <div style="text-align:center;margin-bottom:6px">${cfg.logotipo?`<img src="${cfg.logotipo}" alt="" style="max-height:35px;max-width:160px;object-fit:contain;margin-bottom:2px">`:''}<div style="font:700 12px/1.2 Arial,sans-serif">${esc(cfg.nombreInstitucion)}</div><div style="font:700 10px/1.2 Arial,sans-serif">FLUJO DE EFECTIVO — ${esc(s.datos.nombre||'—')} · Folio ${esc(s.folio)}</div></div>
      <table style="width:100%;border-collapse:collapse"><thead><tr><th style="border:1px solid #999;padding:2px 4px;text-align:left;font:700 8px/1.1 Arial,sans-serif;background:#eee;min-width:120px">Concepto</th>${cols}</tr></thead><tbody>
        ${FILAS_ING.map(f=>mkRow(f[0],f[1])).join('')}
        ${totRow('Total ingresos',E.flujo.ing)}
        ${FILAS_EGR.map(f=>mkRow(f[0],f[1])).join('')}
        ${totRow('Total egresos',E.flujo.egr)}
        ${totRow('Resultado',E.flujo.res)}
        ${totRow('Acumulado',E.flujo.acum)}
      </tbody></table>
      <div style="margin-top:6px;font:400 8px/1.3 Arial,sans-serif;color:#666">Egresos/Ingresos: ${pct(E.flujo.ratio)} · Cobertura mes pago: ${pct(E.flujo.cobertura)} · Meses negativos: ${E.flujo.mesesNeg} · Score flujo: ${pct(E.scoreFlujo)} · ${new Date().toLocaleString('es-MX')}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:50px;margin:34px 30px 8px">
        <div style="text-align:center;border-top:1px solid #000;padding-top:3px;font:400 8.5px/1.3 Arial,sans-serif">${esc(s.datos.nombre||'&nbsp;')}<br>Nombre y firma del solicitante</div>
        <div style="text-align:center;border-top:1px solid #000;padding-top:3px;font:400 8.5px/1.3 Arial,sans-serif">${esc(s.analista)}<br>Nombre y firma del analista</div>
      </div>
    </div>`;
  },

  renderCanvasImprimible(s,E){
    const cv=s.canvas,cfg=this.state.config;
    return `<div style="font:400 9px/1.2 Arial,sans-serif;color:#000;padding:8px 15px;max-width:800px;margin:0 auto">
      <div style="text-align:center;margin-bottom:6px">${cfg.logotipo?`<img src="${cfg.logotipo}" alt="" style="max-height:35px;max-width:160px;object-fit:contain;margin-bottom:2px">`:''}<div style="font:700 12px/1.2 Arial,sans-serif">${esc(cfg.nombreInstitucion)}</div><div style="font:700 10px/1.2 Arial,sans-serif">MODELO CANVAS — ${esc(s.datos.nombre||'—')} · Folio ${esc(s.folio)}</div></div>

      <div style="margin-top:16px"><button class="btn btn-s" data-action="resetOcupaciones">Restaurar catálogo por defecto</button></div>
    </div>`:''}

    ${st.configTab==='logotipo'?`

      <h3>Logotipo de la institución</h3>
      <p style="font:400 13px/1.5 var(--font);color:var(--n700);margin:0 0 12px">Cargue el logotipo que aparecerá en la barra superior, los dictámenes y reportes impresos. Formatos: PNG, JPG, SVG. Tamaño recomendado: 200×60 px.</p>
      ${cfg.logotipo?`
        <div style="margin-bottom:16px;padding:20px;background:var(--n100);border-radius:8px;text-align:center">
          <img src="${cfg.logotipo}" alt="Logotipo" style="max-height:80px;max-width:300px;object-fit:contain">
        </div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-p" data-action="cargarLogotipo">Cambiar logotipo</button>
          <button class="btn btn-d" data-action="quitarLogotipo">Quitar logotipo</button>
        </div>
      `:`
        <div style="margin-bottom:16px;padding:30px;background:var(--n100);border:2px dashed var(--n400);border-radius:8px;text-align:center;color:var(--n600)">
          <div style="font:400 14px/1.5 var(--font)">No se ha cargado ningún logotipo</div>
        </div>
        <button class="btn btn-p" data-action="cargarLogotipo">Cargar logotipo</button>
      `}
    </div>`:''}

    ${st.configTab==='personal'?`
    <div class="config-card">
      <h3>Directorio de personal</h3>
      <p style="font:400 13px/1.5 var(--font);color:var(--n700);margin:0 0 12px">Registre los nombres y cargos de analistas y administradores de la institución. Esta información se usa en los dictámenes y firmas.</p>
      <table class="table" style="margin-bottom:20px">
        <thead><tr><th>Nombre completo</th><th>Cargo</th><th>Tipo</th><th></th></tr></thead>
        <tbody>
          ${(cfg.personal||[]).map((p,i)=>`<tr>
            <td>${esc(p.nombre)}</td>
            <td>${esc(p.cargo)}</td>
            <td>${p.tipo==='administrador'?'Administrador':'Analista'}</td>
            <td style="text-align:right"><button class="btn btn-g" data-action="borrarPersonal" data-idx="${i}" style="padding:4px 9px;font-size:12px">Quitar</button></td>

          ${(cfg.personal||[]).length===0?'<tr><td colspan="4" style="color:var(--n600);text-align:center;padding:14px">No hay personal registrado</td></tr>':''}

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end;max-width:700px">
        <div class="field"><label>Nombre completo</label><input class="input" type="text" id="nuevoPersonalNombre" value="${esc(st.nuevoPersonal.nombre)}"></div>
        <div class="field"><label>Cargo</label><input class="input" type="text" id="nuevoPersonalCargo" value="${esc(st.nuevoPersonal.cargo)}" placeholder="Ej: Gerente de crédito"></div>
        <div class="field"><label>Tipo</label><select class="input" id="nuevoPersonalTipo">
          <option value="analista"${st.nuevoPersonal.tipo==='analista'?' selected':''}>Analista</option>
          <option value="administrador"${st.nuevoPersonal.tipo==='administrador'?' selected':''}>Administrador</option>
        </select></div>
        <button class="btn btn-p" data-action="agregarPersonal">Agregar</button>
      </div>
    </div>`:''}

    ${st.configTab==='regulatorio'?`

      <h3>Información regulatoria</h3>
      <p style="font:400 13px/1.5 var(--font);color:var(--n700);margin:0 0 12px">Datos legales y regulatorios de la institución. Se usan en reportes oficiales y documentos de cumplimiento.</p>

        <div class="field"><label>Registro CNBV / CONDUSEF</label><input class="input" type="text" id="cfgCNBV" value="${esc((cfg.regulatorio||{}).registroCNBV||'')}"></div>

        <div class="field"><label>Correo electrónico oficial</label><input class="input" type="email" id="cfgCorreo" value="${esc((cfg.regulatorio||{}).correoOficial||'')}"></div>
        <div class="field"><label>CLABE interbancaria</label><input class="input" type="text" id="cfgCLABE" value="${esc((cfg.regulatorio||{}).clabe||'')}" maxlength="18"></div>
      </div>
      <button class="btn btn-p" data-action="guardarRegulatorio" style="margin-top:16px">Guardar información regulatoria</button>

  renderParams(){
    const st=this.state,P=st.params,esSuper=st.sesion.rol==='superadmin';
    const dis=esSuper?'':'disabled';
    const mkRow=(label,hint,value,path)=>`<div style="display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--div)">
      <div><div style="font:400 14px/1.35 var(--font)">${label}</div>${hint?`<div style="font:400 12px/1.4 var(--font);color:var(--n600)">${hint}</div>`:''}</div>
      <input class="input" type="text" inputmode="decimal" value="${value}" data-action="updParam" data-path="${path}" step="any" ${dis} style="text-align:right">
    </div>`;

    return `
    <h1 style="margin:0 0 4px">Parámetros del modelo</h1>
    <p style="font:400 15px/1.5 var(--font);color:var(--n700);margin:0 0 34px">Ponderaciones y umbrales del modelo de scoring. Solo el superadministrador puede modificarlos.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:40px">
      <section>
        <div style="border-bottom:2px solid var(--text);padding-bottom:6px"><h2 style="margin:0">Mezcla del score global</h2></div>
        ${mkRow('Cinco C del crédito','',''+P.mezcla.cincoC,'mezcla.cincoC')}
        ${mkRow('Análisis de flujo de efectivo','',''+P.mezcla.flujo,'mezcla.flujo')}
        ${mkRow('Modelo CANVAS del negocio','',''+P.mezcla.canvas,'mezcla.canvas')}
      </section>
      <section>
        <div style="border-bottom:2px solid var(--text);padding-bottom:6px"><h2 style="margin:0">Las cinco C</h2></div>
        ${mkRow('Carácter','',''+P.bloques.caracter,'bloques.caracter')}
        ${mkRow('Capacidad de pago','',''+P.bloques.capacidad,'bloques.capacidad')}
        ${mkRow('Capital','',''+P.bloques.capital,'bloques.capital')}
        ${mkRow('Condiciones','',''+P.bloques.condiciones,'bloques.condiciones')}
        ${mkRow('Colateral','',''+P.bloques.colateral,'bloques.colateral')}
        ${mkRow('Monto para evaluación simplificada','Debajo de este monto solo se evalúan Carácter, Capacidad y Colateral',''+P.montoEvalSimplificada,'montoEvalSimplificada')}
      </section>
      <section>
        <div style="border-bottom:2px solid var(--text);padding-bottom:6px"><h2 style="margin:0">Semáforo del dictamen</h2></div>
        ${mkRow('Score mínimo para aprobar','',''+P.dictamen.aprobado,'dictamen.aprobado')}
        ${mkRow('Score mínimo para condicionar','',''+P.dictamen.condicionado,'dictamen.condicionado')}
      </section>
      <section>
        <div style="border-bottom:2px solid var(--text);padding-bottom:6px"><h2 style="margin:0">Umbrales de veto</h2></div>
        ${mkRow('Cobertura mínima de la cuota','Debajo: rechazo',''+P.u.cobCuotaMin,'u.cobCuotaMin')}
        ${mkRow('Egresos máximos sobre ingresos','Arriba de 0.90 se niega',''+P.u.flujoGastosMax,'u.flujoGastosMax')}
        ${mkRow('Endeudamiento actual máximo','',''+P.u.endActVeto,'u.endActVeto')}
        ${mkRow('Endeudamiento máximo con el crédito','',''+P.u.endProyVeto,'u.endProyVeto')}
        ${mkRow('Créditos con atraso tolerados','',''+P.u.atrasosVeto,'u.atrasosVeto')}
        ${mkRow('IVA sobre intereses','',''+P.u.ivaInteres,'u.ivaInteres')}
      </section>
    </div>
    ${esSuper?`<div style="display:flex;gap:8px;margin-top:34px">
      <button class="btn btn-p" data-action="guardarParams">Guardar parámetros</button>
      <button class="btn btn-s" data-action="resetParams">Restaurar valores originales</button>
    </div>`:''}`;
  },

    return `

      </select></div>
      <div class="field"><label>Tope de resolución</label><input class="input" type="text" inputmode="decimal" id="nuTope" value="0" min="0"></div>
      <button class="btn btn-p" data-action="altaUsuario">Dar de alta</button>
    </div>
