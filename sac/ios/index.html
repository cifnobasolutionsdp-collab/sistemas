select.input{appearance:auto}
.tag{display:inline-flex;font-size:11px;padding:3px 10px;border-radius:3px;letter-spacing:.02em}

.tag-r{background:var(--a2100);color:var(--a2800)}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(32,30,29,.55);padding:8px;border-bottom:1px solid var(--div)}
.table td{padding:8px;border-bottom:1px solid rgba(32,30,29,.06)}
.table tbody tr:hover{background:rgba(32,30,29,.03)}
.grid{border-collapse:collapse;font-variant-numeric:tabular-nums}
.grid th,.grid td{border:1px solid var(--div);padding:0}
.grid input{border:0;background:transparent;width:80px;padding:5px 6px;font:400 12.5px var(--font);text-align:right}
.grid input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--a100)}
.field>label{display:block;font-size:12px;margin-bottom:5px;color:rgba(32,30,29,.65)}
.canvas-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;grid-template-rows:auto auto auto;gap:0;border:2px solid var(--n800);font-size:13px}
.canvas-cell{border:1px solid var(--n400);padding:8px;min-height:120px;display:flex;flex-direction:column}
.canvas-cell h4{font:600 11px/1.3 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--n800);margin:0 0 6px;display:flex;align-items:center;gap:6px}

.canvas-cell textarea:focus{outline:none;background:var(--a100)}
.canvas-header{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr;gap:0;border-bottom:2px solid var(--n800)}
.canvas-header>div{padding:6px 8px;border-right:1px solid var(--n400);font:400 12px/1.3 var(--font)}

.canvas-bottom>.canvas-cell{min-height:100px}

    flujo,flujoAnios:2,flujoMesPago:11,
    canvas,
    resolucion:null,bitacora:[{ts:Date.now(),accion:'Solicitud creada',quien:user.nombre}]
  };
}

const APP={
  state:{
    sesion:null,vista:'tablero',tab:'datos',idActual:null,
    loginUser:'',loginPass:'',loginErr:'',
    users:[...USUARIOS_INICIALES],sucursales:[...SUCURSALES_INICIALES],
    params:defaultParams(),config:defaultConfig(),solicitudes:[],auditoria:[],
    comentario:'',firma:'',avisoAccion:'',avisoUsuarios:'',
    pegarAbierto:false,pegarTexto:'',pegarAviso:'',
    nuevoU:{usuario:'',nombre:'',rol:'analista',sucursal:'Sucursal Matriz',pass:'',tope:0},
    nuevaSucursal:'',esc:null,folioSeq:1001,
    configTab:'institucion',nuevoProducto:{nombre:'',plazoMax:24,tasaAnual:18},
    nuevoNivel:{nombre:'',plazoMax:24}
  },

  init(){
    try{
      const raw=localStorage.getItem(LS_KEY);
      if(raw){
        const d=JSON.parse(raw);
        Object.assign(this.state,{
          users:d.users||USUARIOS_INICIALES,sucursales:d.sucursales||SUCURSALES_INICIALES,
          params:Object.assign(defaultParams(),d.params||{}),config:Object.assign(defaultConfig(),d.config||{}),
          solicitudes:d.solicitudes||[],auditoria:d.auditoria||[],folioSeq:d.folioSeq||1001
        });
      }
    }catch(e){}
    this.render();
  },

  set(upd){Object.assign(this.state,upd);this.render()},

  persist(extra){
    const s=Object.assign({},this.state,extra||{});
    try{localStorage.setItem(LS_KEY,JSON.stringify({users:s.users,sucursales:s.sucursales,params:s.params,config:s.config,solicitudes:s.solicitudes,auditoria:s.auditoria,folioSeq:s.folioSeq}))}catch(e){}
  },

  log(accion,detalle){
    const u=this.state.sesion;
    const entry={ts:Date.now(),usuario:u?u.usuario:'—',rol:u?ROL_NOMBRE[u.rol]:'—',accion,detalle:detalle||''};
    const aud=[entry,...this.state.auditoria].slice(0,400);
    this.state.auditoria=aud;this.persist({auditoria:aud});
  },

  actual(){return this.state.solicitudes.find(s=>s.id===this.state.idActual)||null},

  upd(path,value){
    const id=this.state.idActual;
    this.state.solicitudes=this.state.solicitudes.map(s=>{
      if(s.id!==id)return s;
      const c=JSON.parse(JSON.stringify(s));
      let ref=c;const parts=path.split('.');
      for(let i=0;i<parts.length-1;i++)ref=ref[parts[i]];
      ref[parts[parts.length-1]]=value;
      return c;
    });
    this.persist();
  },

  _scheduleRender(){clearTimeout(this._rt);this._rt=setTimeout(()=>this._renderSafe(),600)},
  _renderSafe(){
    const ae=document.activeElement;
    const path=ae?.getAttribute('data-path');
    const key=ae?.getAttribute('data-key');
    const mes=ae?.getAttribute('data-mes');
    const action=ae?.getAttribute('data-action');
    const pos=ae?.selectionStart;
    const tag=ae?.tagName;
    this.render();
    let el=null;
    if(path&&action)el=document.querySelector('[data-path="'+path+'"][data-action="'+action+'"]');
    else if(key&&mes)el=document.querySelector('[data-key="'+key+'"][data-mes="'+mes+'"]');
    else if(key&&action)el=document.querySelector('[data-key="'+key+'"][data-action="'+action+'"]');
    if(el){el.focus();if(pos!=null&&el.setSelectionRange&&(tag==='INPUT'||tag==='TEXTAREA')){try{el.setSelectionRange(pos,pos)}catch(e){}}}
  },

  _clampProductLimits(){
    const s=this.actual();if(!s||!s.datos.producto)return;
    const prod=this.state.config.productos.find(p=>p.nombre===s.datos.producto);
    if(!prod)return;
    if(num(s.datos.tasaPct)>prod.tasaAnual)this.upd('datos.tasaPct',prod.tasaAnual);
    if(num(s.datos.plazo)>prod.plazoMax)this.upd('datos.plazo',prod.plazoMax);
  },

  plan(datos,montoOv,plazoOv){
    const P=this.state.params;
    const monto=montoOv!=null?montoOv:num(datos.monto);
    const meses=Math.max(1,plazoOv!=null?plazoOv:num(datos.plazo));
    const tasaAnual=num(datos.tasaPct)/100;
    const per=PERIODICIDADES.find(p=>p[0]===datos.periodicidad)||PERIODICIDADES[2];
    const porAnio=per[2];

    if(datos.periodicidad==='pago_unico'){
      const intTotal=monto*tasaAnual*(meses/12);
      const cuotaUnica=monto+intTotal;
      const cuotaMensual=cuotaUnica/Math.max(1,meses);
      return {monto,meses,n:1,porAnio:0,cuota:cuotaUnica,cuotaIva:cuotaUnica+intTotal*P.u.ivaInteres,cuotaMensual:cuotaMensual+intTotal*P.u.ivaInteres/Math.max(1,meses),totalInt:intTotal,iva:intTotal*P.u.ivaInteres,total:cuotaUnica+intTotal*P.u.ivaInteres};
    }
    if(datos.periodicidad==='pago_unico_periodico'){
      const iPeriodo=tasaAnual/12;
      const intMensual=monto*iPeriodo;
      const totalInt=intMensual*meses;
      const cuotaInt=intMensual;
      const cuotaMensual=intMensual+intMensual*P.u.ivaInteres+monto/Math.max(1,meses);
      return {monto,meses,n:meses,porAnio:12,cuota:cuotaInt,cuotaIva:cuotaInt+cuotaInt*P.u.ivaInteres,cuotaMensual,totalInt,iva:totalInt*P.u.ivaInteres,total:monto+totalInt+totalInt*P.u.ivaInteres};
    }

    const n=Math.max(1,Math.round(meses/12*porAnio));
    const i=tasaAnual/porAnio;
    let cuota,totalInt;
    if(datos.plan==='insolutos'){
      const cap=monto/n;const prim=cap+monto*i;
      cuota=prim;totalInt=monto*i*(n+1)/2;
    }else{
      cuota=i>0?monto*i/(1-Math.pow(1+i,-n)):monto/n;
      totalInt=cuota*n-monto;
    }
    const intPeriodo=totalInt/n;
    const cuotaIva=cuota+intPeriodo*P.u.ivaInteres;
    const cuotaMensual=cuotaIva*porAnio/12;
    return {monto,meses,n,porAnio,cuota,cuotaIva,cuotaMensual,totalInt,iva:totalInt*P.u.ivaInteres,total:cuotaIva*n};
  },

  calcArraigo(anios,meses2){
    const totalMeses=num(anios)*12+num(meses2);
    if(totalMeses>=18)return 10;
    if(totalMeses>=12)return 7;
    if(totalMeses>=6)return 3;
    return 0;
  },

  evaluar(s,montoOv,plazoOv){
    const P=this.state.params;const vetos=[];
    const pl=this.plan(s.datos,montoOv,plazoOv);
    const c=s.caracter;

    // BONUS POINTS
    let bonusDiscapacidad=s.datos.tieneDiscapacidad?7:0;
    let bonusGenero=0;
    if(s.datos.genero==='mujer'){
      bonusGenero=3;
      if(s.datos.esUnicoSosten)bonusGenero=10;
    }else if(s.datos.genero==='hombre'&&s.datos.esUnicoSosten){
      bonusGenero=5;
    }

    // CARÁCTER
    const pVi=OPC.vivienda[c.vivienda]?OPC.vivienda[c.vivienda][1]:OPC.vivienda[0][1];
    const totalResMeses=num(c.resAnios)*12+num(c.resMeses);
    let pRe;
    if(totalResMeses>=6){
      pRe=this.calcArraigo(c.resAnios,c.resMeses);
    }else{
      pRe=this.calcArraigo(c.resPrevAnios,c.resPrevMeses);
    }
    const dom=clamp10(pVi*P.arraigoDom.vivienda+pRe*P.arraigoDom.residencia);

    const esPrimerEmpleo=!!s.datos.esPrimerEmpleo;
    const pAc=OPC.actividad[c.actividad]?OPC.actividad[c.actividad][1]:OPC.actividad[0][1];
    let pAn;
    if(esPrimerEmpleo){
      pAn=10;
    }else{
      const totalLabMeses=num(c.labAnios)*12+num(c.labMeses);
      if(totalLabMeses>=6){
        pAn=this.calcArraigo(c.labAnios,c.labMeses);
      }else{
        pAn=this.calcArraigo(c.labPrevAnios,c.labPrevMeses);
      }
    }
    const lab=clamp10(pAc*P.arraigoLab.actividad+pAn*P.arraigoLab.antiguedad);

    const sinHist=c.historial!==0;
    const pHi=OPC.historial[c.historial]?OPC.historial[c.historial][1]:OPC.historial[0][1];
    let pAt=10;
    if(!sinHist){
      const mop=num(c.mopMaximo);
      if(mop>=5){pAt=0;vetos.push('Experiencia crediticia: MOP '+mop+', la deuda se considera irrecuperable.')}
      else if(mop>=3){
        if(c.comprobantePagoMOP)pAt=3;
        else{pAt=0;vetos.push('Experiencia crediticia: MOP '+mop+' sin comprobante de pago presentado.')}
      }else if(mop===2)pAt=5;
      else pAt=10;
    }
    const pCo=sinHist?10:(OPC.comportamiento[c.comportamiento]?OPC.comportamiento[c.comportamiento][1]:10);
    const pRf=OPC.referencias[c.referencias]?OPC.referencias[c.referencias][1]:OPC.referencias[0][1];
    const exp=clamp10(pHi*P.expCred.historial+pAt*P.expCred.atrasos+pCo*P.expCred.comportamiento+pRf*P.expCred.referencias);
    const com=clamp10((OPC.antigSocio[c.antigSocio]?OPC.antigSocio[c.antigSocio][1]:10)*P.compromiso.antigSocio+(OPC.ahorro[c.ahorro]?OPC.ahorro[c.ahorro][1]:10)*P.compromiso.ahorro);
    let caracter=(dom*P.caracter.arraigoDom+lab*P.caracter.arraigoLab+exp*P.caracter.expCred+com*P.caracter.compromiso)/10;
    caracter=Math.min(1,caracter+(bonusDiscapacidad+bonusGenero)/100);

    // CAPACIDAD
    const k=s.capacidad;
    const ingresos=num(k.ingTrabajo)+num(k.ingArrendamiento)+num(k.ingIntereses)+num(k.ingTransferencias)+num(k.ingOtros);
    const fam=num(k.gAlimentos)+num(k.gTransporte)+num(k.gEducacion)+num(k.gVivienda)+num(k.gPersonal)+num(k.gLimpieza)+num(k.gVestido)+num(k.gSalud)+num(k.gOtrosGastos);
    const deudas=num(k.dCajas)+num(k.dBancos)+num(k.dArrendamiento)+num(k.dPrestamistas);
    const egresosTot=fam*(1+P.u.margenGastos)+deudas;
    const disponible=ingresos-egresosTot;
    const cobCuota=pl.cuotaMensual>0?disponible/pl.cuotaMensual:0;
    let r1=0;
    if(cobCuota>=P.u.cobCuotaBuena)r1=10;else if(cobCuota>=P.u.cobCuotaMin)r1=5;
    else vetos.push('Capacidad de pago: la cobertura de la cuota es '+(isFinite(cobCuota)?cobCuota.toFixed(2):'0.00')+', menor al mínimo de '+P.u.cobCuotaMin.toFixed(2)+'.');
    const ratioGI=ingresos>0?egresosTot/ingresos:1;
    const r2=ratioGI<P.u.gastosIngBueno?10:ratioGI<P.u.gastosIngMedio?3:0;
    const ratioGCI=ingresos>0?(egresosTot+pl.cuotaMensual)/ingresos:1;
    const r3=ratioGCI<P.u.gastosCuotaBueno?10:ratioGCI<P.u.gastosCuotaMedio?3:0;
    const capacidad=(r1*P.capacidad.coberturaCuota+r2*P.capacidad.gastosIngresos+r3*P.capacidad.gastosCuotaIng)/10;
    const gastoRef=num(s.datos.dependientes)*P.u.gastoBasicoPersona;
    const alertaGastos=fam>0&&fam<gastoRef;

    // CAPITAL
    const cp=s.capital;
    const af=cp.activosFijos||{};
    let activoFijoComprobado=0,activoFijoTotal=0;
    ACTIVOS_FIJOS.forEach(a=>{const it=af[a[0]];if(it){activoFijoTotal+=num(it.monto);if(it.comprobante&&it.comprobante!=='ninguno')activoFijoComprobado+=num(it.monto)}});
    const activos=num(cp.activoCirculante)+activoFijoComprobado;
    const pasivos=num(cp.pasivoCorto)+num(cp.pasivoLargo);
    const endAct=activos>0?pasivos/activos:1;
    let q1=0;
    if(endAct>1)q1=0;
    else if(endAct>P.u.endActVeto){q1=0;vetos.push('Capital: el endeudamiento actual es '+pct(endAct)+', arriba del límite de '+pct(P.u.endActVeto)+'.')}
    else if(endAct>P.u.endActMedio)q1=5;else if(endAct>P.u.endActBueno)q1=7;else q1=10;
    const endProy=(activos+pl.monto)>0?(pasivos+pl.monto)/(activos+pl.monto):1;
    let q2=0;
    if(endProy>1)q2=0;
    else if(endProy>P.u.endProyVeto){q2=0;vetos.push('Capital: con el crédito solicitado el endeudamiento llega a '+pct(endProy)+', arriba del límite de '+pct(P.u.endProyVeto)+'.')}
    else if(endProy>P.u.endProyMedio)q2=5;else if(endProy>P.u.endProyBueno)q2=7;else q2=10;
    const capital=(q1*P.capital.endeudActual+q2*P.capital.endeudProyectado)/10;

    // CONDICIONES
    const cd=s.condiciones;
    const pFu=OPC.fuente[cd.fuente]?OPC.fuente[cd.fuente][1]:10;
    const tieneOVaEmprender=(s.datos.ocupacion==='negocio_rural'||s.datos.ocupacion==='negocio_urbano')||(c.actividad===0||c.actividad===4);
    let condiciones;
    if(tieneOVaEmprender){
      const pSe=OPC.sector[cd.sector]?OPC.sector[cd.sector][1]:10;
      const pEn=OPC.entorno[cd.entorno]?OPC.entorno[cd.entorno][1]:10;
      const pAN=OPC.antigNegocio[cd.antigNegocio]?OPC.antigNegocio[cd.antigNegocio][1]:10;
      const neg2=pSe*P.negocio.sector+pEn*P.negocio.entorno+pAN*P.negocio.antiguedad;
      condiciones=(pFu*P.condiciones.fuente+neg2*P.condiciones.negocio)/10;
    }else{
      condiciones=pFu/10;
    }

    // COLATERAL
    const g=s.colateral;let colateral=0;let colTxt='';
    const grado=x=>x<0.5?1:x<1?2:x<2?3:4;
    if(g.tipo==='garantes'){
      const c1=pl.cuotaMensual>0?num(g.ingGarante1)/pl.cuotaMensual:0;
      const c2=pl.cuotaMensual>0?num(g.ingGarante2)/pl.cuotaMensual:0;
      const g1=grado(c1),g2=grado(c2);
      colateral=(g1===1||g2===1)?0:(g1+g2>=4?1:0);
      colTxt='Garantes: cobertura de cuota '+c1.toFixed(2)+' y '+c2.toFixed(2)+(colateral?' — aceptable':' — no aceptable');
    }else if(g.tipo==='aval'){
      const cAval=pl.cuotaMensual>0?num(g.ingAval)/pl.cuotaMensual:0;
      colateral=cAval>=2?1:cAval>=1?0.7:0;
      colTxt='Aval/codeudor: cobertura de cuota '+cAval.toFixed(2)+(colateral>=0.7?' — aceptable':' — insuficiente');
    }else if(g.tipo==='sin_aval_garantia_liquida'){
      const cov=pl.monto>0?num(g.avaluo)/pl.monto:0;
      colateral=cov>=P.u.covAhorro?1:0;
      colTxt='Garantía líquida sin aval: cobertura '+cov.toFixed(2)+' veces el crédito; se requiere '+P.u.covAhorro.toFixed(2)+(colateral?' — adecuada':' — insuficiente');
    }else if(g.tipo==='ninguna'){
      colateral=0;colTxt='Sin garantía';
    }else{
      const req=g.tipo==='prenda'?P.u.covPrenda:g.tipo==='hipoteca'?P.u.covHipoteca:P.u.covAhorro;
      const cov=pl.monto>0?num(g.avaluo)/pl.monto:0;
      colateral=cov>=req?1:0;
      colTxt='Cobertura del avalúo '+cov.toFixed(2)+' veces el crédito; se requiere '+req.toFixed(2)+(colateral?' — adecuada':' — insuficiente');
    }

    const score5c=caracter*P.bloques.caracter+capacidad*P.bloques.capacidad+capital*P.bloques.capital+condiciones*P.bloques.condiciones+colateral*P.bloques.colateral;

    // FLUJO DE EFECTIVO
    const mesesFlujo=Math.max(1,num(s.flujoAnios))*12;
    let ing=[],egr=[],res=[],acum=[],run=0;
    for(let m=0;m<mesesFlujo;m++){
      let a=0,b=0;
      FILAS_ING.forEach(f=>{a+=num((s.flujo[f[0]]||[])[m])});
      FILAS_EGR.forEach(f=>{b+=num((s.flujo[f[0]]||[])[m])});
      ing.push(a);egr.push(b);res.push(a-b);run+=a-b;acum.push(run);
    }
    const totIng=ing.reduce((x,y)=>x+y,0);
    const totEgr=egr.reduce((x,y)=>x+y,0);
    const ratioFlujo=totIng>0?totEgr/totIng:1;
    const mp=Math.min(mesesFlujo-1,Math.max(0,num(s.flujoMesPago)));
    const ingMesPago=ing[mp]||0;
    const compromisoMes=egr[mp]||0;
    const cobFlujo=compromisoMes>0?ingMesPago/compromisoMes:0;
    const mesesNeg=acum.filter(x=>x<0).length;
    let f1=0;
    if(totIng<=0){f1=0}
    else if(ratioFlujo<=0.70)f1=10;else if(ratioFlujo<=0.80)f1=7;else if(ratioFlujo<=P.u.flujoGastosMax)f1=4;
    else{f1=0;vetos.push('Flujo de efectivo: los egresos son '+pct(ratioFlujo)+' de los ingresos, arriba del máximo de '+pct(P.u.flujoGastosMax)+'.')}
    let f2=0;
    if(compromisoMes<=0){f2=0}
    else if(cobFlujo>=1.5)f2=10;else if(cobFlujo>=1.2)f2=8;else if(cobFlujo>P.u.flujoCoberturaMin)f2=5;
    else{f2=0;vetos.push('Flujo de efectivo: la cobertura del mes de pago es '+pct(cobFlujo)+', igual o menor al 100% exigido.')}
    const f3=mesesNeg===0?10:mesesNeg<=2?6:2;
    const capturado=totIng>0||totEgr>0;
    const scoreFlujo=capturado?(f1*P.flujoPeso.ratioGastos+f2*P.flujoPeso.cobertura+f3*P.flujoPeso.acumulado)/10:0;
    if(!capturado)vetos.push('Flujo de efectivo: no se ha capturado el flujo mensual.');

    // CANVAS (solo aplica si tiene negocio)
    const tieneNegocio=s.datos.ocupacion==='negocio_rural'||s.datos.ocupacion==='negocio_urbano';
    let cs=0;
    CANVAS_BLOQUES.forEach(b=>{cs+=num((s.canvas[b[0]]||{}).p)});
    const scoreCanvas=tieneNegocio?cs/(CANVAS_BLOQUES.length*5):0;

    let wC=P.mezcla.cincoC,wF=P.mezcla.flujo,wV=P.mezcla.canvas;
    if(!tieneNegocio){wV=0;const tot=P.mezcla.cincoC+P.mezcla.flujo;wC=P.mezcla.cincoC/tot;wF=P.mezcla.flujo/tot}
    const global=100*(score5c*wC+scoreFlujo*wF+scoreCanvas*wV);
    let banda='NO AUTORIZABLE';
    for(let i=0;i<P.bandas.length;i++){if(score5c>=P.bandas[i][0]){banda=P.bandas[i][1];break}}
    let dict='RECHAZADO';
    if(vetos.length===0)dict=global>=P.dictamen.aprobado?'APROBADO':global>=P.dictamen.condicionado?'CONDICIONADO':'RECHAZADO';

    const flujoRequerido=s.condiciones.fuente>0||['anual','pago_unico','pago_unico_periodico'].includes(s.datos.periodicidad)||s.datos.ocupacion==='negocio_rural';
    return {
      pl,vetos,banda,dictamen:dict,global,
      score5c,scoreFlujo,scoreCanvas,
      caracter,capacidad,capital,condiciones,colateral,colTxt,
      sub:{dom,lab,exp,com,pVi,pRe,pAc,pAn,pHi,pAt,pCo,pRf,r1,r2,r3,q1,q2},
      ingresos,egresosTot,disponible,cobCuota,ratioGI,ratioGCI,alertaGastos,gastoRef,
      bonusDiscapacidad,bonusGenero,
      flujo:{ing,egr,res,acum,ratio:ratioFlujo,cobertura:cobFlujo,mesesNeg,mesesFlujo,ingMesPago,compromisoMes,f1,f2,f3},
      sinHist,tieneNegocio,tieneOVaEmprender,flujoRequerido,pesos:{cincoC:wC,flujo:wF,canvas:wV},
      activoFijoTotal,activoFijoComprobado
    };
  },

  render(){
    const el=document.getElementById('app');
    const st=this.state;
    if(!st.sesion){el.innerHTML=this.renderLogin();this.bind();return}
    el.innerHTML=this.renderMain();
    this.bind();
  },

  renderLogin(){
    const st=this.state;
    const cfg=st.config;
    return `
    <div style="min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--bg)">
      <div style="padding:60px 50px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--div)">
        <div>
          <div style="display:flex;align-items:baseline;gap:10px;border-top:4px solid var(--text);border-bottom:1px solid var(--text);padding:12px 0 10px;margin-bottom:6px">
            <span style="font:600 13px/1 var(--font);letter-spacing:.18em;text-transform:uppercase">${esc(cfg.nombreInstitucion)}</span>
            <span style="flex:1"></span>
            <span style="font:400 12px/1 var(--font);color:var(--n700)">Sistema de Análisis de Crédito</span>
          </div>
          <h1 style="font:600 64px/0.95 var(--fonth);margin:30px 0 0;letter-spacing:-.02em">SAC</h1>
          <div style="font:400 28px/1 var(--fonth);color:var(--a700);margin-top:6px">2.0</div>
          <p style="font:400 16px/1.55 var(--font);max-width:36ch;margin:30px 0 0;color:var(--n800)">Scoring crediticio por las cinco C del crédito, con análisis de flujo de efectivo y modelo CANVAS para micro y pequeños negocios rurales y urbanos.</p>
        </div>
        <div style="font:400 12.5px/1.6 var(--font);color:var(--n700)">
          <div>Ponderación vigente · 5C 60% · Flujo 30% · CANVAS 10%</div>
          <div>Moneda MXN · Productos configurables</div>
        </div>
      </div>
      <div style="padding:60px 50px;display:flex;flex-direction:column;justify-content:center;max-width:520px">
        <h2 style="font:600 26px/1.1 var(--fonth);margin:0 0 4px">Iniciar sesión</h2>
        <p style="font:400 14px/1.5 var(--font);color:var(--n700);margin:0 0 26px">Acceso por rol: superadministrador, gerente de sucursal y analista de crédito.</p>
        <div class="field" style="margin-bottom:15px">
          <label>Usuario</label>
          <input class="input" type="text" id="loginUser" value="${esc(st.loginUser)}" placeholder="usuario">
        </div>
        <div class="field" style="margin-bottom:20px">
          <label>Contraseña</label>
          <input class="input" type="password" id="loginPass" value="${esc(st.loginPass)}" placeholder="••••••••">
        </div>
        ${st.loginErr?`<div style="font:400 13px/1.4 var(--font);color:var(--a2700);margin-bottom:16px">${esc(st.loginErr)}</div>`:''}
        <button class="btn btn-p btn-block" data-action="login" style="margin-bottom:30px">Entrar al sistema</button>
        <div style="font:400 12px/1.4 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--n600);margin-bottom:10px">Cuentas de demostración</div>
        <div style="display:flex;flex-direction:column;gap:7px">
          ${USUARIOS_INICIALES.map(d=>`<button class="btn btn-g" data-action="demoPick" data-user="${esc(d.usuario)}" data-pass="${esc(d.pass)}" style="justify-content:flex-start;text-align:left;padding:9px 11px;font:400 13px/1.35 var(--font)"><span><strong>${esc(d.usuario)}</strong> · ${esc(d.pass)}</span><br><span style="color:var(--n700)">${ROL_NOMBRE[d.rol]} — ${esc(d.nombre)}</span></button>`).join('')}
        </div>
      </div>
    </div>`;
  },

  renderMain(){
    const st=this.state,u=st.sesion,cfg=st.config;
    const esSuper=u.rol==='superadmin',esGer=u.rol==='gerente';
    const nav=[['tablero','Tablero'],['solicitud','Solicitud en análisis']];
    if(esSuper){nav.push(['config','Configuración']);nav.push(['params','Parámetros del modelo']);nav.push(['usuarios','Usuarios y sucursales'])}
    nav.push(['auditoria','Auditoría']);

    let content='';
    if(st.vista==='tablero'||(!this.actual()&&st.vista==='solicitud'))content=this.renderTablero();
    else if(st.vista==='solicitud'&&this.actual())content=this.renderSolicitud();
    else if(st.vista==='config')content=this.renderConfig();
    else if(st.vista==='params')content=this.renderParams();
    else if(st.vista==='usuarios')content=this.renderUsuarios();
    else if(st.vista==='auditoria')content=this.renderAuditoria();

    return `
    <div style="min-height:100vh;background:var(--bg)">
      <div class="no-print" style="display:flex;align-items:center;gap:15px;padding:12px 24px;border-bottom:1px solid var(--text);background:var(--bg);position:sticky;top:0;z-index:20">
        <span style="font:600 13px/1 var(--font);letter-spacing:.16em;text-transform:uppercase">SAC <span style="color:var(--a700)">2.0</span></span>
        <span style="width:1px;height:20px;background:var(--div)"></span>
        <span style="font:400 13px/1 var(--font);color:var(--n700)">${esc(cfg.nombreInstitucion)}</span>
        <span style="width:1px;height:20px;background:var(--div)"></span>
        <span style="font:400 13px/1 var(--font);color:var(--n700)">${esSuper?'Todas las sucursales':esc(u.sucursal)}</span>
        <span style="flex:1"></span>
        <span style="font:400 13px/1.3 var(--font);text-align:right">${esc(u.nombre)}<br><span style="color:var(--n700);font-size:12px">${ROL_NOMBRE[u.rol]}</span></span>
        <button class="btn btn-s" data-action="logout" style="padding:6px 12px;font-size:13px">Salir</button>
      </div>
      <div style="display:grid;grid-template-columns:212px minmax(0,1fr);align-items:start">
        <nav class="no-print" style="padding:22px 14px;position:sticky;top:46px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--div);min-height:calc(100vh - 46px)">
          ${nav.map(n=>`<button data-action="nav" data-vista="${n[0]}" style="text-align:left;border:0;${st.vista===n[0]?'background:var(--a100);color:var(--a800);font:600 14px/1.3 var(--font);border-left:3px solid var(--accent)':'background:transparent;color:var(--text);font:400 14px/1.3 var(--font);border-left:3px solid transparent'};padding:9px 11px;cursor:pointer;border-radius:0 3px 3px 0">${esc(n[1])}</button>`).join('')}
          <span style="flex:1"></span>
          <div style="font:400 11.5px/1.5 var(--font);color:var(--n600);padding:11px">Respaldo local<br>${st.solicitudes.length} solicitudes guardadas</div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-g" data-action="exportar" style="flex:1;padding:6px;font-size:12px">Exportar</button>
            <button class="btn btn-g" data-action="importar" style="flex:1;padding:6px;font-size:12px">Importar</button>
          </div>
        </nav>
        <main style="padding:30px 34px 70px;max-width:1320px">${content}</main>
      </div>
    </div>`;
  },

  renderTablero(){
    const st=this.state,u=st.sesion,cfg=st.config;
    const esSuper=u.rol==='superadmin',esGer=u.rol==='gerente';
    const visibles=st.solicitudes.filter(s=>{
      if(esSuper)return true;
      if(esGer)return s.sucursal===u.sucursal;
      return s.analistaId===u.usuario;
    });
    const evs=visibles.map(s=>({s,e:this.evaluar(s)}));
    const aprob=evs.filter(x=>x.s.estado==='APROBADA');
    const montoAprob=aprob.reduce((a,x)=>a+num(x.s.datos.monto),0);
    const prom=evs.length?evs.reduce((a,x)=>a+x.e.global,0)/evs.length:0;

    return `
    <h1 style="margin:0 0 4px">Tablero de cartera</h1>
    <p style="font:400 15px/1.5 var(--font);color:var(--n700);margin:0 0 34px">${esSuper?'Vista consolidada de todas las sucursales.':esGer?'Solicitudes de '+esc(u.sucursal)+'.':'Sus solicitudes como analista de crédito.'}</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:30px;margin-bottom:44px">
      <div><div style="font:400 11.5px/1.4 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--n600);margin-bottom:7px">En análisis</div><div style="font:600 33px/1 var(--fonth)">${evs.filter(x=>['BORRADOR','ENVIADA','ESCALADA'].includes(x.s.estado)).length}</div></div>
      <div><div style="font:400 11.5px/1.4 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--n600);margin-bottom:7px">Aprobadas</div><div style="font:600 33px/1 var(--fonth)">${aprob.length}</div><div style="font:400 12.5px/1.4 var(--font);color:var(--n700);margin-top:4px">${mx(montoAprob)} colocados</div></div>
      <div><div style="font:400 11.5px/1.4 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--n600);margin-bottom:7px">Rechazadas</div><div style="font:600 33px/1 var(--fonth)">${evs.filter(x=>x.s.estado==='RECHAZADA').length}</div></div>
      <div><div style="font:400 11.5px/1.4 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--n600);margin-bottom:7px">Score promedio</div><div style="font:600 33px/1 var(--fonth)">${prom.toFixed(1)}</div></div>
    </div>
    <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:14px">
      <h2 style="margin:0">Solicitudes</h2><span style="flex:1"></span>
      <button class="btn btn-p" data-action="nuevaSolicitud">Nueva solicitud</button>
    </div>
    <div style="overflow-x:auto">
    <table class="table" style="min-width:760px">
      <thead><tr><th>Folio</th><th>Solicitante</th><th>Sucursal</th><th style="text-align:right">Monto</th><th style="text-align:right">Score</th><th>Riesgo 5C</th><th>Estado</th><th>Analista</th><th></th></tr></thead>
      <tbody>${evs.map(x=>`<tr>
        <td style="font-variant-numeric:tabular-nums">${esc(x.s.folio)}</td>
        <td>${esc(x.s.datos.nombre||'(sin nombre)')}</td>
        <td style="color:var(--n700)">${esc(x.s.sucursal)}</td>
        <td style="text-align:right;font-variant-numeric:tabular-nums">${mx(x.s.datos.monto)}</td>
        <td style="text-align:right;font-variant-numeric:tabular-nums;font-weight:600">${x.e.global.toFixed(1)}</td>
        <td>${esc(x.e.banda)}</td>
        <td><span class="tag tag-o">${esc(x.s.estado)}</span></td>
        <td style="color:var(--n700)">${esc(x.s.analista)}</td>
        <td style="text-align:right"><button class="btn btn-g" data-action="abrirSolicitud" data-id="${x.s.id}" style="padding:4px 9px;font-size:13px">Abrir</button></td>
      </tr>`).join('')}</tbody>
    </table></div>
    ${evs.length===0?'<p style="font:400 15px/1.5 var(--font);color:var(--n700);margin:26px 0 0">No hay solicitudes en su alcance. Cree la primera con «Nueva solicitud».</p>':''}`;
  },

  renderSolicitud(){
    const st=this.state,s=this.actual(),E=this.evaluar(s),cfg=st.config;
    const allTabs=[['datos','Datos'],['caracter','Carácter'],['capacidad','Capacidad'],['capital','Capital'],['condiciones','Condiciones'],['colateral','Colateral'],['flujo','Flujo de efectivo'],['canvas','CANVAS'],['dictamen','Dictamen']];
    const tabs=E.tieneNegocio?allTabs:allTabs.filter(t=>t[0]!=='canvas');
    const activeTab=(!E.tieneNegocio&&st.tab==='canvas')?'datos':st.tab;

    let tabContent='';
    if(activeTab==='datos')tabContent=this.renderTabDatos(s,E);
    else if(activeTab==='caracter')tabContent=this.renderTabCaracter(s,E);
    else if(activeTab==='capacidad')tabContent=this.renderTabCapacidad(s,E);
    else if(activeTab==='capital')tabContent=this.renderTabCapital(s,E);
    else if(activeTab==='condiciones')tabContent=this.renderTabCondiciones(s,E);
    else if(activeTab==='colateral')tabContent=this.renderTabColateral(s,E);
    else if(activeTab==='flujo')tabContent=this.renderTabFlujo(s,E);
    else if(activeTab==='canvas')tabContent=this.renderTabCanvas(s,E);
    else if(activeTab==='dictamen')tabContent=this.renderTabDictamen(s,E);

    const sidebar=`<aside style="flex:1 1 270px;min-width:0">
      <div style="border-top:3px solid var(--text);padding-top:12px">
        <div style="font:400 11.5px/1.4 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--n600);margin-bottom:12px">Desglose del score</div>
        ${[
          {l:'Carácter',p:pct(this.state.params.bloques.caracter),v:pct(E.caracter)},
          {l:'Capacidad de pago',p:pct(this.state.params.bloques.capacidad),v:pct(E.capacidad)},
          {l:'Capital',p:pct(this.state.params.bloques.capital),v:pct(E.capital)},
          {l:'Condiciones',p:pct(this.state.params.bloques.condiciones),v:pct(E.condiciones)},
          {l:'Colateral',p:pct(this.state.params.bloques.colateral),v:pct(E.colateral)},
          {l:'Subtotal 5C',p:pct(E.pesos.cincoC),v:pct(E.score5c)},
          {l:'Flujo de efectivo',p:pct(E.pesos.flujo),v:pct(E.scoreFlujo)}
        ].concat(E.tieneNegocio?[{l:'Modelo CANVAS',p:pct(E.pesos.canvas),v:pct(E.scoreCanvas)}]:[]).map(b=>`<div style="display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid var(--div)">
          <span style="font:400 13.5px/1.3 var(--font)">${b.l}</span><span style="flex:1"></span>
          <span style="font:400 12px/1.3 var(--font);color:var(--n600)">${b.p}</span>
          <span style="font:600 14px/1.3 var(--fonth);font-variant-numeric:tabular-nums;min-width:52px;text-align:right">${b.v}</span>
        </div>`).join('')}
        <div style="display:flex;align-items:baseline;gap:10px;padding:10px 0 0">
          <span style="font:600 15px/1.3 var(--fonth)">Score global</span><span style="flex:1"></span>
          <span style="font:600 22px/1 var(--fonth);font-variant-numeric:tabular-nums">${E.global.toFixed(1)}</span>
        </div>
        ${E.bonusDiscapacidad||E.bonusGenero?`<div style="margin-top:8px;font:400 12px/1.4 var(--font);color:var(--a700)">Bonificaciones: ${E.bonusDiscapacidad?'Discapacidad +7':''}${E.bonusDiscapacidad&&E.bonusGenero?' · ':''}${E.bonusGenero?'Género/sostén +'+E.bonusGenero:''}</div>`:''}
      </div>
      ${E.vetos.length?`<div style="margin-top:22px;border-top:3px solid var(--accent2);padding-top:12px">
        <div style="font:400 11.5px/1.4 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--a2700);margin-bottom:8px">Causales de rechazo</div>
        ${E.vetos.map(v=>`<div style="font:400 13px/1.45 var(--font);padding:5px 0;border-bottom:1px solid var(--div)">${esc(v)}</div>`).join('')}
      </div>`:''}
      <div style="margin-top:22px;display:flex;flex-direction:column;gap:7px">
        <button class="btn btn-s" data-action="guardar">Guardar avance</button>
        <button class="btn btn-g" data-action="irDictamen">Ir al dictamen</button>
      </div>
    </aside>`;

    return `
    <div style="display:flex;align-items:flex-start;gap:20px;margin-bottom:6px">
      <div>
        <div style="font:400 11.5px/1.4 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--n600)">Folio ${esc(s.folio)} · ${esc(s.estado)}</div>
        <h1 style="margin:4px 0 0">${esc(s.datos.nombre||'Solicitante sin nombre')}</h1>
      </div>
      <span style="flex:1"></span>
      <div style="text-align:right">
        <div style="font:400 11.5px/1.4 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--n600)">Score global</div>
        <div style="font:600 46px/1 var(--fonth)">${E.global.toFixed(1)}</div>
        <div style="font:400 13px/1.3 var(--font);color:var(--n700)">${E.vetos.length?'No autorizable':E.dictamen==='APROBADO'?'Viable':E.dictamen==='CONDICIONADO'?'Viable con condiciones':'Debajo del mínimo'}</div>
      </div>
    </div>
    <div class="no-print" style="display:flex;flex-wrap:wrap;gap:3px;border-bottom:1px solid var(--text);margin:24px 0 26px">
      ${tabs.map(t=>`<button data-action="tab" data-tab="${t[0]}" style="border:0;${activeTab===t[0]?'background:var(--text);color:var(--bg);font:600 13.5px/1 var(--font)':'background:transparent;color:var(--n800);font:400 13.5px/1 var(--font)'};padding:10px 13px;cursor:pointer">${t[1]}${t[0]==='flujo'&&E.flujoRequerido?'<span style="color:var(--accent2);margin-left:3px" title="Flujo requerido">●</span>':''}</button>`).join('')}
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start">
      <div style="flex:1 1 440px;min-width:0">${tabContent}</div>
      ${activeTab!=='flujo'&&activeTab!=='canvas'?sidebar:''}
    </div>`;
  },

  renderField(label,hint,inputHtml,puntaje){
    return `<div style="display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--div)">
      <div style="flex:1 1 200px;min-width:0">
        <div style="font:400 15px/1.35 var(--font)">${label}</div>
        ${hint?`<div style="font:400 12.5px/1.45 var(--font);color:var(--n700);margin-top:3px">${hint}</div>`:''}
      </div>
      <div style="flex:2 1 240px;min-width:0">${inputHtml}</div>
      <div style="flex:0 0 46px;text-align:right;font:400 14px/1.5 var(--font);color:var(--n700)">${puntaje!=null?puntaje:''}</div>
    </div>`;
  },

  renderSection(titulo,meta,fields){
    return `<section style="margin-bottom:36px">
      <div style="display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--text);padding-bottom:6px;margin-bottom:4px">
        <h2 style="font:600 19px/1.2 var(--fonth);margin:0">${titulo}</h2><span style="flex:1"></span>
        <span style="font:400 12.5px/1 var(--font);color:var(--n700)">${meta}</span>
      </div>
      ${fields}
    </section>`;
  },

  renderRadio(name,options,selected,path){
    return `<div style="display:flex;flex-direction:column;gap:4px">
      ${options.map((o,i)=>`<label style="display:flex;gap:8px;align-items:flex-start;font:400 13.5px/1.4 var(--font);cursor:pointer">
        <input type="radio" name="${name}" ${selected===i?'checked':''} data-action="updRadio" data-path="${path}" data-val="${i}" style="margin:3px 0 0;accent-color:var(--accent)">
        <span>${esc(o[0])} · ${o[1]}</span>
      </label>`).join('')}
    </div>`;
  },

  renderTabDatos(s,E){
    const d=s.datos,cfg=this.state.config;
    const prodSel=d.producto?cfg.productos.find(p=>p.nombre===d.producto):null;
    const productoOpts=cfg.productos.map(p=>`<option value="${esc(p.nombre)}" ${d.producto===p.nombre?'selected':''}>${esc(p.nombre)} (hasta ${p.plazoMax} meses, ${p.tasaAnual}%)</option>`).join('');

    return this.renderSection('Solicitante',s.sucursal+' · '+s.analista,
      this.renderField('Nombre del solicitante','Como aparece en su identificación',`<input class="input" type="text" value="${esc(d.nombre)}" data-action="updText" data-path="datos.nombre">`)+
      this.renderField('Número de socio','Formato 001-000000',`<input class="input" type="text" value="${esc(d.socio)}" data-action="updText" data-path="datos.socio">`)+
      this.renderField('Género','',`<select class="input" data-action="updText" data-path="datos.genero">
        <option value="" ${!d.genero?'selected':''}>Seleccione...</option>
        <option value="mujer" ${d.genero==='mujer'?'selected':''}>Mujer</option>
        <option value="hombre" ${d.genero==='hombre'?'selected':''}>Hombre</option>
      </select>`)+
      this.renderField('¿Es el(la) único(a) que sostiene a su familia?','Mujer única sostén: +10 pts · Hombre único sostén: +5 pts',`<select class="input" data-action="updBool" data-path="datos.esUnicoSosten">
        <option value="false" ${!d.esUnicoSosten?'selected':''}>No</option>
        <option value="true" ${d.esUnicoSosten?'selected':''}>Sí</option>
      </select>`,E.bonusGenero)+
      this.renderField('¿Tiene alguna discapacidad?','Bonificación de +7 puntos al score de carácter',`<select class="input" data-action="updBool" data-path="datos.tieneDiscapacidad">
        <option value="false" ${!d.tieneDiscapacidad?'selected':''}>No</option>
        <option value="true" ${d.tieneDiscapacidad?'selected':''}>Sí</option>
      </select>`,E.bonusDiscapacidad)+
      this.renderField('Ocupación','Actividad principal del solicitante',`<select class="input" data-action="updText" data-path="datos.ocupacion">
        ${(cfg.ocupaciones||OCUPACIONES_DEFAULT).map(o=>`<option value="${o[0]}" ${d.ocupacion===o[0]?'selected':''}>${o[1]}</option>`).join('')}
      </select>`)+
      this.renderField('Clasificación IFRS9','Tipo de crédito según las Normas Internacionales de Información Financiera',`<select class="input" data-action="updText" data-path="datos.clasificacionIFRS9">
        <option value="" ${!d.clasificacionIFRS9?'selected':''}>Seleccione...</option>
        ${CLASIFICACION_IFRS9.map(c2=>`<option value="${c2[0]}" ${d.clasificacionIFRS9===c2[0]?'selected':''}>${c2[1]}</option>`).join('')}
      </select>`)+
      this.renderField('¿Es su primer empleo?','Si es su primer empleo se desactivará el arraigo laboral',`<select class="input" data-action="updBool" data-path="datos.esPrimerEmpleo">
        <option value="false" ${!d.esPrimerEmpleo?'selected':''}>No</option>
        <option value="true" ${d.esPrimerEmpleo?'selected':''}>Sí</option>
      </select>`)+
      this.renderField('Destino del crédito','Capital de trabajo, activo fijo, ciclo agrícola...',`<input class="input" type="text" value="${esc(d.destino)}" data-action="updText" data-path="datos.destino">`)+
      this.renderField('Dependientes económicos','Se usa para el gasto familiar de referencia',`<input class="input" type="number" value="${d.dependientes}" data-action="updNum" data-path="datos.dependientes" min="0">`)
    )+
    this.renderSection('Producto y condiciones del crédito','Cuota mensual equivalente '+mx(E.pl.cuotaMensual),
      this.renderField('Producto de crédito','Seleccione del catálogo de productos configurado',`<select class="input" data-action="updText" data-path="datos.producto">
        <option value="">Seleccione un producto...</option>${productoOpts}
      </select>`)+

  renderTabFlujo(s,E){
    const meses=E.flujo.mesesFlujo;
    const colLabel=m=>MESES[m%12].slice(0,3)+' A'+(Math.floor(m/12)+1);
    const mkRow=(key,label)=>{
      const arr=s.flujo[key]||[];
      let cells='';
      for(let m=0;m<meses;m++)cells+=`<td><input type="number" value="${arr[m]||0}" data-action="updFlujo" data-key="${key}" data-mes="${m}" step="any"></td>`;
      return `<tr><td style="position:sticky;left:0;background:var(--bg);padding:5px 10px;font:400 12.5px/1.3 var(--font);white-space:nowrap;z-index:1">${label}</td>${cells}</tr>`;
    };
    const totRow=(label,arr)=>`<tr><td style="position:sticky;left:0;background:var(--n200);padding:6px 10px;font:600 12.5px/1.3 var(--font);white-space:nowrap;z-index:1">${label}</td>${arr.slice(0,meses).map(x=>`<td style="background:var(--n200);padding:6px;font:600 12px/1.2 var(--font);text-align:right;white-space:nowrap">${mx(x)}</td>`).join('')}</tr>`;
    const headerRow=(label)=>`<tr><td colspan="${meses+1}" style="background:var(--a100);padding:6px 10px;font:600 11.5px/1.2 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--a800)">${label}</td></tr>`;

    let cols='';
    for(let m=0;m<meses;m++)cols+=`<th style="background:var(--n200);padding:7px 6px;font:600 11px/1.2 var(--font);white-space:nowrap">${colLabel(m)}</th>`;
    let mesesOpts='';
    for(let m=0;m<meses;m++)mesesOpts+=`<option value="${m}" ${num(s.flujoMesPago)===m?'selected':''}>${MESES[m%12]} — año ${Math.floor(m/12)+1}</option>`;

    const esAnualOUnico=['anual','pago_unico','pago_unico_periodico'].includes(s.datos.periodicidad);
    return `
    ${E.flujoRequerido?'<div style="background:var(--a2100);border:1px solid var(--accent2);padding:10px 14px;margin-bottom:16px;border-radius:3px;font:400 13px/1.5 var(--font);color:var(--a2800)"><strong>Flujo de efectivo requerido:</strong> El solicitante tiene ingresos o gastos variables en el año, o su plan de pagos es anual / pago único. Complete el flujo mensual para una evaluación precisa.</div>':''}

  renderTabCanvas(s,E){

    return `<div class="canvas-cell" style="${style}">

  },

  renderFlujoImprimible(s,E){
    const meses=E.flujo.mesesFlujo;
    const colLabel=m=>MESES[m%12].slice(0,3)+(meses>12?' A'+(Math.floor(m/12)+1):'');
    const cfg=this.state.config;
    let cols='';for(let m=0;m<meses;m++)cols+='<th style="border:1px solid #999;padding:2px 3px;font:700 7px/1.1 Arial,sans-serif;white-space:nowrap;background:#eee">'+colLabel(m)+'</th>';
    const mkRow=(key,label)=>{const arr=s.flujo[key]||[];let cells='';for(let m=0;m<meses;m++)cells+='<td style="border:1px solid #ddd;padding:1px 3px;text-align:right;font-size:7.5px">'+(arr[m]?mx(arr[m]):'—')+'</td>';return '<tr><td style="border:1px solid #999;padding:2px 4px;font-size:8px;white-space:nowrap;background:#f8f8f8">'+label+'</td>'+cells+'</tr>'};
    const totRow=(label,arr)=>'<tr><td style="border:1px solid #999;padding:2px 4px;font:700 8px/1.1 Arial,sans-serif;white-space:nowrap;background:#e0e0e0">'+label+'</td>'+arr.slice(0,meses).map(x=>'<td style="border:1px solid #999;padding:1px 3px;text-align:right;font:700 7.5px/1.1 Arial,sans-serif;background:#e0e0e0">'+mx(x)+'</td>').join('')+'</tr>';
    return `<div style="font:400 9px/1.2 Arial,sans-serif;color:#000;padding:8px 10px">
      <div style="text-align:center;margin-bottom:6px"><div style="font:700 12px/1.2 Arial,sans-serif">${esc(cfg.nombreInstitucion)}</div><div style="font:700 10px/1.2 Arial,sans-serif">FLUJO DE EFECTIVO — ${esc(s.datos.nombre||'—')} · Folio ${esc(s.folio)}</div></div>
      <table style="width:100%;border-collapse:collapse"><thead><tr><th style="border:1px solid #999;padding:2px 4px;text-align:left;font:700 8px/1.1 Arial,sans-serif;background:#eee;min-width:120px">Concepto</th>${cols}</tr></thead><tbody>
        ${FILAS_ING.map(f=>mkRow(f[0],f[1])).join('')}
        ${totRow('Total ingresos',E.flujo.ing)}
        ${FILAS_EGR.map(f=>mkRow(f[0],f[1])).join('')}
        ${totRow('Total egresos',E.flujo.egr)}
        ${totRow('Resultado',E.flujo.res)}
        ${totRow('Acumulado',E.flujo.acum)}
      </tbody></table>
      <div style="margin-top:6px;font:400 8px/1.3 Arial,sans-serif;color:#666">Egresos/Ingresos: ${pct(E.flujo.ratio)} · Cobertura mes pago: ${pct(E.flujo.cobertura)} · Meses negativos: ${E.flujo.mesesNeg} · Score flujo: ${pct(E.scoreFlujo)} · ${new Date().toLocaleString('es-MX')}</div>
    </div>`;
  },

      <div style="text-align:center;margin-bottom:6px"><div style="font:700 12px/1.2 Arial,sans-serif">${esc(cfg.nombreInstitucion)}</div><div style="font:700 10px/1.2 Arial,sans-serif">MODELO CANVAS — ${esc(s.datos.nombre||'—')} · Folio ${esc(s.folio)}</div></div>

  renderParams(){

      <input class="input" type="number" value="${value}" data-action="updParam" data-path="${path}" step="any" ${dis} style="text-align:right">

    return `
    <h1 style="margin:0 0 4px">Parámetros del modelo</h1>

        <div style="border-bottom:2px solid var(--text);padding-bottom:6px"><h2 style="margin:0">Semáforo del dictamen</h2></div>

      <button class="btn btn-s" data-action="resetParams">Restaurar valores originales</button>

  bind(){
    const app=document.getElementById('app');
    app.onclick=e=>{
      const btn=e.target.closest('[data-action]');
      if(!btn)return;
      const tag=btn.tagName;
      if(tag==='SELECT'||tag==='TEXTAREA'||(tag==='INPUT'&&btn.type!=='radio'))return;
      this.handleAction(btn.dataset.action,btn,e);
    };
    app.oninput=e=>{
      const el=e.target.closest('[data-action]');
      if(!el)return;
      const a=el.dataset.action;
      if(a==='updText')this.upd(el.dataset.path,el.value);
      else if(a==='updNum'){
        let v=num(el.value);
        if(el.dataset.path==='datos.tasaPct'||el.dataset.path==='datos.plazo'){
          const sol=this.actual();
          if(sol&&sol.datos.producto){
            const pr=this.state.config.productos.find(p=>p.nombre===sol.datos.producto);
            if(pr){
              if(el.dataset.path==='datos.tasaPct'&&v>pr.tasaAnual){v=pr.tasaAnual;el.value=v}
              if(el.dataset.path==='datos.plazo'&&v>pr.plazoMax){v=pr.plazoMax;el.value=v}
            }
          }
        }
        this.upd(el.dataset.path,v);
      }
      else if(a==='updFlujo'){const s=this.actual();if(!s)return;const arr=(s.flujo[el.dataset.key]||[]).slice();arr[parseInt(el.dataset.mes)]=num(el.value);this.upd('flujo.'+el.dataset.key,arr)}
      else if(a==='updCanvasNota')this.upd('canvas.'+el.dataset.key+'.nota',el.value);
      else if(a==='updActivoFijo'){const sol=this.actual();if(!sol)return;const af=JSON.parse(JSON.stringify(sol.capital.activosFijos||{}));if(!af[el.dataset.key])af[el.dataset.key]={monto:0,comprobante:'ninguno'};if(el.dataset.prop==='monto')af[el.dataset.key].monto=num(el.value);else af[el.dataset.key].comprobante=el.value;this.upd('capital.activosFijos',af)}
      else if(a==='updNivelPlazo'){const cfg=JSON.parse(JSON.stringify(this.state.config));cfg.nivelesOperacion[parseInt(el.dataset.idx)].plazoMax=num(el.value);this.state.config=cfg;this.persist()}
      else if(a==='updParam'){const p=JSON.parse(JSON.stringify(this.state.params));const parts=el.dataset.path.split('.');let ref=p;for(let i=0;i<parts.length-1;i++)ref=ref[parts[i]];ref[parts[parts.length-1]]=num(el.value);this.state.params=p}
      else return;
      this._scheduleRender();
    };
    app.onchange=e=>{
      const el=e.target.closest('[data-action]');
      if(!el||el.tagName!=='SELECT')return;
      const a=el.dataset.action;
      if(a==='updText'){
        this.upd(el.dataset.path,el.value);
        if(el.dataset.path==='datos.producto'){
          const sol=this.actual();
          if(sol&&el.value){
            const pr=this.state.config.productos.find(p=>p.nombre===el.value);
            if(pr){
              if(num(sol.datos.tasaPct)>pr.tasaAnual)this.upd('datos.tasaPct',pr.tasaAnual);
              if(num(sol.datos.plazo)>pr.plazoMax)this.upd('datos.plazo',pr.plazoMax);
            }
          }
        }
      }
      else if(a==='updNum')this.upd(el.dataset.path,num(el.value));
      else if(a==='updBool')this.upd(el.dataset.path,el.value==='true');
      else if(a==='updFlujoProp')this.upd(el.dataset.prop,num(el.value));
      else if(a==='updActivoFijo'){const sol=this.actual();if(sol){const af=JSON.parse(JSON.stringify(sol.capital.activosFijos||{}));if(!af[el.dataset.key])af[el.dataset.key]={monto:0,comprobante:'ninguno'};af[el.dataset.key].comprobante=el.value;this.upd('capital.activosFijos',af)}}
      this.render();
    };
  },

  handleAction(action,el,e){
    const st=this.state;
    switch(action){
      case 'login':{
        const user=document.getElementById('loginUser')?.value?.trim();
        const pass=document.getElementById('loginPass')?.value;
        const f=st.users.find(x=>x.usuario===user&&x.pass===pass);
        if(!f){this.set({loginErr:'Usuario o contraseña incorrectos.'});return}
        this.set({sesion:f,loginErr:'',loginPass:'',vista:'tablero'});
        this.log('Inicio de sesión',f.sucursal);
        break;
      }
      case 'demoPick':
        this.set({loginUser:el.dataset.user,loginPass:el.dataset.pass,loginErr:''});
        break;
      case 'logout':
        this.log('Cierre de sesión','');
        this.set({sesion:null,loginUser:'',loginPass:'',idActual:null,vista:'tablero'});
        break;
      case 'nav':
        this.set({vista:el.dataset.vista,avisoAccion:''});
        break;
      case 'tab':
        this.set({tab:el.dataset.tab,avisoAccion:''});
        break;
      case 'configTab':
        this.set({configTab:el.dataset.tab});
        break;
      case 'nuevaSolicitud':{
        const folio=(st.config.nombreInstitucion.substring(0,3).toUpperCase()||'SAC')+'-'+st.folioSeq;
        const s=nuevaSolicitud(folio,st.sesion);
        const lista=[s,...st.solicitudes];
        this.state.solicitudes=lista;this.state.folioSeq=st.folioSeq+1;
        this.persist();this.log('Nueva solicitud',folio);
        this.set({idActual:s.id,vista:'solicitud',tab:'datos',comentario:'',firma:'',esc:null});
        break;
      }
      case 'abrirSolicitud':
        this.set({idActual:el.dataset.id,vista:'solicitud',tab:'datos',comentario:'',firma:'',avisoAccion:'',esc:null});
        break;
      case 'updText':this.upd(el.dataset.path,el.value);break;
      case 'updNum':this.upd(el.dataset.path,num(el.value));break;
      case 'updBool':this.upd(el.dataset.path,el.value==='true');break;
      case 'updRadio':this.upd(el.dataset.path,parseInt(el.dataset.val));this.render();break;
      case 'updFlujo':{
        const s=this.actual();if(!s)return;
        const arr=(s.flujo[el.dataset.key]||[]).slice();
        arr[parseInt(el.dataset.mes)]=num(el.value);
        this.upd('flujo.'+el.dataset.key,arr);
        break;
      }
      case 'updFlujoProp':this.upd(el.dataset.prop,num(el.value));break;
      case 'updCanvasP':{
        this.upd('canvas.'+el.dataset.key+'.p',parseInt(el.dataset.val));this.render();break;
      }
      case 'updCanvasNota':this.upd('canvas.'+el.dataset.key+'.nota',el.value);break;
      case 'updParam':{
        const p=JSON.parse(JSON.stringify(st.params));
        const parts=el.dataset.path.split('.');
        let ref=p;for(let i=0;i<parts.length-1;i++)ref=ref[parts[i]];
        ref[parts[parts.length-1]]=num(el.value);
        this.set({params:p});
        break;
      }
      case 'guardar':this.persist();this.log('Avance guardado',this.actual()?.folio);this.render();break;
      case 'irDictamen':this.set({tab:'dictamen'});break;
      case 'guardarParams':this.persist();this.log('Parámetros modificados','');break;
      case 'resetParams':this.state.params=defaultParams();this.persist();this.log('Parámetros restaurados','');this.render();break;
      case 'resolver':{
        const comentario=document.getElementById('comentarioDictamen')?.value||'';
        const firma=document.getElementById('firmaDictamen')?.value||'';
        if(!comentario.trim()||!firma.trim()){this.set({avisoAccion:'El dictamen del analista y la firma electrónica son obligatorios.'});return}
        const s=this.actual();const E=this.evaluar(s);const u=st.sesion;
        const estado=el.dataset.estado;const etiqueta=el.dataset.etiqueta;
        this.state.solicitudes=st.solicitudes.map(x=>{
          if(x.id!==s.id)return x;
          const c=JSON.parse(JSON.stringify(x));
          c.estado=estado;
          c.resolucion={estado,por:u.nombre,rol:ROL_NOMBRE[u.rol],comentario,firma,ts:Date.now(),score:E.global,banda:E.banda};
          c.bitacora=(c.bitacora||[]).concat([{ts:Date.now(),accion:etiqueta+' — score '+E.global.toFixed(1),quien:u.nombre}]);
          return c;
        });
        this.persist();this.log(etiqueta,s.folio+' · '+mx(s.datos.monto));
        this.set({comentario:'',firma:'',avisoAccion:''});
        break;
      }
      case 'imprimir':window.print();break;
      case 'imprimirDictamen':{
        const sol=this.actual();if(!sol)break;
        const ev=this.evaluar(sol);
        let area=document.getElementById('print-area');
        if(!area){area=document.createElement('div');area.id='print-area';document.body.appendChild(area)}
        area.innerHTML=this.renderDictamenImprimible(sol,ev);
        document.body.classList.add('printing');
        setTimeout(()=>{window.print();document.body.classList.remove('printing')},100);
        break;
      }
      case 'imprimirFlujo':{
        const sol=this.actual();if(!sol)break;
        const ev=this.evaluar(sol);
        let area=document.getElementById('print-area');
        if(!area){area=document.createElement('div');area.id='print-area';document.body.appendChild(area)}
        area.innerHTML=this.renderFlujoImprimible(sol,ev);
        document.body.classList.add('printing');
        setTimeout(()=>{window.print();document.body.classList.remove('printing')},100);
        break;
      }
      case 'imprimirCanvas':{
        const sol=this.actual();if(!sol)break;
        const ev=this.evaluar(sol);
        let area=document.getElementById('print-area');
        if(!area){area=document.createElement('div');area.id='print-area';document.body.appendChild(area)}
        area.innerHTML=this.renderCanvasImprimible(sol,ev);
        document.body.classList.add('printing');
        setTimeout(()=>{window.print();document.body.classList.remove('printing')},100);
        break;
      }
      case 'autoPopularFlujo':{
        const sol=this.actual();if(!sol)break;
        const pl=this.plan(sol.datos);
        const per=sol.datos.periodicidad;
        const mesesFlujo=Math.max(1,num(sol.flujoAnios))*12;
        const prestamoArr=(sol.flujo.prestamoInst||[]).slice();
        const pagoArr=(sol.flujo.pagoInst||[]).slice();
        while(prestamoArr.length<36)prestamoArr.push(0);
        while(pagoArr.length<36)pagoArr.push(0);
        prestamoArr[0]=num(sol.datos.monto);
        if(per==='anual'){
          const mesPago=Math.min(mesesFlujo-1,Math.max(0,num(sol.flujoMesPago)));
          pagoArr[mesPago]=Math.round(pl.cuotaIva);
        }else if(per==='pago_unico'){
          const mesFin=Math.min(mesesFlujo-1,Math.max(0,num(sol.datos.plazo)-1));
          pagoArr[mesFin]=Math.round(pl.total);
        }else if(per==='pago_unico_periodico'){
          const intMensual=num(sol.datos.monto)*(num(sol.datos.tasaPct)/100/12);
          const ivaInt=intMensual*this.state.params.u.ivaInteres;
          for(let m=0;m<mesesFlujo;m++)pagoArr[m]=Math.round(intMensual+ivaInt);
          const mesFin=Math.min(mesesFlujo-1,Math.max(0,num(sol.datos.plazo)-1));
          pagoArr[mesFin]=Math.round(num(sol.datos.monto)+intMensual+ivaInt);
        }
        this.upd('flujo.prestamoInst',prestamoArr);
        this.upd('flujo.pagoInst',pagoArr);
        this.render();
        break;
      }
      case 'guardarNombreInst':{
        const val=document.getElementById('cfgNombreInst')?.value?.trim();
        if(val){
          const cfg=Object.assign({},st.config,{nombreInstitucion:val});
          this.state.config=cfg;this.persist();this.log('Nombre de institución cambiado',val);this.render();
        }break;
      }
      case 'agregarProducto':{
        const nombre=document.getElementById('nuevoProductoNombre')?.value?.trim();
        const plazo=num(document.getElementById('nuevoProductoPlazo')?.value);
        const tasa=num(document.getElementById('nuevoProductoTasa')?.value);
        if(!nombre)return;
        const cfg=JSON.parse(JSON.stringify(st.config));
        cfg.productos.push({nombre,plazoMax:plazo,tasaAnual:tasa});
        this.state.config=cfg;this.persist();this.log('Producto agregado',nombre);
        this.set({nuevoProducto:{nombre:'',plazoMax:24,tasaAnual:18}});
        break;
      }
      case 'borrarProducto':{
        const cfg=JSON.parse(JSON.stringify(st.config));
        cfg.productos.splice(parseInt(el.dataset.idx),1);
        this.state.config=cfg;this.persist();this.log('Producto eliminado','');this.render();
        break;
      }
      case 'agregarNivel':{
        const nombre=document.getElementById('nuevoNivelNombre')?.value?.trim();
        const plazo=num(document.getElementById('nuevoNivelPlazo')?.value);
        if(!nombre)return;
        const cfg=JSON.parse(JSON.stringify(st.config));
        cfg.nivelesOperacion.push({nombre,plazoMax:plazo});
        this.state.config=cfg;this.persist();this.log('Nivel de operación agregado',nombre);
        this.set({nuevoNivel:{nombre:'',plazoMax:24}});
        break;
      }
      case 'borrarNivel':{
        const cfg=JSON.parse(JSON.stringify(st.config));
        cfg.nivelesOperacion.splice(parseInt(el.dataset.idx),1);
        this.state.config=cfg;this.persist();this.log('Nivel eliminado','');this.render();
        break;
      }
      case 'updNivelPlazo':{
        const cfg=JSON.parse(JSON.stringify(st.config));
        cfg.nivelesOperacion[parseInt(el.dataset.idx)].plazoMax=num(el.value);
        this.state.config=cfg;this.persist();
        break;
      }
      case 'updActivoFijo':{
        const sol=this.actual();if(!sol)return;
        const af=JSON.parse(JSON.stringify(sol.capital.activosFijos||{}));
        if(!af[el.dataset.key])af[el.dataset.key]={monto:0,comprobante:'ninguno'};
        if(el.dataset.prop==='monto')af[el.dataset.key].monto=num(el.value);
        else af[el.dataset.key].comprobante=el.value;
        this.upd('capital.activosFijos',af);
        this.render();break;
      }
      case 'agregarOcupacion':{
        const clave=document.getElementById('nuevaOcupacionClave')?.value?.trim().replace(/\s+/g,'_');
        const nombre=document.getElementById('nuevaOcupacionNombre')?.value?.trim();
        if(!clave||!nombre)return;
        const cfg=JSON.parse(JSON.stringify(st.config));
        if(!cfg.ocupaciones)cfg.ocupaciones=[...OCUPACIONES_DEFAULT];
        cfg.ocupaciones.push([clave,nombre]);
        this.state.config=cfg;this.persist();this.log('Ocupación agregada',nombre);this.render();
        break;
      }
      case 'borrarOcupacion':{
        const cfg=JSON.parse(JSON.stringify(st.config));
        if(!cfg.ocupaciones)cfg.ocupaciones=[...OCUPACIONES_DEFAULT];
        cfg.ocupaciones.splice(parseInt(el.dataset.idx),1);
        this.state.config=cfg;this.persist();this.log('Ocupación eliminada','');this.render();
        break;
      }
      case 'resetOcupaciones':{
        const cfg=JSON.parse(JSON.stringify(st.config));
        cfg.ocupaciones=[...OCUPACIONES_DEFAULT];
        this.state.config=cfg;this.persist();this.log('Catálogo de ocupaciones restaurado','');this.render();
        break;
      }
      case 'altaUsuario':{
        const usuario=document.getElementById('nuUsuario')?.value?.trim();
        const nombre=document.getElementById('nuNombre')?.value?.trim();
        const pass=document.getElementById('nuPass')?.value;
        const rol=document.getElementById('nuRol')?.value;
        const sucursal=document.getElementById('nuSucursal')?.value;
        const tope=num(document.getElementById('nuTope')?.value);
        if(!usuario||!nombre||!pass){this.set({avisoUsuarios:'Usuario, nombre y contraseña son obligatorios.'});return}
        if(st.users.some(u=>u.usuario===usuario)){this.set({avisoUsuarios:'Ese nombre de usuario ya existe.'});return}
        const lista=[...st.users,{usuario,nombre,pass,rol,sucursal,tope}];
        this.state.users=lista;this.persist();this.log('Usuario dado de alta',usuario+' — '+ROL_NOMBRE[rol]);
        this.set({avisoUsuarios:''});
        break;
      }
      case 'borrarUsuario':{
        if(el.dataset.user===st.sesion.usuario){this.set({avisoUsuarios:'No puede quitar su propia cuenta.'});return}
        const lista=st.users.filter(u=>u.usuario!==el.dataset.user);
        this.state.users=lista;this.persist();this.log('Usuario dado de baja',el.dataset.user);
        this.set({avisoUsuarios:''});
        break;
      }
      case 'altaSucursal':{
        const n=document.getElementById('nuevaSucursal')?.value?.trim();
        if(!n)return;
        const lista=[...st.sucursales,n];
        this.state.sucursales=lista;this.persist();this.log('Sucursal creada',n);this.render();
        break;
      }
      case 'exportar':{
        const data={app:'SAC '+st.config.nombreInstitucion+' 2.0',exportado:new Date().toISOString(),users:st.users,sucursales:st.sucursales,params:st.params,config:st.config,solicitudes:st.solicitudes,auditoria:st.auditoria,folioSeq:st.folioSeq};
        const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
        const a=document.createElement('a');a.href=URL.createObjectURL(blob);
        a.download='respaldo-sac-'+new Date().toISOString().slice(0,10)+'.json';
        a.click();URL.revokeObjectURL(a.href);
        this.log('Respaldo exportado',st.solicitudes.length+' solicitudes');
        break;
      }
      case 'importar':{
        const inp=document.createElement('input');inp.type='file';inp.accept='.json';
        inp.onchange=()=>{
          const file=inp.files?.[0];if(!file)return;
          const fr=new FileReader();
          fr.onload=()=>{
            try{
              const d=JSON.parse(fr.result);
              const merged=(d.solicitudes||[]).concat(st.solicitudes.filter(x=>!(d.solicitudes||[]).some(y=>y.id===x.id)));
              Object.assign(this.state,{
                users:d.users||st.users,sucursales:d.sucursales||st.sucursales,
                params:Object.assign(defaultParams(),d.params||{}),config:Object.assign(defaultConfig(),d.config||{}),
                solicitudes:merged,auditoria:(d.auditoria||[]).concat(st.auditoria).slice(0,400),
                folioSeq:Math.max(d.folioSeq||1001,st.folioSeq)
              });
              this.persist();this.log('Respaldo importado',file.name);this.render();
            }catch(err){this.log('Error al importar',file.name)}
          };
          fr.readAsText(file);
        };
        inp.click();
        break;
      }
    }
  }
};

document.addEventListener('DOMContentLoaded',()=>APP.init());
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
