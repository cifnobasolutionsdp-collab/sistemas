<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SECI COSO ERM</title>
<meta name="description" content="Sistema de Evaluación de Control Interno con base en COSO ERM: evaluación de madurez, auditoría interna, contraloría de crédito, mesa de control y gestión de riesgos. Funciona sin conexión y guarda la información en el equipo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c5cab'/%3E%3Cpath d='M9 17l4 4 10-10' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --line: #dfe3e8;
  --line-strong: #c4cad3;
  --text: #14181f;
  --text-2: #4a5160;
  --text-3: #6b7280;
  --brand: #1c5cab;
  --brand-ink: #ffffff;
  --brand-soft: #e3edfa;
  --focus: #2a78d6;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --good: #0ca30c;
  --good-ink: #0b6e0b;
  --good-soft: #e3f4e3;
  --warn: #fab219;
  --warn-ink: #8a5a00;
  --warn-soft: #fdf1d6;
  --serious: #ec835a;
  --serious-ink: #a4441c;
  --serious-soft: #fbe6dc;
  --crit: #d03b3b;
  --crit-ink: #a52626;
  --crit-soft: #f9e0e0;
  --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #5598e7; --seq-4: #256abf; --seq-5: #104281;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --radius: 10px;
  --nav-w: 248px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121315;
    --surface: #1a1b1e;
    --surface-2: #212226;
    --line: #2e3036;
    --line-strong: #43464e;
    --text: #f2f3f5;
    --text-2: #c3c6cd;
    --text-3: #9499a3;
    --brand: #3987e5;
    --brand-ink: #ffffff;
    --brand-soft: #1b2b42;
    --focus: #6da7ec;
    --series-1: #3987e5;
    --series-2: #d95926;
    --good-ink: #5fd35f;
    --good-soft: #15301a;
    --warn-ink: #f6c453;
    --warn-soft: #3a2e10;
    --serious-ink: #f0a283;
    --serious-soft: #3d2418;
    --crit-ink: #f08a8a;
    --crit-soft: #3e1d1d;
    --seq-1: #184f95; --seq-2: #256abf; --seq-3: #3987e5; --seq-4: #6da7ec; --seq-5: #b7d3f6;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121315;
  --surface: #1a1b1e;
  --surface-2: #212226;
  --line: #2e3036;
  --line-strong: #43464e;
  --text: #f2f3f5;
  --text-2: #c3c6cd;
  --text-3: #9499a3;
  --brand: #3987e5;
  --brand-ink: #ffffff;
  --brand-soft: #1b2b42;
  --focus: #6da7ec;
  --series-1: #3987e5;
  --series-2: #d95926;
  --good-ink: #5fd35f;
  --good-soft: #15301a;
  --warn-ink: #f6c453;
  --warn-soft: #3a2e10;
  --serious-ink: #f0a283;
  --serious-soft: #3d2418;
  --crit-ink: #f08a8a;
  --crit-soft: #3e1d1d;
  --seq-1: #184f95; --seq-2: #256abf; --seq-3: #3987e5; --seq-4: #6da7ec; --seq-5: #b7d3f6;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0 0 .5rem; line-height: 1.25; }
h1 { font-size: 1.45rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 .75rem; }
a { color: var(--brand); }
small, .muted { color: var(--text-3); }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- layout ---------- */
.shell { display: grid; grid-template-columns: var(--nav-w) 1fr; min-height: 100vh; }
.nav {
  background: var(--surface); border-right: 1px solid var(--line);
  position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column;
}
.brand { display: flex; gap: .6rem; align-items: center; padding: 1rem 1rem .75rem; }
.brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--brand); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 20px; height: 20px; }
.brand b { display: block; font-size: .98rem; }
.brand span { font-size: .75rem; color: var(--text-3); }
.nav-group { padding: .35rem .6rem; }
.nav-group > div { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); padding: .5rem .5rem .25rem; }
.nav a {
  display: flex; align-items: center; gap: .55rem; padding: .45rem .6rem; border-radius: 7px;
  color: var(--text-2); text-decoration: none; font-weight: 500;
}
.nav a svg { width: 17px; height: 17px; flex: none; opacity: .8; }
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a.active { background: var(--brand-soft); color: var(--brand); }
.nav-foot { margin-top: auto; padding: .75rem 1rem 1rem; border-top: 1px solid var(--line); font-size: .8rem; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: .75rem; padding: .6rem 1.25rem; background: var(--surface);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap;
}
.topbar .grow { flex: 1; }
.topbar select { max-width: 280px; }
.menu-btn { display: none; }
.content { padding: 1.25rem; max-width: 1400px; width: 100%; }
.page-head { display: flex; gap: 1rem; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; margin-bottom: 1rem; }
.page-head p { color: var(--text-2); margin: 0; max-width: 75ch; }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.1rem; box-shadow: var(--shadow); min-width: 0; }
.card + .card { margin-top: 1rem; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: .75rem; flex-wrap: wrap; }
.card-head h2, .card-head h3 { margin: 0; }
.grid { display: grid; gap: 1rem; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stack > * + * { margin-top: 1rem; }
.row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }

.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem 1rem; box-shadow: var(--shadow); }
.tile .lbl { font-size: .78rem; color: var(--text-3); font-weight: 500; }
.tile .val { font-size: 1.7rem; font-weight: 650; line-height: 1.15; margin-top: .15rem; }
.tile .sub { font-size: .8rem; color: var(--text-2); margin-top: .2rem; }

/* ---------- forms ---------- */
label.f { display: block; font-size: .8rem; font-weight: 600; color: var(--text-2); margin-bottom: .2rem; }
.field { margin-bottom: .75rem; min-width: 0; }
input[type=text], input[type=password], input[type=number], input[type=date], input[type=url], input[type=search], input[type=month], select, textarea {
  width: 100%; font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 7px; padding: .45rem .6rem; min-height: 36px;
}
textarea { min-height: 70px; resize: vertical; }
input:disabled, select:disabled, textarea:disabled { background: var(--surface-2); color: var(--text-2); }
.btn {
  display: inline-flex; align-items: center; gap: .4rem; font: inherit; font-weight: 600; cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
  padding: .42rem .8rem; border-radius: 7px; min-height: 34px; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--crit-ink); border-color: var(--crit); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: .2rem .55rem; min-height: 28px; font-size: .82rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .86rem; }
.tbl th, .tbl td { padding: .45rem .6rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl th { background: var(--surface-2); font-weight: 600; color: var(--text-2); font-size: .78rem; position: sticky; top: 0; }
.tbl tr:last-child td { border-bottom: none; }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl td.c, .tbl th.c { text-align: center; }
.tbl tr.sel td { background: var(--brand-soft); }
.tbl tr.grp td { background: var(--surface-2); font-weight: 650; }

/* ---------- badges ---------- */
.badge { display: inline-flex; align-items: center; gap: .3rem; padding: .08rem .5rem; border-radius: 999px; font-size: .75rem; font-weight: 600; border: 1px solid transparent; white-space: nowrap; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge.plain::before { display: none; }
.b-good { background: var(--good-soft); color: var(--good-ink); }
.b-warn { background: var(--warn-soft); color: var(--warn-ink); }
.b-serious { background: var(--serious-soft); color: var(--serious-ink); }
.b-crit { background: var(--crit-soft); color: var(--crit-ink); }
.b-info { background: var(--brand-soft); color: var(--brand); }
.b-neutral { background: var(--surface-2); color: var(--text-2); border-color: var(--line); }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: .25rem; border-bottom: 1px solid var(--line); margin-bottom: 1rem; overflow-x: auto; }
.tabs a, .tabs button {
  padding: .55rem .8rem; border: none; background: none; font: inherit; font-weight: 600; color: var(--text-2);
  border-bottom: 2px solid transparent; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.tabs .on { color: var(--brand); border-bottom-color: var(--brand); }

/* ---------- questionnaire ---------- */
.principle { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); margin-bottom: 1rem; box-shadow: var(--shadow); }
.principle > header { display: flex; gap: 1rem; align-items: center; padding: .75rem 1rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.principle > header h3 { margin: 0; flex: 1; min-width: 240px; }
.q { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: .75rem; padding: .7rem 1rem; border-bottom: 1px solid var(--line); align-items: start; }
.q:last-child { border-bottom: none; }
.q .qid { font-weight: 650; color: var(--text-2); font-variant-numeric: tabular-nums; }
.q .qt { color: var(--text); }
.q .qmeta { display: flex; gap: .35rem; flex-wrap: wrap; margin-top: .35rem; }
.attrs { display: grid; grid-template-columns: repeat(8, 30px); gap: 4px; }
.attr { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 700; font-size: .8rem; color: var(--text-3); padding: 0; }
.attr.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.attr:disabled { cursor: default; }
.attr-legend { display: grid; grid-template-columns: repeat(8, 30px); gap: 4px; font-size: .65rem; text-align: center; color: var(--text-3); }
.q-side { display: flex; flex-direction: column; gap: .35rem; align-items: flex-end; }
.lvl { font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- charts ---------- */
.chart { width: 100%; }
.chart text { fill: var(--text-2); font-size: 11px; font-family: inherit; }
.chart .axis { stroke: var(--line-strong); }
.chart .grid-l { stroke: var(--line); }
.legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .8rem; color: var(--text-2); margin-bottom: .4rem; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: .35rem; vertical-align: -1px; }
.heat { display: grid; grid-template-columns: 70px repeat(5, minmax(44px, 1fr)); gap: 3px; font-size: .78rem; }
.heat .cell { aspect-ratio: 1.6; border-radius: 6px; display: grid; place-items: center; font-weight: 700; color: var(--text); border: 1px solid var(--line); }
.heat .ax { display: grid; place-items: center; color: var(--text-3); text-align: center; }
.bar-track { height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.bar-fill { height: 100%; background: var(--series-1); border-radius: 4px; }
#tip { position: fixed; z-index: 100; pointer-events: none; background: var(--text); color: var(--bg); padding: .35rem .55rem; border-radius: 6px; font-size: .78rem; max-width: 280px; box-shadow: var(--shadow); }

/* ---------- modal & toast ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(10,14,22,.5); display: grid; place-items: center; z-index: 50; padding: 1rem; }
.modal { background: var(--surface); border-radius: 12px; width: min(880px, 100%); max-height: calc(100vh - 2rem); display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.modal.sm { width: min(480px, 100%); }
.modal > header { display: flex; align-items: center; padding: .9rem 1.1rem; border-bottom: 1px solid var(--line); gap: .5rem; }
.modal > header h2 { margin: 0; flex: 1; }
.modal > .body { padding: 1rem 1.1rem; overflow-y: auto; }
.modal > footer { padding: .75rem 1.1rem; border-top: 1px solid var(--line); display: flex; gap: .5rem; justify-content: flex-end; flex-wrap: wrap; }
#toast-root { position: fixed; right: 1rem; bottom: 1rem; display: flex; flex-direction: column; gap: .5rem; z-index: 60; }
.toast { background: var(--text); color: var(--bg); padding: .6rem .9rem; border-radius: 8px; box-shadow: var(--shadow); max-width: 360px; font-size: .88rem; }
.toast.err { background: var(--crit); color: #fff; }

/* ---------- login ---------- */
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
.login { width: min(420px, 100%); }
.login .brand { padding: 0 0 1rem; }
.callout { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: .7rem .9rem; font-size: .86rem; color: var(--text-2); }
.callout.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn-ink); }
.callout.crit { background: var(--crit-soft); border-color: transparent; color: var(--crit-ink); }
.callout.info { background: var(--brand-soft); border-color: transparent; color: var(--text); }
details.box { border: 1px solid var(--line); border-radius: 8px; padding: .5rem .8rem; background: var(--surface); }
details.box + details.box { margin-top: .5rem; }
details.box summary { cursor: pointer; font-weight: 600; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; font-size: .88rem; }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; }
pre { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: .7rem; overflow-x: auto; }
.empty { text-align: center; color: var(--text-3); padding: 2rem 1rem; }
.print-only { display: none; }

@media (max-width: 1100px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .nav { position: fixed; z-index: 40; left: 0; top: 0; width: 270px; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  .nav.open { transform: none; }
  .menu-btn { display: inline-flex; }
  .content { padding: 1rem; }
  .g2, .g3, .g4 { grid-template-columns: minmax(0, 1fr); }
  .q { grid-template-columns: minmax(0, 1fr); }
  .q-side { align-items: flex-start; }
  .topbar select { max-width: 100%; }
}
@media print {
  body { background: #fff; color: #000; font-size: 11px; }
  .nav, .topbar, .no-print, #toast-root { display: none !important; }
  .shell { display: block; }
  .content { padding: 0; max-width: none; }
  .card, .tile { box-shadow: none; break-inside: avoid; }
  .print-only { display: block; }
  .tbl th { position: static; }
}

</style>
</head>

<script>
window.SECI_BANCO = {"version":"2026.1","components":[{"code":"GC","name":"Gobierno y Cultura","peso":0.25,"principles":[{"n":1,"t":"Los órganos directivos ejercen supervisión sobre los riesgos","q":[{"id":"1.1.1","t":"¿Los miembros del Consejo de Administración y otros órganos directivos comprenden y aplican los marcos de referencia para la evaluación de riesgos y control interno (COSO ERM 2017, COSO Control Interno 2013, Modelo de las Tres Líneas del IIA 2020, ISO 31000:2018 y COBIT 2019) en sus procesos de toma de decisiones?","orig":"1.1.1","actualizado":true},{"id":"1.1.2","t":"¿Existe un Comité de Riesgos o un Comité de Auditoría en la Institución Financiera, formalmente establecido y con un mandato claro para supervisar y evaluar los riesgos críticos, así como para informar periódicamente al Consejo de Administración?","orig":"1.1.2"},{"id":"1.1.3","t":"¿Los órganos directivos revisan y aprueban anualmente el plan de auditoría interna, asegurando que esté alineado con los objetivos estratégicos y cubra las áreas de mayor riesgo en la Institución Financiera?","orig":"1.1.3"},{"id":"1.1.4","t":"¿Se reciben y analizan en el Consejo de Administración reportes regulares sobre el estado de los riesgos y los controles implementados, incluyendo resultados de auditorías y revisiones de control interno?","orig":"1.1.4"},{"id":"1.1.5","t":"¿Se han establecido procedimientos para garantizar que las decisiones estratégicas tomadas por los órganos directivos consideren los riesgos identificados y las posibles medidas de mitigación? MANUAL DE RIESGOS","orig":"1.1.5"},{"id":"1.1.6","t":"¿El Consejo de Administración ha implementado un programa de capacitación continua para sus miembros, con el fin de asegurar que posean las competencias necesarias para identificar, evaluar y gestionar los riesgos de la Institución Financiera?","orig":"1.1.6"},{"id":"1.1.7","t":"¿Existen políticas y protocolos claros para la rendición de cuentas de los órganos directivos en el cumplimiento de su responsabilidad de supervisar los riesgos, y se evalúa periódicamente su desempeño en esta área?","orig":"1.1.7"},{"id":"1.1.8","t":"¿El Consejo de Administración tiene un proceso establecido para revisar la efectividad de los comités que supervisan los riesgos (como el Comité de Auditoría y el Comité de Riesgos) y asegurar que estos cuenten con los recursos necesarios para cumplir sus funciones?","orig":"1.1.8"},{"id":"1.1.9","t":"¿El Consejo de Administración supervisa expresamente los riesgos de ciberseguridad, tecnológicos y de uso de inteligencia artificial, recibiendo reportes al menos semestrales sobre incidentes, vulnerabilidades y planes de remediación?","tema":"Ciberseguridad","nuevo":true}]},{"n":2,"t":"Establece estructuras operativas","q":[{"id":"1.2.1","t":"¿La Institución Financiera ha definido y documentado una estructura organizacional clara que delimita las funciones y responsabilidades de cada área y asegura una adecuada supervisión de los riesgos?","orig":"1.2.1"},{"id":"1.2.2","t":"¿Existe un manual de organización y funciones actualizado que especifica las responsabilidades y tareas de cada puesto, asegurando que todos los empleados conozcan sus roles en el sistema de control interno y de gestión de riesgos?","orig":"1.2.2"},{"id":"1.2.3","t":"¿Se cuenta con políticas y procedimientos formales para la toma de decisiones en temas de riesgo, de manera que las estructuras operativas de la Institución Financiera actúen de forma alineada y coherente?","orig":"1.2.3"},{"id":"1.2.4","t":"¿La Institución Financiera lleva a cabo evaluaciones periódicas de la efectividad de sus estructuras operativas para identificar y corregir debilidades que puedan afectar el gobierno de riesgos y control?","orig":"1.2.4"},{"id":"1.2.5","t":"¿El Consejo de Administración y la alta gerencia revisan y ajustan las estructuras organizacionales y los procedimientos internos de manera proactiva, en respuesta a cambios en el entorno o a nuevos riesgos emergentes?","orig":"1.2.5"},{"id":"1.2.6","t":"¿Se han implementado sistemas de comunicación efectivos para asegurar que la información relevante sobre riesgos y control fluya de manera adecuada entre los diferentes niveles jerárquicos y áreas de la Institución Financiera?","orig":"1.2.6"},{"id":"1.2.7","t":"¿La Institución Financiera cuenta con un sistema de control de personal y recursos adecuado que evita conflictos de interés y garantiza la segregación de funciones clave, especialmente en áreas críticas como finanzas, auditoría, y cumplimiento?","orig":"1.2.7"}]},{"n":3,"t":"Define la cultura deseada","q":[{"id":"1.3.1","t":"¿El Consejo de Administración y la Gerencia conocen y promueven activamente la importancia de una cultura de riesgos y de control interno en toda la Institución Financiera?","orig":"1.3.1"},{"id":"1.3.2","t":"¿Todos los niveles de personal entienden y asumen sus responsabilidades en cuanto a la gestión de riesgos y el control interno, según sus respectivos niveles de autoridad?","orig":"1.3.2"},{"id":"1.3.3","t":"¿La Institución Financiera cuenta con un plan para integrar la cultura de riesgos en las actividades diarias y de cumplimiento de sus empleados?","orig":"1.3.3"},{"id":"1.3.4","t":"¿Existen procedimientos claros para evaluar y cumplir los objetivos y metas de control interno, incluyendo indicadores de desempeño específicos?","orig":"1.3.4"},{"id":"1.3.5","t":"¿Se han establecido métricas claras para evaluar el cumplimiento y la eficacia del control interno y la gestión de riesgos?","orig":"1.3.5"},{"id":"1.3.6","t":"¿El Consejo de Administración aprueba y supervisa los incentivos de desempeño de manera que refuercen una conducta alineada con los valores de la Institución Financiera y la cultura de riesgos?","orig":"1.3.6"},{"id":"1.3.7","t":"¿Existen políticas de reconocimiento y recompensa que fomenten una cultura de cumplimiento y de control de riesgos en todas las áreas?","orig":"1.3.7"},{"id":"1.3.8","t":"¿La Institución Financiera realiza revisiones periódicas para evaluar si los comportamientos y actitudes de su personal están alineados con la cultura de riesgos y control establecida?","orig":"1.3.8"}]},{"n":4,"t":"Demuestra compromiso con los valores éticos","q":[{"id":"1.4.1","t":"¿La Institución Financiera ha establecido políticas, normas y procedimientos de control interno y ética que son obligatorios para todos los empleados, independientemente de su nivel jerárquico?","orig":"1.4.1"},{"id":"1.4.2","t":"¿Existe un Código de Ética formalizado que esté alineado con los valores de control interno y gestión de riesgos de la Institución Financiera?","orig":"1.4.2"},{"id":"1.4.3","t":"¿El Código de Ética se comunica a todos los niveles de la Institución Financiera y a terceros relevantes, como proveedores y socios de negocio?","orig":"1.4.3"},{"id":"1.4.4","t":"¿La Institución Financiera requiere una declaración formal, de manera periódica, para que el personal exprese su compromiso de cumplir con el Código de Ética?","orig":"1.4.4"},{"id":"1.4.5","t":"¿El Código de Ética incluye lineamientos específicos sobre la conducta esperada en relación con el control de riesgos y el respeto a las normas de control interno?","orig":"1.4.5"},{"id":"1.4.6","t":"¿El Código de Ética forma parte del plan de capacitación anual para asegurar que todos los empleados estén al tanto de sus responsabilidades en control interno y gestión de riesgos?","orig":"1.4.6"},{"id":"1.4.7","t":"¿Existen procedimientos específicos para investigar, documentar y actuar ante posibles violaciones a los valores éticos o las normas de control interno? REGLAMENTO INTERNO DE TRABAJO","orig":"1.4.7"},{"id":"1.4.8","t":"¿Se asegura la Institución Financiera de que todos los empleados renueven periódicamente su compromiso con el Código de Ética, reforzando la importancia de la ética y el control interno?","orig":"1.4.8"},{"id":"1.4.9","t":"¿La Institución Financiera cuenta con un canal de denuncia claro y accesible para reportar violaciones a los valores éticos y de control interno, garantizando la confidencialidad y protección del denunciante?","orig":"1.4.9"},{"id":"1.4.10","t":"¿Se realizan revisiones periódicas del Código de Ética para asegurar que se mantenga alineado con las mejores prácticas de control interno y gestión de riesgos?","orig":"1.4.10"},{"id":"1.4.11","t":"¿La Institución Financiera ha establecido un Comité de Ética que supervise el cumplimiento del Código de Ética y dé seguimiento a los incidentes de control interno?","orig":"1.4.11"},{"id":"1.4.12","t":"¿Se identifican, aprueban y revelan los conflictos de interés y las operaciones con personas relacionadas (consejeros, funcionarios y sus familiares), incluidos los créditos relacionados, dentro de los límites regulatorios?","tema":"Crédito","nuevo":true}]},{"n":5,"t":"Atrae, desarrolla y retiene individuos competentes","q":[{"id":"1.5.1","t":"¿La Institución Financiera tiene un proceso formal para la administración de recursos humanos que incluya el reclutamiento, selección, capacitación y retención de personal con competencias en control interno y gestión de riesgos?","orig":"1.5.1"},{"id":"1.5.2","t":"¿Se han identificado claramente las competencias necesarias para cada cargo, especialmente en roles críticos para el control interno y la gestión de riesgos?","orig":"1.5.2"},{"id":"1.5.3","t":"¿La Institución Financiera evalúa periódicamente la carga laboral de sus empleados en áreas críticas para evitar exceso o carencia de personal que pueda afectar la gestión de riesgos?","orig":"1.5.3"},{"id":"1.5.4","t":"¿Existen evaluaciones regulares del desempeño del personal para asegurar que sus competencias en control interno y gestión de riesgos se mantengan actualizadas?","orig":"1.5.4"},{"id":"1.5.5","t":"¿La Institución Financiera ha formalizado un Reglamento Interno de Trabajo (RIT) que incluye políticas específicas sobre control interno y gestión de riesgos?","orig":"1.5.5"},{"id":"1.5.6","t":"¿Se cuenta con un programa de capacitación que incluya aspectos de control interno y riesgos, asegurando que todos los empleados reciban formación en estas áreas críticas?","orig":"1.5.6"},{"id":"1.5.7","t":"¿La Institución Financiera evalúa el cumplimiento de su programa de capacitación para asegurarse de que las competencias en control interno y riesgos estén alineadas con las mejores prácticas?","orig":"1.5.7"},{"id":"1.5.8","t":"¿Existen programas de inducción y desarrollo profesional para nuevos empleados que incluyan la capacitación en control interno y riesgos desde el inicio de sus funciones?","orig":"1.5.8"},{"id":"1.5.9","t":"¿La Institución Financiera revisa regularmente sus políticas de rotación de personal para evitar la acumulación de poder en funciones críticas y reducir riesgos operativos?","orig":"1.5.9"},{"id":"1.5.10","t":"¿Se realizan evaluaciones de desempeño basadas en competencias antes de considerar promociones o movimientos dentro de áreas clave?","orig":"1.5.10"}]}]},{"code":"EST","name":"Estrategia y Establecimiento de Objetivos","peso":0.2,"principles":[{"n":6,"t":"Analiza el contexto empresarial","q":[{"id":"2.6.1","t":"¿La Institución realiza análisis internos regulares sobre su capacidad competitiva y recursos disponibles (talento humano, financiero, tecnológico, y de gobierno corporativo) para asegurar su adaptación y desempeño en el mercado?","orig":"2.6.1"},{"id":"2.6.2","t":"¿Se efectúan análisis externos detallados que incluyan factores económicos, políticos, sociales, y tecnológicos en los países o regiones donde opera la Institución?","orig":"2.6.2"},{"id":"2.6.3","t":"¿Existen mecanismos para evaluar factores de riesgo específicos como el lavado de dinero y financiamiento al terrorismo en el contexto empresarial externo?","orig":"2.6.3"},{"id":"2.6.4","t":"¿Los resultados de estos análisis se traducen en planes de acción concretos que se monitorean y actualizan regularmente?","orig":"2.6.4"},{"id":"2.6.5","t":"¿El análisis de contexto incorpora riesgos ambientales, sociales y de gobierno corporativo (ASG), incluidos fenómenos climáticos que afecten a socios, garantías o regiones atendidas?","tema":"ASG","nuevo":true}]},{"n":7,"t":"Define el apetito al riesgo","q":[{"id":"2.7.1","t":"¿El Consejo de Administración y la alta gerencia han establecido y aprobado un marco claro que define el apetito y tolerancia al riesgo, tomando en cuenta los diferentes niveles de la organización?","orig":"2.7.1"},{"id":"2.7.2","t":"¿Se comunican y aplican adecuadamente los límites de riesgo establecidos a todas las unidades de negocio y se aseguran de que los empleados estén informados y capacitados sobre estos límites?","orig":"2.7.2"},{"id":"2.7.3","t":"¿El apetito al riesgo se expresa en límites cuantitativos medibles para el riesgo de crédito (IMOR, ICOR, concentración por acreditado y sector, cobertura de reservas) con alertas tempranas y responsables de escalamiento?","tema":"Crédito","nuevo":true}]},{"n":8,"t":"Evalúa estrategias alternativas","q":[{"id":"2.8.1","t":"¿La Institución realiza estudios de viabilidad sobre la adopción de tecnologías avanzadas (como IA, Machine Learning, y análisis de Big Data) en sus procesos y servicios?","orig":"2.9.1"},{"id":"2.8.2","t":"¿Existe un proceso formal para la selección de alternativas estratégicas que aseguren la alineación con los objetivos generales de la Institución y la gestión de riesgos?","orig":"2.9.2"},{"id":"2.8.3","t":"¿La Institución considera los posibles impactos de sus decisiones estratégicas en la satisfacción de clientes, cumplimiento regulatorio, y adaptación a las tendencias del mercado?","orig":"2.9.3"},{"id":"2.8.4","t":"¿Existen planes de contingencia establecidos para mitigar riesgos asociados con la implementación de nuevas estrategias y tecnologías?","orig":"2.9.4"},{"id":"2.8.5","t":"¿La Institución consulta regularmente con expertos en áreas clave para asegurar la viabilidad de sus alternativas estratégicas?","orig":"2.9.5"},{"id":"2.8.6","t":"¿Se realiza una evaluación de los costos y beneficios de cada alternativa estratégica, incluyendo los potenciales riesgos operativos y financieros?","orig":"2.9.6"},{"id":"2.8.7","t":"¿Existen indicadores de desempeño que permitan medir la eficacia de las alternativas estratégicas implementadas?","orig":"2.9.7"},{"id":"2.8.8","t":"¿Se revisan periódicamente las estrategias implementadas para garantizar que sigan alineadas con los objetivos organizacionales y el entorno cambiante?","orig":"2.9.8"}]},{"n":9,"t":"Formula los objetivos empresariales","q":[{"id":"2.9.1","t":"¿Los objetivos de negocio (colocación, captación, rentabilidad, morosidad, liquidez y solvencia) se derivan formalmente del plan estratégico y son aprobados por el Consejo de Administración?","tema":"Objetivos","nuevo":true},{"id":"2.9.2","t":"¿Cada objetivo de negocio tiene métricas, metas y tolerancias definidas (variación aceptable del desempeño) congruentes con el apetito al riesgo?","tema":"Objetivos","nuevo":true},{"id":"2.9.3","t":"¿Los objetivos se despliegan en cascada a sucursales, áreas y puestos clave, con responsables y fechas de cumplimiento?","tema":"Objetivos","nuevo":true},{"id":"2.9.4","t":"¿Se verifica que los objetivos de crecimiento de cartera no excedan los límites de concentración, capacidad de originación y control de la mesa de control?","tema":"Objetivos","nuevo":true},{"id":"2.9.5","t":"¿Los objetivos consideran requerimientos regulatorios (capitalización, liquidez, reservas preventivas) y su cumplimiento se monitorea al menos mensualmente?","tema":"Objetivos","nuevo":true},{"id":"2.9.6","t":"¿Se revisan y, en su caso, ajustan los objetivos de negocio cuando cambian el contexto o el perfil de riesgo de la Institución?","tema":"Objetivos","nuevo":true}]}]},{"code":"DES","name":"Desempeño","peso":0.15,"principles":[{"n":10,"t":"Identificar riesgos clave","q":[{"id":"3.10.1","t":"¿La empresa ha definido claramente una metodología para evaluar los riesgos basada en un enfoque integral, incluyendo aspectos de PLD (Prevención de Lavado de Dinero)? ¿El manual de administración de riesgos está actualizado, y el personal lo conoce y recibe capacitación al respecto?","orig":"3.10.1"},{"id":"3.10.2","t":"¿Se identifican y valoran los riesgos crediticios, incluyendo su impacto y las estrategias de respuesta? ¿Con qué frecuencia se realiza esta evaluación? (análisis BIA)","orig":"3.10.2"},{"id":"3.10.3","t":"¿Se identifican y valoran los riesgos de liquidez, evaluando su impacto y las estrategias de respuesta? ¿Con qué frecuencia se realiza esta evaluación?","orig":"3.10.3"},{"id":"3.10.4","t":"¿Se identifican y valoran los riesgos de mercado, evaluando su impacto y las estrategias de respuesta? ¿Con qué frecuencia se realiza esta evaluación?","orig":"3.10.4"},{"id":"3.10.5","t":"¿Se identifican y valoran los riesgos operacionales y tecnológicos, evaluando su impacto y las estrategias de respuesta? ¿Con qué frecuencia se realiza esta evaluación?","orig":"3.10.5"},{"id":"3.10.6","t":"¿Se identifican y valoran los riesgos legales, evaluando su impacto y las estrategias de respuesta? ¿Con qué frecuencia se realiza esta evaluación?","orig":"3.10.6"},{"id":"3.10.7","t":"¿Se identifican y valoran los riesgos reputacionales, evaluando su impacto y las estrategias de respuesta? ¿Con qué frecuencia se realiza esta evaluación?","orig":"3.10.7"},{"id":"3.10.8","t":"¿Se identifican y valoran los riesgos relacionados con PLD/FT (Lavado de Dinero y Financiamiento al Terrorismo), evaluando su impacto y las estrategias de respuesta? ¿Con qué frecuencia se realiza esta evaluación?","orig":"3.10.8"},{"id":"3.10.9","t":"¿Se identifican y evalúan los riesgos derivados de terceros y proveedores críticos (core bancario, nube, corresponsales, cobranza externa) con debida diligencia y cláusulas de auditoría?","tema":"Terceros","nuevo":true},{"id":"3.10.10","t":"¿Se identifican y valoran los riesgos de fraude interno y externo, incluido el fraude digital (suplantación de identidad, ingeniería social, robo de cuentas)?","tema":"Fraude","nuevo":true}]},{"n":11,"t":"Evalúa la severidad de los riesgos","q":[{"id":"3.11.1","t":"¿La gerencia selecciona y desarrolla evaluaciones continuas para determinar la severidad o impacto de los riesgos?","orig":"3.11.1"},{"id":"3.11.2","t":"¿La empresa cuenta con pólizas de seguros para proteger sus diferentes activos?","orig":"3.11.2"},{"id":"3.11.3","t":"¿El Consejo de Administración conoce y aprueba la selección de la aseguradora antes de formalizar los contratos de seguros?","orig":"3.11.3"},{"id":"3.11.4","t":"¿Se ha designado a una persona responsable de controlar la vigencia de los seguros contratados?","orig":"3.11.4"},{"id":"3.11.5","t":"¿Las pólizas y la documentación de los seguros están adecuadamente custodiadas y almacenadas en una caja de seguridad?","orig":"3.11.5"},{"id":"3.11.6","t":"¿Están asegurados los valores en efectivo que permanecen en la empresa?","orig":"3.11.6"},{"id":"3.11.7","t":"¿Están asegurados los valores y las garantías recibidas por la empresa?","orig":"3.11.7"},{"id":"3.11.8","t":"¿Se han afianzado mediante pólizas de seguro a los funcionarios responsables de manejar efectivo y a los ejecutivos principales de la empresa? También se puede utilizar pagaré.","orig":"3.11.8"},{"id":"3.11.9","t":"¿Se realizan pruebas de estrés y análisis de escenarios sobre la cartera de crédito (pérdida esperada, pérdida no esperada / VaR de crédito, concentración) y sus resultados se presentan al Comité de Riesgos?","tema":"Crédito","nuevo":true}]},{"n":12,"t":"Prioriza los riesgos","q":[{"id":"3.12.1","t":"¿La empresa cuenta con un catálogo de riesgos debidamente documentado?","orig":"3.12.1"},{"id":"3.12.2","t":"¿Existe una metodología clara para la valoración de riesgos?","orig":"3.12.2"},{"id":"3.12.3","t":"¿Se ha definido un valor porcentual o numérico para la probabilidad de ocurrencia de cada riesgo, en relación con la totalidad de los riesgos identificados? (Análisis BIA)","orig":"3.12.3"}]},{"n":13,"t":"Implementa las respuestas a los riesgos","q":[{"id":"3.13.1","t":"¿La empresa ha definido claramente los tratamientos mitigantes en función del nivel de riesgo, considerando el nivel de tolerancia establecido?","orig":"3.13.1"},{"id":"3.13.2","t":"¿Están identificados los controles, estructuras internas, medidas, criterios, políticas y procedimientos que contribuyen a administrar, controlar y disminuir la exposición a los riesgos?","orig":"3.13.2"},{"id":"3.13.3","t":"¿El funcionamiento del mapa y matriz de riesgos está claramente definido?","orig":"3.13.3"},{"id":"3.13.4","t":"¿Se ha determinado si es necesario implementar medidas mitigantes adicionales o realizar mejoras para mantener el grado de riesgo en niveles tolerables de acuerdo al perfil de la empresa?","orig":"3.13.4"},{"id":"3.13.5","t":"¿Se documentan las modificaciones y actualizaciones a manuales, instructivos, políticas, reglamentos y formatos?","orig":"3.13.5"},{"id":"3.13.6","t":"¿Se evalúa periódicamente (al menos cada 12 meses) la eficacia y eficiencia de la metodología de gestión de riesgos?","orig":"3.13.6"},{"id":"3.13.7","t":"¿Se elabora un programa de acciones para abordar las problemáticas detectadas en la evaluación de objetivos y metas?","orig":"3.13.7"},{"id":"3.13.8","t":"¿Se da seguimiento a la implementación de las mejoras propuestas y a las deficiencias identificadas en auditorías externas?","orig":"3.13.8"},{"id":"3.13.9","t":"¿La empresa implementa las recomendaciones derivadas de auditorías internas?","orig":"3.13.9"},{"id":"3.13.10","t":"¿Se realizan autoevaluaciones de control interno en los procesos críticos identificados, y se desarrollan programas de trabajo para atender las deficiencias detectadas?","orig":"3.13.10"},{"id":"3.13.11","t":"¿La empresa cuenta con un procedimiento formal que establece las políticas y mecanismos necesarios para que los responsables de procesos comuniquen los resultados de sus evaluaciones de control interno y las deficiencias identificadas al coordinador de actividades de control interno?","orig":"3.13.11"},{"id":"3.13.12","t":"¿La gerencia da seguimiento a la implementación de acciones correctivas para corregir las deficiencias identificadas en el sistema de control interno, asegurándose de que se cumplan en el tiempo establecido?","orig":"3.13.12"},{"id":"3.13.13","t":"¿La mesa de control verifica, antes de la disposición del crédito, la integración completa del expediente, las autorizaciones por nivel facultado, las garantías y la consulta a sociedades de información crediticia, registrando las excepciones?","tema":"Mesa de control","nuevo":true},{"id":"3.13.14","t":"¿La contraloría de crédito revisa de forma independiente y periódica la originación, seguimiento y recuperación de la cartera, el cumplimiento de políticas y la atención de excepciones?","tema":"Contraloría de crédito","nuevo":true}]},{"n":14,"t":"Desarrolla un portafolio de riesgos","q":[{"id":"3.14.1","t":"¿Se realizan ejercicios periódicos para identificar, valorar y responder a riesgos derivados de acontecimientos económicos, políticos, sociales, tecnológicos, geográficos y globales? ¿Con qué frecuencia?","orig":"3.14.1"},{"id":"3.14.2","t":"¿El catálogo de riesgos, el mapa de riesgos, la matriz de riesgos y los informes están debidamente documentados, y son conocidos por los consejeros?","orig":"3.14.2"}]}]},{"code":"REV","name":"Revisión y Ajuste","peso":0.15,"principles":[{"n":15,"t":"Evalúa los cambios sustanciales","q":[{"id":"4.15.1","t":"¿Las amenazas y oportunidades derivadas de los cambios son gestionadas a nivel estratégico por los altos mandos de la organización?","orig":"4.15.1"},{"id":"4.15.2","t":"¿Existe un mecanismo para identificar y responder oportunamente a los cambios que afectan los objetivos institucionales?","orig":"4.15.2"},{"id":"4.15.3","t":"¿La empresa cuenta con una fuente confiable de información sobre cambios en la legislación aplicable?","orig":"4.15.3"},{"id":"4.15.4","t":"¿La organización tiene la capacidad de responder de manera oportuna y positiva a los cambios?","orig":"4.15.4"},{"id":"4.15.5","t":"¿Los directivos adoptan una actitud constructiva y sin prejuicios para abordar cambios inevitables, como modificaciones legislativas o nuevas exigencias regulatorias, en beneficio de la empresa?","orig":"4.15.5"},{"id":"4.15.6","t":"¿Se toman acciones para asegurar que el personal nuevo comprenda la cultura organizacional y adopte una actitud positiva hacia los cambios?","orig":"4.15.6"},{"id":"4.15.7","t":"¿Se han implementado mecanismos para acceder a nuevos sistemas de información?","orig":"4.15.7"},{"id":"4.15.8","t":"¿La empresa conserva el sistema de información anterior durante un período de transición prudente al adoptar uno nuevo, asegurándose de su correcto funcionamiento antes de la implementación completa?","orig":"4.15.8"},{"id":"4.15.9","t":"¿Se han desarrollado acciones para reducir o eliminar la resistencia natural al cambio entre los empleados?","orig":"4.15.9"},{"id":"4.15.10","t":"¿Se cuenta con acceso a información confiable sobre avances tecnológicos que podrían beneficiar a la empresa?","orig":"4.15.10"}]},{"n":16,"t":"Revisa los riesgos y el desempeño","q":[{"id":"4.16.1","t":"¿La organización realiza evaluaciones periódicas de los Indicadores Clave de Riesgo (KRI), Indicadores Clave de Desempeño (KPI) y los indicadores de la CNBV? ¿Con qué frecuencia se llevan a cabo?","orig":"4.16.1"},{"id":"4.16.2","t":"¿Existe un documento formal que establezca los planes de recuperación ante desastres y de continuidad operativa para los sistemas informáticos (incluyendo datos, hardware, software críticos, personal y espacios físicos) asociados a los procesos críticos de la empresa?","orig":"4.16.2"},{"id":"4.16.3","t":"¿Los procedimientos de control especifican claramente las responsabilidades del personal involucrado y establecen la rendición de cuentas dentro de la organización?","orig":"4.16.3"},{"id":"4.16.4","t":"¿Los procedimientos incluyen la frecuencia y fechas de las actividades de control y las acciones de seguimiento, considerando el nivel de exposición al riesgo?","orig":"4.16.4"},{"id":"4.16.5","t":"¿La asignación de controles toma en cuenta el nivel de competencia y autoridad del personal, así como la complejidad de las actividades y el volumen de operaciones?","orig":"4.16.5"},{"id":"4.16.6","t":"¿La Gerencia General u órgano equivalente revisa periódicamente las políticas, procedimientos y actividades de control para asegurar su relevancia y las actualiza cuando es necesario, considerando cambios en personas, procesos o tecnología que puedan afectar su eficacia?","orig":"4.16.6"},{"id":"4.16.7","t":"¿Los planes de continuidad del negocio y de recuperación ante desastres se prueban al menos una vez al año y los resultados se documentan con acciones de mejora?","tema":"Continuidad","nuevo":true}]},{"n":17,"t":"Propone mejoras en la gestión de riesgos empresariales","q":[{"id":"4.17.1","t":"¿La empresa cuenta con mecanismos que promuevan una cultura de innovación y recepción de sugerencias para mejoras propuestas por empleados y directivos?","orig":"4.17.1"},{"id":"4.17.2","t":"¿Se consideran las sugerencias o propuestas de mejora presentadas por empleados y directivos? ¿Se evalúa su viabilidad en conjunto con el Comité de Riesgos y/o el Comité de Auditoría?","orig":"4.17.2"},{"id":"4.17.3","t":"¿Se evalúa si es necesario implementar mejoras o medidas mitigantes adicionales para mantener los niveles de riesgo dentro de los límites tolerables para la empresa?","orig":"4.17.3"},{"id":"4.17.4","t":"¿Las propuestas de mejora y/o medidas mitigantes adicionales son evaluadas formalmente?","orig":"4.17.4"},{"id":"4.17.5","t":"¿La empresa cuenta con indicadores de desempeño e indicadores de riesgo específicos para los procesos de cambio?","orig":"4.17.5"},{"id":"4.17.6","t":"¿Existen actividades de supervisión operativa para asegurar que los cambios o mejoras se realicen de manera planeada y controlada?","orig":"4.17.6"},{"id":"4.17.7","t":"¿Los supervisores inmediatos cumplen con su responsabilidad de monitorear las actividades con la frecuencia necesaria?","orig":"4.17.7"},{"id":"4.17.8","t":"¿Los responsables de cada proceso y procedimiento están al tanto de sus responsabilidades en cuanto a la autorización y aprobación de actividades? (Firmas de responsabilidad)","orig":"4.17.8"},{"id":"4.17.9","t":"¿La empresa dispone de una política, manual o documento similar que establezca la obligación de mejorar y/o actualizar periódicamente políticas y procedimientos, especialmente en procesos clave para cumplir con los objetivos organizacionales?","orig":"4.17.9"},{"id":"4.17.10","t":"¿Se evalúa si el diseño de los controles es adecuado como respuesta a la mitigación de riesgos en la matriz de riesgos, y si estos controles han sido implementados conforme a su diseño?","orig":"4.17.10"},{"id":"4.17.11","t":"¿La función de auditoría interna cuenta con un programa de aseguramiento y mejora de la calidad, incluyendo una evaluación externa al menos cada cinco años, conforme a las Normas Globales de Auditoría Interna (IIA, 2024)?","tema":"Auditoría interna","nuevo":true},{"id":"4.17.12","t":"¿Se da seguimiento formal a las observaciones de la autoridad supervisora (CNBV y, en su caso, Comité de Supervisión Auxiliar) hasta su solventación?","tema":"Regulatorio","nuevo":true}]}]},{"code":"ICR","name":"Información, Comunicación y Reporte","peso":0.25,"principles":[{"n":18,"t":"Aprovecha la información y la tecnología","q":[{"id":"5.18.1","t":"¿Cuenta la Institución Financiera con sistemas informáticos que respalden sus actividades misionales, financieras o administrativas? En caso afirmativo, indique los nombres de dichos sistemas y los procesos que apoyan.","orig":"5.18.1"},{"id":"5.18.2","t":"¿La Institución Financiera dispone de un Comité de Tecnología de la Información y Comunicaciones (o su equivalente) en el cual participen los principales directivos, el personal de tecnología y representantes de las áreas usuarias? (Gobierno de TI, COBIT 5 ISACA = COSO)","orig":"5.18.2"},{"id":"5.18.3","t":"¿Existe un Plan Operativo Anual Informático?","orig":"5.18.3"},{"id":"5.18.4","t":"¿Dispone la Institución Financiera de laboratorios de pruebas para habilitar tecnologías antes de su implementación en operaciones?","orig":"5.18.4"},{"id":"5.18.5","t":"¿Existe un inventario, programa de adquisiciones o plan de renovación de equipos y/o software?","orig":"5.18.5"},{"id":"5.18.6","t":"¿La Institución Financiera cuenta con licencias y contratos para el funcionamiento y mantenimiento de los equipos TIC?","orig":"5.18.6"},{"id":"5.18.7","t":"¿Existen políticas y lineamientos de seguridad para los sistemas informáticos y de comunicación (como claves de acceso, programas de seguridad contra accesos no autorizados, antivirus, y respaldo de información)?","orig":"5.18.7"},{"id":"5.18.8","t":"¿Se implementan controles para asegurar que las solicitudes de acceso a las aplicaciones se ajusten a las listas de personal autorizado?","orig":"5.18.8"},{"id":"5.18.9","t":"¿La Institución Financiera realiza actualizaciones en los accesos de los empleados cuando cambian de función o dejan de formar parte de la organización?","orig":"5.18.9"},{"id":"5.18.10","t":"¿Se efectúan revisiones periódicas de los accesos otorgados en los sistemas?","orig":"5.18.10"},{"id":"5.18.11","t":"¿Cuenta la Institución Financiera con una metodología para el desarrollo de sus sistemas informáticos?","orig":"5.18.11"},{"id":"5.18.12","t":"¿La metodología de desarrollo incluye controles sobre los cambios en la tecnología?","orig":"5.18.12"},{"id":"5.18.13","t":"¿Se seleccionan y ejecutan controles sobre los servicios de outsourcing para asegurar la integridad, exactitud y validez de la información proporcionada y recibida de los proveedores?","orig":"5.18.13"},{"id":"5.18.14","t":"¿Existe un Plan de Sistemas de Información formalmente implementado que esté alineado con el Plan Estratégico u Operativo y que apoye los objetivos de la Institución Financiera?","orig":"5.18.14"},{"id":"5.18.15","t":"¿Se ha definido la información requerida en cada nivel de la Institución Financiera para soportar el funcionamiento del sistema informático?","orig":"5.18.15"},{"id":"5.18.16","t":"¿Cuenta la Institución Financiera con políticas y/o procedimientos autorizados que establezcan las fuentes y características de los datos, así como los elementos necesarios para su procesamiento y generación de información?","orig":"5.18.16"},{"id":"5.18.17","t":"¿Se han diseñado sistemas de información para capturar, procesar datos y transformarlos en información útil que cumpla con los requisitos definidos?","orig":"5.18.17"},{"id":"5.18.18","t":"¿Se evalúa el balance entre los beneficios y los costos de enviar, obtener y administrar la información según las necesidades de la Institución Financiera?","orig":"5.18.18"},{"id":"5.18.19","t":"¿Se realiza una auditoría anual de los procesos que incluyen inteligencia artificial (IA) para asegurar su confiabilidad y cumplimiento con normativas?","tema":"Inteligencia artificial","orig":"2.8.1"},{"id":"5.18.20","t":"¿La Institución cuenta con expertos en IA dentro del área de auditoría interna para supervisar la implementación y operación de procesos basados en IA?","tema":"Inteligencia artificial","orig":"2.8.2"},{"id":"5.18.21","t":"¿Los procesos de IA están documentados y su implementación es revisada periódicamente por el área de auditoría?","tema":"Inteligencia artificial","orig":"2.8.3"},{"id":"5.18.22","t":"¿Existen controles de acceso y protección de datos específicos para sistemas que utilizan IA, incluyendo políticas de privacidad de clientes?","tema":"Inteligencia artificial","orig":"2.8.4"},{"id":"5.18.23","t":"¿La IA en la Institución es utilizada únicamente con fines alineados a los objetivos estratégicos, y se evitan usos que puedan representar riesgos no controlados?","tema":"Inteligencia artificial","orig":"2.8.5"},{"id":"5.18.24","t":"¿Se implementan medidas de seguridad adicionales para datos procesados por IA, como encriptación y autenticación avanzada?","tema":"Inteligencia artificial","orig":"2.8.6"},{"id":"5.18.25","t":"¿La Institución tiene un proceso para evaluar los posibles sesgos en la IA, y realiza ajustes para asegurar que los resultados sean objetivos y justos?","tema":"Inteligencia artificial","orig":"2.8.7"},{"id":"5.18.26","t":"¿Se dispone de mecanismos de monitoreo en tiempo real para evaluar el desempeño y resultados de los procesos basados en IA?","tema":"Inteligencia artificial","orig":"2.8.8"},{"id":"5.18.27","t":"¿Se realiza una revisión anual de los proveedores de servicios de IA para asegurar que cumplen con las políticas de seguridad y calidad de la Institución?","tema":"Inteligencia artificial","orig":"2.8.9"},{"id":"5.18.28","t":"¿Existen políticas claras para la eliminación segura de los datos utilizados por sistemas de IA una vez que han cumplido su propósito?","tema":"Inteligencia artificial","orig":"2.8.10"},{"id":"5.18.29","t":"¿La Institución tiene procedimientos para hacer frente a incidentes de seguridad que involucren sistemas de IA?","tema":"Inteligencia artificial","orig":"2.8.11"},{"id":"5.18.30","t":"¿Se realizan simulacros de respuesta a incidentes para procesos que dependen de IA y tecnologías avanzadas?","tema":"Inteligencia artificial","orig":"2.8.12"},{"id":"5.18.31","t":"¿Se cuenta con un comité o equipo que supervise el uso ético de IA en todas las áreas de la Institución?","tema":"Inteligencia artificial","orig":"2.8.13"},{"id":"5.18.32","t":"¿Existen controles para limitar la toma de decisiones automáticas de la IA en áreas de alto riesgo, requiriendo intervención humana?","tema":"Inteligencia artificial","orig":"2.8.14"},{"id":"5.18.33","t":"¿La Institución verifica regularmente la exactitud de los datos procesados por IA para prevenir decisiones incorrectas basadas en información errónea?","tema":"Inteligencia artificial","orig":"2.8.15"},{"id":"5.18.34","t":"¿Se tiene una política de transparencia respecto al uso de IA, informando a los clientes sobre cómo se utilizan sus datos y el alcance de la IA?","tema":"Inteligencia artificial","orig":"2.8.16"},{"id":"5.18.35","t":"¿Se realizan evaluaciones periódicas de ciberseguridad para identificar y mitigar vulnerabilidades en sistemas de IA?","tema":"Inteligencia artificial","orig":"2.8.17"},{"id":"5.18.36","t":"¿La Institución establece pruebas y validaciones antes de implementar IA en procesos críticos para asegurar que funcione según lo previsto?","tema":"Inteligencia artificial","orig":"2.8.18"},{"id":"5.18.37","t":"¿Se evalúa la rentabilidad y efectividad de la IA y otras tecnologías después de su implementación para justificar su permanencia?","tema":"Inteligencia artificial","orig":"2.8.19"},{"id":"5.18.38","t":"¿La Institución cuenta con una política de actualización y mejora continua de sus sistemas de IA en respuesta a avances tecnológicos y cambios en el mercado?","tema":"Inteligencia artificial","orig":"2.8.21"},{"id":"5.18.39","t":"¿Se supervisan los resultados generados por la IA para detectar posibles errores o inconsistencias en los datos?","tema":"Inteligencia artificial","orig":"2.8.22"},{"id":"5.18.40","t":"¿La Institución tiene una política para descontinuar o actualizar procesos de IA que ya no sean útiles o presenten riesgos?","tema":"Inteligencia artificial","orig":"2.8.23"},{"id":"5.18.41","t":"¿Existen métricas para evaluar el impacto de la IA en la eficiencia operativa y satisfacción del cliente?","tema":"Inteligencia artificial","orig":"2.8.24"},{"id":"5.18.42","t":"¿La Institución consulta regularmente con expertos en ética y tecnología para evaluar el impacto de la IA en la privacidad y los derechos de los clientes?","tema":"Inteligencia artificial","orig":"2.8.26"},{"id":"5.18.43","t":"¿Se llevan a cabo revisiones para asegurar que los procesos de IA no se vean comprometidos por errores de software o fallos en los datos?","tema":"Inteligencia artificial","orig":"2.8.27"},{"id":"5.18.44","t":"¿La Institución tiene un plan de contingencia para reemplazar procesos basados en IA en caso de falla crítica o incidente de seguridad?","tema":"Inteligencia artificial","orig":"2.8.28"},{"id":"5.18.45","t":"¿El tratamiento de datos personales de socios y clientes cumple con la Ley Federal de Protección de Datos Personales en Posesión de los Particulares vigente (2025), incluyendo avisos de privacidad, derechos ARCO y medidas de seguridad?","tema":"Datos personales","nuevo":true}]},{"n":19,"t":"Comunica los riesgos de información","q":[{"id":"5.19.1","t":"¿Existen responsables designados para generar información sobre el cumplimiento de los objetivos y metas establecidos en el Plan Estratégico u Operativo de la Institución Financiera?","orig":"5.19.1"},{"id":"5.19.2","t":"¿Se ha asignado personal responsable de elaborar la información de gestión para cumplir con las obligaciones presupuestarias de la Institución Financiera?","orig":"5.19.2"},{"id":"5.19.3","t":"¿Se ha asignado personal responsable de generar información para el cumplimiento de las obligaciones de rendición de cuentas?","orig":"5.19.3"},{"id":"5.19.4","t":"¿Cuenta la Institución Financiera con un documento que establezca las responsabilidades del personal en materia de control interno en sus respectivas áreas de autoridad?","orig":"5.19.4"},{"id":"5.19.5","t":"¿Se elabora formalmente un informe periódico para el Consejo de Administración y Vigilancia, la Gerencia General u órgano equivalente, sobre el estado de los sistemas informáticos y la seguridad de la información (COBIT 2019 / ISO/IEC 27001:2022)?","orig":"5.19.5","actualizado":true},{"id":"5.19.6","t":"¿Cumple la Institución Financiera con el registro contable de sus operaciones y su reflejo en la información financiera?","orig":"5.19.6"},{"id":"5.19.7","t":"¿La Institución Financiera cumple con la generación de la información presupuestal del año en curso?","orig":"5.19.7"},{"id":"5.19.8","t":"Para los sistemas informáticos mencionados en la pregunta 5.18.1, ¿se les ha realizado una auditoría de TI, de control interno y/o de riesgos en el último ejercicio?","orig":"5.19.8"},{"id":"5.19.9","t":"En relación con la pregunta anterior, ¿ha establecido la Institución Financiera actividades de control para mitigar los riesgos identificados que podrían afectar su operación?","orig":"5.19.9"},{"id":"5.19.10","t":"¿Dispone la Institución Financiera de una metodología para evaluar el control interno y los riesgos en el entorno de tecnologías de la información y comunicaciones (TIC)? (COBIT - ISO 27001)","orig":"5.19.10"},{"id":"5.19.11","t":"¿Se implementan controles que faciliten la comunicación externa, incluyendo políticas y procedimientos para recibir información de partes externas y compartirla?","orig":"5.19.11"},{"id":"5.19.12","t":"¿Comparte la Institución Financiera su código de ética con los proveedores para promover su cumplimiento interno?","orig":"5.19.12"},{"id":"5.19.13","t":"¿Cuenta la Institución Financiera con canales de comunicación para recibir información de clientes, proveedores y auditores externos, y verifica la relevancia de dicha información para el sistema de control interno?","orig":"5.19.13"},{"id":"5.19.14","t":"¿La gerencia evalúa la información resultante de evaluaciones externas sobre el control interno y la comunica al Consejo de Administración y Vigilancia o al Comité de Auditoría cuando corresponde?","orig":"5.19.14"},{"id":"5.19.15","t":"¿La Institución Financiera selecciona métodos para responder a la información entrante, asegurando que los mensajes clave recibidos se atiendan y se dirijan adecuadamente?","orig":"5.19.15"},{"id":"5.19.16","t":"¿Los reportes regulatorios se envían en tiempo y forma a la autoridad, con controles de calidad de datos, conciliación contable y evidencia de revisión previa?","tema":"Regulatorio","nuevo":true}]},{"n":20,"t":"Informes sobre riesgos, cultura y desempeño","q":[{"id":"5.20.1","t":"¿Se elabora formalmente un informe periódico para la Asamblea General, el Consejo de Administración y Vigilancia, o la Gerencia General u órgano equivalente, sobre el estatus de los riesgos?","orig":"5.20.1"},{"id":"5.20.2","t":"¿Existe un informe periódico que se comunique formalmente a la Asamblea General, el Consejo de Administración y Vigilancia, o la Gerencia General u órgano equivalente, sobre la cultura organizacional y el gobierno?","orig":"5.20.2"},{"id":"5.20.3","t":"¿Se elabora formalmente un informe periódico para la Asamblea General, el Consejo de Administración y Vigilancia, o la Gerencia General u órgano equivalente, sobre el desempeño general de la Institución Financiera?","orig":"5.20.3"},{"id":"5.20.4","t":"¿Se presenta al Consejo un tablero integrado con los resultados de auditoría interna, contraloría interna, contraloría de crédito / mesa de control y administración de riesgos, con el estatus de los planes de acción?","tema":"Integración","nuevo":true}]}]}],"atributos":[{"k":"a","n":"Existe","ciclo":"Definir","ev":"Nombre del documento (política, procedimiento, actividad)."},{"k":"b","n":"Diseñada","ciclo":"Definir","ev":"La evidencia corresponde a lo solicitado y está alineada con lineamientos de la Empresa, sector, reguladores o prácticas internacionales."},{"k":"c","n":"Aprobado","ciclo":"Aprobar","ev":"Resolución, acta u otro acto administrativo de aprobación por la autoridad facultada (número, quién, cargo, fecha)."},{"k":"d","n":"Difundido","ciclo":"Difundir","ev":"Cursos, reuniones, boletines, correo, intranet u otros medios de difusión en el periodo evaluado."},{"k":"e","n":"Implementado","ciclo":"Documentar y medir","ev":"Políticas, procedimientos y actividades que evidencian la implementación conforme a la documentación vigente."},{"k":"f","n":"Responsable","ciclo":"Documentar y medir","ev":"Acto administrativo o función (MOF) que designa al responsable."},{"k":"g","n":"Funcionamiento","ciclo":"Documentar y medir","ev":"Registros que evidencian la operación con la frecuencia y cuidado debidos (al menos tres meses)."},{"k":"h","n":"Mejora continua","ciclo":"Revisar y mejorar","ev":"Actualización o mejora documentada dentro de los últimos dos años (resolución, fecha de última actualización, automatización)."}],"niveles":[{"nivel":0,"requiere":0,"t":"No existen actividades diseñadas para cubrir el requerimiento."},{"nivel":1,"requiere":2,"t":"Existen actividades diseñadas pero no están documentadas en políticas y/o procedimientos ni aprobadas."},{"nivel":2,"requiere":4,"t":"Las actividades están diseñadas, documentadas, aprobadas y difundidas; en proceso de implementación."},{"nivel":3,"requiere":5,"t":"Además, el control se implementó recientemente conforme a la documentación vigente."},{"nivel":4,"requiere":7,"t":"Además, existe responsable asignado y registros que evidencian su funcionamiento (al menos tres meses)."},{"nivel":5,"requiere":8,"t":"Además, el control fue mejorado o la documentación se actualizó en los últimos dos años (mejora continua)."}],"madurez":[{"n":"Inexistente","rango":"0.00 – 0.99","t":"Carencia completa de cualquier proceso reconocible. La empresa no ha reconocido siquiera que existe un problema a resolver."},{"n":"Inicial","rango":"1.00 – 1.99","t":"Existe evidencia que la empresa ha reconocido que los problemas existen y requieren ser resueltos. Sin embargo; no existen procesos estándar en su lugar existen enfoques ad hoc que tienden a ser aplicados de forma individual o caso por caso. El enfoque general hacia la administración es desorganizado."},{"n":"Repetible","rango":"2.00 – 2.99","t":"Se han desarrollado los procesos hasta el punto en que se siguen procedimientos similares en diferentes áreas que realizan la misma tarea. No hay entrenamiento o comunicación formal de los procedimientos estándar, y se deja la responsabilidad al individuo. Existe un alto grado de confianza en el conocimiento de los individuos y, por lo tanto, los errores son muy probables."},{"n":"Definido","rango":"3.00 – 3.99","t":"Los procedimientos se han estandarizado y documentado, y se han difundido a través de entrenamiento. Sin embargo, se deja que el individuo decida utilizar estos procesos, y es poco probable que se detecten desviaciones. Los procedimientos en sí no son sofisticados pero formalizan las prácticas existentes."},{"n":"Gestionado","rango":"4.00 – 4.99","t":"Es posible monitorear y medir el cumplimiento de los procedimientos y tomar medidas cuando los procesos no estén trabajando de forma efectiva. Los procesos están bajo constante mejora y proporcionan buenas prácticas. Se usa la automatización y herramientas de una manera limitada o fragmentada."},{"n":"Optimizado","rango":"5","t":"Los procesos se han refinado hasta un nivel de mejor práctica, se basan en los resultados de mejoras continuas y en un modelo de madurez con otras empresas. TI se usa de forma integrada para automatizar el flujo de trabajo, brindando herramientas para mejorar la calidad y la efectividad, haciendo que la empresa se adapte de manera rápida."}],"glosario":[["Actividades de revisión y ajustes","Para revisar el desempeño de la entidad, una organización puede considerar qué tan bien funcionan los componentes de gestión de riesgos empresariales a lo largo del tiempo a la luz de cambios sustanciales y qué revisiones se necesitan."],["Apetito al riesgo","Cantidad y tipo de riesgo que la Institución está dispuesta a aceptar en la búsqueda de su misión y objetivos; se expresa con límites cuantitativos aprobados por el Consejo."],["Autoevaluación","Actividad desarrollada por el personal de la empresa para revisar y analizar los procesos y operaciones sujetos a su competencia funcional. Constituye una herramienta diseñada como parte del Sistema de Control Interno que comprende un conjunto de elementos de control que actúan coordinadamente permitiendo en cada proceso, operación o nivel organizacional medir la eficacia y calidad de los controles."],["Bitácora de auditoría","Registro cronológico e inalterable de las acciones realizadas por los usuarios del sistema, encadenado con huellas digitales (hash) para detectar alteraciones."],["Capacidad de riesgo","Nivel máximo de riesgo que la Institución puede asumir sin comprometer su solvencia, liquidez o continuidad."],["Cargo","Denominación del puesto laboral dentro del Cuadro de Asignación de Personal."],["Componente","Uno de los cinco elementos del control interno. Los componentes del control interno son el Entorno de Control, Evaluación de Riesgos, Actividades de Control, Información y Comunicación, y Actividades de Supervisión."],["Contraloría de crédito","Función que supervisa de forma independiente el proceso de crédito (originación, seguimiento y recuperación) y el cumplimiento de las políticas aprobadas."],["Control","(1) Como sustantivo (esto es, la existencia de un control), una política o un procedimiento que forman parte del control interno. Los controles existen dentro de cada uno de los cinco componentes. (2) Como verbo (esto es, controlar) establecer o implementar una política o un procedimiento que lleve a cabo un principio."],["Control interno","Proceso integral efectuado por el Directorio, la Gerencia y el personal de una empresa, diseñado para enfrentar los riesgos de la empresa y para dar seguridad razonable en la consecución de la misión de la empresa, se alcanzarán los siguientes objetivos:\n\n• Promover la eficacia, eficiencia, transparencia y economía en las operaciones de la empresa, así como la calidad de los servicios públicos que presta.\n• Cuidar y resguardar los recursos y bienes del Estado contra cualquier forma de pérdida, deterioro, uso indebido y actos ilegales, así como, en general, contra todo hecho irregular o situación perjudicial que pudiera afectarlos.\n• Cumplir la normatividad aplicable a la empresa y a sus operaciones.\n• Garantizar la confiabilidad y oportunidad de la información.\n• Fomentar e impulsar la práctica de valores institucionales.\n• Promover el cumplimiento del Directorio, la Gerencia y el personal de rendir cuentas por los fondos y bienes públicos a su cargo o por una misión u objetivo encargado y aceptado."],["Control interno efectivo","Un sistema efectivo de control interno requiere que cada uno de los cinco componentes o principios esté presente, en funcionamiento y operando conjuntamente. Debido a que el control interno es un proceso la efectividad del mismo se mide a través el tiempo."],["COSO","The Committee of Sponsoring Organizations of the Treadway Commission. COSO es una iniciativa conjunta de cinco organizaciones del sector privado que se dedica a elaborar fuentes de liderazgo empresarial mediante el desarrollo de directrices y marcos detallados de trabajo en las áreas de control interno, gestión de riesgos corporativos y lucha contra el fraude (véase www.coso.org)."],["Deficiencia de control interno","Cualquier falta de un componente o componentes y sus principios que reducen la probabilidad de que una empresa cumpla sus objetivos."],["Desempeño","Riesgos que pueden afectar el logro de la estrategia y los objetivos de negocio pueden ser identificados y evaluados. Riesgos son priorizados por severidad y en el contexto del apetito al riesgo. La organización selecciona las respuestas al riesgo y toma el riesgo que ha asumido."],["Directorio","Es el órgano colegiado a cargo de la dirección de la Empresa."],["Empresa","Nombre de su Empresa Empresa"],["Establecimiento de estrategias y objetivos","Gestión de riesgos empresariales, estrategia y objetivos trabajan juntos en el proceso de planeación estratégica. El apetito al riesgo es definido y alineado con la estrategia; los objetivos de negocio ponen la estrategia en practica mientras sirve para identificar, evaluar y responder a los riesgos."],["Evaluación del sistema de control interno","Actividad desarrollada cuyo objetivo es verificar la existencia, nivel de desarrollo y el grado de efectividad del control interno en el cumplimiento de los objetivos de la empresa."],["Funcionar de forma integrada","Determinación de que los cinco componentes reducen colectivamente, a un nivel aceptable, el riesgo de no alcanzar un objetivo."],["Gobierno y cultura organizacional y de riesgos","El gobierno establece el tono de la organización, reforzando la importancia de, y estableciendo responsabilidades de supervisión, para la gestión de riesgos empresariales. La cultura se refiere a valores éticos, comportamientos deseados y comprensión del riesgo en la entidad."],["Hallazgo de auditoría","Resultado de comparar la condición observada con el criterio aplicable; se documenta con condición, criterio, causa, efecto y recomendación."],["ICOR","Índice de cobertura: reservas preventivas entre cartera vencida."],["IMOR","Índice de morosidad: cartera vencida entre cartera total."],["Indicador clave de riesgo (KRI)","Métrica que anticipa cambios en el perfil de riesgo y se compara con umbrales de apetito y tolerancia para generar alertas tempranas."],["Información, comunicación y reporte","La gestión de riesgos empresariales requiere un proceso continuo para obtener y compartir información necesaria, de fuentes internas y externas, que fluya en todas las direcciones y a través de toda la organización."],["Lineamiento","Son pautas sobre las cuáles se desprenden las políticas."],["Mesa de control","Función que verifica, antes de la disposición del crédito, que el expediente esté completo, las autorizaciones correspondan al nivel facultado y se cumplan las condiciones aprobadas."],["Modelo de las Tres Líneas","Modelo del IIA (2020) que distingue los roles del órgano de gobierno, la dirección (primera y segunda línea) y la auditoría interna (tercera línea, independiente)."],["Plan de solución (PS)","Conjunto de acciones, responsables, fechas, presupuesto y entregables para corregir una deficiencia de control interno."],["Políticas","Declaración del Directorio o Gerencia que reflejan su visión sobre lo que debe hacerse para llevar a cabo el control. Dicha visión puede documentarse por escrito y plasmarse expresamente en otras comunicaciones o bien de manera implícita a través de las decisiones y medidas adoptadas. Una política sirve como base sobre la que desarrollar los procedimientos."],["Procedimiento","Una medida que pone operativa una política."],["Proceso","Conjunto de actividades, tareas y procedimientos organizados y repetibles que producen un resultado esperado."],["Punto de interés","Tienen como propósito proporcionar material de orientación para el diseño, implementación y operación de los principios a los que se encuentran asociados. Los puntos de interés se consideran relevantes para la implementación del sistema de control interno."],["Respuesta ante un riesgo","La decisión de aceptar, evitar, reducir o compartir un riesgo."],["Riesgo","La condición en que existe la posibilidad de que un evento ocurra e impacte negativamente sobre los objetivos de la empresa."],["Riesgo inherente","El riesgo que afecta a la consecución de objetivos de la empresa en caso de que no concurran las medidas adoptadas para administrar los riesgos."],["Riesgo residual","El riesgo que afecta a la consecución de objetivos de la empresa y que sigue existiendo una vez adoptadas e implementadas las acciones dispuestas para administrar el riesgo."],["Seguridad razonable","Concepto que describe que, el control interno, con independencia de lo bien diseñado y desarrollado que este, no puede garantizar que se cumpla los objetivos de la empresa. Esto se debe a las limitaciones inherentes de todos los sistemas de control interno."],["Sistema de control interno","Conjunto de procesos, mecanismos y elementos organizados y relacionados que interactúan entre sí, y que se aplican de manera específica por una Empresa en sus procesos de gestión, para dar certidumbre a la toma de decisiones y conducirla con una seguridad razonable al logro de sus objetivos y metas en un ambiente ético, de calidad, mejora continua, eficiencia y de cumplimiento de las leyes aplicables, en concordancia con las normas de la actividad empresarial del Estado."],["Tolerancia al riesgo","El nivel aceptable de variación del desempeño en relación con la consecución de los objetivos de la empresa."]],"normativa":[{"nombre":"Ley para Regular las Actividades de las Sociedades Cooperativas de Ahorro y Préstamo (LRASCAP)","tipo":"Externa","ambito":"SOCAP"},{"nombre":"Disposiciones de carácter general aplicables a las SOCAP (CNBV)","tipo":"Externa","ambito":"SOCAP"},{"nombre":"Ley de Ahorro y Crédito Popular y sus disposiciones (SOFIPO)","tipo":"Externa","ambito":"SOFIPO"},{"nombre":"Ley General de Organizaciones y Actividades Auxiliares del Crédito (SOFOM)","tipo":"Externa","ambito":"SOFOM"},{"nombre":"Ley General de Sociedades Mercantiles (LGSM)","tipo":"Externa","ambito":"General"},{"nombre":"Ley General de Sociedades Cooperativas (LGSC)","tipo":"Externa","ambito":"General"},{"nombre":"Ley del Impuesto sobre la Renta","tipo":"Externa","ambito":"Fiscal"},{"nombre":"Ley del Impuesto al Valor Agregado","tipo":"Externa","ambito":"Fiscal"},{"nombre":"Ley Federal del Trabajo","tipo":"Externa","ambito":"Laboral"},{"nombre":"Ley de Protección y Defensa al Usuario de Servicios Financieros y disposiciones CONDUSEF","tipo":"Externa","ambito":"Usuarios"},{"nombre":"Ley para la Transparencia y Ordenamiento de los Servicios Financieros y circulares de Banco de México (CAT, GAT, contratos, estados de cuenta)","tipo":"Externa","ambito":"Usuarios"},{"nombre":"Ley Federal para la Prevención e Identificación de Operaciones con Recursos de Procedencia Ilícita y disposiciones PLD/FT aplicables","tipo":"Externa","ambito":"PLD/FT"},{"nombre":"Ley para Regular las Sociedades de Información Crediticia","tipo":"Externa","ambito":"Crédito"},{"nombre":"Ley Federal de Protección de Datos Personales en Posesión de los Particulares (2025)","tipo":"Externa","ambito":"Datos personales"},{"nombre":"COSO ERM — Gestión del riesgo empresarial: integración con estrategia y desempeño (2017)","tipo":"Externa","ambito":"Marco"},{"nombre":"COSO Control Interno — Marco Integrado (2013)","tipo":"Externa","ambito":"Marco"},{"nombre":"IIA — Normas Globales de Auditoría Interna (2024)","tipo":"Externa","ambito":"Marco"},{"nombre":"IIA — Modelo de las Tres Líneas (2020)","tipo":"Externa","ambito":"Marco"},{"nombre":"ISO 31000:2018 Gestión del riesgo","tipo":"Externa","ambito":"Marco"},{"nombre":"ISO/IEC 27001:2022 Seguridad de la información","tipo":"Externa","ambito":"Marco"},{"nombre":"ISO 22301:2019 Continuidad del negocio","tipo":"Externa","ambito":"Marco"},{"nombre":"ISO/IEC 42001:2023 Sistemas de gestión de inteligencia artificial","tipo":"Externa","ambito":"Marco"},{"nombre":"COBIT 2019 Gobierno y gestión de TI","tipo":"Externa","ambito":"Marco"},{"nombre":"Manual De Control Interno","tipo":"Interna","ambito":"Manual"},{"nombre":"Manual De Crédito Y Cobranza","tipo":"Interna","ambito":"Manual"},{"nombre":"Manual De Captación De Socios","tipo":"Interna","ambito":"Manual"},{"nombre":"Manual De Mercadotecnia","tipo":"Interna","ambito":"Manual"},{"nombre":"Manual De Riesgos","tipo":"Interna","ambito":"Manual"},{"nombre":"Manual De Pld Cumplimiento","tipo":"Interna","ambito":"Manual"},{"nombre":"Manual De Captación De Ahorros E Inversiones","tipo":"Interna","ambito":"Manual"},{"nombre":"Manual De Auditoría Interna","tipo":"Interna","ambito":"Manual"},{"nombre":"Manual De Recursos Humanos","tipo":"Interna","ambito":"Manual"},{"nombre":"Manual De Administración Y Finanzas","tipo":"Interna","ambito":"Manual"},{"nombre":"Manual De Contabilidad","tipo":"Interna","ambito":"Manual"},{"nombre":"Manual De Informática","tipo":"Interna","ambito":"Manual"},{"nombre":"Reglamentos De Consejos Y Directivos","tipo":"Interna","ambito":"Manual"},{"nombre":"Manual De Contraloría De Crédito Y Mesa De Control","tipo":"Interna","ambito":"Manual"},{"nombre":"Manual De Contraloría Interna","tipo":"Interna","amb   const r = aleatorio(10);
  let s = [...r].map((x) => abc[x % abc.length]).join('');
  return s.slice(0, 5) + (r[0] % 10) + s.slice(5);
}

/* Cifrado de respaldos: AES-GCM con llave PBKDF2 a partir de una frase. */
async function llaveFrase(frase, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(frase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function cifrar(texto, frase) {
  const salt = aleatorio(16), iv = aleatorio(12);
  const k = await llaveFrase(frase, salt);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, new TextEncoder().encode(texto));
  return { salt: b64(salt), iv: b64(iv), datos: b64(ct) };
}
async function descifrar(obj, frase) {
  const k = await llaveFrase(frase, deB64(obj.salt));
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deB64(obj.iv) }, k, deB64(obj.datos));
  return new TextDecoder().decode(pt);
}
