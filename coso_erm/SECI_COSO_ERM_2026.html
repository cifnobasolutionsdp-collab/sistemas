/* Bitácora encadenada ------------------------------------------------- */
function bitacora(accion, detalle = '') {
  if (!DB) return;
  const prev = DB.bitacora.length ? DB.bitacora[DB.bitacora.length - 1].h : '0';
  const e = { ts: ahora(), usuario: SES ? SES.usuario : '—', rol: SES ? SES.rol : '—', accion, detalle: String(detalle).slice(0, 400), prev };
  e.h = sha256(prev + '|' + e.ts + '|' + e.usuario + '|' + e.rol + '|' + e.accion + '|' + e.detalle);
  DB.bitacora.push(e);
  if (DB.bitacora.length > MAX_BITACORA) DB.bitacora.splice(0, DB.bitacora.length - MAX_BITACORA);
}
function verificarBitacora() {
  const L = DB.bitacora;
  for (let i = 0; i < L.length; i++) {
    const e = L[i];
    if (i > 0 && e.prev !== L[i - 1].h) return { ok: false, i, e };
    const h = sha256(e.prev + '|' + e.ts + '|' + e.usuario + '|' + e.rol + '|' + e.accion + '|' + e.detalle);
    if (h !== e.h) return { ok: false, i, e };
  }
  return { ok: true, n: L.length };
}

/* Autoguardado a archivo local (Chrome/Edge) --------------------------- */
const FS = { handle: null, estado: 'no' }; // no | activo | permiso | nosoportado
const fsSoportado = () => 'showSaveFilePicker' in window;
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('seci.coso.fs', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('h');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(k, v) { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction('h', 'readwrite'); v == null ? t.objectStore('h').delete(k) : t.objectStore('h').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function idbGet(k) { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction('h').objectStore('h').get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); }
async function fsIniciar() {
  if (!fsSoportado()) { FS.estado = 'nosoportado'; return; }
  try {
    FS.handle = await idbGet('archivo');
    if (!FS.handle) { FS.estado = 'no'; return; }
    const p = await FS.handle.queryPermission({ mode: 'readwrite' });
    FS.estado = p === 'granted' ? 'activo' : 'permiso';
  } catch { FS.estado = 'no'; }
}
async function fsVincular() {
  const h = await window.showSaveFilePicker({ suggestedName: 'SECI_datos.json', types: [{ description: 'Respaldo SECI', accept: { 'application/json': ['.json'] } }] });
  FS.handle = h;
  await idbSet('archivo', h);
  FS.estado = 'activo';
  await autoguardarArchivo();
  bitacora('Autoguardado', 'Vinculó archivo local ' + h.name);
  guardar();
}
async function fsReactivar() {
  if (!FS.handle) return;
  const p = await FS.handle.requestPermission({ mode: 'readwrite' });
  FS.estado = p === 'granted' ? 'activo' : 'permiso';
  if (FS.estado === 'activo') await autoguardarArchivo();
}
async function fsDesvincular() { FS.handle = null; FS.estado = 'no'; await idbSet('archivo', null); }
async function autoguardarArchivo() {
  if (FS.estado !== 'activo' || !FS.handle) return;
  try {
    const w = await FS.handle.createWritable();
    await w.write(JSON.stringify(paqueteRespaldo()));
    await w.close();
    FS.ultimo = ahora();
  } catch (e) {
    FS.estado = 'permiso';
    console.warn('Autoguardado', e);
  }
}
function paqueteRespaldo() {

async function login(usuario, pass) {
  const u = DB.users.find((x) => x.usuario.toLowerCase() === usuario.trim().toLowerCase());
  if (!u) { SES = null; bitacora('Acceso fallido', 'Usuario inexistente: ' + usuario); guardar(); throw new Error('Usuario o contraseña incorrectos.'); }
  if (!u.activo) throw new Error('El usuario está inactivo. Contacte al área de Sistemas.');
  if (u.bloqueoHasta && new Date(u.bloqueoHasta) > new Date()) {
    throw new Error('Usuario bloqueado temporalmente por intentos fallidos. Intente después de ' + new Date(u.bloqueoHasta).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }));
  }
  const h = await hashPassword(pass, u.salt, u.alg);
  if (h !== u.hash) {
    u.intentos = (u.intentos || 0) + 1;
    if (u.intentos >= 5) { u.bloqueoHasta = new Date(Date.now() + 10 * 60000).toISOString(); u.intentos = 0; }
    SES = null;
    bitacora('Acceso fallido', 'Contraseña incorrecta: ' + u.usuario);
    guardar();
    throw new Error('Usuario o contraseña incorrectos.');
  }
  u.intentos = 0; u.bloqueoHasta = null; u.ultimoAcceso = ahora();
  SES = { uid: u.id, usuario: u.usuario, rol: u.rol, nombre: u.nombre, t: Date.now() };
  sessionStorage.setItem(SES_KEY, JSON.stringify(SES));
  bitacora('Inicio de sesión', ROLES[u.rol].n);
  guardar();
}

}

const PREGUNTAS = [];
const PRINCIPIOS = [];
for (const c of B.components) for (const p of c.principles) {
  PRINCIPIOS.push({ ...p, comp: c.code });
  for (const q of p.q) PREGUNTAS.push({ ...q, comp: c.code, p: p.n });
}
const PREG = Object.fromEntries(PREGUNTAS.map((q) => [q.id, q]));
const COMP = Object.fromEntries(B.components.map((c) => [c.code, c]));
const TEMAS = [...new Set(PREGUNTAS.map((q) => q.tema).filter(Boolean))].sort();
const ATR = B.atributos;

const lead = (a) => { let n = 0; for (const x of a) { if (x === 1) n++; else break; } return n; };
function nivel(a) {
  if (!a) return null;
  const L = lead(a);
  return L >= 8 ? 5 : L >= 7 ? 4 : L >= 5 ? 3 : L >= 4 ? 2 : L >= 2 ? 1 : 0;
}
const noAcumulativo = (a) => !!a && a.slice(lead(a)).some((x) => x === 1);
const presente = (a) => !!a && (a[0] + a[1] + a[2] + a[3]) >= 3;
const funcionando = (a) => !!a && (a[4] + a[5] + a[6] + a[7]) >= 3;
function riesgoQ(a) {
  if (!a) return null;
  const s = sum(a);
  return s > 6 ? 'Bajo' : s > 4 ? 'Moderado' : 'Alto';
}
function madurez(score) {
  if (score == null) return '—';
  return score < 1 ? 'Inexistente' : score < 2 ? 'Inicial' : score < 3 ? 'Repetible' : score < 4 ? 'Definido' : score < 5 ? 'Gestionado' : 'Optimizado';
}
const clsMadurez = (s) => s == null ? 'b-neutral' : s < 2 ? 'b-crit' : s < 3 ? 'b-serious' : s < 4 ? 'b-warn' : 'b-good';
const clsRiesgo = (r) => ({ Bajo: 'b-good', Moderado: 'b-warn', Alto: 'b-crit' }[r] || 'b-neutral');
const badgeMadurez = (s) => s == null ? '<span class="muted">Sin datos</span>' : `<span class="badge ${clsMadurez(s)}">${esc(madurez(s))}</span>`;
const badgeRiesgo = (r) => r ? `<span class="badge ${clsRiesgo(r)}">Riesgo ${esc(r.toLowerCase())}</span>` : '';

function evalActiva() { return DB.evals.find((e) => e.id === DB.evalActiva) || null; }
const evalBloqueada = (ev) => !ev || ev.estado === 'Cerrada';

function planEstado(r) {
  if (!r || !(r.plan || r.defi)) return null;
  if ((r.avance || 0) >= 100 || r.estadoPlan === 'Concluido') return 'Concluido';
  if (r.ff && r.ff < hoy()) return 'Vencido';
  return r.estadoPlan || ((r.avance || 0) > 0 ? 'En proceso' : 'Pendiente');
}
function requierePlan(r) {
  const lv = nivel(r && r.a);
  return lv != null && lv < 4 && ['Alta', 'Media'].includes(r.prio);
}

function stats(ev) {
  const R = (ev && ev.resp) || {};
  const pesos = DB.config.pesos;
  const out = { comps: [], total: 0, contestadas: 0, errores: [], sinEvidencia: [], sinPlan: [], porValidar: 0, validadas: 0, observadas: 0, riesgo: { Bajo: 0, Moderado: 0, Alto: 0 }, presente: 0, funcionando: 0, planes: { total: 0, Vencido: 0, Concluido: 0, 'En proceso': 0, Pendiente: 0 } };
  for (const c of B.components) {
    const cs = { code: c.code, name: c.name, peso: pesos[c.code] ?? c.peso, principles: [], total: 0, contestadas: 0, presente: 0, funcionando: 0, riesgo: { Bajo: 0, Moderado: 0, Alto: 0 } };
    for (const p of c.principles) {
      const ps = { n: p.n, t: p.t, total: 0, contestadas: 0, suma: 0, presente: 0, funcionando: 0 };
      for (const q of p.q) {
        ps.total++;
        const r = R[q.id];
        if (r && r.a) {
          const lv = nivel(r.a);
          ps.contestadas++; ps.suma += lv;
          if (presente(r.a)) ps.presente++;
          if (funcionando(r.a)) ps.funcionando++;
          const rq = riesgoQ(r.a);
          cs.riesgo[rq]++; out.riesgo[rq]++;
          if (noAcumulativo(r.a)) out.errores.push({ id: q.id, motivo: 'Atributos no acumulativos: hay atributos marcados después de uno sin cumplir (el nivel se calcula hasta el primer atributo faltante).' });
          const ev2 = r.ev || [];
          const faltan = [];
          if (r.a[0] && r.a[1] && !ev2[0]) faltan.push('a-b');
          for (let k = 2; k < 8; k++) if (r.a[k] && !ev2[k - 1]) faltan.push(ATR[k].k);
          if (faltan.length) out.sinEvidencia.push({ id: q.id, faltan });
          if (requierePlan(r) && !r.plan) out.sinPlan.push(q.id);
          const v = r.val && r.val.estado;
          if (v === 'Validado') out.validadas++; else if (v === 'Con observaciones') out.observadas++; else out.porValidar++;
        }
        const pe = planEstado(r);
        if (pe) { out.planes.total++; out.planes[pe]++; }
      }
      ps.score = ps.contestadas ? ps.suma / ps.contestadas : null;
      cs.total += ps.total; cs.contestadas += ps.contestadas; cs.presente += ps.presente; cs.funcionando += ps.funcionando;
      cs.principles.push(ps);
    }
    cs.score = avg(cs.principles.map((p) => p.score));
    cs.pctPresente = cs.total ? cs.presente / cs.total : 0;
    cs.pctFuncionando = cs.total ? cs.funcionando / cs.total : 0;
    out.total += cs.total; out.contestadas += cs.contestadas; out.presente += cs.presente; out.funcionando += cs.funcionando;
    out.comps.push(cs);
  }
  const conScore = out.comps.filter((c) => c.score != null);
  const sp = sum(conScore.map((c) => c.peso));
  out.global = conScore.length && sp ? sum(conScore.map((c) => c.score * c.peso)) / sp : null;
  out.promedioSimple = avg(out.comps.map((c) => c.score));
  out.pendientes = out.total - out.contestadas;
  const u = DB.config.umbralIntegracion;
  out.integrado = out.pendientes === 0 && out.comps.every((c) => c.score >= 3 && c.pctPresente >= u && c.pctFuncionando >= u);
  return out;
}

/* Riesgos e indicadores ------------------------------------------------ */
const sev = (p, i) => (p || 0) * (i || 0);
function nivelSev(s) {
  if (!s) return { n: 'Sin evaluar', c: 'b-neutral' };
  return s >= 15 ? { n: 'Crítico', c: 'b-crit' } : s >= 10 ? { n: 'Alto', c: 'b-serious' } : s >= 5 ? { n: 'Medio', c: 'b-warn' } : { n: 'Bajo', c: 'b-good' };
}
function ultimoValor(k) {
  const v = [...(k.valores || [])].sort((a, b) => a.periodo.localeCompare(b.periodo));
  return v[v.length - 1] || null;
}
function estadoKRI(k, valor) {
  if (valor == null) return { n: 'Sin dato', c: 'b-neutral' };
  const peor = k.sentido === 'alto' ? (x, lim) => x > lim : (x, lim) => x < lim;
  if (!peor(valor, k.apetito)) return { n: 'Dentro del apetito', c: 'b-good' };
  if (!peor(valor, k.tolerancia)) return { n: 'En tolerancia', c: 'b-warn' };
  if (!peor(valor, k.capacidad)) return { n: 'Excede tolerancia', c: 'b-serious' };
  return { n: 'Excede capacidad', c: 'b-crit' };
}
function estadoRevision(r) {
  const items = r.items || {};
  const nc = DB.mesa.checklist.filter((c) => items[c.id] === 'NC');
  if (nc.some((c) => c.critico)) return 'Detenido';
  if (nc.length) return 'Liberado con excepción';
  return 'Liberado';
}
const clsRevision = (s) => ({ Liberado: 'b-good', 'Liberado con excepción': 'b-warn', Detenido: 'b-crit' }[s] || 'b-neutral');
function hallazgoVencido(h) { return !['Solventado', 'Cerrado'].includes(h.estatus) && h.fechaCompromiso && h.fechaCompromiso < hoy(); }
function valorAuto(tipo) {
  const ultimo = [...DB.cartera.cortes].sort((a, b) => a.periodo.localeCompare(b.periodo)).pop();
  if (tipo === 'imor') return ultimo && ultimo.total ? +(100 * ultimo.vencido / ultimo.total).toFixed(2) : null;
  if (tipo === 'conc20') return ultimo && ultimo.total ? +(100 * sum(ultimo.top.slice(0, 20).map((t) => t.saldo)) / ultimo.total).toFixed(2) : null;
  if (tipo === 'excMesa') {
    const per = periodoActual();
    let revs = DB.mesa.revisiones.filter((r) => (r.fecha || '').startsWith(per));
    if (!revs.length) revs = DB.mesa.revisiones;
    return revs.length ? +(100 * revs.filter((r) => estadoRevision(r) !== 'Liberado').length / revs.length).toFixed(2) : null;
  }
  if (tipo === 'planesVenc') { const ev = evalActiva(); return ev ? stats(ev).planes.Vencido : null; }
  if (tipo === 'hallVenc') return DB.hallazgos.filter(hallazgoVencido).length;
  return null;
}

/* Modal: devuelve una promesa que resuelve con el botón presionado. */
let _modalResolve = null;
function modal({ titulo, cuerpo, botones = [{ id: 'ok', t: 'Aceptar', primary: true }], chico = false, alAbrir }) {
  cerrarModal();
  $('#modal-root').innerHTML = `
    <div class="modal-back" data-act="modal-fondo">
      <div class="modal ${chico ? 'sm' : ''}" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
        <header><h2 id="modal-titulo">${esc(titulo)}</h2><button class="btn ghost sm" data-modal="cancel" aria-label="Cerrar">${ico('cerrar')}</button></header>
        <div class="body">${cuerpo}</div>
        <footer>${botones.map((b) => `<button class="btn ${b.primary ? 'primary' : ''} ${b.danger ? 'danger' : ''}" data-modal="${esc(b.id)}">${esc(b.t)}</button>`).join('')}</footer>
      </div>
    </div>`;
  const m = $('.modal');
  const f = m.querySelector('input:not([type=hidden]):not([disabled]), select:not([disabled]), textarea:not([disabled])');
  (f || m.querySelector('[data-modal]')).focus();
  if (alAbrir) alAbrir(m);
  return new Promise((res) => { _modalResolve = res; });
}
function cerrarModal(valor = null) {
  if (_modalResolve) { const r = _modalResolve; _modalResolve = null; r(valor); }
  $('#modal-root').innerHTML = '';
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-modal]');
  if (b) {
    const id = b.dataset.modal;
    if (id === 'cancel') return cerrarModal('cancel');
    const res = _modalResolve;
    // El llamador decide si cierra (validaciones): resolvemos sin cerrar.
    if (res) { _modalResolve = null; res(id); }
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('.modal')) cerrarModal('cancel'); });
async function confirmar(titulo, texto, { ok = 'Confirmar', peligro = false } = {}) {
  const r = await modal({ titulo, cuerpo: `<p>${texto}</p>`, chico: true, botones: [{ id: 'cancel', t: 'Cancelar' }, { id: 'ok', t: ok, primary: !peligro, danger: peligro }] });
  cerrarModal();
  return r === 'ok';
}
/* Formulario modal con validación: `validar(datos)` devuelve mensaje de error o null. */
async function formModal(opts, validar) {
  let r = await modal(opts);
  while (r && r !== 'cancel') {
    const datos = leerForm($('.modal'));
    const err = validar ? await validar(datos, r) : null;
    if (!err) { cerrarModal(); return { boton: r, datos }; }
    let box = $('.modal .form-err');
    if (!box) { box = document.createElement('div'); box.className = 'callout crit form-err'; box.style.marginBottom = '.75rem'; $('.modal .body').prepend(box); }
    box.textContent = err;
    r = await new Promise((res) => { _modalResolve = res; });
  }
  cerrarModal();
  return null;
}
function leerForm(el) {
  const o = {};
  for (const x of $$('[name]', el)) {
    if (x.type === 'checkbox') o[x.name] = x.checked;
    else if (x.type === 'radio') { if (x.checked) o[x.name] = x.value; }
    else if (x.type === 'file') o[x.name] = x.files;
    else o[x.name] = x.value;
  }
  return o;
}

/* Campos de formulario ------------------------------------------------- */
function campo(nombre, etiqueta, valor = '', { tipo = 'text', opciones = null, dis = false, req = false, ph = '', ayuda = '', attrs = '', lista = '' } = {}) {
  const id = 'f_' + nombre + '_' + Math.random().toString(36).slice(2, 6);
  let input;
  if (opciones) {
    input = `<select id="${id}" name="${esc(nombre)}" ${dis ? 'disabled' : ''} ${attrs}>${opciones.map((o) => {
      const [v, t] = Array.isArray(o) ? o : [o, o];
      return `<option value="${esc(v)}" ${String(v) === String(valor ?? '') ? 'selected' : ''}>${esc(t)}</option>`;
    }).join('')}</select>`;
  } else if (tipo === 'textarea') {
    input = `<textarea id="${id}" name="${esc(nombre)}" ${dis ? 'disabled' : ''} placeholder="${esc(ph)}" ${attrs}>${esc(valor)}</textarea>`;
  } else if (tipo === 'checkbox') {
    return `<label class="row" style="margin-bottom:.6rem"><input type="checkbox" name="${esc(nombre)}" ${valor ? 'checked' : ''} ${dis ? 'disabled' : ''} ${attrs}> ${esc(etiqueta)}</label>`;
  } else {
    input = `<input id="${id}" type="${tipo}" name="${esc(nombre)}" value="${esc(valor)}" ${dis ? 'disabled' : ''} ${req ? 'required' : ''} placeholder="${esc(ph)}" ${lista ? `list="${esc(lista)}"` : ''} ${attrs}>`;
  }
  return `<div class="field"><label class="f" for="${id}">${esc(etiqueta)}${req ? ' *' : ''}</label>${input}${ayuda ? `<small>${esc(ayuda)}</small>` : ''}</div>`;
}
const datalist = (id, arr) => `<datalist id="${esc(id)}">${arr.map((x) => `<option value="${esc(x)}">`).join('')}</datalist>`;

/* Gráficas (HTML + CSS, con tooltip al pasar el cursor) ---------------- */
function barras(items, { max = 5, decimales = 2, sufijo = '', marcas = [1, 2, 3, 4, 5] } = {}) {
  if (!items.length) return '<div class="empty">Sin datos.</div>';
  return `<div class="chart-bars" style="display:grid;grid-template-columns:minmax(120px,32%) 1fr 56px;gap:.45rem .75rem;align-items:center">
    ${items.map((it) => {
      const v = it.valor;
      const pct = v == null ? 0 : clamp(v / max, 0, 1) * 100;
      return `<div style="font-size:.83rem;color:var(--text-2);line-height:1.25">${esc(it.etiqueta)}</div>
        <div style="position:relative;height:14px" data-tip="${esc(it.tip || (it.etiqueta + ': ' + (v == null ? 'sin datos' : fmtN(v, decimales) + sufijo)))}">
          ${marcas.map((m) => `<span style="position:absolute;left:${(m / max) * 100}%;top:-2px;bottom:-2px;border-left:1px dashed var(--line)"></span>`).join('')}
          <div style="position:absolute;inset:3px auto 3px 0;width:${pct}%;background:${it.color || 'var(--series-1)'};border-radius:0 4px 4px 0;min-width:${v ? 2 : 0}px"></div>
        </div>
        <div class="num" style="font-weight:650;text-align:right">${v == null ? '—' : fmtN(v, decimales) + sufijo}</div>`;
    }).join('')}
  </div>`;
}
function barrasDobles(items, series, { max = 5 } = {}) {
  const colores = ['var(--series-1)', 'var(--series-2)'];
  return `<div class="legend">${series.map((s, i) => `<span><i style="background:${colores[i]}"></i>${esc(s)}</span>`).join('')}</div>
  <div style="display:grid;grid-template-columns:minmax(120px,32%) 1fr;gap:.6rem .75rem;align-items:center">
    ${items.map((it) => `<div style="font-size:.83rem;color:var(--text-2)">${esc(it.etiqueta)}</div>
      <div style="display:grid;gap:3px">${it.valores.map((v, i) => `<div style="display:flex;align-items:center;gap:.5rem" data-tip="${esc(it.etiqueta + ' · ' + series[i] + ': ' + (v == null ? 'sin datos' : fmtN(v)))}">
        <div style="height:10px;width:${v == null ? 0 : clamp(v / max, 0, 1) * 85}%;background:${colores[i]};border-radius:0 4px 4px 0"></div>
        <span class="num" style="font-size:.78rem;color:var(--text-2)">${v == null ? '—' : fmtN(v)}</span></div>`).join('')}</div>`).join('')}
  </div>`;
}
function apilada(partes) {
  const total = sum(partes.map((p) => p.v));
  if (!total) return '<div class="empty">Sin puntos de interés evaluados.</div>';
  return `<div style="display:flex;height:22px;gap:2px;border-radius:5px;overflow:hidden">${partes.filter((p) => p.v).map((p) => `<div style="flex:${p.v};background:${p.color}" data-tip="${esc(p.n + ': ' + p.v + ' (' + fmtPct(p.v / total) + ')')}"></div>`).join('')}</div>
    <div class="legend" style="margin-top:.5rem">${partes.map((p) => `<span><i style="background:${p.color}"></i>${esc(p.n)}: <b class="num">${p.v}</b> (${fmtPct(p.v / total, 0)})</span>`).join('')}</div>`;
}
function progreso(v, max = 1) {
  const pct = max ? clamp(v / max, 0, 1) * 100 : 0;
  return `<div class="bar-track" title="${fmtN(pct, 0)}%"><div class="bar-fill" style="width:${pct}%"></div></div>`;
}
/* Tooltip global */
document.addEventListener('mouseover', (e) => {
  const t = e.target.closest('[data-tip]');
  const tip = $('#tip');
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tip;
  tip.hidden = false;
});
document.addEventListener('mousemove', (e) => {
  const tip = $('#tip');
  if (tip.hidden) return;
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
  const y = e.clientY + 16 + tip.offsetHeight > window.innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});

/* Tema claro/oscuro */
function aplicarTema() {
  let t = null;
  try { t = localStorage.getItem(THEME_KEY); } catch { /* sin almacenamiento */ }
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}
function alternarTema() {
  const oscuro = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  try { localStorage.setItem(THEME_KEY, oscuro ? 'light' : 'dark'); } catch { /* sin almacenamiento */ }
  aplicarTema();
}

ACT['cambio-pass'] = async (f) => {

function nuevaEvaluacion(nombre, ejercicio, copiarDe = null) {
  const base = copiarDe ? DB.evals.find((e) => e.id === copiarDe) : null;
  const ev = {
    id: uid('e'), nombre, ejercicio, estado: 'Borrador', creada: ahora(), creadaPor: SES ? SES.usuario : '',
    banco: B.version,
    datos: base ? JSON.parse(JSON.stringify(base.datos)) : {
      empresa: DB.config.institucion, nombreComercial: DB.config.nombreComercial, director: '', contralorNombre: '', contralorCargo: 'Contralor Interno',
      presidenteCA: '', presidenteCargo: 'Presidente del Comité de Auditoría', revisadoPor: 'Presidente, Secretario y Vocales del Consejo de Administración',
      fechaInicio: hoy(), fechaFin: new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10), proximaEvaluacion: '',
      procesos: 'Gobierno\nCrédito y cobranza\nTalento humano\nTecnologías de la información\nContabilidad y finanzas', evaluadores: '', conclusiones: '', explicacion: '', notas: '',
    },
    resp: {},
  };
  if (base) {
    ev.datos.fechaInicio = hoy();
    // Se copian respuestas y evidencias; la validación de auditoría inicia de nuevo.
    for (const [k, r] of Object.entries(base.resp)) if (PREG[k]) { const c = JSON.parse(JSON.stringify(r)); delete c.val; ev.resp[k] = c; }
  }
  DB.evals.push(ev);
  DB.evalActiva = ev.id;
  bitacora('Alta de evaluación', nombre + (base ? ' (copia de ' + base.nombre + ')' : ''));
  return ev;
}
function cargarDemo(ev) {
  for (const [k, d] of Object.entries(B.demo)) {
    if (!PREG[k]) continue;
    const r = JSON.parse(JSON.stringify(d));
    if (r.a) r.a = r.a.map((x) => (x === 1 ? 1 : 0));
    if (r.matriz) r.matriz = /^s/i.test(r.matriz) ? 'Sí' : 'No';
    r.upd = { por: 'demo', fecha: ahora() };
    ev.resp[k] = r;
  }
  ev.datos.empresa = ev.datos.empresa || 'Institución de demostración';
  bitacora('Carga de demostración', ev.nombre);
}

/* Cuestionario --------------------------------------------------------- */
const FILTROS = [['', 'Todos'], ['pend', 'Sin contestar'], ['err', 'Con inconsistencia'], ['alto', 'Riesgo alto'], ['plan', 'Requieren plan'], ['val', 'Por validar'], ['obs', 'Con observaciones de auditoría'], ['nuevo', 'Nuevos 2026']];
let CUES = { q: '', f: '', tema: '' };
function filtraPregunta(q, r) {
  if (CUES.tema && q.tema !== CUES.tema) return false;
  if (CUES.q) {
    const t = norm(q.id + ' ' + q.t + ' ' + (q.orig || ''));
    if (!norm(CUES.q).split('_').every((w) => t.includes(w))) return false;
  }
  const a = r && r.a;
  switch (CUES.f) {
    case 'pend': return !a;
    case 'err': return noAcumulativo(a);
    case 'alto': return riesgoQ(a) === 'Alto';
    case 'plan': return requierePlan(r || {}) && !(r && r.plan);
    case 'val': return !!a && !(r.val && r.val.estado);
    case 'obs': return !!(r && r.val && r.val.estado === 'Con observaciones');
    case 'nuevo': return !!q.nuevo;
    default: return true;
  }
}
function htmlPregunta(q, r, editable) {

        ${q.tema ? `<span class="badge b-neutral plain">${esc(q.tema)}</span>` : ''}
        ${q.orig && q.orig !== q.id ? `<span class="badge b-neutral plain" title="Identificador en el Excel original">Excel ${esc(q.orig)}</span>` : ''}
        ${noAcumulativo(a) ? '<span class="badge b-crit">Atributos no acumulativos</span>' : ''}
        ${v ? `<span class="badge ${v === 'Validado' ? 'b-good' : 'b-serious'}">${esc(v)}</span>` : ''}
        ${r && r.prio ? `<span class="badge b-neutral">Prioridad ${esc(r.prio)}</span>` : ''}
        ${r && (r.plan || r.defi) ? `<span class="badge ${planEstado(r) === 'Vencido' ? 'b-crit' : 'b-neutral'}">Plan: ${esc(planEstado(r))}</span>` : ''}
      </div>
    </div>

      <div class="row">
        ${a ? `<span class="lvl" title="Nivel de cumplimiento según la tabla de criterios">Nivel ${lv}</span>
          <span class="badge ${presente(a) ? 'b-good' : 'b-neutral'} plain" title="a+b+c+d ≥ 3">${presente(a) ? 'Presente' : 'No presente'}</span>
          <span class="badge ${funcionando(a) ? 'b-good' : 'b-neutral'} plain" title="e+f+g+h ≥ 3">${funcionando(a) ? 'Funcionando' : 'No funcionando'}</span>
          ${badgeRiesgo(riesgoQ(a))}` : `<span class="muted">Sin contestar</span>${editable ? `<button class="btn sm" data-act="attr-cero" data-q="${q.id}" title="Registrar que no existe ningún atributo">Evaluar en 0</button>` : ''}`}
        <button class="btn sm" data-act="detalle" data-q="${q.id}">Detalle</button>

function htmlPrincipio(p, ev) {
  const st = stats(ev).comps.flatMap((c) => c.principles).find((x) => x.n === p.n);
  return `<header id="ph-${p.n}"><h3>Principio ${p.n}: ${esc(p.t)}</h3>

VISTAS.cuestionario = (args) => {
  const ev = evalActiva();
  if (!ev) return cabecera('Cuestionario') + sinEval();
  const qs = new URLSearchParams(location.hash.split('?')[1] || '');
  if (qs.get('f') != null) CUES.f = qs.get('f');
  const code = (args[0] || B.components[0].code).split('?')[0];
  const comp = COMP[code] || B.components[0];
  const editable = can('eval.responder') && !evalBloqueada(ev);
  const st = stats(ev);
  let total = 0;
  const cuerpo = comp.principles.map((p) => {
    const filas = p.q.filter((q) => filtraPregunta(q, ev.resp[q.id]));
    total += filas.length;
    if (!filas.length) return '';
    return `<section class="principle" data-p="${p.n}">${htmlPrincipio(p, ev)}${filas.map((q) => htmlPregunta(q, ev.resp[q.id], editable)).join('')}</section>`;
  }).join('');
  return `${cabecera('Cuestionario COSO ERM', `Marque los atributos que cumple cada punto de interés. El nivel (0–5) se obtiene de la tabla de criterios: <b>a</b> Existe · <b>b</b> Diseñada · <b>c</b> Aprobado · <b>d</b> Difundido · <b>e</b> Implementado · <b>f</b> Responsable · <b>g</b> Funcionamiento · <b>h</b> Mejora continua.`,

  <div class="tabs" role="tablist">${st.comps.map((c) => `<a href="#/cuestionario/${c.code}" class="${c.code === comp.code ? 'on' : ''}">${esc(c.name)} <small class="num">${c.contestadas}/${c.total}</small></a>`).join('')}</div>
  <div class="row no-print" style="margin-bottom:1rem">

function marcarCambio(r) { r.upd = { por: SES.usuario, fecha: ahora() }; if (r.val && r.val.estado === 'Validado') r.val = { ...r.val, estado: '', obs: (r.val.obs || '') + ' [Respuesta modificada después de validar]' }; }
ACT.attr = (t) => {

  const qid = t.dataset.q, i = Number(t.dataset.i);

  if (nuevo) for (let k = 0; k <= i; k++) r.a[k] = 1; else for (let k = i; k < 8; k++) r.a[k] = 0;
  marcarCambio(r);

function siguienteFolio(pref, lista, campoF = 'folio') {
  const anio = new Date().getFullYear();
  const n = lista.filter((x) => String(x[campoF] || '').startsWith(`${pref}-${anio}-`)).length + 1;
  return `${pref}-${anio}-${String(n).padStart(3, '0')}`;
}
async function editarHallazgo(id, pre = {}) {
  const h = id ? DB.hallazgos.find((x) => x.id === id) : { folio: siguienteFolio('H', DB.hallazgos), estatus: 'Abierto', severidad: 'Media', origen: 'Auditoría interna', seguimiento: [], ...pre };
  const ed = can('hallazgos');
  const res = await formModal({
    titulo: id ? `Hallazgo ${h.folio}` : 'Nuevo hallazgo',
    cuerpo: `<div class="grid g3">
      ${campo('folio', 'Folio', h.folio, { dis: !ed, req: true })}
      ${campo('origen', 'Origen', h.origen, { opciones: ORIGENES, dis: !ed })}
      ${campo('severidad', 'Severidad', h.severidad, { opciones: SEVERIDAD, dis: !ed })}
    </div>
    ${campo('titulo', 'Título', h.titulo, { dis: !ed, req: true })}
    <div class="grid g2">
      ${campo('condicion', 'Condición (lo que se encontró)', h.condicion, { tipo: 'textarea', dis: !ed })}
      ${campo('criterio', 'Criterio (norma, política o punto de interés incumplido)', h.criterio, { tipo: 'textarea', dis: !ed })}
      ${campo('causa', 'Causa', h.causa, { tipo: 'textarea', dis: !ed })}
      ${campo('efecto', 'Efecto / riesgo', h.efecto, { tipo: 'textarea', dis: !ed })}
    </div>
    ${campo('recomendacion', 'Recomendación', h.recomendacion, { tipo: 'textarea', dis: !ed })}
    <div class="grid g3">
      ${campo('qid', 'Punto de interés COSO vinculado', h.qid, { dis: !ed, ph: 'p. ej. 3.13.13', lista: 'dl-q' })}
      ${campo('riesgo', 'Riesgo vinculado (clave)', h.riesgo, { dis: !ed, lista: 'dl-r' })}
      ${campo('area', 'Área responsable', h.area, { dis: !ed, lista: 'dl-areas' })}
      ${campo('responsable', 'Responsable de atención', h.responsable, { dis: !ed })}
      ${campo('fechaCompromiso', 'Fecha compromiso', h.fechaCompromiso, { tipo: 'date', dis: !ed })}
      ${campo('estatus', 'Estatus', h.estatus, { opciones: ESTATUS_H.filter((s) => can('hallazgos.cerrar') || !['Solventado', 'Cerrado'].includes(s) || s === h.estatus), dis: !ed })}
    </div>
    ${datalist('dl-q', PREGUNTAS.map((q) => q.id))}${datalist('dl-r', DB.riesgos.map((r) => r.clave))}${datalist('dl-areas', DB.responsables.areas)}
    <h3>Seguimiento</h3>
    ${(h.seguimiento || []).length ? `<ul>${h.seguimiento.map((s) => `<li><small>${fmtFechaHora(s.fecha)} · ${esc(s.por)}</small><br>${esc(s.nota)}</li>`).join('')}</ul>` : '<p class="muted">Sin notas de seguimiento.</p>'}
    ${ed ? campo('nota', 'Agregar nota de seguimiento', '', { tipo: 'textarea' }) : ''}`,
    botones: [...(id && can('hallazgos.cerrar') ? [{ id: 'borrar', t: 'Eliminar', danger: true }] : []), { id: 'cancel', t: 'Cerrar' }, ...(ed ? [{ id: 'ok', t: 'Guardar', primary: true }] : [])],
  }, (d, b) => {
    if (b === 'borrar') return null;
    if (!d.titulo.trim()) return 'Indique el título del hallazgo.';
    if (d.qid && !PREG[d.qid.trim()]) return 'El punto de interés no existe en el banco de preguntas.';
    if (DB.hallazgos.some((x) => x.folio === d.folio.trim() && x.id !== id)) return 'El folio ya existe.';
    return null;
  });
  if (!res) return;
  if (res.boton === 'borrar') {
    if (!await confirmar('Eliminar hallazgo', `¿Eliminar el hallazgo ${esc(h.folio)}?`, { ok: 'Eliminar', peligro: true })) return;
    DB.hallazgos = DB.hallazgos.filter((x) => x.id !== id);
    bitacora('Baja de hallazgo', h.folio); guardar(); render(); return;
  }
  const d = res.datos;
  const nota = d.nota; delete d.nota;
  d.folio = d.folio.trim(); d.qid = d.qid.trim();
  const cambioEstatus = id && d.estatus !== h.estatus;
  Object.assign(h, d);
  h.seguimiento = h.seguimiento || [];
  if (cambioEstatus) h.seguimiento.push({ fecha: ahora(), por: SES.usuario, nota: 'Cambio de estatus a: ' + d.estatus });
  if (nota && nota.trim()) h.seguimiento.push({ fecha: ahora(), por: SES.usuario, nota: nota.trim() });
  if (!id) { h.id = uid('h'); h.creado = ahora(); h.por = SES.usuario; DB.hallazgos.push(h); }
  bitacora(id ? 'Edición de hallazgo' : 'Alta de hallazgo', h.folio + ' · ' + h.estatus);
  guardar(); render(); toast('Hallazgo guardado.');
}

/* Cartera: se importa con el lay out del Sistema de Administración de
   Riesgos de Crédito (docs/layout_carga.md) y se guardan solo agregados. */
function agregarCartera(filas, fuente) {
  const req = ['periodo', 'folio', 'saldo_vigente', 'saldo_vencido'];
  const faltan = req.filter((k) => !(k in (filas[0] || {})));
  if (faltan.length) throw new Error('Faltan columnas obligatorias del lay out: ' + faltan.join(', '));
  const porPer = {};
  const errores = [];
  filas.forEach((f, i) => {
    const vig = num(f.saldo_vigente), ven = num(f.saldo_vencido);
    if (!/^\d{4}-\d{2}$/.test(f.periodo || '') || vig == null || ven == null) { errores.push(i + 2); return; }
    const P = porPer[f.periodo] || (porPer[f.periodo] = { periodo: f.periodo, creditos: 0, vigente: 0, vencido: 0, porProducto: {}, porSucursal: {}, mora: { 'Al corriente': 0, '1-30': 0, '31-90': 0, '91-180': 0, '>180': 0 }, socios: {} });
    P.creditos++; P.vigente += vig; P.vencido += ven;
    const tot = vig + ven;
    for (const [k, campoD] of [['porProducto', 'producto'], ['porSucursal', 'sucursal']]) {
      const key = f[campoD] || 'N/D';
      const o = P[k][key] || (P[k][key] = { vigente: 0, vencido: 0, n: 0 });
      o.vigente += vig; o.vencido += ven; o.n++;
    }
    const dm = num(f.dias_mora) || 0;
    P.mora[dm <= 0 ? 'Al corriente' : dm <= 30 ? '1-30' : dm <= 90 ? '31-90' : dm <= 180 ? '91-180' : '>180'] += tot;
    const s = f.socio || f.folio;
    P.socios[s] = (P.socios[s] || 0) + tot;
  });
  const cortes = Object.values(porPer).map((P) => {
    P.total = P.vigente + P.vencido;
    P.top = Object.entries(P.socios).sort((a, b) => b[1] - a[1]).slice(0, 20).map(([socio, saldo]) => ({ socio, saldo }));
    P.acreditados = Object.keys(P.socios).length;
    delete P.socios;
    P.fuente = fuente; P.cargado = ahora(); P.por = SES.usuario;
    return P;
  });
  return { cortes, errores };
}

function vistaMapa() {
  const cel = {};
  for (const r of DB.riesgos) {
    const p = MAPA === 'residual' ? (r.probR || r.prob) : r.prob, i = MAPA === 'residual' ? (r.impR || r.imp) : r.imp;
    if (!p || !i) continue;
    (cel[p + '-' + i] = cel[p + '-' + i] || []).push(r.clave);
  }
  const color = (s) => s >= 15 ? 'var(--crit-soft)' : s >= 10 ? 'var(--serious-soft)' : s >= 5 ? 'var(--warn-soft)' : 'var(--good-soft)';
  let g = '';
  for (let p = 5; p >= 1; p--) {
    g += `<div class="ax">${p}</div>`;
    for (let i = 1; i <= 5; i++) { const L = cel[p + '-' + i] || []; g += `<div class="cell" style="background:${color(p * i)}" data-tip="${esc(`Probabilidad ${p} × impacto ${i} = ${p * i} (${nivelSev(p * i).n})${L.length ? ': ' + L.join(', ') : ''}`)}">${L.length || ''}</div>`; }
  }
  g += '<div></div>' + [1, 2, 3, 4, 5].map((i) => `<div class="ax">${i}</div>`).join('');
  return `<div class="card"><div class="row" style="margin-bottom:1rem"><div class="tabs" style="margin:0;border:none">${['inherente', 'residual'].map((m) => `<button class="${MAPA === m ? 'on' : ''}" data-act="mapa" data-m="${m}">Riesgo ${m}</button>`).join('')}</div></div>
    <div style="display:grid;grid-template-columns:auto 1fr;gap:.5rem;align-items:center;max-width:620px">
      <div style="writing-mode:vertical-rl;transform:rotate(180deg);color:var(--text-3);font-size:.8rem">Probabilidad</div>
      <div><div class="heat">${g}</div><div style="text-align:center;color:var(--text-3);font-size:.8rem;margin-top:.25rem">Impacto</div></div>
    </div>
    <div class="legend" style="margin-top:1rem">${[['Bajo (1–4)', 'var(--good-soft)'], ['Medio (5–9)', 'var(--warn-soft)'], ['Alto (10–14)', 'var(--serious-soft)'], ['Crítico (15–25)', 'var(--crit-soft)']].map(([t, c]) => `<span><i style="background:${c};border:1px solid var(--line-strong)"></i>${t}</span>`).join('')}</div>
    <p class="muted" style="font-size:.8rem">El número en cada celda es la cantidad de riesgos; pase el cursor para ver las claves.</p></div>`;
}
ACT.mapa = (t) => { MAPA = t.dataset.m; render(); };

function registrarValorKRI(k, periodo, valor, por) {
  k.valores = (k.valores || []).filter((v) => v.periodo !== periodo);
  k.valores.push({ periodo, valor, por, fecha: ahora() });

ACT['kri-auto'] = () => {
  let n = 0;
  const cortes = [...DB.cartera.cortes].sort((a, b) => a.periodo.localeCompare(b.periodo));
  for (const k of DB.kris.filter((x) => x.auto)) {
    const v = valorAuto(k.auto);

    n++;

  bitacora('KRI automáticos', n + ' indicadores actualizados');
  guardar(); render(); toast(n + ' indicador(es) actualizado(s).');

/* Importación ----------------------------------------------------------- */
const IMPORTA = {
  hallazgos: { n: 'Hallazgos de auditoría', perm: 'hallazgos' },
  riesgos: { n: 'Matriz de riesgos', perm: 'riesgos' },
  kris: { n: 'Valores de KRI', perm: 'kris' },
  mesa: { n: 'Revisiones de mesa de control', perm: 'mesa' },
  auditorias: { n: 'Plan anual de auditoría', perm: 'auditplan' },
  respuestas: { n: 'Respuestas de la evaluación activa', perm: 'eval.responder' },
  cartera: { n: 'Cartera de crédito (lay out del sistema de riesgos de crédito)', perm: 'cartera' },
};
function mapearFila(f, cols) {
  const o = {};
  for (const c of cols) {
    if (c.soloExport) continue;
    const v = f[norm(c.label)] ?? f[norm(c.key)];
    if (v !== undefined) o[c.key] = v;
  }
  return o;
}
function aplicarImportacion(e, filas) {
  const r = { altas: 0, cambios: 0, errores: [] };
  const up = (lista, clave, obj, prefijo) => {
    const ex = lista.find((x) => x[clave] === obj[clave]);
    if (ex) { Object.assign(ex, obj); r.cambios++; return ex; }
    obj.id = uid(prefijo); lista.push(obj); r.altas++; return obj;
  };
  if (e === 'cartera') {
    const { cortes, errores } = agregarCartera(filas, 'importación');
    for (const c of cortes) { DB.cartera.cortes = DB.cartera.cortes.filter((x) => x.periodo !== c.periodo); DB.cartera.cortes.push(c); r.altas++; }
    r.errores = errores.map((n) => `Renglón ${n}: periodo o saldos inválidos`);
    return r;
  }
  filas.forEach((f, i) => {
    const lin = i + 2;
    try {
      if (e === 'hallazgos') {
        const o = mapearFila(f, COLS.hallazgos);
        if (!o.folio || !o.titulo) throw new Error('folio y titulo son obligatorios');
        if (o.qid && !PREG[o.qid]) throw new Error('punto_interes inexistente: ' + o.qid);
        if (o.severidad && !SEVERIDAD.includes(o.severidad)) o.severidad = 'Media';
        if (o.estatus && !ESTATUS_H.includes(o.estatus)) o.estatus = 'Abierto';
        const h = up(DB.hallazgos, 'folio', o, 'h');
        h.estatus = h.estatus || 'Abierto'; h.seguimiento = h.seguimiento || []; h.origen = h.origen || 'Auditoría externa';
      } else if (e === 'riesgos') {
        const o = mapearFila(f, COLS.riesgos);
        if (!o.clave || !o.descripcion) throw new Error('clave y descripcion son obligatorias');
        for (const k of ['prob', 'imp', 'probR', 'impR']) { if (o[k] !== undefined) { o[k] = num(o[k]); if (o[k] != null && (o[k] < 1 || o[k] > 5)) throw new Error(k + ' fuera de la escala 1-5'); } }
        if (o.qids !== undefined) o.qids = String(o.qids).split(/[|,;\s]+/).filter((q) => PREG[q]);
        up(DB.riesgos, 'clave', o, 'r');
      } else if (e === 'kris') {
        const o = mapearFila(f, COLS.kris);
        const k = DB.kris.find((x) => norm(x.nombre) === norm(o.kri) || x.id === o.kri);
        if (!k) throw new Error('KRI no registrado: ' + o.kri);
        if (!/^\d{4}-\d{2}$/.test(o.periodo || '') || num(o.valor) == null) throw new Error('periodo (AAAA-MM) o valor inválido');
        registrarValorKRI(k, o.periodo, num(o.valor), SES.usuario + ' (importación)');
        r.cambios++;
      } else if (e === 'mesa') {
        const o = mapearFila(f, COLS.mesa());
        if (!o.folio) throw new Error('folio obligatorio');
        o.monto = num(o.monto);
        o.items = {};
        for (const c of DB.mesa.checklist) {
          const v = String(o['it_' + c.id] || f[norm(c.id)] || 'C').toUpperCase();
          o.items[c.id] = ['C', 'NC', 'NA'].includes(v) ? v : 'C';
          delete o['it_' + c.id];
        }
        const rv = up(DB.mesa.revisiones, 'folio', o, 'm');
        rv.resultado = estadoRevision(rv);
      } else if (e === 'auditorias') {
        const o = mapearFila(f, COLS.auditorias);
        if (!o.proceso) throw new Error('proceso obligatorio');
        const ex = DB.auditorias.find((a) => norm(a.proceso) === norm(o.proceso) && (a.periodo || '') === (o.periodo || ''));
        if (ex) { Object.assign(ex, o); r.cambios++; } else { o.id = uid('a'); o.estatus = o.estatus || 'Programada'; o.riesgo = o.riesgo || 'Medio'; DB.auditorias.push(o); r.altas++; }
      } else if (e === 'respuestas') {
        const ev = evalActiva();
        if (!ev || evalBloqueada(ev)) throw new Error('No hay evaluación activa editable');
        const o = mapearFila(f, COLS.respuestas);
        if (!PREG[o.id]) throw new Error('punto_interes inexistente: ' + o.id);
        const rr = ev.resp[o.id] || (ev.resp[o.id] = {});
        const attrs = ATR_KEYS.map((k) => o[k]);
        if (attrs.some((x) => x !== undefined && x !== '')) {
          rr.a = attrs.map((x) => (/^(1|si|sí|x|true)$/i.test(String(x ?? '').trim()) ? 1 : 0));
        }
        for (const k of ['area', 'cargo', 'ubic', 'matriz', 'prio', 'coment', 'defi', 'plan', 'resp', 'fi', 'ff', 'presup', 'entreg']) if (o[k] !== undefined && o[k] !== '') rr[k] = o[k];
        if (o.avance !== undefined && o.avance !== '') rr.avance = clamp(num(o.avance) || 0, 0, 100);
        const evs = ['ev_ab', 'ev_c', 'ev_d', 'ev_e', 'ev_f', 'ev_g', 'ev_h'].map((k) => o[k]);
        if (evs.some((x) => x)) rr.ev = evs.map((x, i2) => x || (rr.ev || [])[i2] || '');
        marcarCambio(rr);
        r.cambios++;
      }
    } catch (err) { r.errores.push(`Renglón ${lin}: ${err.message}`); }
  });
  return r;
}
function aplicarPaquete(pq) {
  if (!pq || pq.formato !== 'seci.intercambio') throw new Error('El archivo no es un paquete de intercambio SECI (formato «seci.intercambio»).');
  const c = pq.contenido || {};
  const res = [];
  for (const [e, filas] of Object.entries(c)) {
    if (!IMPORTA[e]) { res.push(`${e}: entidad no reconocida, se omitió`); continue; }
    if (!can(IMPORTA[e].perm)) { res.push(`${IMPORTA[e].n}: su perfil no puede importar esta entidad, se omitió`); continue; }
    if (!Array.isArray(filas)) continue;
    // Los paquetes usan las mismas etiquetas que los CSV; se normalizan las llaves.
    const norm2 = filas.map((f) => Object.fromEntries(Object.entries(f).map(([k, v]) => [norm(k), Array.isArray(v) ? v.join('|') : v == null ? '' : String(v)])));
    const r = aplicarImportacion(e, norm2);
    res.push(`${IMPORTA[e].n}: ${r.altas} altas, ${r.cambios} actualizaciones${r.errores.length ? ', ' + r.errores.length + ' errores (' + r.errores.slice(0, 3).join('; ') + ')' : ''}`);
  }
  bitacora('Importación de paquete', (pq.origen && pq.origen.sistema || 'origen desconocido') + ': ' + res.join(' | '));
  guardar();
  return res;
}
function armarPaquete(area) {
  const ev = evalActiva();
  const ent = {
    auditoria: ['hallazgos', 'auditorias', 'respuestas', 'planes'],
    credito: ['mesa', 'kris', 'hallazgos'],
    riesgos: ['riesgos', 'kris', 'respuestas'],
    todo: ['hallazgos', 'auditorias', 'respuestas', 'planes', 'mesa', 'riesgos', 'kris'],
  }[area];
  const contenido = {};
  for (const e of ent) {
    const [filas, cols] = datosEntidad(e);
    contenido[e] = filas.map((f) => Object.fromEntries(cols.map((c) => [c.label, typeof c.get === 'function' ? c.get(f) : f[c.key]])));
  }
  const st = ev ? stats(ev) : null;
  return {
    formato: 'seci.intercambio', version: 1, generado: ahora(), area,
    origen: { sistema: 'SECI COSO ERM', version: APP_VERSION, banco: B.version, institucion: DB.config.institucion, usuario: SES.usuario },
    resumen: st ? { evaluacion: ev.nombre, ejercicio: ev.ejercicio, estado: ev.estado, madurez: st.global, nivel: madurez(st.global), componentes: st.comps.map((c) => ({ codigo: c.code, componente: c.name, puntaje: c.score, nivel: madurez(c.score), presente: c.pctPresente, funcionando: c.pctFuncionando })), cartera: DB.cartera.cortes.map((x) => ({ periodo: x.periodo, total: x.total, vencido: x.vencido, imor: x.total ? x.vencido / x.total : null })) } : null,
    contenido,
  };
}

async function llamarConector(c, metodo, cuerpo) {
  const headers = { Accept: 'application/json' };
  if (cuerpo) headers['Content-Type'] = 'application/json';
  if (c.token) headers.Authorization = 'Bearer ' + c.token;
  const resp = await fetch(c.url, { method: metodo, headers, body: cuerpo ? JSON.stringify(cuerpo) : undefined });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return metodo === 'GET' ? resp.json() : resp.text();
}

    ${campo('actual', 'Contraseña actual', '', { tipo: 'password', req: true, attrs: 'autocomplete="current-password"' })}
    ${campo('nueva', 'Nueva contraseña', '', { tipo: 'password', req: true, attrs: 'autocomplete="new-password"' })}
    ${campo('nueva2', 'Confirmar', '', { tipo: 'password', req: true, attrs: 'autocomplete="new-password"' })}
    <div class="row end"><button class="btn primary" type="submit">Actualizar</button></div></form></div></div>
  <div class="card"><h3>Mi actividad reciente</h3><div class="tbl-wrap"><table class="tbl"><tr><th>Fecha</th><th>Acción</th><th>Detalle</th></tr>${mios.map((b) => `<tr><td>${fmtFechaHora(b.ts)}</td><td>${esc(b.accion)}</td><td>${esc(b.detalle)}</td></tr>`).join('')}</table></div></div>`;
};

/* Administración --------------------------------------------------------- */
let BIT_F = '';
VISTAS.admin = (args) => {
  if (!can('admin')) return cabecera('Administración') + '<div class="callout crit">Acceso exclusivo del perfil Sistemas.</div>';
  const tab = args[0] || '';
  const t = tabsDe('admin', tab, [['', 'Usuarios'], ['respaldos', 'Respaldos'], ['bitacora', 'Bitácora'], ['config', 'Configuración']]);
  if (tab === 'respaldos') return cabecera('Administración') + t + vistaRespaldos();
  if (tab === 'bitacora') return cabecera('Administración') + t + vistaBitacora();
  if (tab === 'config') return cabecera('Administración') + t + vistaConfig();
  return `${cabecera('Administración', '', `<button class="btn primary" data-act="usr-editar">${ico('mas')} Nuevo usuario</button>`)}${t}
  <div class="card"><div class="tbl-wrap"><table class="tbl"><tr><th>Usuario</th><th>Nombre</th><th>Perfil</th><th>Estado</th><th>Último acceso</th><th>Acciones</th></tr>
    ${DB.users.map((u) => `<tr><td><code>${esc(u.usuario)}</code></td><td>${esc(u.nombre)}</td><td>${esc(ROLES[u.rol].n)}</td>
      <td>${!u.activo ? '<span class="badge b-neutral">Inactivo</span>' : u.bloqueoHasta && new Date(u.bloqueoHasta) > new Date() ? '<span class="badge b-crit">Bloqueado</span>' : u.mustChange ? '<span class="badge b-warn">Contraseña temporal</span>' : '<span class="badge b-good">Activo</span>'}</td>
      <td>${fmtFechaHora(u.ultimoAcceso) || '<span class="muted">Nunca</span>'}</td>
      <td><div class="row"><button class="btn sm" data-act="usr-editar" data-id="${u.id}">Editar</button><button class="btn sm" data-act="usr-reset" data-id="${u.id}">Restablecer contraseña</button></div></td></tr>`).join('')}
  </table></div></div>
  <div class="card"><h3>Perfiles</h3><dl class="kv">${Object.values(ROLES).map((r) => `<dt><b>${esc(r.n)}</b></dt><dd>${esc(r.d)}</dd>`).join('')}</dl></div>`;
};
const sistemasActivos = (excepto) => DB.users.filter((u) => u.rol === 'sistemas' && u.activo && u.id !== excepto).length;
ACT['usr-editar'] = async (t) => {
  const id = t.dataset.id;
  const u = id ? DB.users.find((x) => x.id === id) : { rol: 'auditor', activo: true };
  const res = await formModal({ titulo: id ? 'Editar usuario' : 'Nuevo usuario', chico: true,
    cuerpo: `${campo('usuario', 'Usuario', u.usuario, { req: true, dis: !!id })}${campo('nombre', 'Nombre completo', u.nombre, { req: true })}
      ${campo('rol', 'Perfil', u.rol, { opciones: Object.entries(ROLES).map(([k, r]) => [k, r.n]) })}
      ${id ? campo('activo', 'Usuario activo', u.activo, { tipo: 'checkbox' }) : campo('pass', 'Contraseña temporal', passwordTemporal(), { ayuda: 'Se pedirá cambiarla en el primer acceso.' })}`,
    botones: [...(id && id !== SES.uid ? [{ id: 'borrar', t: 'Eliminar', danger: true }] : []), { id: 'cancel', t: 'Cancelar' }, { id: 'ok', t: 'Guardar', primary: true }] },
  (d, b) => {
    if (b === 'borrar') return sistemasActivos(id) < 1 ? 'Debe existir al menos un usuario de Sistemas activo.' : null;
    if (!id && !/^[a-z0-9._-]{3,30}$/i.test(d.usuario)) return 'Usuario: 3 a 30 caracteres (letras, números, punto, guion).';
    if (!id && DB.users.some((x) => x.usuario.toLowerCase() === d.usuario.toLowerCase())) return 'El usuario ya existe.';
    if (!d.nombre.trim()) return 'Indique el nombre.';
    if (!id) return politicaPassword(d.pass);
    if (u.rol === 'sistemas' && (d.rol !== 'sistemas' || !d.activo) && sistemasActivos(id) < 1) return 'Debe existir al menos un usuario de Sistemas activo.';
    return null;
  });
  if (!res) return;
  const d = res.datos;
  if (res.boton === 'borrar') {
    DB.users = DB.users.filter((x) => x.id !== id);
    bitacora('Baja de usuario', u.usuario);
  } else if (id) {
    const cambios = [u.nombre !== d.nombre ? 'nombre' : '', u.rol !== d.rol ? `perfil ${u.rol}→${d.rol}` : '', u.activo !== d.activo ? (d.activo ? 'activado' : 'desactivado') : ''].filter(Boolean).join(', ');
    Object.assign(u, { nombre: d.nombre.trim(), rol: d.rol, activo: d.activo });
    bitacora('Edición de usuario', `${u.usuario}: ${cambios || 'sin cambios'}`);
  } else {
    DB.users.push({ id: uid('u'), usuario: d.usuario.trim(), nombre: d.nombre.trim(), rol: d.rol, activo: true, mustChange: true, creado: ahora(), ...(await nuevaCredencial(d.pass)) });
    bitacora('Alta de usuario', `${d.usuario} (${ROLES[d.rol].n})`);
    await modal({ titulo: 'Usuario creado', chico: true, cuerpo: `<p>Entregue la contraseña temporal a <b>${esc(d.nombre)}</b>:</p><p><code style="font-size:1.1rem">${esc(d.pass)}</code></p>` });
    cerrarModal();
  }
  guardar(); render();
};
ACT['usr-reset'] = async (t) => {
  const u = DB.users.find((x) => x.id === t.dataset.id);
  if (!await confirmar('Restablecer contraseña', `Se generará una contraseña temporal para <b>${esc(u.usuario)}</b> y se desbloqueará la cuenta.`, { ok: 'Restablecer' })) return;
  const pass = passwordTemporal();
  Object.assign(u, await nuevaCredencial(pass), { mustChange: true, intentos: 0, bloqueoHasta: null });
  bitacora('Restablecimiento de contraseña', u.usuario);
  guardar(); render();
  await modal({ titulo: 'Contraseña temporal', chico: true, cuerpo: `<p>Nueva contraseña temporal para <b>${esc(u.usuario)}</b>:</p><p><code style="font-size:1.1rem">${esc(pass)}</code></p>` });
  cerrarModal();
};

function vistaRespaldos() {
  let tam = 0;
  try { tam = (localStorage.getItem(DB_KEY) || '').length * 2; } catch { /* sin acceso */ }
  return `<div class="grid g2">
    <div class="card"><h3>Descargar respaldo</h3>
      <p>Último respaldo: <b>${DB.meta.ultimoRespaldo ? fmtFechaHora(DB.meta.ultimoRespaldo) : 'nunca'}</b>. Tamaño de la información: <b>${fmtN(tam / 1024, 0)} KB</b>.</p>
      <p class="muted">El respaldo incluye evaluaciones, hallazgos, riesgos, KRI, mesa de control, cartera agregada, catálogos, usuarios (contraseñas cifradas con hash) y bitácora. Guárdelo en un medio seguro de la institución.</p>
      <div class="row"><button class="btn primary" data-act="resp-descargar">${ico('descarga')} Respaldo JSON</button>${hayCrypto() ? `<button class="btn" data-act="resp-cifrado">${ico('descarga')} Respaldo cifrado</button>` : ''}</div>
    </div>
    <div class="card"><h3>Restaurar respaldo</h3>
      <p class="muted">Reemplaza <b>toda</b> la información actual por la del respaldo. Antes de restaurar se descarga automáticamente un respaldo de la información actual.</p>
      <input type="file" accept=".json,application/json" data-chg="resp-restaurar">
    </div>
    <div class="card"><h3>Autoguardado en archivo local</h3>
      ${FS.estado === 'nosoportado' ? '<p class="muted">Este navegador no permite escribir archivos locales automáticamente (disponible en Chrome y Edge). Use los respaldos manuales.</p>'
        : `<p>Estado: <span class="badge ${FS.estado === 'activo' ? 'b-good' : FS.estado === 'permiso' ? 'b-warn' : 'b-neutral'}">${{ activo: 'Activo', permiso: 'Requiere permiso', no: 'No configurado' }[FS.estado]}</span> ${FS.handle ? `<code>${esc(FS.handle.name)}</code>` : ''}</p>
        <p class="muted">Cada cambio se escribe también en un archivo .json de su equipo o carpeta de red, que funciona como respaldo continuo.</p>
        <div class="row"><button class="btn" data-act="fs-vincular">Elegir archivo</button>${FS.estado === 'permiso' ? '<button class="btn" data-act="fs-reactivar">Conceder permiso</button>' : ''}${FS.handle ? '<button class="btn" data-act="fs-desvincular">Desvincular</button>' : ''}</div>`}
    </div>
    <div class="card"><h3>Eliminar información de este navegador</h3>
      <p class="muted">Borra todos los datos de este equipo (no afecta respaldos descargados). Útil al retirar un equipo.</p>
      <button class="btn danger" data-act="resp-borrar">Eliminar todo</button>
    </div>
  </div>`;
}
function respaldoDescargado(nombre) {
  DB.meta.ultimoRespaldo = ahora();
  bitacora('Respaldo', nombre);
  guardar();
}
ACT['resp-descargar'] = () => {
  const nombre = `SECI_respaldo_${sello()}.json`;
  respaldoDescargado(nombre);
  descargar(nombre, JSON.stringify(paqueteRespaldo()));
  render();
};
ACT['resp-cifrado'] = async () => {
  const res = await formModal({ titulo: 'Respaldo cifrado', chico: true,
    cuerpo: `<p class="muted">El archivo se cifra con AES-256-GCM. Sin la frase no es posible recuperarlo.</p>${campo('frase', 'Frase de cifrado', '', { tipo: 'password', req: true, ayuda: 'Mínimo 12 caracteres.' })}${campo('frase2', 'Confirmar frase', '', { tipo: 'password', req: true })}`,
    botones: [{ id: 'cancel', t: 'Cancelar' }, { id: 'ok', t: 'Descargar', primary: true }] },
  (d) => (d.frase.length < 12 ? 'La frase debe tener al menos 12 caracteres.' : d.frase !== d.frase2 ? 'Las frases no coinciden.' : null));
  if (!res) return;
  const nombre = `SECI_respaldo_cifrado_${sello()}.json`;
  respaldoDescargado(nombre);
  const cif = await cifrar(JSON.stringify(paqueteRespaldo()), res.datos.frase);
  descargar(nombre, JSON.stringify({ formato: 'seci-respaldo-cifrado', version: 1, generado: ahora(), institucion: DB.config.institucion, alg: 'AES-256-GCM/PBKDF2-SHA256-200000', ...cif }));
  render();
};
async function abrirRespaldo(file) {
  let obj = JSON.parse(await leerArchivo(file));
  if (obj.formato === 'seci-respaldo-cifrado') {
    if (!hayCrypto()) throw new Error('Este navegador no puede descifrar el respaldo.');
    const res = await formModal({ titulo: 'Respaldo cifrado', chico: true, cuerpo: campo('frase', 'Frase de cifrado', '', { tipo: 'password', req: true }), botones: [{ id: 'cancel', t: 'Cancelar' }, { id: 'ok', t: 'Descifrar', primary: true }] },
      async (d) => { try { obj._plano = await descifrar(obj, d.frase); return null; } catch { return 'Frase incorrecta o archivo dañado.'; } });
    if (!res) return null;
    obj = JSON.parse(obj._plano);
  }
  if (obj.formato !== 'seci-respaldo' || !obj.datos) throw new Error('El archivo no es un respaldo del SECI.');
  const integro = sha256(JSON.stringify(obj.datos)) === obj.integridad;
  const ok = await confirmar('Restaurar respaldo', `Respaldo de <b>${esc(obj.institucion || '—')}</b> generado el ${fmtFechaHora(obj.generado)} por ${esc(obj.por || '—')}.<br>
    ${obj.datos.users ? obj.datos.users.length : 0} usuarios · ${obj.datos.evals ? obj.datos.evals.length : 0} evaluaciones.<br><br>
    Integridad: ${integro ? '<span class="badge b-good">Verificada</span>' : '<span class="badge b-crit">El contenido no coincide con su huella; pudo haber sido modificado</span>'}<br><br>Se reemplazará toda la información actual.`, { ok: 'Restaurar', peligro: !integro });
  if (!ok) return null;
  const db = migrar(obj.datos);
  if (!db.users.some((u) => u.rol === 'sistemas' && u.activo)) throw new Error('El respaldo no contiene un usuario de Sistemas activo.');
  return db;
}
CHG['resp-restaurar'] = async (t) => {
  const f = t.files[0];
  if (!f) return;
  const nuevo = await abrirRespaldo(f);
  t.value = '';
  if (!nuevo) return;
  descargar(`SECI_respaldo_previo_${sello()}.json`, JSON.stringify(paqueteRespaldo()));
  const quien = SES.usuario;
  DB = nuevo;
  bitacora('Restauración de respaldo', `${f.name} (por ${quien})`);
  guardar();
  logout('Cierre de sesión por restauración');
  toast('Respaldo restaurado. Inicie sesión nuevamente.');
};
ACT['fs-vincular'] = async () => { await fsVincular(); render(); toast('Autoguardado activado.'); };
ACT['fs-desvincular'] = async () => { await fsDesvincular(); bitacora('Autoguardado', 'Desvinculado'); guardar(); render(); };
ACT['resp-borrar'] = async () => {
  const res = await formModal({ titulo: 'Eliminar toda la información', chico: true,
    cuerpo: `<div class="callout crit" style="margin-bottom:.75rem">Esta acción elimina definitivamente la información de este navegador.</div>${campo('conf', 'Escriba BORRAR para confirmar', '', { req: true })}`,
    botones: [{ id: 'cancel', t: 'Cancelar' }, { id: 'ok', t: 'Eliminar', danger: true }] }, (d) => (d.conf !== 'BORRAR' ? 'Escriba BORRAR en mayúsculas.' : null));
  if (!res) return;
  localStorage.removeItem(DB_KEY);
  sessionStorage.removeItem(SES_KEY);
  await fsDesvincular().catch(() => {});
  DB = null; SES = null;
  location.hash = '';
  render();
};
function vistaBitacora() {
  const L = DB.bitacora.filter((b) => !BIT_F || norm(b.usuario + ' ' + b.accion + ' ' + b.detalle).includes(norm(BIT_F))).slice(-500).reverse();
  return `<div class="card"><div class="row" style="margin-bottom:.75rem"><input type="search" placeholder="Filtrar por usuario, acción o detalle…" value="${esc(BIT_F)}" data-chg="bit-f" style="max-width:320px">
    <span class="muted">${DB.bitacora.length} eventos (se conservan los últimos ${MAX_BITACORA})</span><span class="spacer"></span>
    <button class="btn" data-act="bit-verificar">Verificar integridad</button><button class="btn" data-act="exp-csv" data-e="bitacora">${ico('descarga')} CSV</button></div>
  <div class="tbl-wrap" style="max-height:65vh"><table class="tbl"><tr><th>Fecha y hora</th><th>Usuario</th><th>Perfil</th><th>Acción</th><th>Detalle</th><th>Huella</th></tr>
    ${L.map((b) => `<tr><td class="num">${fmtFechaHora(b.ts)}</td><td>${esc(b.usuario)}</td><td>${esc(ROLES[b.rol] ? ROLES[b.rol].n : b.rol)}</td><td>${esc(b.accion)}</td><td>${esc(b.detalle)}</td><td><code title="${esc(b.h)}">${esc(b.h.slice(0, 10))}</code></td></tr>`).join('')}
  </table></div><p class="muted" style="font-size:.8rem;margin-top:.5rem">Cada evento incluye la huella SHA-256 del evento anterior; cualquier modificación o eliminación intermedia rompe la cadena y se detecta con «Verificar integridad».</p></div>`;
}
CHG['bit-f'] = (t) => { BIT_F = t.value; render(); };
ACT['bit-verificar'] = async () => {
  const r = verificarBitacora();
  bitacora('Verificación de bitácora', r.ok ? `Íntegra (${r.n} eventos)` : `Ruptura en el evento ${r.i + 1}`);
  guardar();
  await modal({ titulo: 'Integridad de la bitácora', chico: true, cuerpo: r.ok ? `<div class="callout info">La cadena de ${r.n} eventos es íntegra.</div>` : `<div class="callout crit">La cadena se rompe en el evento ${r.i + 1} (${esc(fmtFechaHora(r.e.ts))}, ${esc(r.e.usuario)}: ${esc(r.e.accion)}). La bitácora fue modificada fuera del sistema.</div>` });
  cerrarModal(); render();
};
function vistaConfig() {
  const c = DB.config;
  return `<form data-submit="config"><div class="grid g2">
    <div class="card"><h3>Institución</h3>${campo('institucion', 'Razón social', c.institucion, { req: true })}${campo('nombreComercial', 'Nombre comercial', c.nombreComercial)}${campo('tipo', 'Tipo de entidad', c.tipo, { opciones: ['SOCAP', 'SOFIPO', 'SOFOM', 'Caja de ahorro', 'Otra'] })}</div>
    <div class="card"><h3>Seguridad y respaldos</h3>${campo('sesionMin', 'Cierre de sesión por inactividad (minutos)', c.sesionMin, { tipo: 'number', attrs: 'min="5" max="240"' })}${campo('diasRespaldo', 'Recordar respaldo cada (días)', c.diasRespaldo, { tipo: 'number', attrs: 'min="1" max="90"' })}</div>
    <div class="card"><h3>Ponderación de componentes</h3><p class="muted">Deben sumar 100 %. Valores tomados de la hoja «Resultados» del Excel.</p>
      ${B.components.map((k) => campo('peso_' + k.code, k.name + ' (%)', Math.round((c.pesos[k.code] ?? k.peso) * 100), { tipo: 'number', attrs: 'min="0" max="100" step="1"' })).join('')}</div>
    <div class="card"><h3>Integración de componentes</h3>${campo('umbralIntegracion', 'Porcentaje mínimo de puntos presentes y funcionando por componente (%)', Math.round(c.umbralIntegracion * 100), { tipo: 'number', attrs: 'min="0" max="100"' })}</div>
  </div><div class="row end" style="margin-top:1rem"><button class="btn primary" type="submit">Guardar configuración</button></div></form>`;
}
ACT.config = (f) => {
  const d = leerForm(f);
  const pesos = Object.fromEntries(B.components.map((k) => [k.code, (num(d['peso_' + k.code]) || 0) / 100]));
  if (Math.abs(sum(Object.values(pesos)) - 1) > 0.001) return toast('Las ponderaciones deben sumar 100 %.', true);
  if (!d.institucion.trim()) return toast('Indique la institución.', true);
  Object.assign(DB.config, { institucion: d.institucion.trim(), nombreComercial: d.nombreComercial, tipo: d.tipo, sesionMin: clamp(num(d.sesionMin) || 20, 5, 240), diasRespaldo: clamp(num(d.diasRespaldo) || 7, 1, 90), umbralIntegracion: clamp((num(d.umbralIntegracion) || 70) / 100, 0, 1), pesos });
  bitacora('Configuración', 'Actualizó parámetros del sistema');
  guardar(); render(); toast('Configuración guardada.');
};

/* Inicio ----------------------------------------------------------------- */
window.addEventListener('storage', (e) => {
  if (e.key !== DB_KEY) return;
  DB = cargarDB();
  if (!DB) { SES = null; render(); return; }
  if (SES && !DB.users.some((u) => u.id === SES.uid && u.activo)) SES = null;
  render();
  toast('La información se actualizó desde otra pestaña.');
});
(async function iniciar() {
  aplicarTema();
  if (!B) { $('#app').innerHTML = '<div class="login-wrap"><div class="callout crit">El banco de preguntas no está incluido. Genere el sistema con <code>python coso_erm/herramientas/construir.py</code>.</div></div>'; return; }
  try { localStorage.setItem('seci.prueba', '1'); localStorage.removeItem('seci.prueba'); } catch {
    $('#app').innerHTML = '<div class="login-wrap"><div class="callout crit">El navegador bloquea el almacenamiento local (modo privado o política del equipo). El sistema no puede guardar información.</div></div>';
    return;
  }
  DB = cargarDB();
  if (DB) restaurarSesion();
  await fsIniciar();
  render();
})();
